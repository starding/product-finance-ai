<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Twelve principles, and the constraints each comes from</p><p class="figsub">Each row is a principle and the three columns are the three sets of constraints; a dot means the principle follows from that set. Tap a row to see the chain of reasoning.</p></div><button class="replay" type="button" data-replay="tc">Replay</button></div>
    <div class="tc" id="tc" data-anim>
      <div class="tc-h"><span></span><span>Principle</span><span>Market</span><span>User</span><span>AI</span></div>
      <button type="button" class="tc-r" data-i="0" style="--i:0"><em>1</em><span>Promise only value that can be provided, delivered and verified</span><i class="on"></i><i class=""></i><i class="on"></i></button><button type="button" class="tc-r" data-i="1" style="--i:1"><em>2</em><span>Measure the product by net value</span><i class=""></i><i class="on"></i><i class=""></i></button><button type="button" class="tc-r" data-i="2" style="--i:2"><em>3</em><span>Place value where it does not disappear as it spreads</span><i class="on"></i><i class=""></i><i class="on"></i></button><button type="button" class="tc-r" data-i="3" style="--i:3"><em>4</em><span>Write instructions as a mandate</span><i class=""></i><i class="on"></i><i class="on"></i></button><button type="button" class="tc-r" data-i="4" style="--i:4"><em>5</em><span>Allocate authority by reversibility; boundaries at the execution layer</span><i class="on"></i><i class="on"></i><i class="on"></i></button><button type="button" class="tc-r" data-i="5" style="--i:5"><em>6</em><span>Income and goals on the user's side; responsibility follows control</span><i class="on"></i><i class=""></i><i class="on"></i></button><button type="button" class="tc-r" data-i="6" style="--i:6"><em>7</em><span>Start with tasks of high applicable share that are easy to check</span><i class=""></i><i class=""></i><i class="on"></i></button><button type="button" class="tc-r" data-i="7" style="--i:7"><em>8</em><span>Shorten unchecked stretches; stop when unsure</span><i class=""></i><i class=""></i><i class="on"></i></button><button type="button" class="tc-r" data-i="8" style="--i:8"><em>9</em><span>Store the relationship as objects, point in time, visible and replayable</span><i class="on"></i><i class="on"></i><i class="on"></i></button><button type="button" class="tc-r" data-i="9" style="--i:9"><em>10</em><span>Keep assurance proportionate to risk</span><i class="on"></i><i class=""></i><i class="on"></i></button><button type="button" class="tc-r" data-i="10" style="--i:10"><em>11</em><span>Earn trust with diagnostic, hard-to-fake evidence</span><i class="on"></i><i class="on"></i><i class=""></i></button><button type="button" class="tc-r" data-i="11" style="--i:11"><em>12</em><span>Defaults on the user's side; invite improvement; seek proportionate trust</span><i class=""></i><i class="on"></i><i class="on"></i></button>
    </div>
    <div class="tc-d" id="tc-d">Tap a principle.</div>
  </div>
  <figcaption>Relevant chapters are given in parentheses.</figcaption>
</figure>
<style>
.tc-h,.tc-r{display:grid;grid-template-columns:24px minmax(0,1fr) 44px 44px 44px;gap:8px;align-items:center}
.tc-h{font-size:11.5px;color:var(--faint);padding:0 10px 4px}
.tc-h span:nth-child(n+3){text-align:center}
.tc-r{font:inherit;width:100%;text-align:left;background:var(--quote);border:1.5px solid transparent;border-radius:7px;padding:5px 10px;margin-bottom:3px;font-size:12.5px;color:var(--ink);cursor:pointer;opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .3s;transition-delay:calc(var(--i)*.07s)}
.tc.in .tc-r{opacity:1;transform:none}
.tc-r em{font-style:normal;color:var(--faint)}
.tc-r i{justify-self:center;width:12px;height:12px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line)}
.tc-r i.on{background:var(--accent);border-color:var(--accent)}
.tc-r.sel{border-color:var(--ink)}
.tc-d{margin-top:10px;background:var(--quote);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.7;min-height:4.6em}
.tc-d b{display:block}
@media (max-width:640px){.tc-h,.tc-r{grid-template-columns:20px minmax(0,1fr) 30px 30px 30px}}
</style>
<script>
(function(){
  const P=[["Promise only value that can be provided, delivered and verified", "Value", "Information advantage is zero-sum and short-term results come mainly from luck → returns and direction cannot be promised → promise only costs, execution, discipline and coverage", "7–12, 24"], ["Measure the product by net value", "Value", "Attention is limited and tolerance has three faces → the user's input and risk are real costs → result minus input minus risk", "15–17, 24"], ["Place value where it does not disappear as it spreads", "Value", "Once analysis is cheap, the advantage of prediction diminishes → what lasts is cost, discipline, behaviour and access", "19, 23"], ["Write instructions as a mandate", "Contract", "Measurable goals get gamed and contracts are incomplete → pair goals with risk constraints, and state default rules and reviews", "15, 21, 25"], ["Allocate authority by reversibility; boundaries at the execution layer", "Contract", "Executed trades cannot be undone and agents make mistakes → the irreversible step is taken by the principal, and the execution layer enforces boundaries", "13, 21, 26"], ["Income and goals on the user's side; responsibility follows control", "Contract", "Credence goods and conflicts of interest; agents optimize for what is measured → structural alignment, with the least-cost avoider responsible", "13, 14, 27"], ["Start with tasks of high applicable share that are easy to check", "Implementation", "The amplification factor is limited by applicable share and the cost of checking → first do what can be taken on in full and checked easily", "19, 20, 22"], ["Shorten unchecked stretches; stop when unsure", "Implementation", "Errors accumulate over steps, and a model tends to guess when unsure → checkpoints, asking for instructions, and saying \"I don't know\"", "21"], ["Store the relationship as objects, point in time, visible and replayable", "Implementation", "Data get revised and continuing tasks have no end point → long-lived objects, point-in-time records, a task panel and replay", "15, 28"], ["Keep assurance proportionate to risk", "Implementation", "An agent's output is non-deterministic and financial errors have severe consequences → grade by consequence and difficulty of verification, statistical evaluation, monitoring and staged release", "22, 29"], ["Earn trust with diagnostic, hard-to-fake evidence", "Trust", "Trust is a belief updated by evidence, and return figures are weakly diagnostic → process evidence, third-party verification, disclosing first", "13, 18, 30"], ["Defaults on the user's side; invite improvement; seek proportionate trust", "Trust", "Biases have a direction, overtrust leads to misuse, and the user's current practice is also a steady state → presentation and defaults serve the task, and leaving is easy; respect habits first, and invite improvement with the user's own records", "16, 18, 30"]];
  const rs=[...document.querySelectorAll('.tc-r')];
  rs.forEach((r,i)=>r.addEventListener('click',()=>{rs.forEach(x=>x.classList.toggle('sel',x===r));const [n,l,ch,cp]=P[i];document.getElementById('tc-d').innerHTML=`<b>${i+1}. ${n} (${l} layer)</b>${ch} (${/[,–]/.test(cp)?'Chapters':'Chapter'} ${cp})`;}));
})();
</script>
