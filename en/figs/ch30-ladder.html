<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Two paths through a cold start</p><p class="figsub">For a new agent, the user's prior is only 30%. Compare how two ways of starting play out over a year: asking the user to hand over full authority at once, or beginning with low-stakes tasks.</p></div><button class="replay" type="button" data-replay="cl2">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Path"><button type="button" data-cl2="a" aria-pressed="false">Ask for full authority at once</button><button type="button" data-cl2="b" aria-pressed="true">Begin with small tasks</button></div>
    <div class="cl2" id="cl2" data-anim>
      <svg viewBox="0 0 640 230" role="img" aria-label="Belief and the threshold for each level"><g id="cl2-ax"></g><path id="cl2-p" class="cl2-l"/><g id="cl2-mk"></g></svg>
      <p class="cl2-msg" id="cl2-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative model: the user hands over a level of task only after the belief crosses that level's threshold; each month of tasks completed produces some verifiable records, and higher-stakes tasks produce more records with greater diagnostic power. The dashed lines are the thresholds for each level, from bottom to top: looking up data and reminders; drafting plans; confirming each order; approving plans.</figcaption>
</figure>
<style>
.cl2 svg{width:100%;height:auto;display:block}
.cl2-l{fill:none;stroke:var(--accent);stroke-width:2.5}
.cl2-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.cl2 svg text{font-size:16px}}
</style>
<script>
(function(){
  const L=[['Look-ups',.25,.12],['Drafting',.5,.18],['Per order',.65,.22],['Approval',.85,.26]];
  const X0=50,X1=560,YT=14,YB=200,x=m=>X0+m/12*(X1-X0),y=p=>YB-p*(YB-YT);
  const lo=p=>Math.log(p/(1-p)),ex=l=>1/(1+Math.exp(-l));
  const $=id=>document.getElementById(id);
  let ax=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`+[0,.5,1].map(v=>`<text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+[0,3,6,9,12].map(m=>`<text x="${x(m)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Month ${m}</text>`).join('');
  L.forEach(([n,t])=>ax+=`<line x1="${X0}" x2="${X1}" y1="${y(t)}" y2="${y(t)}" stroke="var(--warm)" stroke-dasharray="3 4" opacity=".6"/><text x="${X1+6}" y="${y(t)+4}" font-size="11" class="t-warm">${n}</text>`);
  $('cl2-ax').innerHTML=ax;
  function sim(k){let p=.3,pts=[[0,p]],unlocked=[];for(let m=1;m<=12;m++){let lvl=-1;L.forEach(([n,t],i)=>{if(p>=t)lvl=i;});
      if(k==='a'){lvl=p>=L[3][1]?3:-1;}
      if(lvl>=0){if(!unlocked.includes(lvl)){unlocked.push(lvl);}p=ex(lo(p)+L[lvl][2]*1.4);} pts.push([m,p]);}return [pts,unlocked];}
  function set(k){document.querySelectorAll('[data-cl2]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cl2===k)));const [pts]=sim(k);
    $('cl2-p').setAttribute('d',pts.map(([m,p],i)=>(i?'L':'M')+x(m).toFixed(1)+','+y(p).toFixed(1)).join(''));
    $('cl2-mk').innerHTML=pts.map(([m,p])=>`<circle cx="${x(m)}" cy="${y(p)}" r="3.5" fill="var(--accent)"/>`).join('');
    const end=pts[12][1];
    $('cl2-msg').textContent=k==='a'?'Asking for full authority at once: the user\'s belief is far below the threshold, nothing is handed over, so no evidence is produced either; after a year the belief is still at 30%.':`Beginning with small tasks: looking up data and reminders have low thresholds, so the user is willing to try them; each month's records lift the belief across one threshold after another. After a year it is about ${(end*100).toFixed(0)}%, enough to hand over tasks at the plan-approval level.`;}
  document.querySelectorAll('[data-cl2]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.cl2)));
  $('cl2').addEventListener('anim-in',()=>{set('a');setTimeout(()=>set('b'),2400);});
  set('b');
})();
</script>
