<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Why hiring a steward keeps getting more expensive</p><p class="figsub">The efficiency of weaving rises 3% a year, a steward's efficiency stays the same, and wages on both sides rise together. The vertical axis shows a year of a steward's services measured against bolts of cloth. Tick "the scribes arrive" to see what happens after year 30.</p></div><button class="replay" type="button" data-replay="bm14">Replay</button></div>
    <div class="bm14" id="bm14" data-anim>
      <svg viewBox="0 0 660 210" role="img" aria-label="Price of a steward relative to cloth"><g id="bm14-g"></g></svg>
      <div class="cs-sw"><label><input type="checkbox" id="bm14-c"> The scribes arrive: from year 30, the cognitive labour that makes up 80% of a steward's work becomes almost free</label></div>
      <p class="bm14-msg" id="bm14-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: Baumol's (1967) two-sector model. The steward's relative price = (1 + 3%) to the power t; after the scribes arrive, the labour a steward needs falls to 20% of what it was, and the remaining checking and bearing responsibility continue at the old efficiency.</figcaption>
</figure>
<style>
.bm14 svg{width:100%;height:auto;display:block}
.bm14-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.bm14 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('bm14'+id),T=50,X0=50,X1=628,YT=12,YB=180,x=t=>X0+t/T*(X1-X0);
  function draw(n){const c=$('-c').checked,N=n===undefined?T:n,P=[];for(let t=0;t<=T;t++)P.push(Math.pow(1.03,t)*(c&&t>=30?.2:1));
    const mx=5,y=v=>YB-v/mx*(YB-YT);
    let h=[0,1,2,3,4,5].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}×</text>`).join('')+[0,10,20,30,40,50].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Year ${t}</text>`).join('');
    if(c)h+=`<line x1="${x(30)}" x2="${x(30)}" y1="${YT}" y2="${YB}" stroke="var(--warm)" stroke-dasharray="4 4"/><text x="${x(30)+6}" y="${YT+12}" font-size="11" fill="var(--warm)">Scribes arrive</text>`;
    h+=`<path d="${P.slice(0,N+1).map((v,t)=>(t?'L':'M')+x(t).toFixed(1)+','+y(v).toFixed(1)).join('')}" fill="none" stroke="var(--accent)" stroke-width="2.6"/>`;
    $('-g').innerHTML=h;
    $('-msg').textContent=c?`In year 29, a year of a steward's services costs as much as ${P[29].toFixed(1)} bolts of cloth; after the scribes arrive, it falls to ${P[30].toFixed(1)} bolts. But the remaining checking and bearing responsibility still do not get faster, and by year 50 it climbs back to ${P[50].toFixed(1)} bolts.`:`After fifty years, a year of a steward's services costs as much as ${P[50].toFixed(1)} bolts of cloth: the steward has not got worse; other things have simply become cheaper.`;}
  $('-c').addEventListener('input',()=>draw());
  $('').addEventListener('anim-in',()=>{$('-c').checked=false;let n=0;const id=setInterval(()=>{n+=1;draw(n);if(n>=T){clearInterval(id);setTimeout(()=>{$('-c').checked=true;draw();},1200);}},40);});
  draw();
})();
</script>
