<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Three parts and three words</p><p class="figsub">Choose a word to see what the derivation in each of the three parts did for it.</p></div><button class="replay" type="button" data-replay="er">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Word">
      <button type="button" data-er="0" aria-pressed="true">Accessible</button>
      <button type="button" data-er="1" aria-pressed="false">Credible</button>
      <button type="button" data-er="2" aria-pressed="false">Cheaper</button>
    </div>
    <div class="er" id="er" data-anim><div class="er-g" id="er-g"></div><p class="er-msg" id="er-msg" aria-live="polite"></p></div>
  </div>
</figure>
<style>
.er-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.er-c{background:var(--quote);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;border-top:4px solid var(--c);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;transition-delay:calc(var(--i)*.2s)}
.er.in .er-c{opacity:1;transform:none}
.er-c em{display:block;font-style:normal;font-size:11.5px;color:var(--faint)}
.er-c b{display:block;font-size:12px;margin-top:4px;color:var(--c)}
.er-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.er-g{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const W=[[['Part One','Saving, lending, money, insurance, banks, shares and markets let people who could not make the exchange before obtain claims on the future.','Institutions grew'],['Part Two','Research and comparison are almost free, the threshold for delegation falls, and personalized arrangements no longer belong only to large clients; checking and accountability set the floor of that threshold.','Loosened'],['Part Three','Starting from one person\'s goals, the three accounts give each goal its own arrangement.','Built into the product']],
    [['Part One','Commitments, custody, disclosure, suitability and regulation make sure claims are honoured in the future.','Institutions grew'],['Part Two','Agents cannot afford to pay for mistakes, can change their names, resemble one another and are present at critical moments: the demands for guarantees, records and defences tighten instead.','Tightened'],['Part Three','Four of the five parts answer to it: the agreement and authority, verifiable records, limits, confirmation and compensation, and the path to building trust.','Built into the product']],
    [['Part One','Diversification, index funds and defaults bring down the cost of the exchange.','Institutions grew'],['Part Two','Cognitive labour is almost free, and the costs of fees, mistakes and execution fall sharply; time, systemic risk and irreversibility do not change.','Loosened, with a floor'],['Part Three','It promises a cap on fees and gives the savings back to the user.','Built into the product']]];
  const M=['Accessible: Part Two moves it a long way forward, and Part Three builds it into each person\'s goals.','Credible: in a world where cognitive labour is almost free, it is the scarcest thing, and most of the product answers to it.','Cheaper: it arrives by itself as the price of cognitive labour falls, but time, systemic risk and irreversible loss set a floor beneath it.'];
  const C=['var(--accent)','var(--warm)','var(--blue)'],g=document.getElementById('er-g'),m=document.getElementById('er-msg'),bs=[...document.querySelectorAll('[data-er]')];
  function set(k){bs.forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.er===k)));g.innerHTML=W[k].map(([p,t,tag],i)=>`<div class="er-c" style="--i:${i};--c:${C[k]}"><em>${p}</em>${t}<b>${tag}</b></div>`).join('');m.textContent=M[k];}
  bs.forEach(b=>b.addEventListener('click',()=>set(+b.dataset.er)));
  document.getElementById('er').addEventListener('anim-in',()=>{[0,1,2].forEach((k,i)=>setTimeout(()=>set(k),300+i*2600));});
  set(0);
})();
</script>
