<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Information advantage is zero-sum</p><p class="figsub">Add up everyone's gains and losses for a year. Drag the share of uninformed people who trade frequently and the cost of each trade to see each group's gains and losses, and what remains once they are added together.</p></div><button class="replay" type="button" data-replay="zr">Replay</button></div>
    <div class="zr" id="zr" data-anim></div>
    <div class="zr-sl">
      <div class="sl"><label for="zr-a">Uninformed who trade frequently <b id="zr-av"></b></label><input id="zr-a" type="range" min="0" max="100" step="10" value="50"></div>
      <div class="sl"><label for="zr-c">Cost of digging and trading <b id="zr-cv"></b></label><input id="zr-c" type="range" min="0" max="10" step="1" value="4"></div>
    </div>
    <p class="zr-msg" id="zr-msg" aria-live="polite"></p>
  </div>
  <figcaption>Illustrative: the informed earn 10 portions from the uninformed who trade frequently; passive holders, who do not trade, get only the fleet's average return and stay out of these gains and losses. Sharpe (1991): before costs, active investors as a group earn the same as passive ones; after costs, active investors as a group must fall behind.</figcaption>
</figure>
<style>
.zr{display:grid;gap:6px}
.zr-r{display:grid;grid-template-columns:9em 1fr 4.5em;gap:10px;align-items:center;font-size:13px}
.zr-t{position:relative;height:16px;background:var(--quote);border-radius:4px}
.zr-t::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--faint)}
.zr-t i{position:absolute;top:0;height:100%;border-radius:4px;transition:left .3s,width .3s}
.zr-r b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.zr-r.tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.zr-sl{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.zr-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.zr-sl{grid-template-columns:1fr;gap:4px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id);
  function bar(v,M){const w=Math.min(50,Math.abs(v)/M*50);return `left:${v>=0?50:50-w}%;width:${w}%;background:${v>=0?'var(--accent)':'var(--warm)'}`;}
  function draw(){const a=+$('zr-a').value/100,c=+$('zr-c').value,pool=10*a,inf=pool-c*.5,act=-pool-c*.5*a,pas=0,tot=inf+act+pas;
    const R=[['Informed',inf],['Uninformed, trading often',act],['Passive holders',pas],['Total',tot]];
    $('zr').innerHTML=R.map(([n,v],i)=>`<div class="zr-r${i===3?' tot':''}"><span>${n}</span><div class="zr-t"><i style="${bar(v,12)}"></i></div><b>${v>=0?'+':'−'}${Math.abs(v).toFixed(1)}</b></div>`).join('');
    $('zr-av').textContent=Math.round(a*100)+'%';$('zr-cv').textContent=c+(c===1?' portion':' portions');
    $('zr-msg').textContent=a===0?'No one trades with the informed: the news they dug up earns them nothing, and they have paid the cost for nothing.':c===0?'Ignoring costs, what the informed earn exactly equals what the uninformed frequent traders lose; the total is zero.':`What the informed earn is exactly what the uninformed frequent traders lose; after ${c} ${c===1?'portion':'portions'} of costs, the total is negative. Passive holders stay out of this guessing game and do not pay the cost.`;}
  ['zr-a','zr-c'].forEach(k=>$(k).addEventListener('input',draw));
  $('zr').addEventListener('anim-in',()=>{let v=0;$('zr-c').value=0;draw();const id=setInterval(()=>{v++;$('zr-c').value=v;draw();if(v>=8)clearInterval(id);},300);});
  draw();
})();
</script>
