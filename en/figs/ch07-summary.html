    <div class="figbar"><div><p class="figtitle">Chapter summary: prices are hard to predict, so what products should not promise</p><p class="figsub">Three design requirements, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="ch07summary">Replay</button></div>
    <div class="ch07summary" id="ch07summary" data-anim><div class="ch07summary-c" style="--i:0"><em>The predictable part gets traded away</em><b>Do not promise to predict direction</b><p>Treat claims of “consistently predicting rises and falls” with scepticism first, including claims that come from AI.</p></div><div class="ch07summary-c warn" style="--i:1"><em>People see patterns in randomness</em><b>Do not package winning or losing streaks as signals</b><p>Short-term chart patterns and streaks of rises or falls are mostly normal features of random sequences.</p></div><div class="ch07summary-c warn" style="--i:2"><em>Predictability weakens once discovered</em><b>Every pattern must pass an out-of-sample test</b><p>AI is very good at finding plausible-looking patterns in noise; backtests and patterns must be tested on data not used to build the model.</p></div></div>
