<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Book summary: designing financial products under three sets of constraints</p><p class="figsub">Four layers of design, each corresponding to a part of net value.</p></div><button class="replay" type="button" data-replay="ch31summary">Replay</button></div>
    <div class="ch31summary" id="ch31summary" data-anim><div class="ch31summary-c" style="--i:0"><em>Value layer</em><b>Promise value that can be delivered and verified</b><p>Measure by net value, and place value in cost, discipline, behaviour and access.</p></div><div class="ch31summary-c" style="--i:1"><em>Contract layer</em><b>Agree authority according to consequences</b><p>Write instructions as a mandate, have the principal take the irreversible step, and put income and goals on the user's side.</p></div><div class="ch31summary-c warn" style="--i:2"><em>Implementation layer</em><b>Make implementation open to checking</b><p>Start with tasks that are easy to check, shorten unchecked stretches, keep point-in-time records, and keep assurance proportionate to risk.</p></div><div class="ch31summary-c warn" style="--i:3"><em>Trust</em><b>Earn proportionate trust with diagnostic evidence</b><p>Make evidence seen and hard to fake, disclose mistakes first, put defaults on the user's side, invite rather than lecture, and make leaving easy.</p></div></div>
  </div>
