<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Same average, larger swings, harder life</p><p class="figsub">Two households both average 12 portions a year over twenty years. Drag the swings in one household's harvest and compare what each household's harvest is equivalent to as a steady amount each year.</p></div><button class="replay" type="button" data-replay="lk">Replay</button></div>
    <div class="lk" id="lk" data-anim>
      <svg viewBox="0 0 640 200" role="img" aria-label="Twenty years of harvests for two households"><g id="lk-ax"></g><g id="lk-b"></g></svg>
      <div class="legend"><span><i style="background:var(--faint)"></i>Household with a steady harvest</span><span><i style="background:var(--accent)"></i>Household with a fluctuating harvest</span></div>
      <div class="sl"><label for="lk-s">Size of the swings <b id="lk-sv"></b></label><input id="lk-s" type="range" min="0" max="50" step="5" value="35"></div>
      <p class="lk-msg" id="lk-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: the fluctuating household's harvest each year = 12 × (1 + size of swings × random number); the random numbers are fixed and adjusted so the average is exactly 12 portions. The steady equivalent is computed with logarithmic satisfaction.</figcaption>
</figure>
<style>
.lk svg{width:100%;height:auto;display:block}
.lk-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.lk svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),Z=[.3,-1.2,.8,.1,-.4,1.5,-.9,.2,.6,-1.8,.9,.4,-.2,1.1,-.7,.05,-1.3,.7,1.0,-.45],m=Z.reduce((a,b)=>a+b,0)/Z.length,ZZ=Z.map(z=>z-m);
  const X0=40,X1=630,YT=10,YB=170,W=(X1-X0)/20,y=v=>YB-v/24*(YB-YT);
  $('lk-ax').innerHTML=[0,6,12,18,24].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+[1,5,10,15,20].map(t=>`<text x="${X0+W*(t-.5)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Year ${t}</text>`).join('');
  function draw(){const s=+$('lk-s').value/100,H=ZZ.map(z=>Math.max(.5,12*(1+s*z)));
    $('lk-b').innerHTML=H.map((h,t)=>`<rect x="${X0+W*t+W*.12}" y="${y(12)}" width="${W*.34}" height="${YB-y(12)}" fill="var(--faint)" opacity=".55"/><rect x="${X0+W*t+W*.5}" y="${y(h)}" width="${W*.34}" height="${YB-y(h)}" fill="var(--accent)"/>`).join('');
    const ce=Math.exp(H.reduce((a,h)=>a+Math.log(h),0)/H.length);$('lk-sv').textContent=Math.round(s*100)+'%';
    $('lk-msg').textContent=s===0?'With no swings, the two households are exactly the same.':`With the same average of 12 portions, the fluctuating household is equivalent to a steady ${ce.toFixed(1)} portions a year, ${(12-ce).toFixed(1)} portions less than the steady household: what good years add cannot make up for what bad years take away.`;}
  $('lk-s').addEventListener('input',draw);
  $('lk').addEventListener('anim-in',()=>{let v=0;$('lk-s').value=0;draw();const id=setInterval(()=>{v+=5;$('lk-s').value=v;draw();if(v>=45)clearInterval(id);},200);});
  draw();
})();
</script>
