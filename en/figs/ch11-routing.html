<figure>
  <div class="card">
    <p class="figtitle">Where an order can be sent</p>
    <p class="figsub">A client wants to buy 300 shares at market. The current lowest asks on each venue are shown below; the best ask across the market is 10.01. Choose a destination to see the result.</p>
    <div class="rt" id="rt" data-anim>
      <div class="rt-src">Client order<br><b>Buy 300 shares</b></div>
      <div class="rt-arrows" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="rt-dst">
        <button type="button" data-rt="a"><b>Exchange A</b><span>Ask 10.01 · 500 shares</span></button>
        <button type="button" data-rt="b"><b>Exchange B</b><span>Ask 10.02 · 800 shares</span></button>
        <button type="button" data-rt="w"><b>Wholesale market maker</b><span>Promises a price better than the best quote</span></button>
      </div>
    </div>
    <div class="rt-d" id="rt-d" aria-live="polite">Choose a destination.</div>
  </div>
  <figcaption>Example quotes. The rules follow the Order Protection Rule in the US Securities and Exchange Commission's Regulation NMS (2005) and FINRA Rule 5310 on best execution; quarterly disclosure of order routing and payment for order flow follows Rule 606 (as amended by the SEC in 2018). Rules differ across jurisdictions.</figcaption>
</figure>
<style>
.rt{display:grid;grid-template-columns:120px 50px 1fr;gap:8px;align-items:center}
.rt-src{background:var(--ink);color:var(--bg);border-radius:10px;padding:12px;text-align:center;font-size:12px}
.rt-src b{font-size:14px}
.rt-arrows{display:flex;flex-direction:column;gap:30px}
.rt-arrows i{display:block;height:2px;background:linear-gradient(90deg,var(--faint) 50%,transparent 50%);background-size:8px 2px;animation:rtflow .8s linear infinite}
@keyframes rtflow{to{background-position:8px 0}}
.rt-dst{display:grid;gap:8px}
.rt-dst button{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rt-dst button span{font-size:12px;color:var(--muted)}
.rt-dst button.sel{border-color:var(--ink)}
.rt-dst button.bad.sel{border-color:var(--warm);background:var(--warm-soft)}
.rt-dst button.ok.sel{border-color:var(--accent);background:var(--accent-soft)}
.rt-d{margin-top:12px;background:var(--quote);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.7;min-height:5em}
.rt-d dl{display:grid;grid-template-columns:112px 1fr;gap:2px 10px;margin:4px 0 0}
.rt-d dt{font-size:12px;color:var(--faint);padding-top:3px}
.rt-d dd{margin:0}
@media (max-width:640px){.rt{grid-template-columns:1fr}.rt-arrows{display:none}}
</style>
<script>
(function(){
  const D={
    a:['ok','10.01','Equal to the best price in the market','Compliant: filled at the best quoted price.'],
    b:['bad','10.02','0.01 worse than the best price','Not allowed: filling at a price worse than the best price publicly quoted on another venue is a "trade-through", which the Order Protection Rule prohibits.'],
    w:['ok','10.008','0.002 better than the best price','Allowed, but with a conflict of interest: the market maker may pay the broker for order flow. The broker must regularly disclose where it sends orders and such income, and show that overall it has sought best execution for its clients.']
  };
  const d=document.getElementById('rt-d'), bs=[...document.querySelectorAll('[data-rt]')];
  bs.forEach(b=>{b.classList.add(D[b.dataset.rt][0]);b.addEventListener('click',()=>{bs.forEach(x=>x.classList.toggle('sel',x===b));const v=D[b.dataset.rt];
    d.innerHTML=`<dl><dt>Fill price</dt><dd><b>${v[1]}</b></dd><dt>Versus best price</dt><dd>${v[2]}</dd><dt>Rule</dt><dd>${v[3]}</dd></dl>`;});});
})();
</script>
