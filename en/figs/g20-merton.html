<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">How much to put in ship shares</p><p class="figsub">Drag the three sliders and see how the optimal share in ship shares changes.</p></div><button class="replay" type="button" data-replay="mt20">Replay</button></div>
    <div class="mt20" id="mt20" data-anim>
      <div class="mt20-f" id="mt20-f"></div>
      <div class="mt20-bar"><i id="mt20-i"></i><span id="mt20-v"></span></div>
      <div class="mt20-ctl">
        <div class="sl"><label for="mt20-p">Extra return of ship shares <b id="mt20-pv"></b></label><input id="mt20-p" type="range" min="1" max="8" step="0.5" value="4"></div>
        <div class="sl"><label for="mt20-s">Volatility of ship shares <b id="mt20-sv"></b></label><input id="mt20-s" type="range" min="10" max="30" step="1" value="16"></div>
        <div class="sl"><label for="mt20-g">Aversion to swings <b id="mt20-gv"></b></label><input id="mt20-g" type="range" min="1" max="10" step="0.5" value="3"></div>
      </div>
      <p class="mt20-msg" id="mt20-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Share = extra return ÷ (aversion coefficient × volatility²). Above 100% it means borrowing to buy; the figure caps it at 100% (Merton, 1969). The values of the aversion coefficient are illustrative.</figcaption>
</figure>
<style>
.mt20-f{font-size:15px;text-align:center;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.mt20-bar{position:relative;height:34px;background:var(--quote);border-radius:8px;overflow:hidden}
.mt20-bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.mt20-bar span{position:absolute;left:10px;top:7px;font-size:14px;color:var(--bg);font-weight:600}
.mt20-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.mt20-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.mt20-ctl{grid-template-columns:1fr;gap:4px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('mt20'+id);
  function draw(){const p=+$('-p').value/100,s=+$('-s').value/100,g=+$('-g').value,w=p/(g*s*s),c=Math.min(1,w);
    $('-pv').textContent=(p*100).toFixed(1)+'%';$('-sv').textContent=Math.round(s*100)+'%';$('-gv').textContent=g.toFixed(1);
    $('-f').textContent=`${(p*100).toFixed(1)}% ÷ (${g.toFixed(1)} × ${(s*100).toFixed(0)}%²) = ${(w*100).toFixed(0)}%`;
    $('-i').style.width=c*100+'%';$('-v').textContent=Math.round(c*100)+'%';$('-v').style.color=c<.12?'var(--ink)':'var(--bg)';$('-v').style.left=c<.12?`calc(${c*100}% + 8px)`:'10px';
    $('-msg').textContent=w>1?'The formula calls for borrowing to buy; the scribe does not borrow to take risks for an ordinary household, so the cap is putting everything in ship shares.':`Put ${Math.round(c*100)}% in ship shares. The share depends only on these three things, not on how much grain he has or how old he is; but the result rests on one premise: he has no other assets.`;}
  ['-p','-s','-g'].forEach(k=>$(k).addEventListener('input',draw));
  $('').addEventListener('anim-in',()=>{let v=1;$('-g').value=1;draw();const id=setInterval(()=>{v+=.5;$('-g').value=v;draw();if(v>=8)clearInterval(id);},200);});
  draw();
})();
</script>
