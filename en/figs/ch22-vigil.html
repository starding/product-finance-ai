<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">The more reliable the results, the laxer the checking</p><p class="figsub">97% of the agent's results are correct. Over twenty weeks, the share the checker actually checks carefully, and the cumulative errors missed. Turn on test items to mix in, at regular intervals, results known to contain errors and see whether the checker catches them.</p></div><button class="replay" type="button" data-replay="vg">Replay</button></div>
    <label class="vg-chk"><input type="checkbox" id="vg-x"> Regularly insert test items with known errors</label>
    <div class="vg" id="vg" data-anim>
      <svg viewBox="0 0 640 220" role="img" aria-label="Checking rate and missed errors"><g id="vg-ax"></g><path id="vg-r" class="vg-l r"/><path id="vg-m" class="vg-l m"/></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Share checked carefully</span><span><i style="background:var(--warm)"></i>Cumulative errors missed</span></div>
      <p class="vg-msg" id="vg-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative curves: 100 results a week. On complacency and bias with automation, see Parasuraman and Manzey (2010).</figcaption>
</figure>
<style>
.vg-chk{display:flex;gap:6px;align-items:center;font-size:14px;margin-bottom:6px}
.vg-chk input{accent-color:var(--accent);width:16px;height:16px}
.vg svg{width:100%;height:auto;display:block}
.vg-l{fill:none;stroke-width:2.5;transition:d .6s} .vg-l.r{stroke:var(--accent)} .vg-l.m{stroke:var(--warm);stroke-dasharray:6 3}
.vg-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.vg svg text{font-size:18px}}
</style>
<script>
(function(){
  const W=20,X0=56,X1=590,YT=14,YB=180,x=w=>X0+(w-1)/(W-1)*(X1-X0),yr=v=>YB-v*(YB-YT),ym=v=>YB-v/40*(YB-YT);
  const $=id=>document.getElementById(id),cb=$('vg-x');
  $('vg-ax').innerHTML=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`+[0,.5,1].map(v=>`<text x="${X0-6}" y="${yr(v)+4}" text-anchor="end" font-size="11" class="t-accent">${v*100}%</text>`).join('')+[0,20,40].map(v=>`<text x="${X1+6}" y="${ym(v)+4}" font-size="11" class="t-warm">${v}</text>`).join('')+[1,5,10,15,20].map(w=>`<text x="${x(w)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Week ${w}</text>`).join('');
  function series(on){const r=[],m=[];let cum=0;for(let w=1;w<=W;w++){const rate=on?.9:Math.max(.25,1-.75*(1-Math.exp(-(w-1)/5)));cum+=3*(1-rate);r.push(rate);m.push(cum);}return [r,m];}
  function r(){const on=cb.checked,[a,b]=series(on);$('vg-r').setAttribute('d',a.map((v,i)=>(i?'L':'M')+x(i+1).toFixed(1)+','+yr(v).toFixed(1)).join(''));$('vg-m').setAttribute('d',b.map((v,i)=>(i?'L':'M')+x(i+1).toFixed(1)+','+ym(v).toFixed(1)).join(''));
    $('vg-msg').textContent=on?`With regular test items, the checker knows an error may appear at any time, and the share checked carefully stays around 90%; about ${b[W-1].toFixed(0)} errors are missed over twenty weeks.`:`In the first few weeks almost every result is read carefully; as results keep being right, checking gradually becomes a glance. The share checked carefully falls to about ${Math.round(a[W-1]*100)}%, and about ${b[W-1].toFixed(0)} errors are missed over twenty weeks.`;}
  cb.addEventListener('change',r);
  $('vg').addEventListener('anim-in',()=>{cb.checked=false;r();setTimeout(()=>{cb.checked=true;r();},2600);});
  r();
})();
</script>
