<figure>
  <div class="card">
    <p class="figtitle">Each added constraint leaves fewer portfolios to choose from</p>
    <p class="figsub">Each dot is a candidate portfolio; the horizontal axis is risk and the vertical axis expected return (illustrative). Tick the principal's constraints one by one and see which portfolios remain.</p>
    <div class="cs-sl" id="cs-sl"></div>
    <div class="cs" id="cs" data-anim>
      <svg viewBox="0 0 640 230" role="img" aria-label="Candidate portfolios and constraints"><g id="cs-ax"></g><g id="cs-pts"></g></svg>
      <p class="cs-msg" id="cs-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative. The five kinds of constraint follow the standard classification for investment policy statements (Maginn et al., 2007).</figcaption>
</figure>
<style>
.cs-sl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:6px}
.cs-sl label{display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
.cs-sl input{accent-color:var(--accent);width:16px;height:16px}
.cs svg{width:100%;height:auto;display:block}
.cs-p{transition:opacity .4s}
.cs-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.cs svg text{font-size:18px}}
</style>
<script>
(function(){
  let s=5;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const P=Array.from({length:70},()=>{const r=2+rnd()*26,ret=1+r*.28+(rnd()-.5)*3;return {r,ret,cash:rnd()*40,turn:rnd(),deriv:rnd()<.18,sector:rnd()<.2};});
  const C=[['Liquidity: at least 10% available at any time',p=>p.cash>=10],['Horizon: money needed in five years, volatility no more than 18%',p=>p.r<=18],['Tax: no frequent turnover',p=>p.turn<.7],['Legal and regulatory: no leverage or derivatives',p=>!p.deriv],['Personal preference: no tobacco companies',p=>!p.sector]];
  const box=document.getElementById('cs-sl');box.innerHTML=C.map(([n],i)=>`<label><input type="checkbox" data-cs="${i}"> ${n}</label>`).join('');
  const X0=50,X1=620,YT=14,YB=200,x=v=>X0+v/30*(X1-X0),y=v=>YB-v/11*(YB-YT);
  document.getElementById('cs-ax').innerHTML=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/><line x1="${X0}" y1="${YT}" x2="${X0}" y2="${YB}" class="s-faint"/><text x="${X1}" y="${YB+16}" text-anchor="end" font-size="11" class="t-faint">Risk →</text><text x="${X0+6}" y="${YT+8}" font-size="11" class="t-faint">Expected return</text>`;
  document.getElementById('cs-pts').innerHTML=P.map((p,i)=>`<circle class="cs-p" data-i="${i}" cx="${x(p.r)}" cy="${y(Math.max(.3,p.ret))}" r="5" fill="var(--accent)"/>`).join('');
  const dots=[...document.querySelectorAll('.cs-p')],cb=[...document.querySelectorAll('[data-cs]')];
  function r(){let n=0;P.forEach((p,i)=>{const ok=cb.every((c,j)=>!c.checked||C[j][1](p));dots[i].style.opacity=ok?1:.1;if(ok)n++;});
    const k=cb.filter(c=>c.checked).length;document.getElementById('cs-msg').textContent=k===0?'With no constraints, all 70 candidate portfolios are open, and the agent might choose any of them.':`With ${k} ${k===1?'constraint':'constraints'} added, ${n} ${n===1?'portfolio remains':'portfolios remain'}.${k===5?' None of those left will make the principal discover afterwards that "this is not what I wanted".':''}`;}
  cb.forEach(c=>c.addEventListener('change',r));
  document.getElementById('cs').addEventListener('anim-in',()=>{cb.forEach(c=>c.checked=false);r();cb.forEach((c,i)=>setTimeout(()=>{c.checked=true;r();},900*(i+1)));});
  r();
})();
</script>
