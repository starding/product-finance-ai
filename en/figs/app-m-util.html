<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Choosing the model: square root or logarithm</p><p class="figsub">The same lifetime of resources, with a positive interest rate on borrowing and lending: the best consumption path under two measures of satisfaction. Drag the interest rate and see how the two paths differ.</p></div><button class="replay" type="button" data-replay="mu">Replay</button></div>
    <div class="mu" id="mu" data-anim>
      <svg viewBox="0 0 640 220" role="img" aria-label="Consumption paths under two measures of satisfaction"><g id="mu-ax"></g><path id="mu-s" class="mu-s"/><path id="mu-l" class="mu-l"/></svg>
      <div class="legend"><span><i style="background:var(--warm)"></i>Square root: first draft</span><span><i style="background:var(--accent)"></i>Logarithm: revised</span></div>
      <div class="sl"><label for="mu-r">Annual interest rate <b id="mu-rv"></b></label><input id="mu-r" type="range" min="0" max="6" step="0.5" value="3"></div>
      <p class="mu-msg" id="mu-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: ages 20 to 80. The consumption path satisfies the condition that the satisfaction from one more mouthful this year equals the satisfaction from that mouthful saved until next year with interest added. Under the square root it grows by (1 + interest rate)² each year; under the logarithm by (1 + interest rate). Both paths have the same present value of lifetime resources; the vertical axis is the multiple of consumption at age 20.</figcaption>
</figure>
<style>
.mu svg{width:100%;height:auto;display:block}
.mu-s{fill:none;stroke:var(--warm);stroke-width:2.4}
.mu-l{fill:none;stroke:var(--accent);stroke-width:2.4}
.mu-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.mu svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=46,X1=630,YT=12,YB=186,x=a=>X0+(a-20)/60*(X1-X0),ly=v=>YB-Math.log(v)/Math.log(40)*(YB-YT);
  $('mu-ax').innerHTML=[1,2,5,10,20,40].map(v=>`<line x1="${X0}" x2="${X1}" y1="${ly(v)}" y2="${ly(v)}" class="s-line"/><text x="${X0-6}" y="${ly(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}×</text>`).join('')+[20,40,60,80].map(a=>`<text x="${x(a)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Age ${a}</text>`).join('');
  function draw(){const r=+$('mu-r').value/100;let ps='',pl='';for(let a=20;a<=80;a++){const t=a-20;ps+=(t?'L':'M')+x(a).toFixed(1)+','+ly(Math.min(40,Math.pow(1+r,2*t))).toFixed(1);pl+=(t?'L':'M')+x(a).toFixed(1)+','+ly(Math.pow(1+r,t)).toFixed(1);}
    $('mu-s').setAttribute('d',ps);$('mu-l').setAttribute('d',pl);$('mu-rv').textContent=(r*100).toFixed(1)+'%';
    const s=Math.pow(1+r,120),l=Math.pow(1+r,60);
    $('mu-msg').textContent=r===0?'With a zero interest rate, both models have a person eat the same amount every year of life.':`At an annual interest rate of ${(r*100).toFixed(1)}%, the square-root model makes consumption at 80 reach ${s>=100?Math.round(s):s.toFixed(1)} times that at 20: scrimping when young and feasting when old. Under the logarithmic model it is about ${l.toFixed(1)} times. The first is far from the intended smoothing of consumption.`;}
  $('mu-r').addEventListener('input',draw);
  $('mu').addEventListener('anim-in',()=>{let v=0;$('mu-r').value=0;draw();const id=setInterval(()=>{v+=.5;$('mu-r').value=v;draw();if(v>=4)clearInterval(id);},250);});
  draw();
})();
</script>
