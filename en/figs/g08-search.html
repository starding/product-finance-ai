<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">The more urgent the sale, the lower the price</p><p class="figsub">A ship share is worth 10 portions of grain on its prospects. The seller can ask three households a day; each has a 15% chance of wanting to buy, offering between 6 and 12 portions. Drag the most days the seller can wait and see the average price obtained by selling in the best way.</p></div><button class="replay" type="button" data-replay="se">Replay</button></div>
    <div class="se" id="se" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="Days the seller can wait and the average sale price"><g id="se-ax"></g><path id="se-c" class="se-c"/><circle id="se-p" r="6" fill="var(--ink)"/></svg>
      <div class="sl"><label for="se-d">Can wait at most <b id="se-dv"></b></label><input id="se-d" type="range" min="0" max="30" step="1" value="2"></div>
      <p class="se-msg" id="se-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: if the share is still unsold when time runs out, it can only be dumped for 5 portions to anyone willing to take it. The best approach is to compare each day’s offer with the expected gain from waiting longer and sell if the offer is higher (computed by backward induction).</figcaption>
</figure>
<style>
.se svg{width:100%;height:auto;display:block}
.se-c{fill:none;stroke:var(--accent);stroke-width:2.5}
.se-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.se svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),A=6,B=12,p=1-Math.pow(.85,3),X0=46,X1=630,YT=12,YB=178,x=d=>X0+d/30*(X1-X0),y=v=>YB-(v-4)/7*(YB-YT);
  const Emax=v=>v<=A?(A+B)/2:v>=B?v:((B*B-v*v)/2+v*(v-A))/(B-A);
  const V=[5];for(let k=1;k<=30;k++)V.push(p*Emax(V[k-1])+(1-p)*V[k-1]);
  $('se-ax').innerHTML=[5,7,9,10,11].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="${v===10?'s-faint':'s-line'}"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+[0,5,10,15,20,25,30].map(d=>`<text x="${x(d)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${d} days</text>`).join('')+`<text x="${X1}" y="${y(10)-5}" text-anchor="end" font-size="11" class="t-muted">Worth 10 on prospects</text>`;
  $('se-c').setAttribute('d',V.map((v,d)=>(d?'L':'M')+x(d).toFixed(1)+','+y(v).toFixed(1)).join(''));
  function draw(){const d=+$('se-d').value;$('se-p').setAttribute('cx',x(d));$('se-p').setAttribute('cy',y(V[d]));$('se-dv').textContent=d+(d===1?' day':' days');
    $('se-msg').textContent=d===0?'Unable to wait even a day, the seller must dump the share for 5 portions, only half what it is worth on its prospects.':V[d]<10?`Able to wait at most ${d} day${d===1?'':'s'}, the seller gets ${V[d].toFixed(1)} portions on average, ${(10-V[d]).toFixed(1)} less than the share is worth on its prospects. The longer one can wait, the better the offer one can pick; but those in urgent need often cannot wait.`:`Able to wait at most ${d} days, the seller gets ${V[d].toFixed(1)} portions on average: wait long enough and one can even find a buyer offering more than the prospects are worth. Sellers in no hurry gain, while those in urgent need cannot wait.`;}
  $('se-d').addEventListener('input',draw);
  $('se').addEventListener('anim-in',()=>{let v=0;$('se-d').value=0;draw();const id=setInterval(()=>{v++;$('se-d').value=v;draw();if(v>=30)clearInterval(id);},90);});
  draw();
})();
</script>
