<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Who gets the benefit of skill</p><p class="figsub">The more money a manager runs, the harder it is to find equally good opportunities, and his excess return falls as he grows. Drag his level of skill to see how large he grows before money stops flowing in, and what the principals and the manager each get.</p></div><button class="replay" type="button" data-replay="bg">Replay</button></div>
    <div class="bg" id="bg" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="Size and excess return after fees"><g id="bg-ax"></g><path id="bg-c" class="bg-c"/><circle id="bg-p" r="6" fill="var(--ink)"/></svg>
      <div class="sl"><label for="bg-a">Manager's skill (extra return on the first money) <b id="bg-av"></b></label><input id="bg-a" type="range" min="1" max="6" step="0.5" value="4"></div>
      <div class="bg-out"><div><span>Size reached as money flows in</span><b id="bg-q"></b></div><div><span>Principals' excess return after fees</span><b id="bg-i"></b></div><div><span>Manager's fees per year</span><b id="bg-f"></b></div></div>
      <p class="bg-msg" id="bg-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: at size q, the excess return after a 1% fee = skill − 0.03 × q − 1%; money keeps flowing in until the principals' excess return after fees falls to zero (a simplification of Berk and Green, 2004). Size is measured in units of 100 portions.</figcaption>
</figure>
<style>
.bg svg{width:100%;height:auto;display:block}
.bg-c{fill:none;stroke:var(--accent);stroke-width:2.5}
.bg-out{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px}
.bg-out div{display:flex;flex-direction:column} .bg-out span{font-size:12px;color:var(--faint)} .bg-out b{font-size:20px;font-variant-numeric:tabular-nums}
.bg-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.bg svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=46,X1=630,YT=12,YB=178,x=q=>X0+q/200*(X1-X0),y=v=>YB-(v+1)/6*(YB-YT);
  $('bg-ax').innerHTML=[-1,0,1,2,3,4,5].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="${v===0?'s-faint':'s-line'}"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v>0?'+':''}${v}%</text>`).join('')+[0,50,100,150,200].map(q=>`<text x="${x(q)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${q}</text>`).join('')+`<text x="${X1}" y="${YB-6}" text-anchor="end" font-size="11" class="t-muted">Money he manages (hundreds of portions)</text>`;
  function draw(){const a=+$('bg-a').value,net=q=>a-.03*q-1,q=Math.max(0,(a-1)/.03);
    $('bg-c').setAttribute('d',`M${x(0)},${y(net(0))}L${x(200)},${y(net(200))}`);$('bg-p').setAttribute('cx',x(Math.min(q,200)));$('bg-p').setAttribute('cy',y(0));
    $('bg-av').textContent=a+'%';$('bg-q').textContent=(Math.round(q)*100).toLocaleString('en-US')+' portions';$('bg-i').textContent='0%';$('bg-f').textContent=Math.round(q*100*.01)+' portions';
    $('bg-msg').textContent=`For a manager with ${a}% skill, money flows in until he manages about ${(Math.round(q)*100).toLocaleString('en-US')} portions. At that point the principals' excess return after fees is exactly zero, and the manager collects about ${Math.round(q)} portions in fees a year. The greater the skill, the larger the size and the higher the manager's income, while the principals still get only the average: the benefit of skill goes to the manager.`;}
  $('bg-a').addEventListener('input',draw);
  $('bg').addEventListener('anim-in',()=>{let v=1;$('bg-a').value=1;draw();const id=setInterval(()=>{v+=.5;$('bg-a').value=v;draw();if(v>=6)clearInterval(id);},350);});
  draw();
})();
</script>
