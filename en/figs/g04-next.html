<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">What this step leaves open</p><p class="figsub">Four problems still unsolved once there is money. Click a problem to see the assumption it hides.</p></div><button class="replay" type="button" data-replay="nx4">Replay</button></div>
    <div class="nx" id="nx4" data-anim>
      <div class="nx-src"><b>With money</b><span>Exchange, accounting and storage</span></div>
      <div class="nx-list" id="nx4-l"></div>
    </div>
    <p class="nx-msg" id="nx4-msg" aria-live="polite"></p>
  </div>
</figure>
<style>
.nx{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.nx-src{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 10px;text-align:center}
.nx-src b{display:block;font-size:16px} .nx-src span{font-size:12px;opacity:.75}
.nx-list{display:grid;gap:6px}
.nx-i{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--quote);border:1px solid transparent;border-radius:9px;padding:9px 12px;color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.3s)}
.nx.in .nx-i{opacity:1;transform:none}
.nx-i span{font-size:13.5px} .nx-i em{font-style:normal;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nx-i.sel{border-color:var(--accent)}
.nx-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.nx{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const Q=[['Harvests are uncertain','Chapter 5 Insurance','Hidden assumption: harvests always arrive as expected. Money makes saving more convenient but cannot prevent crop failure.'],
    ['Maturities do not match','Chapter 6 Banks','Hidden assumption: savers and borrowers want the same timing. Savers want to withdraw at any time; those clearing land need to borrow for many years.'],
    ['The value of money depends on belief and on the issuer','Chapter 11 Regulation and custody','Hidden assumption: issuance is disciplined and the ledger will not be tampered with. Who ensures this?'],
    ['Who sets prices','Chapter 8 Markets','Hidden assumption: a yardstick brings prices with it. Prices still have to be determined jointly by the buying and selling of many people.']];
  const l=document.getElementById('nx4-l'),msg=document.getElementById('nx4-msg');
  l.innerHTML=Q.map((q,i)=>`<button type="button" class="nx-i" style="--i:${i}" data-i="${i}"><span>${q[0]}</span><em>→ ${q[1]}</em></button>`).join('');
  const bs=[...l.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));msg.textContent=Q[i][2];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('nx4').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1600+k*1800));});
  set(0);
})();
</script>
