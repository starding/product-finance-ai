<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">The same capability, more than 280 times cheaper</p><p class="figsub">The price per million tokens of calling a large model at a given level of performance. The vertical axis is logarithmic. Drag the budget to see how many reports the same money could read at the two dates.</p></div><button class="replay" type="button" data-replay="pr13">Replay</button></div>
    <div class="pr13" id="pr13" data-anim>
      <svg viewBox="0 0 660 210" role="img" aria-label="The fall in the price of calling large models"><g id="pr13-g"></g></svg>
      <div class="sl"><label for="pr13-b">Budget <b id="pr13-bv"></b></label><input id="pr13-b" type="range" min="1" max="100" step="1" value="20"></div>
      <div class="pr13-out" id="pr13-out"></div>
    </div>
  </div>
  <figcaption>Data: Stanford University, <i>AI Index Report 2025</i>, benchmarked at an MMLU score of about 64.8%: about US$20 in November 2022 and about US$0.07 in October 2024 (per million tokens). "One report" is taken as about 20,000 tokens, for illustration.</figcaption>
</figure>
<style>
.pr13 svg{width:100%;height:auto;display:block}
.pr13-out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pr13-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.pr13-out span{display:block;font-size:11.5px;color:var(--faint)} .pr13-out b{font-size:18px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.pr13-out{grid-template-columns:1fr}.pr13 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('pr13'+id),P=[['Nov 2022',20],['Oct 2024',.07]],X0=70,YT=16,YB=176;
  const y=v=>YB-(Math.log10(v)+2)/(Math.log10(100)+2)*(YB-YT);
  function draw(k){const b=+$('-b').value;$('-bv').textContent='US$'+b;
    let h=[.01,.1,1,10,100].map(v=>`<line x1="${X0}" x2="640" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">$${v}</text>`).join('');
    P.forEach(([n,v],i)=>{const cx=200+i*260,vv=k===undefined||k>i?v:100;h+=`<rect x="${cx-50}" y="${y(vv)}" width="100" height="${YB-y(vv)}" fill="${i?'var(--accent)':'var(--faint)'}" style="transition:y .8s,height .8s"/><text x="${cx}" y="${y(vv)-6}" text-anchor="middle" font-size="13">US$${v}</text><text x="${cx}" y="${YB+20}" text-anchor="middle" font-size="12" class="t-faint">${n}</text>`;});
    $('-g').innerHTML=h;const n=v=>Math.floor(b/(v*.02));
    $('-out').innerHTML=[['Reports readable in Nov 2022',n(20).toLocaleString('en-US')],['Reports readable in Oct 2024',n(.07).toLocaleString('en-US')]].map(([a,c])=>`<div><span>${a}</span><b>${c}</b></div>`).join('');}
  $('-b').addEventListener('input',()=>draw());
  $('').addEventListener('anim-in',()=>{draw(1);setTimeout(()=>draw(),900);});
  draw();
})();
</script>
