<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: the value and limits of financial agents</p><p class="figsub">Four design requirements, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="ch23summary">Replay</button></div>
    <div class="ch23summary" id="ch23summary" data-anim><div class="ch23summary-c" style="--i:0"><em>The baseline is actual behaviour</em><b>Measure value against what users did before</b><p>A research agent's value lies in depth; a portfolio agent's value lies in letting people who do no allocation do it, not in saving a few minutes.</p></div><div class="ch23summary-c" style="--i:1"><em>The value of prediction falls as it spreads</em><b>Do not sell on prediction</b><p>Place value in staying diversified, lowering costs and reducing behavioural bias, which do not disappear as similar agents spread.</p></div><div class="ch23summary-c warn" style="--i:2"><em>Trading errors are hard to undo</em><b>Tier authority; set limits and a stop switch</b><p>Information and advice can be autonomous; changing holdings and moving funds need the person's confirmation, with per-transaction and cumulative limits.</p></div><div class="ch23summary-c warn" style="--i:3"><em>Agents act together</em><b>Keep similar rules from firing at once</b><p>Stagger execution times, vary rule parameters, and when markets swing violently, flag the risk and slow execution down.</p></div></div>
  </div>
</figure>
