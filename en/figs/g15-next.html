<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">What this step leaves open</p><p class="figsub">Four questions that remain unresolved once guarantees and records have made scribes trustworthy. Click a question to see the assumption it hides.</p></div><button class="replay" type="button" data-replay="nx15">Replay</button></div>
    <div class="nx" id="nx15" data-anim>
      <div class="nx-src"><b>Guaranteed scribes</b><span>Liability, records and authority</span></div>
      <div class="nx-list" id="nx15-l"></div>
    </div>
    <p class="nx-msg" id="nx15-msg" aria-live="polite"></p>
  </div>
</figure>
<style>
.nx{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.nx-src{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 10px;text-align:center}
.nx-src b{display:block;font-size:16px} .nx-src span{font-size:12px;opacity:.75}
.nx-list{display:grid;gap:6px}
.nx-i{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--quote);border:1px solid transparent;border-radius:9px;padding:9px 12px;color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.3s)}
.nx.in .nx-i{opacity:1;transform:none}
.nx-i span{font-size:13.5px} .nx-i em{font-style:normal;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nx-i.sel{border-color:var(--accent)}
.nx-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.nx{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const Q=[['The cost of the guarantee','Part Three','Hidden assumption: the guarantee is free. Liability, insurance and records all cost money, and once these are built into fees, the threshold for delegation may rise again.'],
    ['The keeper of the record','Part Three','Hidden assumption: the party that keeps the record is trustworthy. Who constrains it, and how can the record be made understandable to principals themselves?'],
    ['A scribe for everyone','Chapter 16','Hidden assumption: only a few people can read every report. When everyone has a scribe, information advantage is used up faster, and new asymmetries appear elsewhere.'],
    ['Scribes that resemble each other','Chapter 17','Hidden assumption: trading is done by many people who each judge for themselves. Scribes from the same few operators may make the same decision at the same moment.']];
  const l=document.getElementById('nx15-l'),msg=document.getElementById('nx15-msg');
  l.innerHTML=Q.map((q,i)=>`<button type="button" class="nx-i" style="--i:${i}" data-i="${i}"><span>${q[0]}</span><em>→ ${q[1]}</em></button>`).join('');
  const bs=[...l.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));msg.textContent=Q[i][2];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('nx15').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1600+k*1800));});
  set(0);
})();
</script>
