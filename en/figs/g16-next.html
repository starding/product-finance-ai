<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">What this step leaves open</p><p class="figsub">Four questions that remain unresolved once everyone has an analyst. Click a question to see the assumption it hides.</p></div><button class="replay" type="button" data-replay="nx16">Replay</button></div>
    <div class="nx" id="nx16" data-anim>
      <div class="nx-src"><b>Analysts for all</b><span>Public information is no longer an advantage</span></div>
      <div class="nx-list" id="nx16-l"></div>
    </div>
    <p class="nx-msg" id="nx16-msg" aria-live="polite"></p>
  </div>
</figure>
<style>
.nx{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.nx-src{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 10px;text-align:center}
.nx-src b{display:block;font-size:16px} .nx-src span{font-size:12px;opacity:.75}
.nx-list{display:grid;gap:6px}
.nx-i{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--quote);border:1px solid transparent;border-radius:9px;padding:9px 12px;color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.3s)}
.nx.in .nx-i{opacity:1;transform:none}
.nx-i span{font-size:13.5px} .nx-i em{font-style:normal;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nx-i.sel{border-color:var(--accent)}
.nx-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.nx{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const Q=[['Analysts that resemble each other','Chapter 17','Hidden assumption: analysts each have their own methods, and their judgments are independent. Scribes from the same few operators may reach the same judgment at the same moment.'],
    ['The race to be first','Chapter 17','Hidden assumption: the order of trades does not matter. Once the speed of understanding news converges, the race shifts to who is faster and who is closer to the source of the news.'],
    ['The power to rank','Chapter 18','Hidden assumption: what the principal sees is what matters most. A scribe that selects and ranks items for the principal can also put first what favours the seller, exploiting human biases.'],
    ['Exclusive data','Part Three','Hidden assumption: information is either public or known to no one. Non-public data is becoming ever more valuable, and who holds it and to whom it is disclosed need new rules.']];
  const l=document.getElementById('nx16-l'),msg=document.getElementById('nx16-msg');
  l.innerHTML=Q.map((q,i)=>`<button type="button" class="nx-i" style="--i:${i}" data-i="${i}"><span>${q[0]}</span><em>→ ${q[1]}</em></button>`).join('');
  const bs=[...l.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));msg.textContent=Q[i][2];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('nx16').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1600+k*1800));});
  set(0);
})();
</script>
