<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">A scribe paid by the number of trades</p><p class="figsub">The same principal, the same year of prices. Switch the scribe's goal, then drag the frequency of push messages, and see how many times the principal trades in a year and what it costs him.</p></div><button class="replay" type="button" data-replay="en18">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Goal">
      <button type="button" data-en18="plan" aria-pressed="true">Acts on the principal's plan</button>
      <button type="button" data-en18="trade" aria-pressed="false">Paid by the number of trades</button>
    </div>
    <div class="en18" id="en18" data-anim>
      <div class="en18-bars" id="en18-b"></div>
      <div class="sl"><label for="en18-p">Push messages per week <b id="en18-pv"></b></label><input id="en18-p" type="range" min="0" max="40" step="2" value="10"></div>
      <p class="en18-msg" id="en18-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: a scribe acting on the plan invests once a month and rebalances once a quarter; its messages only remind the principal of the agreement and cause no extra trades. A scribe paid by the number of trades sends a message whenever the price moves; each message has a 15% chance of triggering a trade, each trade costs 0.3% of its value in spread and fees, and each trade is about one tenth of the holdings.</figcaption>
</figure>
<style>
.en18-bars{display:grid;gap:12px;margin:6px 0 10px}
.en18-r{display:grid;grid-template-columns:8.5em 1fr 5.5em;gap:10px;align-items:center;font-size:12.5px}
.en18-r div{height:22px;background:var(--quote);border-radius:5px;overflow:hidden}
.en18-r i{display:block;height:100%;transition:width .4s}
.en18-r b{text-align:right;font-variant-numeric:tabular-nums}
.en18-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.en18-r{grid-template-columns:1fr 5.5em}.en18-r span{grid-column:1/-1}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('en18'+id);let mode='plan';
  function draw(){const p=+$('-p').value;$('-pv').textContent=String(p);const base=16,extra=mode==='trade'?Math.round(p*52*.15):0,n=base+extra,cost=n*.1*.3;
    $('-b').innerHTML=[['Trades per year',n,360,'var(--blue)',String(n)],['Trading cost (% of holdings)',cost,12,'var(--warm)',cost.toFixed(1)+'%']].map(([k,v,m,c,t])=>`<div class="en18-r"><span>${k}</span><div><i style="width:${Math.min(100,v/m*100)}%;background:${c}"></i></div><b>${t}</b></div>`).join('');
    $('-msg').textContent=mode==='plan'?`Acting on the principal's plan: investing monthly and rebalancing quarterly, 16 trades a year, costing about ${cost.toFixed(1)}% of holdings. However many messages it sends, they only remind him of the agreement.`:`Paid by the number of trades: ${p} messages a week add ${extra} trades a year, costing about ${cost.toFixed(1)}% of holdings in total. The better the scribe knows the principal, the better it knows when a nudge works best.`;}
  const bs=[...document.querySelectorAll('[data-en18]')];
  function set(m){mode=m;bs.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.en18===m)));draw();}
  bs.forEach(b=>b.addEventListener('click',()=>set(b.dataset.en18)));$('-p').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{set('plan');setTimeout(()=>{set('trade');let v=0;$('-p').value=0;draw();const id=setInterval(()=>{v+=2;$('-p').value=v;draw();if(v>=40)clearInterval(id);},120);},1800);});
  draw();
})();
</script>
