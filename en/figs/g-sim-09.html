<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Civilization Simulator · Chapter 9: informed and uninformed</p><p class="figsub">Each year a new piece of news about the fleet's prospects appears. Those who pay to dig for it learn it first; everyone else must wait until it is public. Adjust the three settings to see the cumulative gains and losses of three groups over twenty years.</p></div><button class="replay" type="button" data-replay="cs9">Replay</button></div>
    <div class="cs-rules"><span class="on">Money</span><span class="on">Insurance</span><span class="on">Bank</span><span class="on">Shares</span><span class="on">Market</span><span class="on">Information in prices</span><span class="lock">Delegation · Ch. 10</span></div>
    <div class="cs9" id="cs9" data-anim>
      <svg viewBox="0 0 660 220" role="img" aria-label="Cumulative gains and losses per person in three groups"><g id="cs9-ax"></g><g id="cs9-l"></g></svg>
      <div class="legend"><span><i style="background:var(--blue)"></i>People who dig for news</span><span><i style="background:var(--warm)"></i>Uninformed people who trade frequently</span><span><i style="background:var(--accent)"></i>Passive holders</span></div>
      <div class="cs9-ctl">
        <div class="sl"><label for="cs9-f">People who dig for news <b id="cs9-fv"></b></label><input id="cs9-f" type="range" min="0" max="80" step="5" value="15"></div>
        <div class="sl"><label for="cs9-c">Cost of digging per person per year <b id="cs9-cv"></b></label><input id="cs9-c" type="range" min="0" max="3" step="0.1" value="0.8"></div>
        <div class="sl"><label for="cs9-a">Uninformed who trade frequently <b id="cs9-av"></b></label><input id="cs9-a" type="range" min="0" max="100" step="10" value="50"></div>
      </div>
      <button type="button" class="replay" id="cs9-re">Another run of years</button>
      <div class="cs9-out" id="cs9-out"></div>
      <p class="cs9-msg" id="cs9-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative model: forty households. The vertical axis shows each person's cumulative gain or loss, in portions, relative to getting only the fleet's average return. The more people dig for news, the more the price reflects it before it is public (a share of f ÷ (f + 0.15)); those who dig earn the part not yet reflected from the uninformed who trade frequently, and both groups also pay a cost of 0.05 portions per trade. Passive holders do not trade, and their gain or loss stays at zero.</figcaption>
</figure>
<style>
.cs9 svg{width:100%;height:auto;display:block}
.cs9-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0}
.cs9-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cs9-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.cs9-out span{display:block;font-size:11.5px;color:var(--faint)} .cs9-out b{font-size:18px;font-variant-numeric:tabular-nums}
.cs9-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.cs9-ctl{grid-template-columns:1fr;gap:4px}.cs9-out{grid-template-columns:1fr}.cs9 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cs9'+id),N=40,Y=20,TC=.05;let seed=909;
  const X0=44,X1=650,YT=10,YB=186,x=t=>X0+t/Y*(X1-X0);
  function sim(f,c,a){let s=seed;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};const g=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());};
    const nI=Math.round(f*N),nU=N-nI,nA=Math.round(a*nU),sh=nI?f/(f+.15):0;const cum={I:[0],A:[0],P:[0]};let I=0,A=0;
    for(let t=0;t<Y;t++){const e=Math.abs(g())*2,vol=.3*nA,pool=nI&&nA?vol*e*(1-sh):0;
      const gi=nI?pool/nI-c-TC:0,ga=nA?-pool/nA-TC:0;I+=gi;A+=ga;cum.I.push(I);cum.A.push(A);cum.P.push(0);}
    return {cum,sh,nI,nA,nP:nU-nA};}
  function draw(){const f=+$('-f').value/100,c=+$('-c').value,a=+$('-a').value/100,S=sim(f,c,a);
    $('-fv').textContent=Math.round(f*100)+'%';$('-cv').textContent=c.toFixed(1)+' portions';$('-av').textContent=Math.round(a*100)+'%';
    const all=[...S.cum.I,...S.cum.A],mx=Math.max(5,...all.map(Math.abs)),y=v=>(YT+YB)/2-v/mx*(YB-YT)/2;
    $('-ax').innerHTML=[-mx,-mx/2,0,mx/2,mx].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="${v===0?'s-faint':'s-line'}"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v>0?'+':''}${Math.round(v)}</text>`).join('')+[0,5,10,15,20].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Year ${t}</text>`).join('');
    const line=(k,col)=>`<path d="${S.cum[k].map((v,t)=>(t?'L':'M')+x(t).toFixed(1)+','+y(v).toFixed(1)).join('')}" fill="none" stroke="${col}" stroke-width="2.4"/>`;
    $('-l').innerHTML=(S.nI?line('I','var(--blue)'):'')+(S.nA?line('A','var(--warm)'):'')+line('P','var(--accent)');
    const iY=S.nI?S.cum.I[Y]/Y:0,aY=S.nA?S.cum.A[Y]/Y:0;
    $('-out').innerHTML=[['News reflected in price before it is public',Math.round(S.sh*100)+'%'],['Diggers, per person per year',S.nI?(iY>=0?'+':'−')+Math.abs(iY).toFixed(2)+' portions':'—'],['Frequent traders, per person per year',S.nA?'−'+Math.abs(aY).toFixed(2)+' portions':'—']].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('');
    $('-msg').textContent=!S.nI?'No one digs for news, so the price changes only when the news becomes public; frequent traders pay trading costs for nothing.':!S.nA?'No one trades with the diggers, so the news they dig up earns them nothing, and each year they pay the cost for nothing.':Math.abs(iY)<.15?`People who dig for news make up about ${Math.round(f*100)}%, and after costs they roughly break even: this is exactly where the number of diggers stops growing. The price has reflected ${Math.round(S.sh*100)}% of the news before it is public; the uninformed who trade frequently still lose about ${Math.abs(aY).toFixed(2)} portions per person per year, and passive holders are unaffected.`:iY>0?`Each person who digs for news earns about ${iY.toFixed(2)} portions more per year, and the money comes from the uninformed who trade frequently. As more people dig, the price reflects news faster, and this gain is thinned out until it disappears. Passive holders stay out and lose nothing.`:`Too many people dig: the price already reflects ${Math.round(S.sh*100)}% of the news, and what is left is not enough to cover the cost, so each digger loses about ${Math.abs(iY).toFixed(2)} portions per year. Some will quit, until digging just breaks even.`;}
  ['-f','-c','-a'].forEach(k=>$(k).addEventListener('input',draw));$('-re').addEventListener('click',()=>{seed=(seed*48271)%2147483647;draw();});
  $('').addEventListener('anim-in',()=>{const seq=[5,15,30,50,70];seq.forEach((v,i)=>setTimeout(()=>{$('-f').value=v;draw();},300+i*1200));});
  draw();
})();
</script>
