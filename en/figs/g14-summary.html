    <div class="g14summary" id="g14summary" data-anim><div class="g14summary-c" style="--i:0"><em>Threshold</em><b>A fixed cost divided by property</b><p>As cognitive labour gets cheaper, the threshold falls; checking and bearing responsibility set its floor.</p></div><div class="g14summary-c" style="--i:1"><em>Personal</em><b>From one arrangement to one for each household</b><p>Tailoring that once belonged only to the wealthy can reach many more households.</p></div><div class="g14summary-c warn" style="--i:2"><em>Agency costs</em><b>Monitoring falls; bonding does not</b><p>Of the three agency costs, only monitoring falls clearly with the price of cognitive labour.</p></div><div class="g14summary-c warn" style="--i:3"><em>Allegiance</em><b>It works for whoever pays it</b><p>An agent that appears free may leave the principal paying more.</p></div></div>
