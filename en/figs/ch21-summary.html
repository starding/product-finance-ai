<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: reliability through process design</p><p class="figsub">Four design requirements, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="ch21summary">Replay</button></div>
    <div class="ch21summary" id="ch21summary" data-anim><div class="ch21summary-c" style="--i:0"><em>All three sources are needed</em><b>Give the agent context, and use tools to calculate and look up figures</b><p>Numbers come from data sources and calculation, with source and cut-off time noted; they are not supplied by the model from memory.</p></div><div class="ch21summary-c" style="--i:1"><em>Errors accumulate over steps</em><b>Shorten every stretch that runs unchecked</b><p>Break long tasks into segments that can be verified, checked automatically or by the user at the end of each.</p></div><div class="ch21summary-c warn" style="--i:2"><em>The capability boundary is uneven</em><b>State the scope of application, and step down outside it</b><p>Say plainly which tasks the agent is known to handle poorly, and hand them to a person or switch to more conservative handling.</p></div><div class="ch21summary-c warn" style="--i:3"><em>When unsure, it guesses</em><b>Reward saying "I don't know"</b><p>With no data, say there is no data, and mark uncertain points separately; penalize wrong answers in evaluation.</p></div></div>
  </div>
