<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">The diagnostic power of evidence</p><p class="figsub">The probability of each piece of evidence from a reliable and from an unreliable trustee, and the ratio of the two (the likelihood ratio). The centre line is 1: the closer to it, the less useful the evidence. Tap a row for an explanation.</p></div><button class="replay" type="button" data-replay="lr">Replay</button></div>
    <div class="lr" id="lr" data-anim></div>
    <p class="lr-msg" id="lr-msg" aria-live="polite">Tap a piece of evidence.</p>
  </div>
  <figcaption>Illustrative probabilities, showing relative size only. Evidence that money chases past performance and advertising is from Sirri and Tufano (1998) and Jain and Wu (2000); Jain and Wu (2000) found that advertised funds did not perform better than their peers afterwards, so the likelihood ratios of past returns and advertising are close to 1.</figcaption>
</figure>
<style>
.lr{display:grid;gap:5px}
.lr-r{font:inherit;width:100%;display:grid;grid-template-columns:minmax(0,1.3fr) 96px minmax(0,1.6fr) 54px;gap:10px;align-items:center;text-align:left;background:var(--quote);border:1.5px solid transparent;border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink);cursor:pointer}
.lr-r.sel{border-color:var(--ink)}
.lr-r>span:nth-child(2){color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.lr-t{position:relative;height:14px;background:var(--surface);border-radius:7px}
.lr-t::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1.5px solid var(--faint)}
.lr-t i{position:absolute;top:0;height:100%;border-radius:7px;width:0;transition:width .6s ease,left .6s ease}
.lr-r b{text-align:right;font-variant-numeric:tabular-nums}
.lr-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.lr-r{grid-template-columns:minmax(0,1fr) 54px}.lr-r>span:nth-child(2){display:none}.lr-t{grid-column:1/-1;grid-row:2}}
</style>
<script>
(function(){
  const E=[['Top-quartile return last year',.27,.25,'Good and bad trustees alike can deliver a fine year: it carries almost no information, yet it is the evidence used most often.'],
    ['Advertised heavily',.5,.5,'Whether a trustee advertises has nothing to do with whether it is reliable; the likelihood ratio is 1.'],
    ['Fees matched the promise all year',.99,.6,'A reliable trustee almost always keeps to the agreement; an unreliable one often has hidden charges.'],
    ['No agreed constraint broken all year',.98,.5,'Whether constraints are respected differs sharply between good and bad trustees, so this evidence has high diagnostic power.'],
    ['Every period accounted for',.97,.4,'Reporting the status of a continuing task in every period is hard for an unreliable trustee to keep up for long.'],
    ['Ability failure admitted and fixed',.9,.3,'The failure itself is evidence about ability; candidly admitting an ability failure and explaining the improvement is evidence of willingness to improve, which reliable trustees show more often.'],
    ['One serious breach',.01,.15,'Very rare among reliable trustees: a single occurrence is enough to change the belief sharply.']];
  const box=document.getElementById('lr'),L=Math.log(20);
  box.innerHTML=E.map(([n,a,b],i)=>`<button type="button" class="lr-r" data-i="${i}"><span>${n}</span><span>${Math.round(a*100)}% vs ${Math.round(b*100)}%</span><div class="lr-t"><i></i></div><b>${(a/b)>=1?(a/b).toFixed(1):'1/'+(b/a).toFixed(0)}</b></button>`).join('');
  const rs=[...box.children];
  function fill(){rs.forEach((r,i)=>{const v=Math.log(E[i][1]/E[i][2])/L*50,el=r.querySelector('i');el.style.background=v>=0?'var(--accent)':'var(--warm)';el.style.left=(v>=0?50:50+v)+'%';el.style.width=Math.max(1,Math.abs(v))+'%';});}
  rs.forEach((r,i)=>r.addEventListener('click',()=>{rs.forEach(x=>x.classList.toggle('sel',x===r));document.getElementById('lr-msg').textContent=E[i][0]+': '+E[i][3];}));
  box.addEventListener('anim-in',()=>{rs.forEach(r=>{const el=r.querySelector('i');el.style.width='0';el.style.left='50%';});setTimeout(fill,60);});
  fill();
})();
</script>
