<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">What this step leaves open</p><p class="figsub">Four new problems brought by lending, each becoming the constraint of a later chapter. Choose a problem to see the assumption hidden in it.</p></div><button class="replay" type="button" data-replay="nx2">Replay</button></div>
    <div class="nx" id="nx2" data-anim>
      <div class="nx-src"><b>Two people</b><span>Lending and interest</span></div>
      <div class="nx-list" id="nx2-l"></div>
    </div>
    <p class="nx-msg" id="nx2-msg" aria-live="polite"></p>
  </div>
</figure>
<style>
.nx{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.nx-src{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 10px;text-align:center}
.nx-src b{display:block;font-size:16px} .nx-src span{font-size:12px;opacity:.75}
.nx-list{display:grid;gap:6px}
.nx-i{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--quote);border:1px solid transparent;border-radius:9px;padding:9px 12px;color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.3s)}
.nx.in .nx-i{opacity:1;transform:none}
.nx-i span{font-size:13.5px} .nx-i em{font-style:normal;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nx-i.sel{border-color:var(--accent)}
.nx-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.nx{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const Q=[['Grain that is lent out may not come back','Chapter 3: Commitment','Hidden assumption: the borrower always repays principal and interest as agreed. What is lent is today\'s grain; what comes back is only a promise about the future.'],
    ['Finding the right counterpart is not easy','Chapter 4: Money','Hidden assumption: each of the two can see plainly what the other needs. With many people, some way is needed to match needs with each other.'],
    ['The problem of old age is still unsolved','Chapter 4: Money','Hidden assumption: the other party still has income decades later. The youngest generation can find no younger people to lend to.'],
    ['Who sets the interest rate','Chapter 8: Market','Hidden assumption: the interest rate is settled by two people negotiating. With many people, it must be set by the lending and borrowing of many together.']];
  const l=document.getElementById('nx2-l'),msg=document.getElementById('nx2-msg');
  l.innerHTML=Q.map((q,i)=>`<button type="button" class="nx-i" style="--i:${i}" data-i="${i}"><span>${q[0]}</span><em>→ ${q[1]}</em></button>`).join('');
  const bs=[...l.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));msg.textContent=Q[i][2];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('nx2').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1600+k*1800));});
  set(0);
})();
</script>
