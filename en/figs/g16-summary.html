<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: if everyone has an analyst</p><p class="figsub">Four conclusions, each corresponding to one mechanism in the chapter.</p></div><button class="replay" type="button" data-replay="g16summary">Replay</button></div>
    <div class="g16summary" id="g16summary" data-anim><div class="g16summary-c" style="--i:0"><em>Rerun: Grossman–Stiglitz</em><b>Reading reports is no longer an advantage</b><p>Analysis is almost free, the number of informed people rises sharply, and prices reflect the great majority of public information.</p></div><div class="g16summary-c" style="--i:1"><em>Private and social value</em><b>Being first moves money; it creates nothing</b><p>Knowing a moment earlier can earn money from others, but racing to be first only consumes resources.</p></div><div class="g16summary-c warn" style="--i:2"><em>Attention</em><b>What is scarce is time to look at information</b><p>The more information there is, the greater the power to rank; those being read also learn to write for scribes.</p></div><div class="g16summary-c warn" style="--i:3"><em>New asymmetry</em><b>The advantage moves to exclusive data</b><p>The arithmetic of active management does not change; who wins and who loses within the group depends on who has non-public data and who is faster.</p></div></div>
