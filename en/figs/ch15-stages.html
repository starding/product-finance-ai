<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">A complete delivery: eight stages</p><p class="figsub">Using "managing a portfolio against goals" as the example. Tap any stage to remove it and see where the delivery breaks down.</p></div><button class="replay" type="button" data-replay="st">Replay</button></div>
    <div class="st" id="st" data-anim></div>
    <p class="st-msg" id="st-msg" aria-live="polite"></p>
  </div>
  <figcaption>The first five stages determine whether the job gets done and done right; the last three determine whether the principal is informed and stays in control. On agency costs, see Jensen and Meckling (1976); on observability and incentives, see Holmström (1979).</figcaption>
</figure>
<style>
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st-s{font:inherit;text-align:left;position:relative;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink);cursor:pointer;opacity:.35;transition:opacity .35s,background .35s,border-color .35s}
.st-s.on{opacity:1;background:var(--accent-soft);border-color:var(--accent)}
.st-s.off{opacity:1;background:var(--warm-soft);border-color:var(--warm);border-style:dashed}
.st-s.off b{text-decoration:line-through;text-decoration-color:var(--warm)}
.st-s em{font-style:normal;font-size:11px;color:var(--faint)}
.st-s b{display:block;font-size:14px;margin:1px 0 3px}
.st-s span{font-size:12px;color:var(--muted);line-height:1.5;display:block}
.st-s.g2{box-shadow:inset 0 3px 0 var(--gold)}
.st-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.st{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
(function(){
  const S=[['Accept the job','State the goal, horizon, constraints and standard of completion','Without a stated standard of completion, there is no way afterwards to judge whether the job was done; it can only be judged by gains and losses.'],
    ['Have the means','Data, tools, accounts and the necessary authority','Without data or permissions, however good the plan, it cannot be carried out.'],
    ['Organize the process','Break the goal into steps and put them in order','Without organized steps, duplicated, missed and conflicting actions follow.'],
    ['Get it right','Check constraints, suitability and calculations','Without checks, an adjustment that breaches the risk constraints may be executed directly.'],
    ['Leave evidence','Record the grounds, versions and every action','Without records, the cause of a problem cannot be traced, and there is no way to prove the work was done as agreed.'],
    ['Be continuous and proactive','Check on a schedule and act unprompted when needed','Work happens only when the user remembers to ask, and no one notices the portfolio drifting from its goal.'],
    ['Visible status and asking first','Show the principal the progress; ask before exceeding authority','The principal does not know what was done, and actions beyond authority come to light only afterwards.'],
    ['Control and exit','Can pause, take over, undo, and take the results away','The user cannot call a halt or take the records away, and can only keep trusting or give up entirely.']];
  const box=document.getElementById('st'),msg=document.getElementById('st-msg');
  box.innerHTML=S.map(([n,d],i)=>`<button type="button" class="st-s${i>=5?' g2':''}" data-i="${i}"><em>Stage ${i+1}</em><b>${n}</b><span>${d}</span></button>`).join('');
  const bs=[...box.children];let off=-1;
  function show(){bs.forEach((b,i)=>{b.classList.toggle('on',i!==off);b.classList.toggle('off',i===off);});
    msg.textContent=off<0?'All eight stages are in place: the job is clearly stated, done and done right, and the principal is informed and in control.':`Without "${S[off][0]}": ${S[off][2]}`;}
  bs.forEach((b,i)=>b.addEventListener('click',()=>{off=off===i?-1:i;show();}));
  box.addEventListener('anim-in',()=>{off=-1;bs.forEach(b=>b.classList.remove('on','off'));msg.textContent='';
    bs.forEach((b,i)=>setTimeout(()=>b.classList.add('on'),200+i*260));setTimeout(show,200+S.length*260);});
  show();
})();
</script>
