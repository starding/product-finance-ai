<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: what did not change</p><p class="figsub">Four conclusions, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g19summary">Replay</button></div>
    <div class="g19summary" id="g19summary" data-anim><div class="g19summary-c" style="--i:0"><em>Time</em><b>Fees can be saved, years cannot</b><p>When income and needs arrive does not change, and neither does the number of years accumulation takes.</p></div><div class="g19summary-c" style="--i:1"><em>Risk</em><b>What cannot be diversified must still be borne</b><p>Individual risk is diversified away almost for free; the risk the whole village shares is not reduced at all.</p></div><div class="g19summary-c warn" style="--i:2"><em>Compensation</em><b>No high return without bearing risk</b><p>Only risk that cannot be diversified earns compensation; an agent cannot put people above the line.</p></div><div class="g19summary-c warn" style="--i:3"><em>Irreversibility</em><b>The faster the execution, the more room to leave</b><p>Some losses cannot be undone; keeping options open has value and must be deliberately preserved in the design.</p></div></div>
