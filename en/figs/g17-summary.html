    <div class="figbar"><div><p class="figtitle">Chapter summary: agents become the main market participants</p><p class="figsub">Four conclusions, each corresponding to one mechanism in the chapter.</p></div><button class="replay" type="button" data-replay="g17summary">Replay</button></div>
    <div class="g17summary" id="g17summary" data-anim><div class="g17summary-c" style="--i:0"><em>Rerun: the spread</em><b>Cheaper in normal times</b><p>Quoting and holding inventory cost scribes almost nothing, so spreads in calm times narrow sharply.</p></div><div class="g17summary-c" style="--i:1"><em>Information cascades</em><b>Scribes that resemble each other act at once</b><p>The same methods and data mean judgments are no longer independent, and uniform action may rest on very little information.</p></div><div class="g17summary-c warn" style="--i:2"><em>Liquidity spirals</em><b>Falls that cause falls</b><p>Rules for cutting positions and for margin trigger at the same time, and quoting scribes withdraw just when they are most needed.</p></div><div class="g17summary-c warn" style="--i:3"><em>Market design</em><b>Give the market time to breathe</b><p>Halts and circuit breakers break the spiral, and diversity among participants reduces action in the same direction.</p></div></div>
