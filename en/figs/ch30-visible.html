<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Evidence changes belief only when it is seen</p><p class="figsub">Over three months the agent produced 90 process records. Switch how they are presented and see how many the user actually sees and notices, and how the belief changes.</p></div><button class="replay" type="button" data-replay="vs">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Presentation">
      <button type="button" data-vs="0" aria-pressed="true">Back end only</button><button type="button" data-vs="1" aria-pressed="false">Push everything</button><button type="button" data-vs="2" aria-pressed="false">Brief account each period</button><button type="button" data-vs="3" aria-pressed="false">Periodic account + key moments</button>
    </div>
    <div class="vs" id="vs" data-anim>
      <div class="vs-g" id="vs-g"></div>
      <div class="vs-out"><div><span>Records the user noticed</span><b id="vs-n"></b></div><div><span>Belief after three months</span><b id="vs-b"></b></div></div>
      <p class="vs-msg" id="vs-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: prior 30%; each process record noticed has a likelihood ratio of 1.08, and each record from a key moment 1.3. When everything is pushed, there are so many messages that the user notices only about a tenth of them.</figcaption>
</figure>
<style>
.vs-g{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.vs-g i{aspect-ratio:1;border-radius:2px;background:var(--quote);transition:background .3s;transition-delay:calc(var(--i)*4ms)}
.vs-g i.s{background:var(--accent)} .vs-g i.k{background:var(--blue)}
.vs-out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.vs-out div{background:var(--quote);border-radius:8px;padding:8px 12px}
.vs-out span{display:block;font-size:12px;color:var(--faint)} .vs-out b{font-size:19px;font-variant-numeric:tabular-nums}
.vs-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.vs-g{grid-template-columns:repeat(15,1fr)}}
</style>
<script>
(function(){
  const g=document.getElementById('vs-g');g.innerHTML=Array.from({length:90},(_,i)=>`<i style="--i:${i}"></i>`).join('');const cs=[...g.children];
  const KEY=[14,37,62,81];
  const M=[[2,0,'The records all exist, but only in the back end: the user sees two of them when happening to open the page, and the belief barely changes.'],[9,0,'Every record is pushed to the user: there are too many messages, the great majority are swiped away and ignored, and fewer than one in ten is actually noticed.'],[30,0,'A brief account each period: the user notices about a third of the records, and the belief rises steadily.'],[30,4,'On top of the periodic account, the relevant records are shown proactively at key moments such as expiries and sharp swings: the most diagnostic pieces of evidence are all seen.']];
  const lo=p=>Math.log(p/(1-p)),ex=l=>1/(1+Math.exp(-l));
  function set(k){document.querySelectorAll('[data-vs]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.vs===k)));const [n,kk,m]=M[k];
    const step=90/n;const seen=new Set();for(let j=0;j<n;j++)seen.add(Math.floor(j*step));
    cs.forEach((c,i)=>c.className=(kk&&KEY.includes(i))?'k':seen.has(i)?'s':'');
    const b=ex(lo(.3)+n*Math.log(1.08)+kk*Math.log(1.3));
    document.getElementById('vs-n').textContent=String(n+kk);document.getElementById('vs-b').textContent=(b*100).toFixed(0)+'%';document.getElementById('vs-msg').textContent=m;}
  document.querySelectorAll('[data-vs]').forEach(b=>b.addEventListener('click',()=>set(+b.dataset.vs)));
  document.getElementById('vs').addEventListener('anim-in',()=>{[0,1,2,3].forEach(i=>setTimeout(()=>set(i),i*1800));});
  set(0);
})();
</script>
