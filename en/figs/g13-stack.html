<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Which parts of a delegation's cost fall</p><p class="figsub">The cost of a delegation broken into five parts. Drag the price of cognitive labour: research, drafting and execution fall almost in step with it, checking falls only in part, and responsibility does not fall at all.</p></div><button class="replay" type="button" data-replay="st13">Replay</button></div>
    <div class="st13" id="st13" data-anim>
      <div class="st13-bars" id="st13-b"></div>
      <div class="sl"><label for="st13-a">Price of cognitive labour <b id="st13-av"></b></label><input id="st13-a" type="range" min="0" max="100" step="5" value="100"></div>
      <p class="st13-msg" id="st13-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: the original cost is 100, with the five parts accounting for 30, 20, 15, 20 and 15; research, drafting and execution are entirely cognitive labour, checking is half cognitive labour, and bearing responsibility is none.</figcaption>
</figure>
<style>
.st13-bars{display:grid;gap:10px;margin-bottom:6px}
.st13-r{display:grid;grid-template-columns:4.5em 1fr 3.5em;gap:10px;align-items:center;font-size:12.5px}
.st13-r>div{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--quote)}
.st13-r i{display:block;height:100%;transition:width .6s;font-style:normal;color:var(--bg);font-size:11px;line-height:26px;text-align:center;white-space:nowrap;overflow:hidden}
.st13-r b{text-align:right;font-variant-numeric:tabular-nums}
.st13-lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:4px 0 8px}
.st13-lg span{display:flex;gap:5px;align-items:center}.st13-lg i{width:11px;height:11px;border-radius:3px}
.st13-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
</style>
<script>
(function(){
  const $=id=>document.getElementById('st13'+id);
  const B=[['Research',30,1,'#2f6f5e'],['Drafting/judgement',20,1,'#4f8f7c'],['Execution',15,1,'#7fb3a2'],['Checking',20,.5,'#c98a4b'],['Responsibility',15,0,'#a4552d']];
  function draw(){const a=+$('-a').value/100;$('-av').textContent=Math.round(a*100)+'%';
    const now=B.map(([n,v,c])=>v*(c*a+(1-c))),tot=now.reduce((x,y)=>x+y,0);
    const row=(lab,vals,t)=>`<div class="st13-r"><span>${lab}</span><div>${vals.map((v,i)=>`<i style="width:${v}%;background:${B[i][3]}" title="${B[i][0]}">${v>=8?B[i][0]:''}</i>`).join('')}</div><b>${t.toFixed(0)}</b></div>`;
    $('-b').innerHTML=row('Before',B.map(b=>b[1]),100)+row('Now',now,tot)+`<div class="st13-lg">${B.map(b=>`<span><i style="background:${b[3]}"></i>${b[0]}</span>`).join('')}</div>`;
    const share=(now[3]+now[4])/tot;
    $('-msg').textContent=a===1?'With the price of cognitive labour unchanged, research, drafting and execution make up over 60% of the cost.':`With the price of cognitive labour down to ${Math.round(a*100)}%, the total cost falls from 100 to ${tot.toFixed(0)}; the share of checking and bearing responsibility in the total rises from 35% to ${Math.round(share*100)}%. However cheap the scribes become, they cannot push the cost below this floor of ${Math.round(B[3][1]*.5+B[4][1])}.`;}
  $('-a').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{let v=100;$('-a').value=100;draw();const id=setInterval(()=>{v-=5;$('-a').value=v;draw();if(v<=0)clearInterval(id);},120);});
  draw();
})();
</script>
