<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: designing on every term of belief updating</p><p class="figsub">Four design requirements, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="ch30summary">Replay</button></div>
    <div class="ch30summary" id="ch30summary" data-anim><div class="ch30summary-c" style="--i:0"><em>Prior and threshold</em><b>Borrow institutions and begin with low-stakes tasks</b><p>Explain custody, regulation and audit; offer low-threshold tasks such as looking up data and reminders first, so that evidence builds up through use.</p></div><div class="ch30summary-c" style="--i:1"><em>Evidence must be seen</em><b>A brief account each period, proactive display at key moments</b><p>Do not hide records in the back end, and do not drown the user in messages.</p></div><div class="ch30summary-c warn" style="--i:2"><em>Evidence must be hard to fake</em><b>Let users open the raw data and third-party records</b><p>Custodian statements, execution records and audit reports are far more diagnostic than the product's own word.</p></div><div class="ch30summary-c warn" style="--i:3"><em>Mistakes and exit</em><b>Disclose mistakes first; make leaving and withdrawing easy</b><p>Set up a procedure to detect, stop, notify, explain and remedy; allow authority to be withdrawn, records exported and assets moved at any time.</p></div></div>
  </div>
</figure>
