    <div class="ch13summary" id="ch13summary" data-anim><div class="ch13summary-c" style="--i:0"><em>Financial products are credence goods</em><b>Make the process open to checking</b><p>Provide the reasoning, records and verifiable data, rather than relying on short-term results alone to prove the product's quality.</p></div><div class="ch13summary-c" style="--i:1"><em>Credibility comes from institutions</em><b>Explain custody and protection clearly</b><p>State who holds the assets in custody, whether they are segregated from the firm's own assets, and what protections apply and up to what limits.</p></div><div class="ch13summary-c warn" style="--i:2"><em>Delegated monitors also need monitoring</em><b>Disclose conflicts of interest and fees</b><p>Explain where the intermediary makes its money and whether that conflicts with the user's interests.</p></div><div class="ch13summary-c" style="--i:3"><em>A trade is not a settlement</em><b>Distinguish trade, settlement and available funds</b><p>Show when money and securities actually arrive and when they can be withdrawn.</p></div></div>
