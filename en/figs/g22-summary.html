    <div class="g22summary" id="g22summary" data-anim><div class="g22summary-c" style="--i:0"><em>Unravelling</em><b>Verifiable records make silence bad news</b><p>Records kept by a third party and unalterable make agents that keep their agreements willing to be seen.</p></div><div class="g22summary-c" style="--i:1"><em>Costly verification</em><b>Detailed checks on poor results or triggers, spot checks otherwise</b><p>The agent does most of the checking for the user, who looks only at conclusions and exceptions.</p></div><div class="g22summary-c warn" style="--i:2"><em>Rerun: attention</em><b>One sentence, key points, full record</b><p>Each layer is traceable to the one below, so a summary cannot hide bad news.</p></div><div class="g22summary-c warn" style="--i:3"><em>At the time, and on what basis</em><b>Record what was known then and which clause applied</b><p>This guards against hindsight; a step with no stated basis is exactly the one to question.</p></div></div>
