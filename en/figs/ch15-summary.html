<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: designing products from the job</p><p class="figsub">Four design requirements, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="ch15summary">Replay</button></div>
    <div class="ch15summary" id="ch15summary" data-anim><div class="ch15summary-c" style="--i:0"><em>Users want a job done</em><b>Organize around jobs, not products</b><p>First ask when the money is needed, how much, and what loss can be borne; then recommend products. The same product can be the wrong choice for a different job.</p></div><div class="ch15summary-c" style="--i:1"><em>Jobs have levels</em><b>Make low-level actions serve high-level goals</b><p>On screens for viewing and ordering, show how this action relates to the user's goal and plan.</p></div><div class="ch15summary-c warn" style="--i:2"><em>Results are affected by luck</em><b>Define completion by the process</b><p>State the goal, constraints and checks in advance, and judge afterwards by whether they were followed, not by returns alone.</p></div><div class="ch15summary-c warn" style="--i:3"><em>Delivery must be complete; ongoing jobs must give an account</em><b>Keep the principal informed and in control</b><p>Have all eight stages in place; in ongoing jobs, report the state of every cycle, distinguishing normal, blocked and awaiting confirmation.</p></div></div>
  </div>
