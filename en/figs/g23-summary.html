<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: agents make mistakes</p><p class="figsub">Four conclusions, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g23summary">Replay</button></div>
    <div class="g23summary" id="g23summary" data-anim><div class="g23summary-c" style="--i:0"><em>Three kinds of mistake</em><b>Consequences allocated by kind</b><p>The operator pays for execution errors and overstepping; the user bears misjudgements under the agreement; the records decide which kind each one is.</p></div><div class="g23summary-c" style="--i:1"><em>Swiss cheese model</em><b>Layered, independent defences</b><p>No line of defence is foolproof, and lines that share a hole fail together.</p></div><div class="g23summary-c warn" style="--i:2"><em>Normal accidents</em><b>Deliberately slow down where things move fast</b><p>Limits, automatic stops on anomalies and delays catch errors before they spread.</p></div><div class="g23summary-c warn" style="--i:3"><em>Rerun: irreversibility and vicarious liability</em><b>Few, weighty confirmations; compensation written in advance</b><p>Confirm only operations that cannot be undone, and set out their consequences; the operator insures, and compensation does not depend on the user proving anything.</p></div></div>
  </div>
