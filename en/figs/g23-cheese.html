<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Five lines of defence</p><p class="figsub">To cause a loss, an error must pass through five lines of defence. Drag the share of errors each line misses, then tick "several lines share one set of data", and see how many of 10,000 errors pass through every line.</p></div><button class="replay" type="button" data-replay="ch23">Replay</button></div>
    <div class="ch23" id="ch23" data-anim>
      <div class="ch23-l" id="ch23-l"></div>
      <div class="sl"><label for="ch23-p">Share each line misses <b id="ch23-pv"></b></label><input id="ch23-p" type="range" min="5" max="60" step="5" value="20"></div>
      <div class="cs-sw"><label><input type="checkbox" id="ch23-c"> The last three lines share one set of the scribe's own data: if one misses, the other two miss too</label></div>
      <p class="ch23-msg" id="ch23-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: the five lines of defence, in order, are the boundaries of the agreement, automatic checks before execution, the limit on each step, confirmation of key operations, and reconciliation afterwards (Reason's Swiss cheese model).</figcaption>
</figure>
<style>
.ch23-l{display:grid;gap:6px;margin:6px 0 10px}
.ch23-r{display:grid;grid-template-columns:9.5em 1fr 5.5em;gap:10px;align-items:center;font-size:12.5px}
.ch23-r div{height:20px;background:var(--quote);border-radius:5px;overflow:hidden}
.ch23-r i{display:block;height:100%;background:var(--warm);transition:width .5s}
.ch23-r b{text-align:right;font-variant-numeric:tabular-nums}
.ch23-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.ch23-r{grid-template-columns:1fr 5.5em}.ch23-r span{grid-column:1/-1}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('ch23'+id),L=['the boundaries','pre-execution checks','the per-step limit','confirmation','reconciliation'];
  function draw(){const p=+$('-p').value/100,c=$('-c').checked;$('-pv').textContent=Math.round(p*100)+'%';let n=10000;const R=[];
    L.forEach((l,i)=>{if(c&&(i===3||i===4)){}else n*=p;R.push([l,n]);});
    $('-l').innerHTML=`<div class="ch23-r"><span>Errors that occur</span><div><i style="width:100%"></i></div><b>10000</b></div>`+R.map(([l,v])=>`<div class="ch23-r"><span>Pass ${l}</span><div><i style="width:${Math.max(.3,v/100)}%"></i></div><b>${v<10?v.toFixed(1):Math.round(v)}</b></div>`).join('');
    const end=R[4][1];$('-msg').textContent=c?`The last three lines share one set of data, so in effect there are only three: ${end<10?end.toFixed(1):Math.round(end)} of 10,000 errors pass through every line, ${Math.round(1/(p*p))} times as many as when the lines are independent.`:`Each line misses ${Math.round(p*100)}% and all five are independent: only ${end<10?end.toFixed(1):Math.round(end)} of 10,000 errors pass through every line. None of them is foolproof, yet together they rarely fail.`;}
  ['-p','-c'].forEach(k=>$(k).addEventListener('input',draw));
  $('').addEventListener('anim-in',()=>{$('-c').checked=false;draw();setTimeout(()=>{$('-c').checked=true;draw();},2200);});
  draw();
})();
</script>
