<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: assigning power by consequence</p><p class="figsub">Four design requirements, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="ch26summary">Replay</button></div>
    <div class="ch26summary" id="ch26summary" data-anim><div class="ch26summary-c" style="--i:0"><em>Authority is a ladder</em><b>Let users see and choose the level for each kind of operation</b><p>Information, drafting, per-trade confirmation, plan approval, time-limited veto and autonomy within scope are set operation by operation, not by a single master switch.</p></div><div class="ch26summary-c" style="--i:1"><em>Reversibility sets the ceiling</em><b>Keep irreversible, uncapped operations at per-trade confirmation</b><p>Selling holdings, transferring funds, accepting offers and exercising options are confirmed by the person; small reversible matters can be handed to the agent.</p></div><div class="ch26summary-c warn" style="--i:2"><em>Irreversible exposure needs timely watching</em><b>Remind before the deadline and explain the options</b><p>For option expiry, margin calls, rights issue deadlines and the like, remind several times in advance; the step that changes holdings is taken by the person.</p></div><div class="ch26summary-c warn" style="--i:3"><em>Limits must be enforced at the execution layer</em><b>Check independently; raise and lower authority with the record</b><p>Check instrument, amount, total and authority for every trade and keep a record; lower the level after overreach, version updates and changes in circumstances, and allow withdrawal with one tap.</p></div></div>
  </div>
</figure>
