<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: keeping assurance proportionate to risk</p><p class="figsub">Four design requirements, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="ch29summary">Replay</button></div>
    <div class="ch29summary" id="ch29summary" data-anim><div class="ch29summary-c" style="--i:0"><em>Consequence × difficulty of verification</em><b>Give each function an assurance level</b><p>Spot checks, evaluation sets, stratified evaluation and review, formal constraints and checks on everything, allocated by level.</p></div><div class="ch29summary-c" style="--i:1"><em>Non-deterministic systems</em><b>Validate statistically on a large enough evaluation set</b><p>Set the number of questions by the error rate to be shown; even with 0 errors, you need at least 3 ÷ target error rate questions.</p></div><div class="ch29summary-c warn" style="--i:2"><em>Overall figures hide critical cases</em><b>Stratify evaluation by case, and red-team</b><p>Expiry days, sharp swings, suspensions and missing data must each meet the bar on their own.</p></div><div class="ch29summary-c warn" style="--i:3"><em>Launch is not the end</em><b>Monitor continuously, release in stages, keep assurance proportionate to risk</b><p>Set alerts and rollback on key metrics; let new versions go to a small group first; do not slow low-risk functions with the highest standard.</p></div></div>
