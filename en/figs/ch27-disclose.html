<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Why outcomes can be worse after disclosure</p><p class="figsub">There is a conflict of interest between the adviser and the person advised. Switch whether the conflict is disclosed, and see the bias in the advice, the discount the recipient applies, and the recipient's final error (illustrative).</p></div><button class="replay" type="button" data-replay="ds2">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Disclosure"><button type="button" data-ds2="0" aria-pressed="true">No disclosure</button><button type="button" data-ds2="1" aria-pressed="false">Conflict disclosed</button></div>
    <div class="ds2" id="ds2" data-anim>
      <div class="ds2-r"><span>How far the advice departs from the truth</span><div class="ds2-t"><i id="ds2-a" style="background:var(--warm)"></i></div><b id="ds2-av"></b></div>
      <div class="ds2-r"><span>Discount the recipient applies</span><div class="ds2-t"><i id="ds2-b" style="background:var(--accent)"></i></div><b id="ds2-bv"></b></div>
      <div class="ds2-r tot"><span>Recipient's final error</span><div class="ds2-t"><i id="ds2-c" style="background:var(--ink)"></i></div><b id="ds2-cv"></b></div>
      <p class="ds2-msg" id="ds2-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative numbers; the directions follow the experiments of Cain, Loewenstein and Moore (2005): after disclosure, advisers gave more biased advice, and recipients' discounts were not enough to offset it.</figcaption>
</figure>
<style>
.ds2-r{display:grid;grid-template-columns:150px 1fr 50px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.ds2-r span{color:var(--muted)} .ds2-r.tot span{color:var(--ink);font-weight:700}
.ds2-t{height:16px;background:var(--quote);border-radius:8px;overflow:hidden}
.ds2-t i{display:block;height:100%;border-radius:8px;transition:width .6s ease}
.ds2-r b{text-align:right;font-variant-numeric:tabular-nums}
.ds2-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.ds2-r{grid-template-columns:110px 1fr 40px}}
</style>
<script>
(function(){
  const S=[[30,0,'Without disclosure, the advice departs from the truth by 30 units; the recipient does not notice, and the error is 30.'],[48,12,'After disclosure, the adviser feels the duty to inform has been met and the advice becomes more biased; the recipient knows of the conflict but discounts only a small part, so the final error is actually larger.']];
  function set(k){document.querySelectorAll('[data-ds2]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.ds2===k)));const [a,b,m]=S[k],c=a-b;
    [['a',a],['b',b],['c',c]].forEach(([id,v])=>{document.getElementById('ds2-'+id).style.width=v/50*100+'%';document.getElementById('ds2-'+id+'v').textContent=v;});document.getElementById('ds2-msg').textContent=m;}
  document.querySelectorAll('[data-ds2]').forEach(b=>b.addEventListener('click',()=>set(+b.dataset.ds2)));
  document.getElementById('ds2').addEventListener('anim-in',()=>{set(0);setTimeout(()=>set(1),2400);});
  set(0);
})();
</script>
