<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Who pays</p><p class="figsub">Four kinds of loss, four places they fall. Select a row to see the basis and conditions for compensation.</p></div><button class="replay" type="button" data-replay="py23">Replay</button></div>
    <div class="py23" id="py23" data-anim><div class="py23-t" id="py23-t"></div><p class="py23-msg" id="py23-msg" aria-live="polite"></p></div>
  </div>
  <figcaption>Illustrative: the compensation rules are a product design derived in this book, not a restatement of any current regulation; the row "Broker fails, assets missing" follows the scope of protection of the Securities Investor Protection Corporation.</figcaption>
</figure>
<style>
.py23-t{display:grid;gap:5px}
.py23-t button{font:inherit;cursor:pointer;display:grid;grid-template-columns:1.2fr 1fr;gap:10px;text-align:left;border:1px solid transparent;border-radius:9px;padding:9px 12px;background:var(--quote);color:var(--ink);font-size:13.5px;opacity:0;transform:translateX(-6px);transition:opacity .35s,transform .35s,border-color .3s;transition-delay:calc(var(--i)*.15s)}
.py23.in .py23-t button{opacity:1;transform:none}
.py23-t button.sel{border-color:var(--ink)}
.py23-t b{font-weight:600} .py23-t span{color:var(--c)}
.py23-msg{font-size:14px;margin:10px 0 0;min-height:4.6em;background:var(--quote);border-radius:9px;padding:10px 12px}
</style>
<script>
(function(){
  const R=[['Execution error','The operator pays in full','var(--warm)','As long as the records show that the amount or destination differs from the instruction, the loss is paid in full, without requiring him to prove how it arose; the operator insures against this.'],['Overstepping','The operator pays, and the agreement\'s penalties apply','var(--warm)','If the records show that the step crossed a boundary or cannot cite a clause of the agreement, it is treated as overstepping. In addition to compensation, the penalties written into the agreement (for example, refunding that year\'s fees) take effect.'],['Misjudgement','He bears it, as the agreement provides','var(--accent)','The scribe kept the agreement completely and decided on the information available at the time, but the outcome was poor. This is a risk the agreement itself accepts; when the agreement was made, he was told how large such losses could be.'],['Broker fails, assets missing','The investor protection fund covers it up to a limit','var(--blue)','Assets are held by an independent custodian. If the custodian or the broker fails and assets are missing, the investor protection fund covers them up to a limit; losses from market declines are not covered.']];
  const t=document.getElementById('py23-t'),m=document.getElementById('py23-msg');
  t.innerHTML=R.map((r,i)=>`<button type="button" style="--i:${i};--c:${r[2]}"><b>${r[0]}</b><span>${r[1]}</span></button>`).join('');const bs=[...t.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));m.textContent=R[i][3];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('py23').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1000+k*1800));});
  set(0);
})();
</script>
