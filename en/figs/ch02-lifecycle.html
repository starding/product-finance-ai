<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Income and consumption over a lifetime</p><p class="figsub">Drag the age to see whether that stage of life is saving, or borrowing and drawing on savings.</p></div><button class="replay" type="button" data-replay="lc">Replay</button></div>
    <div class="lc" id="lc" data-anim>
      <svg viewBox="0 0 640 280" role="img" aria-label="Illustrative curves of income and consumption over the life cycle">
        <g id="lc-grid"></g>
        <path id="lc-save" class="lc-area save"/>
        <path id="lc-borrow" class="lc-area borrow"/>
        <path id="lc-dis" class="lc-area dis"/>
        <path id="lc-inc" class="lc-line inc"/>
        <path id="lc-con" class="lc-line con"/>
        <line id="lc-cur" y1="20" y2="240" class="lc-cur"/>
        <circle id="lc-di" r="5" class="lc-dot inc"/>
        <circle id="lc-dc" r="5" class="lc-dot con"/>
        <text id="lc-tinc" font-size="12" class="t-accent">Income</text>
        <text id="lc-tcon" font-size="12" class="t-warm">Consumption</text>
      </svg>
      <div class="sl"><label for="lc-age">Age <b id="lc-av"></b></label><input id="lc-age" type="range" min="22" max="85" value="45"></div>
      <p class="lc-msg" id="lc-msg" aria-live="polite"></p>
      <div class="legend"><span><i style="background:var(--accent-soft)"></i>Income above consumption: saving</span><span><i style="background:var(--warm-soft)"></i>Consumption above income: borrowing or drawing on savings</span></div>
    </div>
  </div>
  <figcaption>Illustrative curves that do not correspond to any statistics. On the life-cycle hypothesis, see Modigliani and Brumberg (1954): people tend to smooth consumption over their lives, saving in stages of high income and borrowing or drawing on savings in stages of low income.</figcaption>
</figure>
<style>
.lc svg{width:100%;height:auto;display:block;margin-bottom:8px}
.lc-line{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200}
.lc-line.inc{stroke:var(--accent)} .lc-line.con{stroke:var(--warm)}
.lc.in .lc-line{animation:lcdraw 1.6s ease forwards}
.lc.in .lc-line.con{animation-delay:.3s}
@keyframes lcdraw{to{stroke-dashoffset:0}}
.lc-area{opacity:0;transition:opacity .6s 1.6s}
.lc.in .lc-area{opacity:1}
.lc-area.save{fill:var(--accent-soft)} .lc-area.borrow,.lc-area.dis{fill:var(--warm-soft)}
.lc-cur{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.lc-dot.inc{fill:var(--accent)} .lc-dot.con{fill:var(--warm)}
.lc-msg{font-size:14px;color:var(--ink);min-height:1.7em;margin:0 0 6px}
</style>
<script>
(function(){
  const X0=46,X1=620,Y0=240,Y1=24, A0=22, A1=85;
  const x=a=>X0+(a-A0)/(A1-A0)*(X1-X0), y=v=>Y0-v/11*(Y0-Y1);
  // Illustrative: income peaks around age 50 and drops to a pension after retirement at 65; consumption rises gently
  const inc=a=>a<65?2.5+7.5*Math.sin(Math.PI*Math.min(1,(a-20)/56)):2.2;
  const con=a=>4.6+1.8*Math.min(1,(a-22)/30)-0.4*Math.max(0,(a-70)/15);
  const ages=[];for(let a=A0;a<=A1;a+=0.25)ages.push(a);
  const line=f=>ages.map((a,i)=>(i?'L':'M')+x(a).toFixed(1)+','+y(f(a)).toFixed(1)).join('');
  const area=(lo,hi)=>{const s=ages.filter(a=>a>=lo&&a<=hi);return 'M'+s.map(a=>x(a).toFixed(1)+','+y(inc(a)).toFixed(1)).join('L')+'L'+s.slice().reverse().map(a=>x(a).toFixed(1)+','+y(con(a)).toFixed(1)).join('L')+'Z';};
  const cross=[];for(let i=1;i<ages.length;i++){const d0=inc(ages[i-1])-con(ages[i-1]),d1=inc(ages[i])-con(ages[i]);if(d0*d1<=0)cross.push(ages[i]);}
  const c1=cross[0]||28, c2=cross.find(a=>a>c1+5)||64;
  document.getElementById('lc-inc').setAttribute('d',line(inc));
  document.getElementById('lc-con').setAttribute('d',line(con));
  document.getElementById('lc-borrow').setAttribute('d',area(A0,c1));
  document.getElementById('lc-save').setAttribute('d',area(c1,c2));
  document.getElementById('lc-dis').setAttribute('d',area(c2,A1));
  let g='';[30,40,50,60,70,80].forEach(a=>{g+=`<line x1="${x(a)}" y1="${Y1}" x2="${x(a)}" y2="${Y0}" class="s-line"/><text x="${x(a)}" y="${Y0+18}" text-anchor="middle" font-size="11" class="t-faint">${a}</text>`;});
  g+=`<line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" class="s-faint"/><text x="${x(65)}" y="${Y1+6}" text-anchor="middle" font-size="11" class="t-faint">Retirement</text><line x1="${x(65)}" y1="${Y1+12}" x2="${x(65)}" y2="${Y0}" class="s-faint" stroke-dasharray="2 3"/>`;
  document.getElementById('lc-grid').innerHTML=g;
  const ti=document.getElementById('lc-tinc'),tc=document.getElementById('lc-tcon');
  ti.setAttribute('x',x(46));ti.setAttribute('y',y(inc(46))-10);tc.setAttribute('x',x(36));tc.setAttribute('y',y(con(36))+20);
  const age=document.getElementById('lc-age');
  function render(){
    const a=+age.value, X=x(a);
    document.getElementById('lc-av').textContent=a;
    const cur=document.getElementById('lc-cur');cur.setAttribute('x1',X);cur.setAttribute('x2',X);
    const di=document.getElementById('lc-di'),dc=document.getElementById('lc-dc');
    di.setAttribute('cx',X);di.setAttribute('cy',y(inc(a)));dc.setAttribute('cx',X);dc.setAttribute('cy',y(con(a)));
    const msg=a<c1?'Income is below desired consumption: borrow (for example a student loan or a mortgage) and repay from future income.':a<c2?'Income is above consumption: save and invest, keeping today\'s money for the future.':'Income drops to a pension, below consumption: draw on earlier savings.';
    document.getElementById('lc-msg').textContent=msg;
  }
  age.addEventListener('input',render); render();
  document.getElementById('lc').addEventListener('anim-in',()=>{let a=22;const t=setInterval(()=>{a+=1;age.value=a;render();if(a>=45)clearInterval(t);},60);});
})();
</script>
