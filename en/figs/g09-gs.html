<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">How many will dig for news</p><p class="figsub">The more people dig for news, the earlier the price reflects it and the less each of them can earn. Drag the cost of digging for news once to see where the market settles: how many people dig, and how much of the news the price reflects in advance.</p></div><button class="replay" type="button" data-replay="gs9">Replay</button></div>
    <div class="gs9" id="gs9" data-anim>
      <svg viewBox="0 0 640 220" role="img" aria-label="Share of informed traders and the gain per person"><g id="gs9-ax"></g><path id="gs9-c" class="gs9-c"/><line id="gs9-l" class="gs9-l"/><circle id="gs9-p" r="6" fill="var(--ink)"/></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>What each informed trader earns from the news</span><span><i style="background:var(--warm)"></i>Cost of digging for news once</span></div>
      <div class="sl"><label for="gs9-k">Cost of digging <b id="gs9-kv"></b></label><input id="gs9-k" type="range" min="1" max="40" step="1" value="10"></div>
      <p class="gs9-msg" id="gs9-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: when the informed make up a share f, the share of the news reflected in the price in advance is f ÷ (f + 0.15), and each informed trader earns 1.5 × (1 − share reflected in advance) ÷ f. Where the two lines cross, digging for news just breaks even, and the market settles there (Grossman and Stiglitz, 1980).</figcaption>
</figure>
<style>
.gs9 svg{width:100%;height:auto;display:block}
.gs9-c{fill:none;stroke:var(--accent);stroke-width:2.5}
.gs9-l{stroke:var(--warm);stroke-width:2;stroke-dasharray:5 4}
.gs9-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.gs9 svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=46,X1=630,YT=12,YB=186,x=f=>X0+f*(X1-X0),y=v=>YB-Math.min(v,4)/4*(YB-YT);
  const s=f=>f/(f+.15),G=f=>1.5*(1-s(f))/f;
  $('gs9-ax').innerHTML=[0,1,2,3,4].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+[0,.25,.5,.75,1].map(f=>`<text x="${x(f)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${f*100}%</text>`).join('')+`<text x="${X1}" y="${YB-6}" text-anchor="end" font-size="11" class="t-muted">Share of people digging for news</text>`;
  let d='';for(let f=.02;f<=1;f+=.01)d+=(f===.02?'M':'L')+x(f).toFixed(1)+','+y(G(f)).toFixed(1);$('gs9-c').setAttribute('d',d);
  function draw(){const c=+$('gs9-k').value/10;let lo=.001,hi=1;for(let i=0;i<50;i++){const m=(lo+hi)/2;if(G(m)>c)lo=m;else hi=m;}const f=G(1)>c?1:lo;
    $('gs9-l').setAttribute('x1',X0);$('gs9-l').setAttribute('x2',X1);$('gs9-l').setAttribute('y1',y(c));$('gs9-l').setAttribute('y2',y(c));$('gs9-p').setAttribute('cx',x(f));$('gs9-p').setAttribute('cy',y(Math.min(c,4)));$('gs9-kv').textContent=c.toFixed(1)+' portions';
    $('gs9-msg').textContent=`When digging once costs ${c.toFixed(1)} portions, the market settles with about ${Math.round(f*100)}% of people digging for news, and the price reflects about ${Math.round(s(f)*100)}% of the news in advance. The lower the cost, the more people dig and the closer the price comes to reflecting the information fully, but it never reflects it fully: otherwise no one would be willing to pay the cost.`;}
  $('gs9-k').addEventListener('input',draw);
  $('gs9').addEventListener('anim-in',()=>{let v=40;$('gs9-k').value=v;draw();const id=setInterval(()=>{v-=2;$('gs9-k').value=Math.max(v,1);draw();if(v<=1)clearInterval(id);},150);});
  draw();
})();
</script>
