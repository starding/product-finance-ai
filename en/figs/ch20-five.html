<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">By where the result lands, human affairs fall into five kinds</p><p class="figsub">Select a kind to see examples and whether an AI agent can directly change the result of such tasks.</p></div><button class="replay" type="button" data-replay="fv">Replay</button></div>
    <div class="fv" id="fv" data-anim></div>
    <p class="fv-msg" id="fv-msg" aria-live="polite"></p>
  </div>
  <figcaption>This book's classification divides tasks by what their result ultimately changes. It complements the routine/non-routine and cognitive/manual division of Autor, Levy and Murnane (2003).</figcaption>
</figure>
<style>
.fv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fv-c{font:inherit;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s,border-color .2s;transition-delay:calc(var(--i)*.15s)}
.fv.in .fv-c{opacity:1;transform:none}
.fv-c em{font-style:normal;font-size:11px;color:var(--faint)}
.fv-c b{font-size:14.5px}
.fv-c span{font-size:12px;color:var(--muted);line-height:1.5}
.fv-c i{font-style:normal;font-size:11.5px;border-radius:5px;padding:2px 6px;margin-top:auto;align-self:flex-start}
.fv-c.d i{background:var(--accent-soft);color:var(--accent)}
.fv-c.n i{background:var(--quote);color:var(--faint)}
.fv-c.d{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.fv-c.sel{border-color:var(--ink)}
.fv-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.fv{grid-template-columns:1fr 1fr}}
</style>
<script>
(function(){
  const T=[['One\'s own body and mind','Exercise, study, rest, medical treatment',0,'The result lands on the person: an agent can draw up plans and explain material, but exercise and study can only be done by the person.'],
    ['Others\' bodies, minds and relationships','Care, raising children, negotiation, maintaining relationships',0,'The result lands on other people and relationships: an agent can prepare material and draft messages, but the relationship itself must still be tended by people.'],
    ['Things and the environment','Cooking, repair, moving, growing',0,'The result lands in the physical world: an agent without a body can only give advice and checklists, and embodied robots are still at an early stage.'],
    ['Information','Writing reports, analysis, research, translation',1,'The result is itself information: an agent can do it directly, and this is the kind with the highest applicable share today.'],
    ['Rights and obligations','Signing contracts, transfers, placing orders, filing taxes',1,'The result is a change in rights and obligations: with tools, an agent can submit and execute on someone\'s behalf, but this usually needs the person\'s authorization.']];
  const box=document.getElementById('fv');
  box.innerHTML=T.map(([n,e,d],i)=>`<button type="button" class="fv-c ${d?'d':'n'}" style="--i:${i}" data-i="${i}"><em>Kind ${i+1}</em><b>${n}</b><span>${e}</span><i>${d?'Agent can act directly':'Agent can only help indirectly'}</i></button>`).join('');
  const bs=[...box.children],m=document.getElementById('fv-msg');
  const sel=i=>{bs.forEach((b,j)=>b.classList.toggle('sel',j===i));m.textContent=T[i][3];};
  bs.forEach((b,i)=>b.addEventListener('click',()=>sel(i)));sel(3);
})();
</script>
