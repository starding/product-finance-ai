<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Authority rises with the record and is withdrawn on change</p><p class="figsub">An agent's level of authority over two years. A good, verifiable record raises the level step by step; an overreach, a model version update and a change in the principal's circumstances bring it down. Tap an event for an explanation.</p></div><button class="replay" type="button" data-replay="pg">Replay</button></div>
    <div class="pg" id="pg" data-anim>
      <svg viewBox="0 0 640 230" role="img" aria-label="Level of authority over time"><g id="pg-g"></g><path id="pg-p" class="pg-l"/><g id="pg-e"></g></svg>
      <p class="pg-msg" id="pg-msg" aria-live="polite">Tap an event in the chart.</p>
    </div>
  </div>
  <figcaption>Illustrative timeline. The levels follow the six-level ladder of authority: 1 information only, 2 draft a plan, 3 confirm each trade, 4 approve a plan, 5 time-limited veto, 6 autonomous within scope. Authority is raised on the basis of a verifiable process record, not returns.</figcaption>
</figure>
<style>
.pg svg{width:100%;height:auto;display:block}
.pg-l{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:1500;stroke-dashoffset:1500;transition:stroke-dashoffset 2.4s ease}
.pg.in .pg-l{stroke-dashoffset:0}
.pg-ev{cursor:pointer}
.pg-ev.sel circle{stroke:var(--ink);stroke-width:2.5}
.pg-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.pg svg text{font-size:16px}}
</style>
<script>
(function(){
  const S=[[0,2],[3,3],[7,4],[11,5],[14,2],[16,3],[18,4],[20,3],[22,3],[22.5,2],[24,2]];
  const EV=[[3,'up','Three months of complete process records; raised to confirm each trade','The agent\'s record while drafting plans is complete: fees, constraints and the account of every cycle can all be checked, so it is allowed to place orders after the person confirms each one.'],[7,'up','Raised to plan approval','Not one overreach during per-trade confirmation; the principal approves a plan of "monthly investment and quarterly rebalancing".'],[11,'up','Raised to time-limited veto','A year of execution within the plan without overreach; rebalancing now comes with a day\'s notice and runs unless vetoed.'],[14,'down','An overreach; lowered to drafting plans','In one rebalancing the agent exceeded the agreed per-trade limit (blocked by the execution layer). Authority is lowered at once, and the reason and handling are explained to the principal.'],[20,'down','Model version update; down one level','The agent has switched model versions, and its past record only partly applies; it runs one level lower until the new version builds a record.'],[22.5,'down','The principal changed jobs; reconfirm','The principal\'s income and spending plans have changed, so the mandate needs review; until the review is done, authority is conservatively lowered to drafting plans.']];
  const X0=70,X1=620,YT=14,YB=190,x=m=>X0+m/24*(X1-X0),y=l=>YB-(l-1)/5*(YB-YT);
  const N=['','Info','Draft','Confirm','Plan','Veto','Auto'];
  let g=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`;
  for(let l=1;l<=6;l++)g+=`<text x="${X0-8}" y="${y(l)+4}" text-anchor="end" font-size="11" class="t-faint">${l} ${N[l]}</text><line x1="${X0}" x2="${X1}" y1="${y(l)}" y2="${y(l)}" class="s-line"/>`;
  [0,6,12,18,24].forEach(m=>g+=`<text x="${x(m)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Month ${m}</text>`);
  document.getElementById('pg-g').innerHTML=g;
  let d='';S.forEach(([m,l],i)=>{d+=(i?`L${x(m)},${y(S[i-1][1])}L`:'M')+`${x(m)},${y(l)}`;});document.getElementById('pg-p').setAttribute('d',d);
  document.getElementById('pg-e').innerHTML=EV.map(([m,k,t],i)=>{const l=S.find(s=>s[0]===m)[1];return `<g class="pg-ev" data-i="${i}"><circle cx="${x(m)}" cy="${y(l)}" r="7" fill="${k==='up'?'var(--accent)':'var(--warm)'}"/></g>`;}).join('');
  const es=[...document.querySelectorAll('.pg-ev')];
  es.forEach((e,i)=>e.addEventListener('click',()=>{es.forEach(z=>z.classList.toggle('sel',z===e));document.getElementById('pg-msg').textContent=EV[i][2]+': '+EV[i][3];}));
})();
</script>
