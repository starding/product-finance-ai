<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">From goal to action: the levels of a job</p><p class="figsub">"Preparing for retirement" breaks down level by level into a plan, decisions and actions. Tap a level to see an example; on the right are how often each level occurs and what each instance is worth.</p></div><button class="replay" type="button" data-replay="ld">Replay</button></div>
    <div class="ld" id="ld" data-anim></div>
    <p class="ld-msg" id="ld-msg" aria-live="polite"></p>
  </div>
  <figcaption>Illustrative. The higher the level, the less often a job occurs and the more each instance is worth; the value of lower-level actions depends on whether they serve the goals above them.</figcaption>
</figure>
<style>
.ld{display:grid;gap:6px}
.ld-r{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:10px;opacity:0;transform:translateX(-12px);transition:opacity .4s,transform .4s;transition-delay:calc(var(--i)*.2s)}
.ld.in .ld-r{opacity:1;transform:none}
.ld-b{width:var(--w);font:inherit;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink);background:color-mix(in srgb,var(--accent) var(--a),var(--surface))}
.ld-b b{font-size:14px;display:block} .ld-b span{font-size:12px;color:var(--muted)}
.ld-b.sel{border-color:var(--ink)}
.ld-m{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.ld-m i{font-style:normal;display:inline-block;height:8px;border-radius:4px;vertical-align:middle;margin-left:4px}
.ld-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.ld-r{grid-template-columns:1fr}.ld-m{flex-direction:row;gap:10px}}
</style>
<script>
(function(){
  const L=[['Goal','Retire in thirty years without a marked drop in living standards','A few times in a lifetime',100,'The goal defines the yardstick for everything else: when the money is needed, how much is needed, and how much fluctuation is acceptable.'],
    ['Plan','Save 15% of income each month, roughly 60/40 stocks to bonds','Reviewed once a year',70,'The plan turns the goal into constraints that can be carried out; it determines most of the long-term result.'],
    ['Decision','Which asset class to buy this month, and whether to rebalance','Monthly or quarterly',40,'Decisions should follow the plan; decisions that depart from it usually come from market excitement, not from a change in the goal.'],
    ['Action','Transfer money, place the order, confirm the fill','Several times a month',18,'Actions should be quick, accurate and reversible; each is worth little, but a mistake can be costly.'],
    ['Looking and understanding','Check prices, read news, understand a price move','Daily',8,'This is what users do most often in a product. Its value lies not in itself but in whether it helps the decisions above it.']];
  const box=document.getElementById('ld');
  box.innerHTML=L.map(([n,e,f,v],i)=>`<div class="ld-r" style="--i:${i};--w:${100-i*10}%"><button type="button" class="ld-b" style="--a:${38-i*7}%" data-i="${i}"><b>${n}</b><span>${e}</span></button><div class="ld-m"><span>Frequency: ${f}</span><span>Value per instance<i style="width:${v*0.6}px;background:var(--accent)"></i></span></div></div>`).join('');
  const bs=[...box.querySelectorAll('.ld-b')],msg=document.getElementById('ld-msg');
  bs.forEach(b=>b.addEventListener('click',()=>{bs.forEach(x=>x.classList.toggle('sel',x===b));msg.textContent=L[+b.dataset.i][4];}));
  bs[0].classList.add('sel');msg.textContent=L[0][4];
})();
</script>
