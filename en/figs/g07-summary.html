<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: shares</p><p class="figsub">Four conclusions, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g07summary">Replay</button></div>
    <div class="g07summary" id="g07summary" data-anim><div class="g07summary-c" style="--i:0"><em>Shares</em><b>Success and failure shared by holding</b><p>Ventures whose outcomes lie far apart do not suit lending; they suit many people investing together and sharing the losses.</p></div><div class="g07summary-c" style="--i:1"><em>Diversification</em><b>Spread the money across many ships</b><p>The average gain is unchanged and volatility falls sharply; staking everything on one ship means bearing avoidable risk.</p></div><div class="g07summary-c warn" style="--i:2"><em>Limited liability</em><b>Lose at most what you put in</b><p>Investors need not care about others’ wealth, and shares can be transferred; part of the risk is shifted to creditors.</p></div><div class="g07summary-c warn" style="--i:3"><em>Debt and equity</em><b>Two ways of dividing the same proceeds</b><p>Debts are paid first and the rest goes to shareholders; the split does not change what the ship itself is worth.</p></div></div>
  </div>
