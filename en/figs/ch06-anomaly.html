<figure>
  <div class="card">
    <p class="figtitle">Average returns sorted by size and book-to-market ratio</p>
    <p class="figsub">Stocks are sorted into five groups by market capitalization (small to large) and five by book-to-market ratio (low to high), giving the average annual returns of 25 portfolios. Tap any cell for a description.</p>
    <div class="an" id="an" data-anim>
      <div class="an-wrap">
        <div class="an-yl">Size<br>small<br>↓<br>large</div>
        <div class="an-grid" id="an-g"></div>
      </div>
      <div class="an-xl"><span>Book-to-market: low (growth)</span><span>high (value)</span></div>
      <p class="an-d" id="an-d" aria-live="polite">Tap any cell.</p>
    </div>
  </div>
  <figcaption>Illustrative data showing only the direction reported by Fama and French (1992) and related studies: portfolios of small stocks with high book-to-market ratios have higher average returns, and differences in beta across portfolios do not explain the gap. The numbers are not the original estimates.</figcaption>
</figure>
<style>
.an-wrap{display:grid;grid-template-columns:40px 1fr;gap:6px;align-items:stretch}
.an-yl{font-size:11px;color:var(--faint);text-align:center;line-height:1.5;display:flex;flex-direction:column;justify-content:center}
.an-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.an-grid button{font:inherit;font-size:13px;font-variant-numeric:tabular-nums;border:0;border-radius:6px;padding:12px 0;cursor:pointer;color:var(--ink);opacity:0;transform:scale(.85);transition:opacity .3s,transform .3s;transition-delay:calc(var(--k)*30ms)}
.an.in .an-grid button{opacity:1;transform:none}
.an-grid button.sel{outline:2px solid var(--ink)}
.an-xl{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin:6px 0 0 46px}
.an-d{font-size:14px;margin:10px 0 0;min-height:1.7em}
</style>
<script>
(function(){
  const g=document.getElementById('an-g'); let h='';
  for(let s=0;s<5;s++)for(let v=0;v<5;v++){
    const r=8+ (4-s)*0.9 + v*1.3 + (s===0&&v===0?-1.5:0); // small growth stocks lower; illustrative
    const beta=(1.25-0.08*s-0.02*v).toFixed(2);
    const t=(r-7)/(16-7), bg=`color-mix(in srgb, var(--accent) ${Math.round(10+t*60)}%, var(--surface))`;
    h+=`<button type="button" style="--k:${s*5+v};background:${bg}" data-r="${r.toFixed(1)}" data-b="${beta}" data-s="${s}" data-v="${v}">${r.toFixed(1)}%</button>`;
  }
  g.innerHTML=h;
  const S=['smallest','small','medium','large','largest'], V=['lowest','low','medium','high','highest'];
  g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{g.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
    document.getElementById('an-d').textContent=`Portfolio with ${S[b.dataset.s]} market cap and ${V[b.dataset.v]} book-to-market ratio: average annual return ${b.dataset.r}%, beta about ${b.dataset.b}. The differences in return are far larger than the differences in beta.`;}));
})();
</script>
