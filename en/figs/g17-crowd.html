<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Crowding through the same door</p><p class="figsub">One of ten portfolios is forced to sell all its holdings. Drag how much the portfolios' holdings overlap, and see the losses of the other nine portfolios, and the second-round losses after they follow their rules for cutting positions and sell too.</p></div><button class="replay" type="button" data-replay="cw17">Replay</button></div>
    <div class="cw17" id="cw17" data-anim>
      <div class="cw17-g" id="cw17-g"></div>
      <div class="legend"><span><i style="background:var(--warm)"></i>First-round loss</span><span><i style="background:var(--warm-soft);border:1px solid var(--warm)"></i>Second-round loss after following the selling</span></div>
      <div class="sl"><label for="cw17-o">Overlap of holdings <b id="cw17-ov"></b></label><input id="cw17-o" type="range" min="0" max="100" step="10" value="20"></div>
      <p class="cw17-msg" id="cw17-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: the forced sale makes the ship shares it held fall 10%. Other portfolios' first-round loss = 10% × degree of overlap. Portfolios whose loss exceeds 3% sell half their holdings, and each portfolio that does so pushes the overlapping part down a further 1.5% (a simplification of the unwinding process described by Khandani and Lo, 2011). Columns are numbered portfolios 2 to 10.</figcaption>
</figure>
<style>
.cw17-g{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;align-items:end;height:150px;margin:6px 0 8px}
.cw17-c{display:flex;flex-direction:column;justify-content:flex-start;height:100%;font-size:11px;color:var(--faint);text-align:center}
.cw17-c div{width:70%;margin:0 auto;display:flex;flex-direction:column}
.cw17-c i{display:block;transition:height .5s}
.cw17-c i.a{background:var(--warm)} .cw17-c i.b{background:var(--warm-soft);border:1px solid var(--warm);border-top:none}
.cw17-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cw17'+id);
  function draw(){const o=+$('-o').value/100;$('-ov').textContent=Math.round(o*100)+'%';const r1=10*o,sellers=r1>3?9:0,r2=sellers*1.5*o,sc=4.5;
    $('-g').innerHTML=Array.from({length:9},(_,i)=>`<div class="cw17-c"><span>No. ${i+2}</span><div><i class="a" style="height:${r1*sc}px"></i><i class="b" style="height:${r2*sc}px"></i></div></div>`).join('');
    $('-msg').textContent=r1<=3?`Overlap ${Math.round(o*100)}%: the other portfolios each lose ${r1.toFixed(1)}%, no position cuts are triggered, and the shock stops there.`:`Overlap ${Math.round(o*100)}%: the other portfolios each lose ${r1.toFixed(1)}% in the first round, and all of them trigger position cuts. The nine portfolios sell together, the overlapping ship shares fall further, and each loses another ${r2.toFixed(1)}% in the second round. The narrower the door and the more people crowding it, the slower everyone gets out.`;}
  $('-o').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{let v=0;$('-o').value=0;draw();const id=setInterval(()=>{v+=10;$('-o').value=v;draw();if(v>=80)clearInterval(id);},350);});
  draw();
})();
</script>
