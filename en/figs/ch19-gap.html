<figure class="gap" id="gapfig">
  <div class="card">
    <p class="figtitle">Theoretical ranges and published measurements</p>
    <p class="figsub">Log scale. Tap any row to see the source study.</p>
    <div id="gapsvg"></div>
    <div class="gapnote" id="gapnote">Tap any row to see the source study and how it was measured.</div>
  </div>
  <figcaption>Theoretical ranges are estimated as "the principal's input to do the task alone ÷ the principal's input when the agent performs fully and correctly". Among the measurements, solid dots are randomized controlled trials of delegation, hollow dots are studies in which a person leads and AI assists (used as a proxy), and diamonds are vendor self-reports or model self-estimates (which leave out the principal's checking).</figcaption>
</figure>
<style>
.gap svg{width:100%;height:auto;display:block}
.gap .row{cursor:pointer}
.gap .row:hover .rowbg,.gap .row.on .rowbg{fill:var(--quote)}
.gapnote{min-height:64px;font-size:13px;line-height:1.7;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.gapnote b{color:var(--ink)}
</style>
<script>
/* ---------- Theoretical ranges and published measurements ---------- */
(function(){
  // [name, theory low, theory high, measured low, measured high, kind D delegation/A assisted/V self-reported/N none, note]
  const groups=[
    ['General delegation',[
      ['Errands across websites',1.5,45,null,null,'N','No published measurement found. On long computer-use workflows taking 1–2 hours, the best strict completion rate is about 21% (OSWorld 2.0, 2026).'],
      ['Monitoring and alerts',2,30,3.07,6.53,'D','Randomized controlled trial of security-alert triage with 167 external security analysts. It was a one-off alert queue, and about 83% of the gain came from automatically closing harmless reports; the author and the tested product both belong to Microsoft (Bono, 2025).'],
      ['Research and synthesis',2.7,24,3.29,3.29,'A','An observed task of reading two reports and writing a summary, with 2–3 people per group and no randomization; the evidence is very weak (UK Department for Business and Trade, 2025).'],
      ['Routine team work',2,24,1.14,1.2,'A','7,137 knowledge workers at 66 firms were randomly given an office assistant; weekly time on email fell by 12%–17%, with no significant change in meeting time (Dillon et al., 2025).'],
      ['Office documents',2,16,1.02,1.67,'A','Three randomized controlled or field experiments: document completion time about 1.02×; consultants 1.12–1.34×; writing tasks 1.67× (Dillon et al. 2025; Dell\'Acqua et al. 2023; Noy and Zhang 2023).'],
    ]],
    ['Professional delegation',[
      ['Customer service',4,100,1.03,1.2,'D','Randomized controlled trial at Taobao with 647 agents and 680,000 sessions: 1.03× across all sessions, 1.20× on the sessions where the agent applied (5.8% of the total) (Wang et al., 2026).'],
      ['Code migration',2.5,60,2,14,'V','Code migration and refactoring. Company and vendor self-reports only: Google internal migrations 2–9×, Airbnb test-file migration about 13×. Results can be verified by compilation and tests, so the gap is smallest.'],
      ['Features and bug fixes',2,36,1.04,1.22,'D','Randomized controlled trial with 57 open-source developers and more than 800 tasks, with free use of coding agents: time fell by 4%–18%, or about 1.0–1.2×. The researchers call it weak evidence, possibly a lower bound (METR, 2026).'],
      ['Contracts and legal work',1.6,24,1.14,1.59,'A','Contract review and legal research. Randomized controlled trial with 127 upper-year law students: time on five tasks fell by 12%–37% (Schwarcz et al., 2025).'],
      ['Clinical notes',2.3,10.3,1.02,1.1,'D','Randomized controlled trial with 238 outpatient physicians in 14 specialties: time writing each note fell by 1.7%–9.5%; the tool was not used in every visit (Lukac et al., 2025).'],
    ]],
    ['Financial delegation',[
      ['Company research',8,40,3,6.7,'V','Research on companies and investment views. Vendor and institutional self-reports only, mostly stated as "up to" reductions or as research cycle time. Individual investors spend a median of about 6 minutes researching each trade, so against actual behaviour the factor is close to or below 1.'],
      ['Portfolio management',8,32,null,null,'N','Portfolio management and continuous monitoring. No measurement of time saved found. Studies of robo-advisers observe that logins and trades did not fall after adoption; the value lies mainly in making allocation possible where it was not before.'],
      ['Order submission',1,2.5,null,null,'N','Placing an order yourself takes about half a minute; with confirmation of each order, delegation saves ten-odd seconds. The theoretical upper bound itself is only 2.5×.'],
    ]],
    ['Reference',[
      ['Users\' total work hours',null,null,1.03,1.06,'A','Surveys of employed people in the United States and Denmark: users report saving 2.8%–5.4% of their working hours; counting non-users, all employed people in the United States save about 1.4% (Bick et al. 2025; Humlum and Vestergaard 2025).'],
      ['Model self-estimates',null,null,5,20,'V','Speed-ups on individual tasks estimated from conversation records, excluding the principal\'s checking time (Anthropic, 2025–2026).'],
    ]],
  ];
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const host=document.getElementById('gapsvg'), note=document.getElementById('gapnote');
  const fm=v=>v<2?String(+v.toFixed(2)):v<10?String(+v.toFixed(1)):String(Math.round(v));
  const rng=(l,h)=>l===h?fm(l)+'×':fm(l)+'–'+fm(h)+'×';
  function draw(){
    const narrow=host.clientWidth<600;
    const W=narrow?600:900, LW=narrow?170:230, RW=narrow?20:120, X0=LW, X1=W-RW;
    const RH=narrow?40:34, GH=30, TOP=34;
    const n=groups.reduce((s,g)=>s+g[1].length,0);
    const H=TOP+groups.length*GH+n*RH+10;
    const vmin=0.8,vmax=100, X=v=>X0+Math.log10(v/vmin)/Math.log10(vmax/vmin)*(X1-X0);
    const ink=css('--ink'),muted=css('--muted'),faint=css('--faint'),line=css('--line'),acc=css('--accent'),warm=css('--warm'),gray=css('--gray-mark'),surf=css('--surface');
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Theoretical amplification-factor ranges for each type of delegation compared with published measurements" font-family="Noto Sans SC, PingFang SC, sans-serif">`;
    [1,3,10,30,100].forEach(v=>{s+=`<line x1="${X(v)}" y1="${TOP-8}" x2="${X(v)}" y2="${H-6}" stroke="${line}"/><text x="${X(v)}" y="${TOP-14}" text-anchor="middle" font-size="12" fill="${faint}">${v}×</text>`;});
    let y=TOP, idx=0;
    groups.forEach(([gt,rows])=>{
      s+=`<text x="4" y="${y+20}" font-size="13" font-weight="700" fill="${muted}">${gt}</text>`; y+=GH;
      rows.forEach(r=>{
        const [name,tl,th,al,ah,k]=r, cy=y+RH/2;
        s+=`<g class="row" data-i="${idx}" tabindex="0"><rect class="rowbg" x="0" y="${y}" width="${W}" height="${RH}" fill="transparent" rx="6"/>`;
        s+=`<text x="12" y="${cy+5}" font-size="${narrow?13:14}" fill="${ink}">${name}</text>`;
        if(tl!=null){s+=`<rect x="${X(tl)}" y="${cy-8}" width="${X(th)-X(tl)}" height="16" rx="8" fill="${acc}" opacity=".22"/>`;
          if(!narrow) s+=`<text x="${X1+10}" y="${cy+5}" font-size="12" fill="${muted}">Theory ${rng(tl,th)}</text>`;}
        if(k==='D'||k==='A'){
          const x1=X(al),x2=X(ah);
          if(tl!=null&&ah<tl) s+=`<line x1="${x2+7}" y1="${cy}" x2="${X(tl)-2}" y2="${cy}" stroke="${warm}" stroke-width="1.3" stroke-dasharray="2 3"/>`;
          if(x2-x1>1) s+=`<line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}" stroke="${warm}" stroke-width="${k==='D'?4:2}" stroke-linecap="round"/>`;
          (x2-x1>1?[x1,x2]:[x1]).forEach(xv=>{s+= k==='D'?`<circle cx="${xv}" cy="${cy}" r="5.5" fill="${warm}"/>`:`<circle cx="${xv}" cy="${cy}" r="5" fill="${surf}" stroke="${warm}" stroke-width="2"/>`;});
        } else if(k==='V'){
          const x1=X(al),x2=X(ah);
          s+=`<line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}" stroke="${gray}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
          [x1,x2].forEach(xv=>{s+=`<path d="M${xv},${cy-5.5} L${xv+5.5},${cy} L${xv},${cy+5.5} L${xv-5.5},${cy} Z" fill="${surf}" stroke="${gray}" stroke-width="1.6"/>`;});
        } else {
          s+=`<text x="${X(th)+8}" y="${cy+4}" font-size="11.5" fill="${faint}">No published data</text>`;
        }
        s+=`</g>`; y+=RH; idx++;
      });
    });
    s+='</svg>';
    host.innerHTML=s;
    const flat=groups.flatMap(g=>g[1]);
    host.querySelectorAll('.row').forEach(g=>{
      const show=()=>{host.querySelectorAll('.row').forEach(x=>x.classList.remove('on'));g.classList.add('on');
        const r=flat[+g.dataset.i]; const kind={D:'randomized trial of delegation',A:'assisted study, used as a proxy',V:'vendor self-report or model self-estimate',N:'No published measurement'}[r[5]];
        note.innerHTML=`<b>${r[0]}</b> · ${r[1]!=null?'Theory '+rng(r[1],r[2])+' · ':''}${r[3]!=null?'Measured '+rng(r[3],r[4])+' ('+kind+')':kind}<br>${r[6]}`;};
      g.addEventListener('click',show); g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show();}});
    });
  }
  draw();
  let t; addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,120);});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
})();
</script>
