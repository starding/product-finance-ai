<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Civilization Simulator · Chapter 10: whom to hand it to</p><p class="figsub">Forty households each have 100 portions of wealth invested in the fleet. The three lines show the median household wealth when households manage it themselves, hand it to managers who pick actively, or hand it to a manager who holds everything in proportion; select one to see the details.</p></div><button class="replay" type="button" data-replay="cs10">Replay</button></div>
    <div class="cs-rules"><span class="on">Bank</span><span class="on">Shares</span><span class="on">Market</span><span class="on">Information in prices</span><span class="on">Delegation</span><span class="lock">Regulation &amp; custody · Ch. 11</span></div>
    <div class="seg-btns" role="group" aria-label="How the shares are managed">
      <button type="button" data-cs10="self" aria-pressed="false">Do it yourself</button>
      <button type="button" data-cs10="active" aria-pressed="true">Active manager</button>
      <button type="button" data-cs10="passive" aria-pressed="false">Hold everything in proportion</button>
    </div>
    <div class="cs10" id="cs10" data-anim>
      <svg viewBox="0 0 660 220" role="img" aria-label="Median wealth under three ways of managing"><g id="cs10-ax"></g><path id="cs10-band" class="cs10-band"/><g id="cs10-l"></g></svg>
      <div class="legend"><span><i style="background:var(--faint)"></i>Do it yourself</span><span><i style="background:var(--warm)"></i>Active managers</span><span><i style="background:var(--accent)"></i>Hold everything in proportion</span><span><i style="background:var(--quote);border:1px solid var(--line)"></i>10th to 90th percentile of households for the selected option</span></div>
      <div class="cs10-ctl">
        <div class="sl"><label for="cs10-s">Managers with real skill <b id="cs10-sv"></b></label><input id="cs10-s" type="range" min="0" max="60" step="10" value="20"></div>
        <div class="sl"><label for="cs10-f">Fee for active picking <b id="cs10-fv"></b></label><input id="cs10-f" type="range" min="0.5" max="2.5" step="0.1" value="1.5"></div>
      </div>
      <div class="cs-sw"><label><input type="checkbox" id="cs10-c"> Each year principals switch to last year's best-performing manager</label></div>
      <button type="button" class="replay" id="cs10-re">Another run of years</button>
      <div class="cs10-out" id="cs10-out"></div>
      <p class="cs10-msg" id="cs10-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative model: the fleet's average return is 6% a year with 15% volatility. Do it yourself: each household's result has its own additional fluctuation, is 1% lower each year because of trading and errors of judgement, and takes 3 hours a week. Active managers: ten managers; those with real skill earn 2% more a year, the rest do not, and each has its own fluctuation; the chosen fee is deducted. Hold everything in proportion: earns the fleet's average return, with a fee of 0.1%. When switching, principals move each year to last year's best-performing manager and pay an extra 0.5% for switching.</figcaption>
</figure>
<style>
.cs10 svg{width:100%;height:auto;display:block}
.cs10-band{fill:var(--quote);stroke:none}
.cs10-ctl{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.cs10-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cs10-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.cs10-out span{display:block;font-size:11.5px;color:var(--faint)} .cs10-out b{font-size:18px;font-variant-numeric:tabular-nums}
.cs10-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.cs10-ctl{grid-template-columns:1fr;gap:4px}.cs10-out{grid-template-columns:1fr}.cs10 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cs10'+id),N=40,Y=20,M=10;let mode='active',seed=1010;
  const X0=44,X1=650,YT=10,YB=186,x=t=>X0+t/Y*(X1-X0);
  function sim(sk,fee,chase){let s=seed;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};const g=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());};
    const nS=Math.round(sk*M),alpha=Array.from({length:M},(_,j)=>j<nS?.02:0);
    const W={self:Array(N).fill(100),active:Array(N).fill(100),passive:Array(N).fill(100)},H={self:[],active:[],passive:[]},pick=Array.from({length:N},(_,i)=>i%M);
    let last=Array(M).fill(0);
    const snap=()=>{for(const k in W){H[k].push(W[k].slice().sort((a,b)=>a-b));}};snap();
    for(let t=0;t<Y;t++){const m=.06+.15*g(),mr=alpha.map(a=>m+a+.06*g());
      for(let i=0;i<N;i++){W.self[i]*=Math.max(.05,1+m-.01+.08*g());W.passive[i]*=1+m-.001;
        let j=pick[i],cost=fee;if(chase){j=last.indexOf(Math.max(...last));if(t>0)cost+=.005;}W.active[i]*=Math.max(.05,1+mr[j]-cost);}
      last=mr.slice();snap();}
    return H;}
  function draw(){const sk=+$('-s').value/100,fee=+$('-f').value/100,chase=$('-c').checked,H=sim(sk,fee,chase);
    $('-sv').textContent=Math.round(sk*100)+'%';$('-fv').textContent=(fee*100).toFixed(1)+'%';
    const q=(a,p)=>a[Math.floor(p*(a.length-1))],all=[].concat(...Object.values(H).map(h=>h.map(a=>q(a,.9)))),mx=Math.max(400,...all),y=v=>YB-Math.min(v,mx)/mx*(YB-YT);
    $('-ax').innerHTML=[0,.25,.5,.75,1].map(k=>{const v=Math.round(mx*k/100)*100;return `<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`;}).join('')+[0,5,10,15,20].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Year ${t}</text>`).join('');
    const h=H[mode];$('-band').setAttribute('d','M'+h.map((a,t)=>x(t)+','+y(q(a,.9))).join('L')+'L'+h.map((a,t)=>x(t)+','+y(q(a,.1))).reverse().join('L')+'Z');
    const C={self:'var(--faint)',active:'var(--warm)',passive:'var(--accent)'};
    $('-l').innerHTML=Object.keys(H).map(k=>`<path d="${H[k].map((a,t)=>(t?'L':'M')+x(t).toFixed(1)+','+y(q(a,.5)).toFixed(1)).join('')}" fill="none" stroke="${C[k]}" stroke-width="${k===mode?3:1.4}" opacity="${k===mode?1:.55}"/>`).join('');
    const med=k=>q(H[k][Y],.5),hrs={self:3*52,active:0,passive:0};
    $('-out').innerHTML=[['Median wealth in year 20',Math.round(med(mode))+' portions'],['10th to 90th percentile of households',Math.round(q(H[mode][Y],.1))+'–'+Math.round(q(H[mode][Y],.9))+' portions'],['Time spent per year',hrs[mode]?hrs[mode]+' hours':'Almost none']].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
    const p=med('passive'),a=med('active');
    $('-msg').textContent=mode==='self'?`Managing it yourself takes 156 hours a year; errors of judgement and trading leave the median at ${Math.round(med('self'))} portions, and the gaps between households are the widest.`:mode==='passive'?`Holding everything in proportion, with no research, no picking and very low fees, gives a median of ${Math.round(p)} portions, and households end up almost the same.`:
      `Handing it to active managers gives a median of ${Math.round(a)} portions, ${a>=p?'slightly above':'below'} the ${Math.round(p)} portions from holding in proportion. ${sk===0?'No manager has real skill, so the fee is a pure loss. ':''}${chase?'Switching to last year\'s champion often means switching to a manager who has just been lucky, and paying extra for the switch.':'Try ticking the switching option, or raising the fee.'}`;}
  document.querySelectorAll('[data-cs10]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.cs10;document.querySelectorAll('[data-cs10]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
  ['-s','-f','-c'].forEach(k=>$(k).addEventListener('input',draw));$('-re').addEventListener('click',()=>{seed=(seed*48271)%2147483647;draw();});
  $('').addEventListener('anim-in',()=>{['self','active','passive'].forEach((k,i)=>setTimeout(()=>{mode=k;document.querySelectorAll('[data-cs10]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.cs10===k)));draw();},300+i*2400));});
  draw();
})();
</script>
