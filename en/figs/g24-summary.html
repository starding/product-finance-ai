<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: trust takes time</p><p class="figsub">Four conclusions, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g24summary">Replay</button></div>
    <div class="g24summary" id="g24summary" data-anim><div class="g24summary-c" style="--i:0"><em>Three sources of trustworthiness</em><b>Ability, benevolence and integrity, each with evidence</b><p>Records prove ability, fees and goals prove benevolence, and the agreement and its verification prove integrity.</p></div><div class="g24summary-c" style="--i:1"><em>Signalling</em><b>Only costly signals are credible</b><p>A deposit, insurance, a licence and an audit are what a cheating operator cannot afford.</p></div><div class="g24summary-c warn" style="--i:2"><em>Starting small and reputation</em><b>Widen level by level; the record changes the judgement</b><p>The loss limit at each level is written down in advance, so a cheating scribe never gets authority worth cheating with.</p></div><div class="g24summary-c warn" style="--i:3"><em>Asymmetry</em><b>After a mistake, step back rather than reset to zero</b><p>Overstepping withdraws authority, a compensated execution error steps back one level, and a misjudgement does not step back.</p></div></div>
  </div>
