<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: banks</p><p class="figsub">Four conclusions, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g06summary">Replay</button></div>
    <div class="g06summary" id="g06summary" data-anim><div class="g06summary-c" style="--i:0"><em>Maturity transformation</em><b>Deposits withdrawable at any time become long-term loans</b><p>When many people pool their grain, the share withdrawn each year is quite stable, so only part needs to be kept back.</p></div><div class="g06summary-c" style="--i:1"><em>Monitoring</em><b>The bank watches borrowers for depositors</b><p>Each borrower is inspected once, and depositors need only care about the bank itself; the cost of monitoring sets the value of this delegation.</p></div><div class="g06summary-c warn" style="--i:2"><em>Bank runs</em><b>Confidence itself is a risk</b><p>Fear that others will withdraw first brings everyone at once, and even a well-run granary can fall.</p></div><div class="g06summary-c warn" style="--i:3"><em>Defences</em><b>Deposit insurance and the lender of last resort</b><p>They spare people the need to rush; the cost is moral hazard, which calls for capital requirements and supervision.</p></div></div>
  </div>
</figure>
