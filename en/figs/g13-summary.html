<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: the cost of cognitive labour collapses</p><p class="figsub">Four conclusions, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g13summary">Replay</button></div>
    <div class="g13summary" id="g13summary" data-anim><div class="g13summary-c" style="--i:0"><em>Price</em><b>Cognitive labour is almost free</b><p>The price of reading, calculating and writing falls to a few hundredths of what it was; everything else stays the same.</p></div><div class="g13summary-c" style="--i:1"><em>Composition</em><b>Checking and bearing responsibility do not fall</b><p>The cheaper cognitive labour becomes, the larger the share of a delegation's cost taken by checking and bearing responsibility.</p></div><div class="g13summary-c warn" style="--i:2"><em>Edge</em><b>Abilities are uneven; checking cannot follow difficulty alone</b><p>The most dangerous tasks are those that look easy but which the scribe gets wrong.</p></div><div class="g13summary-c warn" style="--i:3"><em>Weakest stave</em><b>The slowest step sets the limit</b><p>Speeding up only what can be sped up leaves a ceiling on the overall factor; the reachable share depends on what is built around the model.</p></div></div>
