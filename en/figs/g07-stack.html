<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Debts first, the rest to shareholders</p><p class="figsub">A ship has borrowed 60 portions; the rest was put up by shareholders. Drag the value of the cargo when the ship returns and see how much the creditors and the shareholders each receive.</p></div><button class="replay" type="button" data-replay="sk">Replay</button></div>
    <div class="sk" id="sk" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="Payoffs to debt and equity"><g id="sk-ax"></g><path id="sk-d" class="sk-d"/><path id="sk-e" class="sk-e"/><line id="sk-v" class="s-faint"/><circle id="sk-pd" r="5" fill="var(--blue)"/><circle id="sk-pe" r="5" fill="var(--accent)"/></svg>
      <div class="legend"><span><i style="background:var(--blue)"></i>Creditors receive</span><span><i style="background:var(--accent)"></i>Shareholders receive</span></div>
      <div class="sl"><label for="sk-x">Value of the cargo <b id="sk-xv"></b></label><input id="sk-x" type="range" min="0" max="300" step="5" value="150"></div>
      <p class="sk-msg" id="sk-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>The two lines always add up to the value of the cargo: debt and equity are just two ways of dividing the same proceeds (Modigliani and Miller, 1958).</figcaption>
</figure>
<style>
.sk svg{width:100%;height:auto;display:block}
.sk-d{fill:none;stroke:var(--blue);stroke-width:2.5}
.sk-e{fill:none;stroke:var(--accent);stroke-width:2.5}
.sk-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.sk svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=46,X1=630,YT=12,YB=180,x=v=>X0+v/300*(X1-X0),y=v=>YB-v/300*(YB-YT),D=60;
  $('sk-ax').innerHTML=[0,100,200,300].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text><text x="${x(v)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${v}</text>`).join('');
  $('sk-d').setAttribute('d',`M${x(0)},${y(0)}L${x(D)},${y(D)}L${x(300)},${y(D)}`);$('sk-e').setAttribute('d',`M${x(0)},${y(0)}L${x(D)},${y(0)}L${x(300)},${y(300-D)}`);
  function draw(){const v=+$('sk-x').value,d=Math.min(v,D),e=Math.max(0,v-D);
    $('sk-v').setAttribute('x1',x(v));$('sk-v').setAttribute('x2',x(v));$('sk-v').setAttribute('y1',YT);$('sk-v').setAttribute('y2',YB);
    $('sk-pd').setAttribute('cx',x(v));$('sk-pd').setAttribute('cy',y(d));$('sk-pe').setAttribute('cx',x(v));$('sk-pe').setAttribute('cy',y(e));$('sk-xv').textContent=v+' portions';
    $('sk-msg').textContent=v<D?`The cargo is worth only ${v} portions, not enough to repay the debt: creditors take all ${v}, and shareholders get nothing.`:`The cargo is worth ${v} portions: creditors first take back ${D}, and shareholders get the remaining ${e}. Creditors’ gains are capped; shareholders’ gains have no ceiling, but they come last.`;}
  $('sk-x').addEventListener('input',draw);
  $('sk').addEventListener('anim-in',()=>{let v=0;$('sk-x').value=0;draw();const id=setInterval(()=>{v+=10;$('sk-x').value=v;draw();if(v>=300)clearInterval(id);},90);});
  draw();
})();
</script>
