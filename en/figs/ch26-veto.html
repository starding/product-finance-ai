<figure>
  <div class="card">
    <p class="figtitle">How long should the veto window be?</p>
    <p class="figsub">The agent proposes an operation with 24 hours to go before the deadline. On average the principal sees the message about 6 hours later. Drag the length of the veto window to see the probability that the principal sees it in time, and the risk of missing the deadline.</p>
    <div class="vt" id="vt" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="Veto window and the two risks"><g id="vt-ax"></g><path id="vt-a" class="vt-l a"/><path id="vt-b" class="vt-l b"/><line id="vt-c" class="vt-c"/></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Principal sees it in time</span><span><i style="background:var(--warm)"></i>Risk of missing the deadline</span></div>
      <div class="sl"><label for="vt-w">Veto window <b id="vt-wv"></b></label><input id="vt-w" type="range" min="1" max="30" step="1" value="12"></div>
      <p class="vt-msg" id="vt-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative calculation: the time until the principal sees the message follows an exponential distribution with a mean of 6 hours; execution follows the end of the window and takes 2 hours, and finishing after the deadline counts as missing it. For the time-limited veto level, see Sheridan and Verplank (1978); the wording follows Parasuraman, Sheridan and Wickens (2000).</figcaption>
</figure>
<style>
.vt svg{width:100%;height:auto;display:block}
.vt-l{fill:none;stroke-width:2.5} .vt-l.a{stroke:var(--accent)} .vt-l.b{stroke:var(--warm)}
.vt-c{stroke:var(--ink);stroke-dasharray:3 3}
.vt-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.vt svg text{font-size:18px}}
</style>
<script>
(function(){
  const D=24,E=2,M=6,X0=56,X1=620,YT=14,YB=176,x=w=>X0+(w-1)/29*(X1-X0),y=v=>YB-v*(YB-YT);
  const See=w=>1-Math.exp(-w/M),Miss=w=>w+E>D?1:Math.max(0,(w+E-(D-6))/6)*.3;
  const $=id=>document.getElementById(id),sl=$('vt-w');
  $('vt-ax').innerHTML=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`+[0,.5,1].map(v=>`<text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+[1,6,12,18,24,30].map(w=>`<text x="${x(w)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${w} h</text>`).join('')+`<line x1="${x(D-E)}" y1="${YT}" x2="${x(D-E)}" y2="${YB}" stroke="var(--warm)" stroke-dasharray="2 3"/><text x="${x(D-E)-4}" y="${YT+10}" text-anchor="end" font-size="11" class="t-warm">Any later, too late to execute</text>`;
  let a='',b='';for(let w=1;w<=30;w+=.25){a+=(w>1?'L':'M')+x(w).toFixed(1)+','+y(See(w)).toFixed(1);b+=(w>1?'L':'M')+x(w).toFixed(1)+','+y(Miss(w)).toFixed(1);}$('vt-a').setAttribute('d',a);$('vt-b').setAttribute('d',b);
  function r(){const w=+sl.value;$('vt-wv').textContent=w+(w===1?' hour':' hours');$('vt-c').setAttribute('x1',x(w));$('vt-c').setAttribute('x2',x(w));$('vt-c').setAttribute('y1',YT);$('vt-c').setAttribute('y2',YB);
    const s=See(w),m=Miss(w);$('vt-msg').textContent=w<4?`With a window of only ${w} ${w===1?'hour':'hours'}, the probability that the principal sees it in time is only ${(s*100).toFixed(0)}%: most of the time the operation runs without anyone having looked. Veto is possible in name; in practice it is close to automatic.`:m>=1?`With a ${w}-hour window, execution happens after the deadline has passed: even the most careful confirmation has lost its point. Close to the deadline, the operation should return to per-trade confirmation, with more insistent reminders.`:`With a ${w}-hour window, the probability that the principal sees it in time is about ${(s*100).toFixed(0)}%, and the risk of missing the deadline is ${m<.05?'small':'starting to rise'}.`;}
  sl.addEventListener('input',r);
  $('vt').addEventListener('anim-in',()=>{let w=1;sl.value=1;r();const id=setInterval(()=>{w++;sl.value=w;r();if(w>=26){clearInterval(id);setTimeout(()=>{sl.value=12;r();},700);}},120);});
  r();
})();
</script>
