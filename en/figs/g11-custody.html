<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Custody: assets out of the manager's hands</p><p class="figsub">Switch between having an independent custodian or not, and see which of the manager's crooked paths are blocked.</p></div><button class="replay" type="button" data-replay="cu">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Custody">
      <button type="button" data-cu="0" aria-pressed="true">Manager holds the assets</button>
      <button type="button" data-cu="1" aria-pressed="false">Independent custodian</button>
    </div>
    <div class="cu" id="cu" data-anim>
      <div class="cu-flow" id="cu-flow"></div>
      <div class="cu-ths" id="cu-ths"></div>
    </div>
  </div>
  <figcaption>Illustrative. Independent custody cannot guarantee that the manager judges correctly; it can only guarantee that the assets are still there and the figures are true.</figcaption>
</figure>
<style>
.cu-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center;margin-bottom:12px}
.cu-n{background:var(--quote);border-radius:10px;padding:10px;text-align:center;font-size:13.5px}
.cu-n b{display:block;font-size:14.5px} .cu-n span{font-size:11.5px;color:var(--muted)}
.cu-n.hold{background:var(--accent-soft)}
.cu-ar{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.4}
.cu-ths{display:grid;gap:6px}
.cu-t{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:13.5px;background:var(--quote);border-radius:8px;padding:8px 12px;opacity:0;transform:translateX(-6px);transition:opacity .4s,transform .4s;transition-delay:calc(var(--i)*.2s)}
.cu.in .cu-t{opacity:1;transform:none}
.cu-t em{font-style:normal;font-size:12px;padding:2px 9px;border-radius:999px}
.cu-t em.ok{background:var(--accent-soft);color:var(--accent)} .cu-t em.no{background:var(--warm-soft);color:var(--warm)}
@media (max-width:640px){.cu-flow{grid-template-columns:1fr;}.cu-ar{transform:none}}
</style>
<script>
(function(){
  const T=[['Sell the ship shares and keep the grain','he cannot reach the shares and can only give instructions'],['Report false figures','the custodian reports directly to principals'],['Pay old principals with new principals\' grain','the custodian records each household\'s shares one by one'],['Buy a ship that loses money','can still happen: custody does not guarantee sound judgement']];
  const box=document.getElementById('cu');
  function set(k){document.querySelectorAll('[data-cu]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.cu===k)));
    document.getElementById('cu-flow').innerHTML=k?`<div class="cu-n"><b>Principals</b><span>read the custodian's reports</span></div><div class="cu-ar">← reports directly<br>hand over shares →</div><div class="cu-n hold"><b>Custodian</b><span>holds the shares</span></div><div class="cu-ar">← instructions</div><div class="cu-n"><b>Manager</b><span>only decides</span></div>`:`<div class="cu-n"><b>Principals</b><span>hear only the manager</span></div><div class="cu-ar">← manager reports<br>hand over shares →</div><div class="cu-n hold"><b>Manager</b><span>holds the shares and decides</span></div><div class="cu-ar"></div><div class="cu-n" style="opacity:.3"><b>Custodian</b><span>none</span></div>`;
    document.getElementById('cu-ths').innerHTML=T.map(([a,b],i)=>`<div class="cu-t" style="--i:${i}"><span>${a}${k?': '+b:''}</span><em class="${k&&i<3?'ok':'no'}">${k&&i<3?'Blocked':'Possible'}</em></div>`).join('');box.classList.remove('in');void box.offsetWidth;box.classList.add('in');}
  document.querySelectorAll('[data-cu]').forEach(b=>b.addEventListener('click',()=>set(+b.dataset.cu)));
  box.addEventListener('anim-in',()=>{set(0);setTimeout(()=>set(1),2600);});
  set(0);box.classList.remove('in');
})();
</script>
