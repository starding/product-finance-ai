<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Ranges held with "98% confidence"</p><p class="figsub">Ten estimation questions, each answered with a range the person believes is 98% certain to contain the true answer. The dots are the true answers.</p></div><button class="replay" type="button" data-replay="cb">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Range">
      <button type="button" data-cb="n" aria-pressed="true">Ranges people usually give</button>
      <button type="button" data-cb="w" aria-pressed="false">Ranges truly at 98%</button>
    </div>
    <div class="cb" id="cb" data-anim>
      <svg viewBox="0 0 640 250" role="img" aria-label="Estimated ranges and true answers"><g id="cb-g"></g></svg>
      <p class="cb-msg" id="cb-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: the ten questions and the range widths are examples, and the hit rate is set at the order of magnitude found in research. In calibration studies, ranges claimed with 98% confidence actually contain only about 60% of true answers; see the review by Lichtenstein, Fischhoff and Phillips (1982).</figcaption>
</figure>
<style>
.cb svg{width:100%;height:auto;display:block}
.cb-r{transition:all .6s ease}
.cb-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.cb svg text{font-size:18px}}
</style>
<script>
(function(){
  const T=[[0,.6],[1,-1.6],[2,.2],[3,1.9],[4,-.4],[5,-.8],[6,.9],[7,2.8],[8,-.1],[9,-2.0]];
  const X0=40,X1=620,cx=(X0+X1)/2,sc=70,g=document.getElementById('cb-g');
  g.innerHTML=`<line x1="${cx}" y1="8" x2="${cx}" y2="240" class="s-faint" stroke-dasharray="3 3"/>`+T.map(([i,v])=>{const y=18+i*23;return `<g><text x="${X0-10}" y="${y+4}" text-anchor="end" font-size="11" class="t-faint">${i+1}</text><rect class="cb-r" data-i="${i}" x="${cx}" y="${y-6}" width="0" height="12" rx="6"/><circle cx="${cx+v*sc}" cy="${y}" r="5" fill="var(--ink)"/></g>`;}).join('');
  const rs=[...g.querySelectorAll('.cb-r')];
  function set(k){document.querySelectorAll('[data-cb]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cb===k)));
    const w=k==='n'?1:3;let hit=0;
    rs.forEach((r,i)=>{const h=w,v=T[i][1],ok=Math.abs(v)<=h;if(ok)hit++;r.setAttribute('x',cx-h*sc);r.setAttribute('width',2*h*sc);r.setAttribute('fill',ok?'var(--accent-soft)':'var(--warm-soft)');r.setAttribute('stroke',ok?'var(--accent)':'var(--warm)');});
    document.getElementById('cb-msg').textContent=k==='n'?`Claimed with 98% confidence, yet only ${hit} of the ten ranges contain the true answer, close to the roughly 60% found in research. People are more confident about how much they know than their knowledge warrants.`:`To truly cover nearly all the true answers, the ranges must be much wider: here about 3 times the original, and ${hit} of the ten hit.`;}
  document.querySelectorAll('[data-cb]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.cb)));
  document.getElementById('cb').addEventListener('anim-in',()=>{rs.forEach(r=>{r.setAttribute('x',cx);r.setAttribute('width',0);});setTimeout(()=>set('n'),100);setTimeout(()=>set('w'),2800);});
  set('n');
})();
</script>
