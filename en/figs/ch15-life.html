<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Income and spending over a lifetime</p><p class="figsub">Income is concentrated in a few decades of work; spending runs through the whole of life. Open each layer in turn to see the four kinds of financial job that result.</p></div><button class="replay" type="button" data-replay="lf">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Job">
      <button type="button" data-lf="save" aria-pressed="true">Saving and growth</button>
      <button type="button" data-lf="draw" aria-pressed="false">Drawing down in retirement</button>
      <button type="button" data-lf="shock" aria-pressed="false">Coping with shocks</button>
      <button type="button" data-lf="pay" aria-pressed="false">Everyday payments</button>
    </div>
    <div class="lf" id="lf" data-anim>
      <svg viewBox="0 0 640 230" role="img" aria-label="Income and consumption over the life cycle">
        <path id="lf-s" class="lf-a s"/><path id="lf-d" class="lf-a d"/>
        <path id="lf-i" class="lf-l i"/><path id="lf-c" class="lf-l c"/>
        <g id="lf-ax"></g><g id="lf-sh"></g><g id="lf-py"></g>
      </svg>
      <div class="legend"><span><i style="background:var(--blue)"></i>Income</span><span><i style="background:var(--ink)"></i>Desired consumption</span><span><i style="background:var(--accent)"></i>Saving</span><span><i style="background:var(--warm)"></i>Drawing down</span></div>
      <p class="lf-msg" id="lf-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative curves, based on the life-cycle hypothesis of Modigliani and Brumberg (1954); the grouping into four jobs draws on Merton's (1995) account of the functions of the financial system.</figcaption>
</figure>
<style>
.lf svg{width:100%;height:auto;display:block}
.lf-l{fill:none;stroke-width:2.5;stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.4s ease}
.lf-l.i{stroke:var(--blue)} .lf-l.c{stroke:var(--ink)}
.lf.in .lf-l{stroke-dashoffset:0}
.lf-a{opacity:0;transition:opacity .5s}
.lf-a.s{fill:var(--accent);} .lf-a.d{fill:var(--warm)}
.lf-a.on{opacity:.3}
@media (max-width:640px){.lf svg text{font-size:17px}}
.lf-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
</style>
<script>
(function(){
  const X0=40,X1=620,YB=190,YT=20,x=a=>X0+(a-20)/(90-20)*(X1-X0),y=v=>YB-v/100*(YB-YT);
  const inc=a=>a<65?Math.max(0,95*Math.exp(-Math.pow((a-50)/17,2))):8, con=a=>52;
  const P=(f,a0,a1)=>{let d='';for(let a=a0;a<=a1;a+=0.5)d+=(a===a0?'M':'L')+x(a).toFixed(1)+','+y(f(a)).toFixed(1);return d;};
  const area=(f,g,a0,a1)=>{let d='M'+x(a0)+','+y(g(a0));for(let a=a0;a<=a1;a+=0.5)d+='L'+x(a).toFixed(1)+','+y(f(a)).toFixed(1);for(let a=a1;a>=a0;a-=0.5)d+='L'+x(a).toFixed(1)+','+y(g(a)).toFixed(1);return d+'Z';};
  let a0=20;while(inc(a0)<con(a0))a0+=0.5;let a1=a0;while(a1<65&&inc(a1)>=con(a1))a1+=0.5;
  const $=id=>document.getElementById(id);
  $('lf-i').setAttribute('d',P(inc,20,90));$('lf-c').setAttribute('d',P(con,20,90));
  $('lf-s').setAttribute('d',area(inc,con,a0,a1));$('lf-d').setAttribute('d',area(con,a=>inc(a),65,90));
  let ax=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`;
  [20,30,40,50,60,70,80,90].forEach(a=>ax+=`<text x="${x(a)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${a===20?'Age ':''}${a}</text>`);
  ax+=`<line x1="${x(65)}" y1="${YT}" x2="${x(65)}" y2="${YB}" class="s-faint" stroke-dasharray="3 3"/><text x="${x(65)+4}" y="${YT+10}" font-size="11" class="t-faint">Retirement</text>`;
  $('lf-ax').innerHTML=ax;
  $('lf-sh').innerHTML=[[38,'Job loss'],[57,'Illness']].map(([a,t])=>`<g class="lf-shk" opacity="0" style="transition:opacity .4s"><line x1="${x(a)}" y1="${y(inc(a))}" x2="${x(a)}" y2="${y(inc(a))+52}" stroke="var(--gold)" stroke-width="2.5"/><path d="M${x(a)-5},${y(inc(a))+44} L${x(a)},${y(inc(a))+54} L${x(a)+5},${y(inc(a))+44}" fill="var(--gold)"/><text x="${x(a)}" y="${y(inc(a))-6}" text-anchor="middle" font-size="12" fill="var(--gold)">${t}</text></g>`).join('');
  let py='';for(let a=22;a<=88;a+=3)py+=`<circle cx="${x(a)}" cy="${YB-6}" r="2.5" fill="var(--faint)"/>`;
  $('lf-py').innerHTML=`<g id="lf-pyg" opacity="0" style="transition:opacity .4s">${py}<text x="${x(24)}" y="${YB-14}" font-size="11" class="t-faint">Monthly payments</text></g>`;
  const M={save:'During working years, income exceeds desired consumption; the surplus has to be saved and grow over decades of waiting. This is the most basic financial job: moving today\'s money into the future.',
    draw:'After retirement, income drops and consumption must be supported by what was built up before. The job is to draw down according to plan and make sure the money does not run out before life does.',
    shock:'Unexpected events such as job loss or illness can make income collapse or spending jump. The job is to set aside an emergency fund or buy insurance, so that one shock does not derail the whole plan.',
    pay:'Salaries arriving, bills being paid, transfers: these happen every month. Such jobs call for convenience, accuracy and security, and usually involve no investment judgment.'};
  function set(k){document.querySelectorAll('[data-lf]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lf===k)));
    $('lf-s').classList.toggle('on',k==='save');$('lf-d').classList.toggle('on',k==='draw');
    document.querySelectorAll('.lf-shk').forEach(g=>g.setAttribute('opacity',k==='shock'?1:0));
    $('lf-pyg').setAttribute('opacity',k==='pay'?1:0);$('lf-msg').textContent=M[k];}
  document.querySelectorAll('[data-lf]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.lf)));
  $('lf').addEventListener('anim-in',()=>{set('save');['draw','shock','pay','save'].forEach((k,i)=>setTimeout(()=>set(k),1800+i*1800));});
  set('save');
})();
</script>
