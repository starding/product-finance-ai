<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Civilization Simulator · Chapter 16: a market where everyone has an analyst</p><p class="figsub">Forty households decide whether to have a scribe analyse public reports for them. The two lines show, as the price of cognitive labour falls from its original level to one hundredth of it, the households willing to analyse and the public information that prices reflect in advance; the dots mark the current price. Then switch on "A few households hold exclusive non-public data" and see where the advantage goes.</p></div><button class="replay" type="button" data-replay="cs16">Replay</button></div>
    <div class="cs-rules"><span class="on">Information in prices</span><span class="on">Parameter: price of cognitive labour</span><span class="on">Personal agent</span><span class="on">Guaranteeing agents</span><span class="on">Analysts for all</span><span class="lock">Agents as market participants · Ch. 17</span></div>
    <div class="cs16" id="cs16" data-anim>
      <svg viewBox="0 0 660 220" role="img" aria-label="Share informed and information reflected in prices"><g id="cs16-g"></g></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Households willing to analyse</span><span><i style="background:var(--blue)"></i>Public information reflected in prices in advance</span></div>
      <div class="sl"><label for="cs16-c">Price of cognitive labour <b id="cs16-cv"></b></label><input id="cs16-c" type="range" min="0" max="2" step="0.1" value="0"></div>
      <div class="cs-sw"><label><input type="checkbox" id="cs16-x"> A few households (one tenth) hold exclusive non-public data</label></div>
      <div class="cs16-out" id="cs16-out"></div>
      <p class="cs16-msg" id="cs16-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative model: the same as in the figure "Where information gathering stops". The cost of analysing public reports is originally 0.8 portions per person per year and falls in proportion to the price of cognitive labour; the informed share settles where each person's gain exactly equals the cost. Exclusive data brings an advantage of 3 portions a year, shared by one tenth of households; the money comes from households that trade without this data, and it does not change with the price of cognitive labour. The horizontal axis is the price of cognitive labour on a logarithmic scale.</figcaption>
</figure>
<style>
.cs16 svg{width:100%;height:auto;display:block}
.cs16-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cs16-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.cs16-out span{display:block;font-size:11.5px;color:var(--faint)} .cs16-out b{font-size:18px;font-variant-numeric:tabular-nums}
.cs16-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.cs16-out{grid-template-columns:1fr}.cs16 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cs16'+id),N=40,V=9.6,K=.1,VX=3,D=.1,X0=50,X1=628,YT=12,YB=180,x=l=>X0+l/2*(X1-X0),y=v=>YB-v*(YB-YT);
  const gain=f=>V*(K/(f+K))*(1-f)/(f*N);
  function eq(c){if(gain(1/N)<=c)return 1/N;let lo=1/N,hi=.999;if(gain(hi)>c)return hi;for(let k=0;k<60;k++){const m=(lo+hi)/2;if(gain(m)>c)lo=m;else hi=m;}return lo;}
  function draw(){const l=+$('-c').value,a=Math.pow(10,-l),c=.8*a,f=eq(c),sh=f/(f+K),xo=$('-x').checked;$('-cv').textContent=a>=.1?Math.round(a*100)+'%':(a*100).toFixed(1)+'%';
    let h=[0,.25,.5,.75,1].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+[[0,'Original'],[1,'10%'],[2,'1%']].map(([v,t])=>`<text x="${x(v)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${t}</text>`).join('')+`<text x="${X1}" y="${YB+30}" text-anchor="end" font-size="11" class="t-faint">Price of cognitive labour →</text>`;
    let dF='',dS='';for(let k=0;k<=40;k++){const ll=k/20,ff=eq(.8*Math.pow(10,-ll));dF+=(k?'L':'M')+x(ll).toFixed(1)+','+y(ff).toFixed(1);dS+=(k?'L':'M')+x(ll).toFixed(1)+','+y(ff/(ff+K)).toFixed(1);}
    h+=`<path d="${dF}" fill="none" stroke="var(--accent)" stroke-width="2.6"/><path d="${dS}" fill="none" stroke="var(--blue)" stroke-width="2.6"/><circle cx="${x(l)}" cy="${y(f)}" r="6" fill="var(--accent)"/><circle cx="${x(l)}" cy="${y(sh)}" r="6" fill="var(--blue)"/>`;
    $('-g').innerHTML=h;const per=c;
    $('-out').innerHTML=[['Households willing to analyse',Math.round(f*N)+''],['Gain per analyst per year',per<.1?per.toFixed(3)+' portions':per.toFixed(2)+' portions'],[xo?'Per data-holding household per year':'Public information reflected in advance',xo?(VX/(D*N)).toFixed(2)+' portions':Math.round(sh*100)+'%']].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('');
    $('-msg').textContent=(l===0?`At the original price of cognitive labour, only ${Math.round(f*N)} households are willing to pay for analysis, and prices reflect about ${Math.round(sh*100)}% of public information in advance.`:`With the price of cognitive labour down to ${a>=.1?Math.round(a*100):(a*100).toFixed(1)}%, the households willing to analyse rise to ${Math.round(f*N)}, and prices reflect about ${Math.round(sh*100)}% of public information in advance. Each analyst's gain falls with the cost to ${per<.1?per.toFixed(3):per.toFixed(2)} portions, and reading reports is worth almost nothing in itself.`)+(xo?` The 4 households holding exclusive non-public data still have an advantage of ${(VX/(D*N)).toFixed(2)} portions each per year; however cheap scribes become, they cannot read this data.`:'');}
  ['-c','-x'].forEach(k=>$(k).addEventListener('input',draw));
  $('').addEventListener('anim-in',()=>{$('-x').checked=false;let v=0;$('-c').value=0;draw();const id=setInterval(()=>{v+=.1;$('-c').value=v.toFixed(1);draw();if(v>=2){clearInterval(id);setTimeout(()=>{$('-x').checked=true;draw();},1200);}},150);});
  draw();
})();
</script>
