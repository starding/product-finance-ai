<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Three ways to sell</p><p class="figsub">You need to sell, in a hurry, a ship share worth 10 portions on its prospects. Select a way to sell and compare how long you wait, how much you end up with, and who is paid the cost.</p></div><button class="replay" type="button" data-replay="bk">Replay</button></div>
    <div class="bk" id="bk" data-anim>
      <button type="button" class="bk-c" data-i="0" style="--i:0"><b>Search yourself</b><span>Ask door to door</span></button>
      <button type="button" class="bk-c" data-i="1" style="--i:1"><b>Use a broker</b><span>He knows who wants to buy</span></button>
      <button type="button" class="bk-c" data-i="2" style="--i:2"><b>Sell to a market maker</b><span>Trade at once</span></button>
    </div>
    <dl class="bk-d" id="bk-d" aria-live="polite"></dl>
  </div>
  <figcaption>Illustrative: searching yourself assumes waiting at most five days; the broker finds a buyer within a day and charges a 2% commission; the market maker’s bid is below the value on prospects by half the spread.</figcaption>
</figure>
<style>
.bk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bk-c{font:inherit;text-align:left;cursor:pointer;background:var(--quote);border:1px solid transparent;border-radius:10px;padding:10px 12px;color:var(--ink);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.25s)}
.bk.in .bk-c{opacity:1;transform:none}
.bk-c b{display:block;font-size:15px} .bk-c span{font-size:12.5px;color:var(--muted)}
.bk-c.sel{border-color:var(--accent);background:var(--accent-soft)}
.bk-d{display:grid;grid-template-columns:7em 1fr;gap:6px 14px;margin:14px 0 0;font-size:13.5px;line-height:1.6}
.bk-d dt{color:var(--faint);font-size:12px;padding-top:2px} .bk-d dd{margin:0}
@media (max-width:640px){.bk{grid-template-columns:1fr}.bk-d{grid-template-columns:1fr;gap:1px}.bk-d dd{margin-bottom:6px}}
</style>
<script>
(function(){
  const K=['How long','Average received','Cost paid to','Suits'];
  const D=[['Up to five days, and it may still not sell','About 9.0 portions','Your own time, and the discount of a forced sale','Sellers in no hurry who know many people'],['Within a day','About 9.8 portions (after the 2% commission)','The broker: paying for the information he holds and the time he spends','Sellers who want a good price but do not want to do the legwork'],['At once','About 9.6 portions (giving up half the spread)','The market maker: paying for the inventory risk he bears','Sellers who cannot wait a moment']];
  const d=document.getElementById('bk-d'),bs=[...document.querySelectorAll('.bk-c')];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));d.innerHTML=K.map((k,j)=>`<dt>${k}</dt><dd>${D[i][j]}</dd>`).join('');}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('bk').addEventListener('anim-in',()=>{[0,1,2].forEach((i,k)=>setTimeout(()=>set(i),400+k*1800));});
  set(0);
})();
</script>
