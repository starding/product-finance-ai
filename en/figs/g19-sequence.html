<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">The same years, in a different order</p><p class="figsub">An old man retires with 100 portions of savings and draws 6 portions a year to live on. The twenty years of returns are the same, only in a different order: in one, the sharp falls come in the first years of retirement; in the other, in the last years.</p></div><button class="replay" type="button" data-replay="sq19">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Order">
      <button type="button" data-sq19="late" aria-pressed="true">Falls in the last years</button>
      <button type="button" data-sq19="early" aria-pressed="false">Falls in the first years</button>
    </div>
    <div class="sq19" id="sq19" data-anim>
      <svg viewBox="0 0 660 210" role="img" aria-label="Savings after retirement"><g id="sq19-g"></g></svg>
      <p class="sq19-msg" id="sq19-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: the annual returns over the twenty years are the same set of numbers, only in reverse order; without withdrawals, the two orders give exactly the same result after twenty years. The vertical axis is in portions.</figcaption>
</figure>
<style>
.sq19 svg{width:100%;height:auto;display:block}
.sq19-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.sq19 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('sq19'+id),R=[-.25,-.15,.05,.08,.1,.07,.09,.06,.08,.1,.07,.09,.08,.06,.1,.07,.09,.08,.1,.12],T=20,X0=50,X1=628,YT=12,YB=178,x=t=>X0+t/T*(X1-X0),y=v=>YB-Math.max(0,v)/200*(YB-YT);
  function path(seq,wd){let w=100;const P=[w];for(const r of seq){w=Math.max(0,(w-wd)*(1+r));P.push(w);}return P;}
  function draw(m){const early=R,late=R.slice().reverse(),A=path(m==='early'?early:late,6),B=path(m==='early'?late:early,6),N=path(early,0)[T];
    let h=[0,50,100,150,200].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+[0,5,10,15,20].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Year ${t}</text>`).join('');
    const L=P=>P.map((v,t)=>(t?'L':'M')+x(t).toFixed(1)+','+y(v).toFixed(1)).join('');
    h+=`<path d="${L(B)}" fill="none" stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="5 4"/><path d="${L(A)}" fill="none" stroke="${m==='early'?'var(--warm)':'var(--accent)'}" stroke-width="2.8"/>`;
    $('-g').innerHTML=h;const zero=A.findIndex(v=>v<=0);
    $('-msg').textContent=m==='late'?`Falls in the last years: the good years at the start let the savings grow first, and ${A[T].toFixed(0)} portions remain after twenty years.`:`Falls in the first years: just after retiring he sells ship shares at the bottom to live on, and what he sells cannot wait for the recovery; `+(zero>0?`the savings run out in year ${zero}. `:`only ${A[T].toFixed(0)} portions remain after twenty years. `)+`With the same returns and no withdrawals, the two orders give exactly the same result (${N.toFixed(0)} portions).`;}
  const bs=[...document.querySelectorAll('[data-sq19]')];
  function set(m){bs.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sq19===m)));draw(m);}
  bs.forEach(b=>b.addEventListener('click',()=>set(b.dataset.sq19)));
  $('').addEventListener('anim-in',()=>{set('late');setTimeout(()=>set('early'),2400);});
  set('late');
})();
</script>
