<figure>
  <div class="card">
    <p class="figtitle">On-the-spot assembly or a fixed workflow</p>
    <p class="figsub">The horizontal axis is how fixed the task's path is; the vertical axis is how many people the same task serves, and how often. Tap a task to see which way of organizing suits it.</p>
    <div class="og" id="og" data-anim>
      <svg viewBox="0 0 640 280" role="img" aria-label="How tasks are organized"><g id="og-ax"></g><g id="og-pts"></g></svg>
      <p class="og-msg" id="og-msg" aria-live="polite">Tap a task.</p>
    </div>
  </div>
  <figcaption>Illustrative positions. The framework that distinguishes tasks by the number of exceptions and how analysable they are is from Perrow (1967).</figcaption>
</figure>
<style>
.og svg{width:100%;height:auto;display:block}
.og-p{cursor:pointer;opacity:0;transition:opacity .4s;transition-delay:calc(var(--i)*.12s)}
.og.in .og-p{opacity:1}
.og-p.sel circle{stroke:var(--ink);stroke-width:2.5}
.og-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.og svg text{font-size:16px}}
</style>
<script>
(function(){
  const T=[['Research a company',12,40,'a','The path differs from company to company, and what to look up and how to calculate it must be judged on the spot: assembled on the spot by the agent.'],['Answer a personal question',15,15,'a','It depends on the principal\'s circumstances, and the steps cannot be fixed in advance: assembled on the spot.'],['Review past decisions',36,30,'a','Each review focuses on something different; a fixed attribution calculation can be called as one of its steps.'],['Daily market summary',85,90,'f','Fixed steps, many people served, consistency required: built as a fixed workflow that has been evaluated.'],['Option/rights expiry alert',90,75,'f','Clear trigger rules and a high cost of missed alerts: a fixed workflow, triggered by rules, with the model responsible for the explanation.'],['Periodic portfolio check-up',80,66,'f','The checks are fixed and the results must be consistent and comparable: a fixed workflow.'],['Track holdings continuously',55,42,'m','The checks themselves are a fixed workflow; the explanation and suggestions after an anomaly is found are done on the spot by the agent: the two connect.']];
  const X0=60,X1=610,YT=14,YB=240,x=v=>X0+v/100*(X1-X0),y=v=>YB-v/100*(YB-YT),C={a:'var(--accent)',f:'var(--blue)',m:'var(--gold)'};
  document.getElementById('og-ax').innerHTML=`<rect x="${x(0)}" y="${y(100)}" width="${x(50)-x(0)}" height="${y(0)-y(100)}" fill="var(--accent-soft)" opacity=".45"/><rect x="${x(50)}" y="${y(100)}" width="${x(100)-x(50)}" height="${y(0)-y(100)}" fill="rgba(47,95,158,.08)"/>`+
    `<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/><line x1="${X0}" y1="${YT}" x2="${X0}" y2="${YB}" class="s-faint"/><text x="${X0}" y="${YB+18}" font-size="11" class="t-faint">Path uncertain</text><text x="${X1}" y="${YB+18}" text-anchor="end" font-size="11" class="t-faint">Path fixed →</text><text x="${X0-6}" y="${YT+8}" text-anchor="end" font-size="11" class="t-faint">Many</text><text x="${X0-6}" y="${YB}" text-anchor="end" font-size="11" class="t-faint">Few</text>`+
    `<text x="${x(25)}" y="${y(96)}" text-anchor="middle" font-size="12" class="t-accent">On-the-spot assembly</text><text x="${x(75)}" y="${y(96)}" text-anchor="middle" font-size="12" fill="var(--blue)">Fixed workflow</text>`;
  document.getElementById('og-pts').innerHTML=T.map(([n,a,b,k],i)=>`<g class="og-p" data-i="${i}" style="--i:${i}"><circle cx="${x(a)}" cy="${y(b)}" r="7" fill="${C[k]}"/><text x="${x(a)+(a>70?-11:11)}" y="${y(b)+4}" text-anchor="${a>70?'end':'start'}" font-size="12" class="t-ink">${n}</text></g>`).join('');
  const ps=[...document.querySelectorAll('.og-p')];
  ps.forEach((p,i)=>p.addEventListener('click',()=>{ps.forEach(q=>q.classList.toggle('sel',q===p));document.getElementById('og-msg').textContent=T[i][0]+': '+T[i][4];}));
})();
</script>
