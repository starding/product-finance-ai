<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Civilization Simulator · Chapter 3: A village that keeps its word</p><p class="figsub">Twenty households that harvest in spring borrow grain each year from households that harvest in autumn. Choose an approach to making promises credible, adjust the share of borrowers who keep their word and how much people care about the future, and see whether lending can be sustained over twenty years.</p></div><button class="replay" type="button" data-replay="cs3">Replay</button></div>
    <div class="cs-rules"><span class="on">Saving</span><span class="on">Seed</span><span class="on">Lending</span><span class="on">Commitment</span><span class="lock">Money · Ch. 4</span><span class="lock">Insurance · Ch. 5</span></div>
    <div class="seg-btns" role="group" aria-label="Approach to making promises credible">
      <button type="button" data-cs3="none" aria-pressed="false">None</button>
      <button type="button" data-cs3="rep" aria-pressed="true">Reputation</button>
      <button type="button" data-cs3="col" aria-pressed="false">Collateral</button>
      <button type="button" data-cs3="both" aria-pressed="false">Reputation + collateral</button>
    </div>
    <div class="cs3" id="cs3" data-anim>
      <svg viewBox="0 0 660 200" role="img" aria-label="Lending in each of twenty years"><g id="cs3-ax"></g><g id="cs3-b"></g></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Borrowed and repaid on time</span><span><i style="background:var(--warm)"></i>Borrowed but did not repay</span><span><i style="background:var(--quote);border:1px solid var(--line)"></i>Could not borrow</span></div>
      <div class="cs3-ctl">
        <div class="sl"><label for="cs3-h">Share who keep their word <b id="cs3-hv"></b></label><input id="cs3-h" type="range" min="0" max="100" step="5" value="60"></div>
        <div class="sl"><label for="cs3-d">How much people care about the future <b id="cs3-dv"></b></label><input id="cs3-d" type="range" min="50" max="95" step="5" value="85"></div>
      </div>
      <div class="cs3-out" id="cs3-out"></div>
      <p class="cs3-msg" id="cs3-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative model: each household borrows 4 portions a year and repays 4.4 in spring; each loan repaid on time brings the two sides 1 portion of gain in total; not repaying gains 4 portions now. Opportunists default only when defaulting pays better. With no approach, they always default. With reputation, they default if the future lost (care for the future ÷ (1 − care for the future) × 1 portion) is less than 4 portions, and are then refused by the whole village. With collateral, they repay if the collateral is worth at least the principal and interest. With no approach, lenders decide whether to keep lending by last year's repayment rate, and stop if it falls below 80%. Of the twenty households, 7 have collateral worth at least the principal and interest.</figcaption>
</figure>
<style>
.cs3 svg{width:100%;height:auto;display:block}
.cs3-ctl{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.cs3-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cs3-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.cs3-out span{display:block;font-size:11.5px;color:var(--faint)} .cs3-out b{font-size:18px;font-variant-numeric:tabular-nums}
.cs3-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.cs3-ctl{grid-template-columns:1fr;gap:4px}.cs3-out{grid-template-columns:1fr}.cs3 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cs3'+id),N=20,Y=20,DUE=4.4,G=4,W=[0,0,0,0.5,1,1,1.5,2,2.5,3,3,3.5,4,4.5,5,5.5,6,7,8,9];
  const X0=40,X1=650,YT=10,YB=168,bw=(X1-X0)/Y,y=v=>YB-v/N*(YB-YT);let mode='rep';
  $('-ax').innerHTML=[0,5,10,15,20].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+
    [1,5,10,15,20].map(t=>`<text x="${X0+bw*(t-.5)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Year ${t}</text>`).join('');
  function sim(h,d){const honest=Array.from({length:N},(_,i)=>((i*7)%N)<Math.round(h*N)),col=W.map(w=>w>=DUE),bad=Array(N).fill(false);
    const future=d/(1-d)*1,repRepays=future>=G;let belief=.9;const rows=[];
    for(let t=0;t<Y;t++){let ok=0,def=0;
      for(let i=0;i<N;i++){let can;
        if(mode==='none')can=belief>=.8;else if(mode==='rep')can=!bad[i];else if(mode==='col')can=col[i];else can=!bad[i];
        if(!can)continue;
        let repay;if(honest[i])repay=true;else if(mode==='none')repay=false;else if(mode==='rep')repay=repRepays;else if(mode==='col')repay=true;else repay=col[i]||repRepays;
        if(repay)ok++;else{def++;bad[i]=true;}}
      if(mode==='none'&&ok+def>0)belief=ok/(ok+def);
      rows.push([ok,def]);}
    return rows;}
  function draw(){const h=+$('-h').value/100,d=+$('-d').value/100,R=sim(h,d);
    $('-hv').textContent=Math.round(h*100)+'%';$('-dv').textContent=Math.round(d*100)+'%';
    $('-b').innerHTML=R.map(([ok,def],t)=>{const x=X0+bw*t+bw*.15,w=bw*.7;return `<rect x="${x}" y="${y(N)}" width="${w}" height="${YB-y(N)}" rx="2" fill="var(--quote)"/><rect x="${x}" y="${y(ok)}" width="${w}" height="${YB-y(ok)}" rx="2" fill="var(--accent)"/><rect x="${x}" y="${y(ok+def)}" width="${w}" height="${y(ok)-y(ok+def)}" fill="var(--warm)"/>`;}).join('');
    const tot=R.reduce((a,r)=>a+r[0],0),defs=R.reduce((a,r)=>a+r[1],0),last=R[Y-1][0]+R[Y-1][1];
    $('-out').innerHTML=[['Gains from lending realised',Math.round(tot/(N*Y)*100)+'%'],['Defaults over twenty years (household-years)',defs],['Households able to borrow in year 20',last]].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
    const fut=d/(1-d);let m='';
    if(mode==='none')m=h>=.8?`With ${Math.round(h*100)}% keeping their word, lenders barely keep lending, but every year ${Math.round((1-h)*N)} households do not repay, and those who keep their word indirectly bear the loss.`:`In the first year ${Math.round((1-h)*N)} households do not repay, and lenders stop lending for good: lending halts completely, and all its gains are lost.`;
    else if(mode==='rep')m=fut>=G?`Borrowers care enough about the future: the future lost (about ${fut.toFixed(1)} portions) is no less than the 4 portions gained now. Even opportunists repay on time, and lending is sustained throughout.`:`Borrowers do not care enough about the future: opportunists default in the first year and are then refused by the whole village; those who keep their word go on borrowing.`;
    else if(mode==='col')m=`Only the 7 households with enough collateral can borrow, and they have no motive not to repay; the other 13 can never borrow, whether or not they would keep their word.`;
    else m=fut>=G?'Those with collateral and those who care about the future all repay on time: lending is sustained almost in full.':'Those with collateral always repay; opportunists with no collateral who do not care about the future default in the first year and are then excluded.';
    $('-msg').textContent=m;}
  document.querySelectorAll('[data-cs3]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.cs3;document.querySelectorAll('[data-cs3]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
  ['-h','-d'].forEach(k=>$(k).addEventListener('input',draw));
  $('').addEventListener('anim-in',()=>{['none','rep','col','both'].forEach((k,i)=>setTimeout(()=>{mode=k;document.querySelectorAll('[data-cs3]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.cs3===k)));draw();},300+i*2400));});
  draw();
})();
</script>
