<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">What this step leaves open</p><p class="figsub">Four new problems that appear once there are markets. Select one to see the assumption it hides.</p></div><button class="replay" type="button" data-replay="nx8">Replay</button></div>
    <div class="nx" id="nx8" data-anim>
      <div class="nx-src"><b>The village market</b><span>Auctions, market making and brokerage</span></div>
      <div class="nx-list" id="nx8-l"></div>
    </div>
    <p class="nx-msg" id="nx8-msg" aria-live="polite"></p>
  </div>
</figure>
<style>
.nx{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.nx-src{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 10px;text-align:center}
.nx-src b{display:block;font-size:16px} .nx-src span{font-size:12px;opacity:.75}
.nx-list{display:grid;gap:6px}
.nx-i{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--quote);border:1px solid transparent;border-radius:9px;padding:9px 12px;color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.3s)}
.nx.in .nx-i{opacity:1;transform:none}
.nx-i span{font-size:13.5px} .nx-i em{font-style:normal;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nx-i.sel{border-color:var(--accent)}
.nx-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.nx{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const Q=[['Prices contain information','Chapter 9 · Information in prices','Hidden assumption: everyone knows equally much about the ship’s prospects. Whoever learns first that the ship has docked safely will buy ahead of everyone else.'],
    ['Those who know more take advantage','Chapter 9 · Information in prices','Hidden assumption: the market maker never trades with the informed. Trading with the informed is a sure loss, so the spread has to cover that loss too.'],
    ['Ordinary people lack time to watch the market','Chapter 10 · Delegation','Hidden assumption: every household can judge for itself when to buy and sell. Deciding when to buy, and which ship, takes time and expertise.'],
    ['Who guarantees the rules of the market?','Chapter 11 · Regulation & custody','Hidden assumption: quotes are genuine and trades settle as agreed. Someone has to be responsible for this.']];
  const l=document.getElementById('nx8-l'),msg=document.getElementById('nx8-msg');
  l.innerHTML=Q.map((q,i)=>`<button type="button" class="nx-i" style="--i:${i}" data-i="${i}"><span>${q[0]}</span><em>→ ${q[1]}</em></button>`).join('');
  const bs=[...l.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));msg.textContent=Q[i][2];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('nx8').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1600+k*1800));});
  set(0);
})();
</script>
