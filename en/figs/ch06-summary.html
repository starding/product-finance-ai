    <div class="ch06summary" id="ch06summary" data-anim><div class="ch06summary-c" style="--i:0"><em>Returns can be broken into factor exposures</em><b>Show a portfolio’s sources of return factor by factor</b><p>Tell users how much of the return comes from market, size, value and other factors, and how much is true excess return.</p></div><div class="ch06summary-c" style="--i:1"><em>Factor exposure can be replicated cheaply</em><b>Fees should match the true excess return</b><p>Only the part that remains after the factors are removed is worth paying active management fees for.</p></div><div class="ch06summary-c warn" style="--i:2"><em>Enough trials always produce false positives</em><b>Raise the bar for “newly discovered patterns”</b><p>New factors produced by AI or backtests need an economic explanation, a higher statistical threshold and out-of-sample tests.</p></div><div class="ch06summary-c warn" style="--i:3"><em>Credible factors can also lag for a long time</em><b>Explain that factor strategies may underperform for years in a row</b><p>Show users the longest historical period of underperformance before they buy, so they are not forced to give up during a slump.</p></div></div>
