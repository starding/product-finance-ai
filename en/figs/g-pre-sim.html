<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">The Civilization Simulator: each chapter unlocks one rule</p><p class="figsub">Choose a rule to see what problem it solves and what the world falls back to when it is switched off. Grey rules are unlocked in later chapters.</p></div><button class="replay" type="button" data-replay="gs">Replay</button></div>
    <div class="gs" id="gs" data-anim></div>
    <p class="gs-msg" id="gs-msg" aria-live="polite"></p>
  </div>
  <figcaption>Chapters already written can be opened; all numbers in the simulator are illustrative.</figcaption>
</figure>
<style>
.gs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gs-r{font:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--faint);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;opacity:0;transform:scale(.96);transition:opacity .35s,transform .35s,background .3s,border-color .3s;transition-delay:calc(var(--i)*.07s)}
.gs.in .gs-r{opacity:1;transform:none}
.gs-r em{font-style:normal;font-size:10.5px} .gs-r b{font-size:13.5px;font-weight:500}
.gs-r.open{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
.gs-r.sel{box-shadow:0 0 0 2px var(--ink)}
.gs-msg{font-size:14px;margin:12px 0 0;min-height:4.8em;line-height:1.7}
@media (max-width:640px){.gs{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
(function(){
  const R=[['Saving and seed','One person keeps today\'s grain for tomorrow, or sows it as seed. ','Without it, he eats well for a few months after the harvest and goes hungry the rest of the year.',1],
    ['Lending','Two people who run short at different times lend to each other and agree on interest. ','Without it, each can only get through the lean months on storage that spoils.',1],
    ['Commitment','Reputation, collateral and contracts make sure what is lent comes back. ','Without it, no one is willing to lend, and lending cannot happen.',1],
    ['Money','Something everyone accepts serves as medium of exchange, unit of account and store of value. ','Without it, exchange must wait until each side happens to want what the other has, and the youngest generation has no way to provide for old age.',1],
    ['Insurance','Many people pool together to share the bad harvests any of them may meet. ','Without it, one bad year can ruin a household.',1],
    ['Bank','It turns many people\'s deposits, which may be withdrawn at any time, into loans that a few people use for a long time. ','Without it, savings sit idle and long-term projects cannot borrow.',1],
    ['Shares','Many people put up money together, share the risk and divide what is left by their shares. ','Without it, no one takes on a large project such as building a ship.',1],
    ['Market','Securities can be sold to others at any time, at prices set by buyers and sellers. ','Without it, shares once bought must be held to the end.',1],
    ['Information in prices','Prices gather everyone\'s information and are hard to predict consistently. ','Without it, those with more information could win every time.',1],
    ['Delegation','Money is handed to people with the time and expertise to manage it. ','Without it, everyone must do their own research and their own trading.',1],
    ['Regulation & custody','Disclosure, custody and suitability constrain trustees and sellers. ','Without it, trustees could divert assets and sellers could hide risks.',1],
    ['Defaults','Arrangements made in advance make up for people\'s decision biases. ','Without it, planned saving is often abandoned halfway.',1]];
  const box=document.getElementById('gs'),msg=document.getElementById('gs-msg');
  box.innerHTML=R.map((r,i)=>`<button type="button" class="gs-r${r[3]?' open':''}" data-i="${i}" style="--i:${i}"><em>Chapter ${i+1}${r[3]?'':' · locked'}</em><b>${r[0]}</b></button>`).join('');
  const bs=[...box.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));const r=R[i];msg.innerHTML=`<b>${r[0]}</b>: ${r[1]}${r[2]}${r[3]?` <a href="g-${String(i+1).padStart(2,'0')}.html">Open the Chapter ${i+1} simulator →</a>`:''}`;}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  box.addEventListener('anim-in',()=>{[0,1,4,9].forEach((i,k)=>setTimeout(()=>set(i),900+k*2000));});
  set(0);
})();
</script>
