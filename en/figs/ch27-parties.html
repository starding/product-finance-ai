<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">One agent, several principals</p><p class="figsub">Switch views: where the money flows, who sets the agent's objectives, and whom the agent ought to serve. The thicker the line, the greater the influence (illustrative). "Issuer" means product issuers; "Model firm" means the model provider.</p></div><button class="replay" type="button" data-replay="pt">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="View">
      <button type="button" data-pt="m" aria-pressed="true">Money flows</button>
      <button type="button" data-pt="g" aria-pressed="false">Who sets objectives</button>
      <button type="button" data-pt="s" aria-pressed="false">Whom it should serve</button>
    </div>
    <div class="pt" id="pt" data-anim>
      <svg viewBox="0 0 640 260" role="img" aria-label="Relationships between the agent and the parties"><defs><marker id="pt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker></defs><g id="pt-e"></g><g id="pt-n"></g></svg>
      <p class="pt-msg" id="pt-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative structure. The case of one agent influenced by several principals at once is called common agency; see Bernheim and Whinston (1986).</figcaption>
</figure>
<style>
.pt svg{width:100%;height:auto;display:block}
.pt-ln{fill:none;transition:stroke-width .5s,opacity .5s}
.pt-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.pt svg text{font-size:17px}}
</style>
<script>
(function(){
  const N={a:[320,130,'Agent','var(--ink)'],u:[90,130,'User','var(--accent)'],p:[550,130,'Platform','var(--blue)'],i:[430,235,'Issuer','var(--gold)'],m:[210,235,'Model firm','var(--faint)']};
  const E={m:[['u','p',5,'Subscriptions, commissions'],['i','p',6,'Sales revenue share'],['p','m',3,'Usage fees'],['p','a',2,'']],
    g:[['p','a',7,'Objectives and metrics'],['m','a',4,'Model training objective'],['u','a',2,'Mandate'],['i','a',2,'Product info and promotion']],
    s:[['a','u',8,'Act on the user\'s mandate and net value'],['a','p',1,''],['a','i',1,'']]};
  const M={m:'The user\'s money flows to the platform, which also takes a revenue share from product issuers and in turn pays the model provider. The agent itself is paid nothing, but its provider is paid from several directions.',g:'The platform has the most influence over the agent\'s objectives: whatever metrics it uses to evaluate the agent, the agent optimizes toward. The user influences it through the mandate, but is often not the most influential party.',s:'The agent ought to serve the user, acting on the user\'s mandate and net value. The gap between the first two views and this one is the conflict of interest.'};
  const $=id=>document.getElementById(id);
  $('pt-n').innerHTML=Object.entries(N).map(([k,[x,y,t,c]])=>`<g><circle cx="${x}" cy="${y}" r="${k==='a'?38:30}" fill="var(--surface)" stroke="${c}" stroke-width="2.5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="${k==='a'?14:12}" class="t-ink">${t}</text></g>`).join('');
  function set(k){document.querySelectorAll('[data-pt]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pt===k)));
    $('pt-e').innerHTML=E[k].map(([f,t,w,l])=>{const [x1,y1]=N[f],[x2,y2]=N[t],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),r1=f==='a'?40:32,r2=t==='a'?42:34,sx=x1+dx/L*r1,sy=y1+dy/L*r1,ex=x2-dx/L*r2,ey=y2-dy/L*r2,mx=(sx+ex)/2-dy/L*18,my=(sy+ey)/2+dx/L*18;
      return `<path class="pt-ln" d="M${sx},${sy}Q${mx},${my} ${ex},${ey}" stroke="${N[k==='s'?t:f][3]}" stroke-width="${w*1.3}" opacity="${w>1?.85:.25}" marker-end="url(#pt-ar)"/>${l?`<text x="${mx}" y="${my-6}" text-anchor="middle" font-size="11" class="t-muted">${l}</text>`:''}`;}).join('');
    $('pt-msg').textContent=M[k];}
  document.querySelectorAll('[data-pt]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.pt)));
  $('pt').addEventListener('anim-in',()=>{['m','g','s'].forEach((k,i)=>setTimeout(()=>set(k),i*2600));});
  set('m');
})();
</script>
