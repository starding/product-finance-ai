<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: markets</p><p class="figsub">Four conclusions, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g08summary">Replay</button></div>
    <div class="g08summary" id="g08summary" data-anim><div class="g08summary-c" style="--i:0"><em>Concentration</em><b>The more people, the easier the match</b><p>Trading gathers in a few central places, and the quality of execution depends on the buyers and sellers there.</p></div><div class="g08summary-c" style="--i:1"><em>Auctions</em><b>Pooled quotes find the price with the most trades</b><p>Each person need only state their own price, and a call auction finds the price that maximises the gains.</p></div><div class="g08summary-c warn" style="--i:2"><em>Market making and the spread</em><b>The spread is the price of immediacy</b><p>The market maker bears inventory risk; the more frequent the trading and the steadier the price, the narrower the spread.</p></div><div class="g08summary-c warn" style="--i:3"><em>Liquidity</em><b>Hard-to-sell assets must offer higher returns</b><p>Liquidity shows up as waiting, the spread and discounts; searching and bargaining are labour, and their cost shapes the form of brokerage.</p></div></div>
  </div>
</figure>
