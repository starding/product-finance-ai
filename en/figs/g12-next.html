<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">What this step leaves open</p><p class="figsub">Every institution carries a cost. Select a cost to see the assumption behind it.</p></div><button class="replay" type="button" data-replay="nx12">Replay</button></div>
    <div class="nx" id="nx12" data-anim>
      <div class="nx-src"><b>Part One</b><span>Institutions derived in twelve steps</span></div>
      <div class="nx-list" id="nx12-l"></div>
    </div>
    <p class="nx-msg" id="nx12-msg" aria-live="polite"></p>
  </div>
</figure>
<style>
.nx{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.nx-src{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 10px;text-align:center}
.nx-src b{display:block;font-size:16px} .nx-src span{font-size:12px;opacity:.75}
.nx-list{display:grid;gap:6px}
.nx-i{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--quote);border:1px solid transparent;border-radius:9px;padding:9px 12px;color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.3s)}
.nx.in .nx-i{opacity:1;transform:none}
.nx-i span{font-size:13.5px} .nx-i em{font-style:normal;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nx-i.sel{border-color:var(--accent)}
.nx-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.nx{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const Q=[['The cost of delegation','Part Two','The assumption: research, monitoring and execution all depend on people\'s time and attention, so ordinary people can only hand their money to a small number of professional institutions and pay for it.'],
    ['The cost of checking','Part Two','The assumption: custody, disclosure and audit all depend on people doing the checking, and seeing clearly what a fiduciary has done is itself expensive labour.'],
    ['The cost of information','Part Two','The assumption: gathering news and analysing fleets take time, and because few people do it, information advantages can exist at all, before competition wears them away.'],
    ['The cost of keeping to plans','Part Two','The assumption: defaults and commitment devices can only be designed around the circumstances of the majority; they cannot be adjusted for each household at any moment, and they can also be used against people.']];
  const l=document.getElementById('nx12-l'),msg=document.getElementById('nx12-msg');
  l.innerHTML=Q.map((q,i)=>`<button type="button" class="nx-i" style="--i:${i}" data-i="${i}"><span>${q[0]}</span><em>→ ${q[1]}</em></button>`).join('');
  const bs=[...l.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));msg.textContent=Q[i][2];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('nx12').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1600+k*1800));});
  set(0);
})();
</script>
