<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Which good becomes money</p><p class="figsub">Three goods on the island can serve as a medium of exchange. The more people accept a good, the more easily it changes hands, so more people accept it. Switch the initial beliefs and see which becomes money in the end.</p></div><button class="replay" type="button" data-replay="em">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Initial beliefs">
      <button type="button" data-em="0" aria-pressed="true">All three about equal at first</button>
      <button type="button" data-em="1" aria-pressed="false">More accept salt at first</button>
      <button type="button" data-em="2" aria-pressed="false">More accept grain at first</button>
    </div>
    <div class="em" id="em" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="Share of people accepting each of three goods"><g id="em-ax"></g><g id="em-l"></g></svg>
      <div class="legend" id="em-lg"></div>
      <p class="em-msg" id="em-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: in each round, people adjust what they are willing to accept according to the share of others who accept it and how well the good keeps. Shells keep well, divide easily and are hard to counterfeit; salt keeps but can get damp; grain rots.</figcaption>
</figure>
<style>
.em svg{width:100%;height:auto;display:block}
.em-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.em svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),G=[['Shells',1.0,'var(--accent)'],['Salt',.95,'var(--gold)'],['Grain',.8,'var(--warm)']];
  const S0=[[.32,.34,.34],[.22,.56,.22],[.2,.2,.6]],X0=40,X1=630,YT=12,YB=180,T=30,x=t=>X0+t/T*(X1-X0),y=v=>YB-v*(YB-YT);
  $('em-lg').innerHTML=G.map(g=>`<span><i style="background:${g[2]}"></i>${g[0]}</span>`).join('');
  $('em-ax').innerHTML=[0,.5,1].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+[0,10,20,30].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="${t===30?'end':'middle'}" font-size="11" class="t-faint">Round ${t}</text>`).join('');
  function run(k){let s=S0[k].slice();const P=[s.slice()];for(let t=0;t<T;t++){const w=s.map((v,i)=>Math.pow(v,1.6)*G[i][1]);const z=w.reduce((a,b)=>a+b,0);s=s.map((v,i)=>.6*v+.4*w[i]/z);P.push(s.slice());}return P;}
  function set(k){document.querySelectorAll('[data-em]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.em===k)));const P=run(k);
    $('em-l').innerHTML=G.map((g,i)=>`<path d="${P.map((s,t)=>(t?'L':'M')+x(t).toFixed(1)+','+y(s[i]).toFixed(1)).join('')}" fill="none" stroke="${g[2]}" stroke-width="2.5"/>`).join('');
    const end=P[T],w=end.indexOf(Math.max(...end)),lc=s=>s.toLowerCase();
    $('em-msg').textContent=k===0?`When the three start out about equal, the most durable good, ${lc(G[w][0])}, gradually wins out: the properties of the good itself made the difference.`:`At first more people accept ${lc(G[k][0])}, and the winner in the end is ${lc(G[w][0])}: ${w===k?'belief got there first, even though it is not the most durable good.':'the properties of the good itself outweighed the initial beliefs.'}`;}
  document.querySelectorAll('[data-em]').forEach(b=>b.addEventListener('click',()=>set(+b.dataset.em)));
  $('em').addEventListener('anim-in',()=>{[0,1,2].forEach((k,i)=>setTimeout(()=>set(k),300+i*2400));});
  set(0);
})();
</script>
