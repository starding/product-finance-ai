<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Disclosure keeps the good ones</p><p class="figsub">Again twenty managers, 35% of them unreliable at the start. Once managers must disclose their holdings, risks and fees, principals can tell good from bad with some confidence and pay only for the value they can see. Drag how well disclosure lets principals tell them apart to see how many reliable managers remain after six rounds.</p></div><button class="replay" type="button" data-replay="ds">Replay</button></div>
    <div class="ds" id="ds" data-anim></div>
    <div class="sl"><label for="ds-d">How well principals can tell <b id="ds-dv"></b></label><input id="ds-d" type="range" min="0" max="100" step="10" value="0"></div>
    <p class="ds-msg" id="ds-msg" aria-live="polite"></p>
  </div>
  <figcaption>Illustrative: when they can tell, principals pay reliable managers 10 portions and unreliable ones 4; when they cannot, they pay the average; a reliable manager's actual pay is the two weighted by how well principals can tell, and when it falls below 8 portions, half of them leave. The rules are the same as in the previous figure, with disclosure added.</figcaption>
</figure>
<style>
.ds{display:grid;gap:6px}
.ds-r{display:grid;grid-template-columns:4.2em 1fr 7em;gap:10px;align-items:center;font-size:12.5px}
.ds-r div{display:flex;flex-wrap:wrap;gap:3px}
.ds-r i{width:12px;height:12px;border-radius:3px}
.ds-r b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.ds-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id);
  function draw(){const d=+$('ds-d').value/100;let G=13,B=7;const rows=[];
    for(let k=0;k<6;k++){const avg=G+B?(10*G+4*B)/(G+B):0,pay=d*10+(1-d)*avg;rows.push([G,B,pay]);if(pay<8)G=Math.floor(G/2);if(d>0)B=Math.round(B*(1-d*.5));}
    $('ds').innerHTML=rows.map(([g,b,p],k)=>`<div class="ds-r"><span>Round ${k+1}</span><div>${'<i style="background:var(--accent)"></i>'.repeat(g)}${'<i style="background:var(--warm)"></i>'.repeat(b)}</div><b>Reliable get ${p.toFixed(1)}</b></div>`).join('');
    $('ds-dv').textContent=Math.round(d*100)+'%';const l=rows[5];
    $('ds-msg').textContent=d===0?'Without disclosure, principals can only pay the average, and reliable managers leave round after round.':l[0]>=13?`Disclosure lets principals tell good from bad ${Math.round(d*100)}% of the way: reliable managers are paid for their value and all stay; unreliable managers find no mandates and gradually leave.`:`Disclosure does not go far enough; reliable managers are still leaving, and ${l[0]} ${l[0]===1?'remains':'remain'} after six rounds.`;}
  $('ds-d').addEventListener('input',draw);
  $('ds').addEventListener('anim-in',()=>{let v=0;$('ds-d').value=0;draw();const id=setInterval(()=>{v+=10;$('ds-d').value=v;draw();if(v>=80)clearInterval(id);},350);});
  draw();
})();
</script>
