<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: finance in a world of one person</p><p class="figsub">Four conclusions, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g01summary">Replay</button></div>
    <div class="g01summary" id="g01summary" data-anim><div class="g01summary-c" style="--i:0"><em>The need to save</em><b>First ask when the user will need the money</b><p>Income and consumption not happening at the same time is the first need every financial product serves.</p></div><div class="g01summary-c" style="--i:1"><em>Store of value</em><b>Not losing value is itself valuable</b><p>A means of storage that does not lose value already makes people better off, even if it earns nothing.</p></div><div class="g01summary-c warn" style="--i:2"><em>Where returns come from</em><b>Positive returns originally come from production</b><p>The return on seed comes from the extra grain the land grows, not from anyone's promise.</p></div><div class="g01summary-c warn" style="--i:3"><em>The limit of one person</em><b>Spanning decades requires other people</b><p>Storage spoils and there is no harvest in old age: one person alone cannot save across a lifetime.</p></div></div>
