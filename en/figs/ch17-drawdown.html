<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Tolerance on paper and tolerance in a decline</p><p class="figsub">A portfolio first falls by about half, then takes several years to recover and reach a new high. Drag the "decline actually tolerable": once the fall exceeds it, the investor sells and holds cash. See how far the final result falls short of holding to the end.</p></div><button class="replay" type="button" data-replay="dd">Replay</button></div>
    <div class="dd" id="dd" data-anim>
      <svg viewBox="0 0 640 230" role="img" aria-label="Decline and recovery path"><g id="dd-ax"></g><path id="dd-p" class="dd-l"/><path id="dd-c" class="dd-c"/><line id="dd-th" class="dd-th"/><text id="dd-tt" font-size="11" class="t-warm"></text><circle id="dd-s" r="6" fill="var(--warm)"/></svg>
      <div class="sl"><label for="dd-r">Decline actually tolerable <b id="dd-rv"></b></label><input id="dd-r" type="range" min="10" max="60" step="5" value="25"></div>
      <div class="dd-out"><div><span>Held to the end</span><b id="dd-h"></b></div><div><span>By actual tolerance</span><b id="dd-a"></b></div></div>
      <p class="dd-msg" id="dd-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative path, shaped like a severe bear market and its recovery, not any specific index; simplified so that the investor does not buy back after selling. On individual investors' perceptions and trading during a crisis, see Hoffmann, Post and Pennings (2013).</figcaption>
</figure>
<style>
.dd svg{width:100%;height:auto;display:block}
.dd-l{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:1500;stroke-dashoffset:1500;transition:stroke-dashoffset 2s ease}
.dd.in .dd-l{stroke-dashoffset:0}
.dd-c{fill:none;stroke:var(--warm);stroke-width:2.5;stroke-dasharray:5 4}
.dd-th{stroke:var(--warm);stroke-dasharray:3 3;opacity:.6}
.dd-out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dd-out div{background:var(--quote);border-radius:8px;padding:8px 12px}
.dd-out span{display:block;font-size:12px;color:var(--faint)} .dd-out b{font-size:19px;font-variant-numeric:tabular-nums}
.dd-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.dd svg text{font-size:18px}}
</style>
<script>
(function(){
  const K=[[0,100],[6,106],[12,88],[17,70],[22,58],[26,52],[30,60],[36,72],[44,82],[52,95],[60,108],[72,128]];
  const v=t=>{for(let i=1;i<K.length;i++)if(t<=K[i][0]){const [a,va]=K[i-1],[b,vb]=K[i];return va+(vb-va)*(t-a)/(b-a);}return K[K.length-1][1];};
  const X0=50,X1=620,YT=12,YB=200,x=t=>X0+t/72*(X1-X0),y=p=>YB-(p-40)/(140-40)*(YB-YT);
  const $=id=>document.getElementById(id);
  let a=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`;
  [40,70,100,130].forEach(p=>a+=`<text x="${X0-6}" y="${y(p)+4}" text-anchor="end" font-size="11" class="t-faint">${p}</text>`);
  [0,1,2,3,4,5,6].forEach(k=>a+=`<text x="${x(k*12)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${k?'Year '+k:'Start'}</text>`);
  $('dd-ax').innerHTML=a;
  let d='';for(let t=0;t<=72;t+=.5)d+=(t?'L':'M')+x(t).toFixed(1)+','+y(v(t)).toFixed(1);$('dd-p').setAttribute('d',d);
  const sl=$('dd-r');
  function r(){const tol=+sl.value/100;let pk=0,ts=null;for(let t=0;t<=72;t+=.5){pk=Math.max(pk,v(t));if(v(t)<=pk*(1-tol)){ts=t;break;}}
    $('dd-rv').textContent=sl.value+'%';$('dd-h').textContent=v(72).toFixed(0);
    const th=106*(1-tol);$('dd-th').setAttribute('x1',X0);$('dd-th').setAttribute('x2',X1);$('dd-th').setAttribute('y1',y(th));$('dd-th').setAttribute('y2',y(th));
    $('dd-tt').setAttribute('x',X1);$('dd-tt').setAttribute('text-anchor','end');$('dd-tt').setAttribute('y',y(th)-5);$('dd-tt').textContent=th>=40?'Tolerance line':'';
    if(ts===null){$('dd-s').setAttribute('opacity',0);$('dd-c').setAttribute('d','');$('dd-a').textContent=v(72).toFixed(0);
      $('dd-msg').textContent='Actual tolerance exceeded the size of this decline; the investor held on through the recovery, and the result is the same as holding to the end.';return;}
    const sv=v(ts);$('dd-s').setAttribute('opacity',1);$('dd-s').setAttribute('cx',x(ts));$('dd-s').setAttribute('cy',y(sv));
    $('dd-c').setAttribute('d',`M${x(ts)},${y(sv)}L${X1},${y(sv)}`);$('dd-a').textContent=sv.toFixed(0);
    $('dd-msg').textContent=`Selling once the decline reached ${sl.value}% turned a paper loss into a realized one and missed the entire recovery: the final value is ${sv.toFixed(0)}, against ${v(72).toFixed(0)} for holding to the end.${+sl.value<=30?' If the tolerance written in the plan is higher than the real one, the gap is paid at the worst possible moment.':''}`;}
  sl.addEventListener('input',r);
  $('dd').addEventListener('anim-in',()=>{sl.value=60;r();setTimeout(()=>{let k=60;const id=setInterval(()=>{k-=5;sl.value=k;r();if(k<=25)clearInterval(id);},300);},2000);});
  r();
})();
</script>
