<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: information in prices</p><p class="figsub">Four conclusions, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g09summary">Replay</button></div>
    <div class="g09summary" id="g09summary" data-anim><div class="g09summary-c" style="--i:0"><em>Pooling</em><b>Prices pool scattered information</b><p>Each person knows only a little, but the price combines everyone; many people's errors cancel out.</p></div><div class="g09summary-c" style="--i:1"><em>Hard to predict</em><b>What can be foreseen is already in the price</b><p>Price changes come only from new news; once a pattern is exploited, the exploitation makes it disappear.</p></div><div class="g09summary-c warn" style="--i:2"><em>Cost</em><b>The informed make everyone pay a spread</b><p>What the market maker loses to the informed, he must recover from the uninformed.</p></div><div class="g09summary-c warn" style="--i:3"><em>Zero-sum</em><b>After costs, information advantage is negative overall</b><p>What the informed earn is what frequent traders lose; holding everything passively stays out of the guessing game.</p></div></div>
  </div>
