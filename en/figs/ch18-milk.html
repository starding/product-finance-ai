<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Build a reputation first, then cash it in</p><p class="figsub">An unreliable trustee performs well for the first 15 periods. The principal's belief rises, and so does the amount entrusted to it; in period 16 a large one-off opportunity appears. Switch whether the principal has a limit that matches the stakes.</p></div><button class="replay" type="button" data-replay="mk">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Limit">
      <button type="button" data-mk="0" aria-pressed="true">Amount grows with belief</button>
      <button type="button" data-mk="1" aria-pressed="false">Cap on single exposure</button>
    </div>
    <div class="mk" id="mk" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="Belief, exposure and loss"><g id="mk-g"></g></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Principal's belief</span><span><i style="background:var(--blue)"></i>Amount entrusted</span><span><i style="background:var(--warm)"></i>Loss</span></div>
      <p class="mk-msg" id="mk-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative. On reputations built and exploited strategically, see Kreps and Wilson (1982) and Milgrom and Roberts (1982).</figcaption>
</figure>
<style>
.mk svg{width:100%;height:auto;display:block}
.mk-b{transition:height .5s ease,y .5s ease}
.mk-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.mk svg text{font-size:18px}}
</style>
<script>
(function(){
  const N=18,X0=40,X1=620,YT=14,YB=176,w=(X1-X0)/N,x=i=>X0+i*w;
  const bel=[];let L=Math.log(.3/.7);for(let i=0;i<N;i++){bel.push(1/(1+Math.exp(-L)));L+=Math.log(.97/.8);}
  function set(k){document.querySelectorAll('[data-mk]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mk===k)));
    const cap=k==='1';let g=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`,line='';
    bel.forEach((b,i)=>{const amt=cap?Math.min(b,.35):b,h=amt*(YB-YT)*.9,loss=i===15?h:0;
      g+=`<rect class="mk-b" x="${x(i)+w*.2}" width="${w*.6}" y="${YB-h}" height="${h}" rx="2" fill="${i===15?'var(--warm)':'var(--blue)'}" opacity="${i>15?.25:i===15?1:.6}"/>`;
      line+=(i?'L':'M')+(x(i)+w/2).toFixed(1)+','+(YB-b*(YB-YT)).toFixed(1);
      if(i%3===0)g+=`<text x="${x(i)+w/2}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${i+1}</text>`;});
    g+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><text x="${x(15)+w/2}" y="${YT+10}" text-anchor="middle" font-size="11" class="t-warm">Cash-in</text>`;
    document.getElementById('mk-g').innerHTML=g;
    document.getElementById('mk-msg').textContent=cap?'With a cap on single exposure, however high the belief, no more than the cap is handed over at once. When the trustee cashes in its reputation, the loss is held within the cap, and doing so no longer pays for the trustee.':'Belief rises with the good record, and the amount handed over rises with it. In period 16 the trustee seizes a large one-off opportunity to cash in its reputation, and the loss is as large as the trust built up before. A good record cannot replace a limit.';}
  document.querySelectorAll('[data-mk]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.mk)));
  document.getElementById('mk').addEventListener('anim-in',()=>{set('0');setTimeout(()=>set('1'),2800);});
  set('0');
})();
</script>
