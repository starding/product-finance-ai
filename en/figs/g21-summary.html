    <div class="g21summary" id="g21summary" data-anim><div class="g21summary-c" style="--i:0"><em>Incomplete contracts</em><b>Uncovered cases need an owner</b><p>Settle in advance who holds the residual right to decide: reversible matters are handled in the spirit of the agreement; irreversible ones wait for his return.</p></div><div class="g21summary-c" style="--i:1"><em>The agreement</em><b>Goals, boundaries, rules, exceptions and term</b><p>Most everyday matters need no request, and final control is kept.</p></div><div class="g21summary-c warn" style="--i:2"><em>Rerun: least privilege</em><b>Four levels by size and reversibility</b><p>Act on its own; act, then tell; confirm first; forbidden. The boundaries shift as trust grows.</p></div><div class="g21summary-c warn" style="--i:3"><em>Formal and real authority</em><b>Write "when to come back and ask" into the agreement</b><p>Quantitative, event and time triggers keep the real decision from passing away unnoticed.</p></div></div>
