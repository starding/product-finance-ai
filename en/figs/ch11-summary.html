<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: explain the trading rules clearly</p><p class="figsub">Four design requirements, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="s06">Replay</button></div>
    <div class="s06" id="s06" data-anim>
      <div class="s06-c" style="--i:0"><em>Order types are trade-offs between risks</em><b>At order entry, explain "may not be filled" and "may be filled badly"</b><p>Especially for stop orders: explain that once triggered they become market orders, and that in a gap the fill price may be far from the set price.</p></div>
      <div class="s06-c" style="--i:1"><em>Call auctions and continuous trading follow different rules</em><b>Explain the rules by trading session</b><p>How orders are matched during the opening and closing auctions, and whether they can be cancelled, should be explained right on the order screen.</p></div>
      <div class="s06-c warn" style="--i:2"><em>Circuit breakers and price limits</em><b>Warn that trading may be temporarily impossible</b><p>Near a price limit or during a halt, state clearly the order's status and how trading will resume, so users do not mistake it for a system failure.</p></div>
      <div class="s06-c" style="--i:3"><em>Orders can be sent to different venues</em><b>Disclose order routing and conflicts of interest</b><p>Explain where the order was sent, how the fill price compares with the best price in the market, and whether there is payment for order flow.</p></div>
    </div>
  </div>
