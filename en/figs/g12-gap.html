<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chasing gains and selling into losses: the principal gets less than the ship shares</p><p class="figsub">The price of ship shares fluctuates around a long-run trend of 6% a year. A principal intends to invest 10 portions each year; when chasing gains and selling into losses, the principal invests more after a strong year and less, or even sells, after a fall. Drag how strongly the principal chases, and compare three returns.</p></div><button class="replay" type="button" data-replay="gp12">Replay</button></div>
    <div class="gp12" id="gp12" data-anim>
      <svg viewBox="0 0 660 240" role="img" aria-label="Ship share price and yearly investment"><g id="gp12-g"></g></svg>
      <div class="legend"><span><i style="background:var(--ink)"></i>Ship share price</span><span><i style="background:var(--accent)"></i>Invested that year</span><span><i style="background:var(--warm)"></i>Sold that year</span></div>
      <div class="sl"><label for="gp12-k">How strongly the principal chases <b id="gp12-kv"></b></label><input id="gp12-k" type="range" min="0" max="2" step="0.25" value="1"></div>
      <div class="gp12-out" id="gp12-out"></div>
      <p class="gp12-msg" id="gp12-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: price = long-run trend × (1 + 0.3 × cyclical swing), with an eight-year cycle. "The ship shares themselves" is the annualized buy-and-hold return; the principal's return is calculated from the timing of money flowing in and out (internal rate of return), which is what Dichev (2007) calls the return that takes the timing of flows into account. The difference between regular scheduled investment and the ship shares themselves comes only from when money goes in, not from any judgement.</figcaption>
</figure>
<style>
.gp12 svg{width:100%;height:auto;display:block}
.gp12-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.gp12-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.gp12-out span{display:block;font-size:11.5px;color:var(--faint)} .gp12-out b{font-size:18px;font-variant-numeric:tabular-nums}
.gp12-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.gp12-out{grid-template-columns:1fr}.gp12 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('gp12'+id),T=20,X0=44,X1=628,x=t=>X0+t/T*(X1-X0);
  const P=[1];for(let t=1;t<=T;t++)P.push(Math.pow(1.06,t)*(1+.3*Math.sin(2*Math.PI*t/8)));const r=P.slice(1).map((v,t)=>v/P[t]-1);
  function irr(f,end){let lo=-.5,hi=.5;for(let k=0;k<80;k++){const m=(lo+hi)/2;let v=0;f.forEach((c,t)=>v+=c*Math.pow(1+m,T-t));if(v>end)hi=m;else lo=m;}return (lo+hi)/2;}
  function run(k){let H=0;const f=[];for(let t=0;t<T;t++){let c=10*(1+k*4*(t?r[t-1]-.06:0));if(c<-H)c=-H;f.push(c);H=(H+c)*(1+r[t]);}return {f,irr:irr(f,H)};}
  const prod=Math.pow(P[T],1/T)-1,dca=run(0).irr;
  function draw(){const k=+$('-k').value,R=run(k);$('-kv').textContent=k===0?'Not at all (regular scheduled investment)':k<=.75?'Mildly':k<=1.25?'Moderately':'Heavily';
    const yp=v=>130-(v-.8)/(4-.8)*120,yf=c=>200-c*1.1;
    let h=[1,2,3,4].map(v=>`<line x1="${X0}" x2="${X1}" y1="${yp(v)}" y2="${yp(v)}" class="s-line"/><text x="${X0-6}" y="${yp(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')
      +`<line x1="${X0}" x2="${X1}" y1="200" y2="200" class="s-line"/>`+[0,5,10,15,20].map(t=>`<text x="${x(t)}" y="236" text-anchor="middle" font-size="11" class="t-faint">Year ${t}</text>`).join('');
    h+=`<path d="${P.map((v,t)=>(t?'L':'M')+x(t).toFixed(1)+','+yp(v).toFixed(1)).join('')}" fill="none" stroke="var(--ink)" stroke-width="2.2"/>`;
    const bw=(X1-X0)/T*.6;R.f.forEach((c,t)=>{const cx=x(t)+bw*.3;h+=c>=0?`<rect x="${cx}" y="${yf(c)}" width="${bw}" height="${200-yf(c)}" fill="var(--accent)"/>`:`<rect x="${cx}" y="200" width="${bw}" height="${yf(c)-200}" fill="var(--warm)"/>`;});
    $('-g').innerHTML=h;const pc=v=>(v*100).toFixed(1)+'%';
    $('-out').innerHTML=[['The ship shares themselves (buy and hold)',pc(prod)],['Principal investing on schedule',pc(dca)],['What this principal actually gets',pc(R.irr)]].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
    $('-msg').textContent=k===0?'Investing 10 portions on schedule every year, ignoring last year\'s rise or fall: the return received is almost the same as that of the ship shares themselves.':`After a strong year the principal invests more, often buying near the top of the cycle; after a fall the principal invests less or sells, selling near the bottom. This principal gets ${((dca-R.irr)*100).toFixed(1)} percentage points a year less than investing on schedule, which adds up to a sizeable gap over twenty years.`;}
  $('-k').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{let v=0;$('-k').value=0;draw();const id=setInterval(()=>{v+=.25;$('-k').value=v;draw();if(v>=1.5)clearInterval(id);},500);});
  draw();
})();
</script>
