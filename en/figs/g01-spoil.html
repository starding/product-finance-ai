<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">The return on storage is negative</p><p class="figsub">Drag the monthly loss rate. The bars show the best way to eat at that rate: more just after the harvest and less as time goes on. The dashed line shows eating the same amount every month.</p></div><button class="replay" type="button" data-replay="sp">Replay</button></div>
    <div class="sp" id="sp" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="Monthly consumption with storage losses"><g id="sp-ax"></g><g id="sp-b"></g><path id="sp-e" class="sp-e"/></svg>
      <div class="sl"><label for="sp-d">Monthly loss <b id="sp-dv"></b></label><input id="sp-d" type="range" min="0" max="6" step="0.5" value="0"></div>
      <div class="sp-out"><div><span>Lost over the year</span><b id="sp-lost"></b></div><div><span>First month / last month</span><b id="sp-fl"></b></div></div>
      <p class="sp-msg" id="sp-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: 12 portions of grain, with satisfaction measured as a logarithm. The best way to eat satisfies the condition "the satisfaction of one more mouthful this month equals the satisfaction of that mouthful kept until next month, net of losses", so monthly consumption falls by a factor of (1 − loss): 1 portion in the first month, a little less each month after.</figcaption>
</figure>
<style>
.sp svg{width:100%;height:auto;display:block}
.sp-e{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 4}
.sp-b rect{transition:height .4s,y .4s}
.sp-out{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px}
.sp-out div{display:flex;flex-direction:column} .sp-out span{font-size:12px;color:var(--faint)} .sp-out b{font-size:20px;font-variant-numeric:tabular-nums}
.sp-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.sp svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=40,X1=630,YB=180,YT=12,W=(X1-X0)/12,y=v=>YB-v/1.8*(YB-YT);
  $('sp-ax').innerHTML=[0,.5,1,1.5].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+
    Array.from({length:12},(_,i)=>`<text x="${X0+W*i+W/2}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${i+1}</text>`).join('');
  $('sp-b').innerHTML=Array.from({length:12},(_,i)=>`<rect x="${X0+W*i+W*.18}" width="${W*.64}" y="${YB}" height="0" rx="2" fill="var(--accent)"/>`).join('');
  const rs=[...document.querySelectorAll('#sp-b rect')],sl=$('sp-d');
  function draw(){const d=+sl.value/100,k=1-d;const c=Array.from({length:12},(_,t)=>Math.pow(k,t)),eaten=c.reduce((a,b)=>a+b,0);
    let Se=0;for(let t=0;t<12;t++)Se+=Math.pow(k,-t);const ce=12/Se;
    rs.forEach((r,i)=>{r.setAttribute('y',y(c[i]));r.setAttribute('height',YB-y(c[i]));});
    $('sp-e').setAttribute('d',`M${X0},${y(ce)}L${X1},${y(ce)}`);
    $('sp-dv').textContent=(d*100).toFixed(1)+'%';$('sp-lost').textContent=(12-eaten).toFixed(1)+' portions';$('sp-fl').textContent=c[0].toFixed(2)+' / '+c[11].toFixed(2);
    $('sp-msg').textContent=d===0?'With no losses, the best way to eat is 1 portion a month, which coincides with the dashed line.':`With a monthly loss of ${(d*100).toFixed(1)}%, the return on storage is −${(d*100).toFixed(1)}%. Eating more just after the harvest and less as time goes on is the better choice; even so, ${(12-eaten).toFixed(1)} portions of grain are simply lost. Eating the same amount every month allows only ${ce.toFixed(2)} portions a month.`;}
  sl.addEventListener('input',draw);
  $('sp').addEventListener('anim-in',()=>{let v=0;sl.value=0;draw();const id=setInterval(()=>{v+=.5;sl.value=v;draw();if(v>=4)clearInterval(id);},300);});
  draw();
})();
</script>
