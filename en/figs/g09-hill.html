<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">The man on the hill sees the ship first</p><p class="figsub">On day 2 the man on the hill sees the ship return safely, and the shares' value rises from 10 portions to 12; the news reaches the whole village only on day 8. Drag how hard he buys to see how much the price has risen before the news is public, and how much he earns.</p></div><button class="replay" type="button" data-replay="hl">Replay</button></div>
    <div class="hl" id="hl" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="Value and price"><g id="hl-ax"></g><path id="hl-g" class="hl-g"/><path id="hl-v" class="hl-v"/><path id="hl-p" class="hl-p"/></svg>
      <div class="legend"><span><i style="background:var(--faint)"></i>True value of the shares</span><span><i style="background:var(--accent)"></i>Price in the market square</span><span><i style="background:var(--gold);opacity:.5"></i>The difference he earns</span></div>
      <div class="sl"><label for="hl-k">How hard he buys <b id="hl-kv"></b></label><input id="hl-k" type="range" min="0" max="100" step="10" value="40"></div>
      <p class="hl-msg" id="hl-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: seeing steady buy orders, the market maker raises his quote, each day moving the price part of the way towards the true value; the share of the gap closed each day rises with how hard he buys.</figcaption>
</figure>
<style>
.hl svg{width:100%;height:auto;display:block}
.hl-v{fill:none;stroke:var(--faint);stroke-width:2;stroke-dasharray:5 4}
.hl-p{fill:none;stroke:var(--accent);stroke-width:2.6}
.hl-g{fill:var(--gold);fill-opacity:.25;stroke:none}
.hl-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.hl svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=46,X1=630,YT=12,YB=178,x=t=>X0+t/10*(X1-X0),y=v=>YB-(v-9)/4*(YB-YT);
  $('hl-ax').innerHTML=[9,10,11,12,13].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+[0,2,4,6,8,10].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Day ${t}</text>`).join('')+
    `<text x="${x(2)}" y="${YT+10}" text-anchor="middle" font-size="11" class="t-warm">He sees the ship</text><text x="${x(8)}" y="${YT+10}" text-anchor="middle" font-size="11" class="t-muted">Everyone knows</text>`;
  $('hl-v').setAttribute('d',`M${x(0)},${y(10)}L${x(2)},${y(10)}L${x(2)},${y(12)}L${x(10)},${y(12)}`);
  function draw(){const k=+$('hl-k').value/100,P=[];let p=10;for(let t=0;t<=10;t++){if(t>2&&t<=8)p+=(12-p)*k*.45;if(t>8)p=12;P.push(p);}
    $('hl-p').setAttribute('d',P.map((v,t)=>(t?'L':'M')+x(t).toFixed(1)+','+y(v).toFixed(1)).join(''));
    let g=`M${x(2)},${y(12)}`;for(let t=2;t<=8;t++)g+=`L${x(t)},${y(P[t])}`;g+=`L${x(8)},${y(12)}Z`;$('hl-g').setAttribute('d',g);
    const pre=(P[8]-10)/2,gain=k>0?(12-(P.slice(2,9).reduce((a,b)=>a+b,0)/7))*k*10:0;$('hl-kv').textContent=Math.round(k*100)+'%';
    $('hl-msg').textContent=k===0?'He holds back: the price does not move before the news is public, then jumps to 12 portions on day 8.':`He buys ${k>.6?'aggressively':'at a steady pace'}, and before the news is public the price has already covered ${Math.round(pre*100)}% of the rise. The harder he buys, the faster the price rises and the smaller the difference left for him: his buying itself passes the news on to the price.`;}
  $('hl-k').addEventListener('input',draw);
  $('hl').addEventListener('anim-in',()=>{let v=0;$('hl-k').value=0;draw();const id=setInterval(()=>{v+=10;$('hl-k').value=v;draw();if(v>=100)clearInterval(id);},250);});
  draw();
})();
</script>
