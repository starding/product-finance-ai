<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Civilization Simulator · Chapter 8: the market at the edge of the village</p><p class="figsub">Forty households hold ship shares; each year some urgently need grain and must sell, and some have grain to spare and want to buy. The three lines show the average price received by those in a hurry to sell under each household searching on its own, a regular market day, and a market day plus a market maker; select one for details.</p></div><button class="replay" type="button" data-replay="cs8">Replay</button></div>
    <div class="cs-rules"><span class="on">Commitment</span><span class="on">Money</span><span class="on">Insurance</span><span class="on">Bank</span><span class="on">Shares</span><span class="on">Market</span><span class="lock">Information in prices · Ch. 9</span></div>
    <div class="seg-btns" role="group" aria-label="How to sell">
      <button type="button" data-cs8="self" aria-pressed="false">Search alone</button>
      <button type="button" data-cs8="fair" aria-pressed="false">Market day</button>
      <button type="button" data-cs8="mm" aria-pressed="true">Market day + market maker</button>
    </div>
    <div class="cs8" id="cs8" data-anim>
      <svg viewBox="0 0 660 210" role="img" aria-label="Average price received by urgent sellers over twenty years"><g id="cs8-ax"></g><g id="cs8-l"></g></svg>
      <div class="legend"><span><i style="background:var(--faint)"></i>Search alone</span><span><i style="background:var(--blue)"></i>Market day</span><span><i style="background:var(--accent)"></i>Market day + market maker</span></div>
      <div class="cs8-ctl">
        <div class="sl"><label for="cs8-b">Households with grain to spare who want to buy <b id="cs8-bv"></b></label><input id="cs8-b" type="range" min="5" max="60" step="5" value="25"></div>
        <button type="button" class="replay" id="cs8-re">Another run of years</button>
      </div>
      <div class="cs8-out" id="cs8-out"></div>
      <p class="cs8-msg" id="cs8-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative model: each ship share is worth 10 portions on its prospects. Each year about 15% of households urgently need grain and must sell; they can wait at most five days, and if no buyer comes they dump the share for 5 portions. Searching alone: the seller asks three households a day; each household met has an even chance of being interested in the ship and offers between 6 and 12 portions. Market day: held every five days, with everyone who wants to sell or buy taking part in a call auction; buyers will pay 8 to 12 portions, and when buyers are too few, the extra sellers must dump their shares. Market maker: buys at any time at the value on prospects minus half the spread, and the more trades, the narrower the spread; when sellers outnumber buyers, the shares he holds are hard to pass on, and he lowers his bid further.</figcaption>
</figure>
<style>
.cs8 svg{width:100%;height:auto;display:block}
.cs8-ctl{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-top:8px}
.cs8-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cs8-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.cs8-out span{display:block;font-size:11.5px;color:var(--faint)} .cs8-out b{font-size:18px;font-variant-numeric:tabular-nums}
.cs8-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.cs8-ctl{grid-template-columns:1fr}.cs8-out{grid-template-columns:1fr}.cs8 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cs8'+id),N=40,Y=20,FAIR=10,DUMP=5,DL=5;let mode='mm',seed=808;
  const X0=40,X1=650,YT=10,YB=180,x=t=>X0+(t+.5)/Y*(X1-X0),y=v=>YB-(v-4)/7*(YB-YT);
  function rng(){let s=seed;return ()=>{s=(s*16807)%2147483647;return s/2147483647;};}
  const Emax=(v,a,b)=>v<=a?(a+b)/2:v>=b?v:((b*b-v*v)/2+v*(v-a))/(b-a);
  function sim(bshare){const r=rng(),out={self:[],fair:[],mm:[]},wait={self:0,fair:0,mm:0},dumped={self:0,fair:0,mm:0};let tot=0;
    for(let t=0;t<Y;t++){let U=0,Bn=0;for(let i=0;i<N;i++){if(r()<.15)U++;else if(r()<bshare)Bn++;}U=Math.max(U,1);tot+=U;
      // searching alone: ask three households a day; q is the chance each one is an interested buyer
      const q=(Bn/N)*.5,pd=1-Math.pow(1-q,3),V=[DUMP];for(let k=1;k<=DL;k++)V.push(pd*Emax(V[k-1],6,12)+(1-pd)*V[k-1]);
      let s=0;for(let i=0;i<U;i++){let sold=false;for(let d=DL;d>=1;d--){if(r()<pd){const o=6+6*r();if(o>=V[d-1]){s+=o;wait.self+=DL-d+1;sold=true;break;}}}if(!sold){s+=DUMP;dumped.self++;wait.self+=DL;}}
      out.self.push(s/U);
      // market day: call auction; the single price is the bid of the last buyer to trade
      const vals=Array.from({length:Bn},()=>8+4*r()).sort((a,b)=>b-a),qq=Math.min(U,Bn),px=qq?vals[qq-1]:DUMP;
      out.fair.push((qq*px+(U-qq)*DUMP)/U);dumped.fair+=U-qq;wait.fair+=U*2.5;
      // market maker: the spread narrows as the number of trades grows
      const spread=.1+2.4*.2/Math.sqrt(Math.max(1,(U+Bn)/2)),glut=Math.max(0,(U-Bn)/U)*2;out.mm.push(FAIR-spread/2-glut);}
    return {out,wait:{self:wait.self/tot,fair:wait.fair/tot,mm:0},dumped,tot};}
  function draw(){const b=+$('-b').value/100,S=sim(b);$('-bv').textContent=Math.round(b*100)+'%';
    $('-ax').innerHTML=[5,7,9,10,11].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="${v===10?'s-faint':'s-line'}"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+[1,5,10,15,20].map(t=>`<text x="${x(t-1)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Year ${t}</text>`).join('');
    const C={self:'var(--faint)',fair:'var(--blue)',mm:'var(--accent)'};
    $('-l').innerHTML=['self','fair','mm'].map(k=>`<path d="${S.out[k].map((v,t)=>(t?'L':'M')+x(t).toFixed(1)+','+y(v).toFixed(1)).join('')}" fill="none" stroke="${C[k]}" stroke-width="${k===mode?3:1.4}" opacity="${k===mode?1:.5}"/>`).join('');
    const avg=S.out[mode].reduce((a,v)=>a+v,0)/Y;
    $('-out').innerHTML=[['Average received by urgent sellers',avg.toFixed(2)+' portions'],['Average wait',S.wait[mode].toFixed(1)+' days'],['Forced cheap sales',S.dumped[mode]]].map(([a,c])=>`<div><span>${a}</span><b>${c}</b></div>`).join('');
    $('-msg').textContent=mode==='self'?`Searching alone, urgent sellers receive ${avg.toFixed(2)} portions on average, and over twenty years there are ${S.dumped.self} cases of a household finding no buyer and selling cheap. The fewer the would-be buyers, the harder it is to find a counterparty.`:
      mode==='fair'?`A regular market day brings sellers and buyers together, and sellers receive ${avg.toFixed(2)} portions on average; but in years with too few buyers, the extra sellers still have to sell cheap (${S.dumped.fair} cases in all).`:
      `The market maker takes shares at any time: urgent sellers need not wait, none has to dump a share, and they receive ${avg.toFixed(2)} portions on average; the spread they give up is the price of immediacy. The fewer the would-be buyers, the lower the market maker’s bid: he bears the inventory risk others will not.`;}
  document.querySelectorAll('[data-cs8]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.cs8;document.querySelectorAll('[data-cs8]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
  $('-b').addEventListener('input',draw);$('-re').addEventListener('click',()=>{seed=(seed*48271)%2147483647;draw();});
  $('').addEventListener('anim-in',()=>{['self','fair','mm'].forEach((k,i)=>setTimeout(()=>{mode=k;document.querySelectorAll('[data-cs8]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.cs8===k)));draw();},300+i*2400));});
  draw();
})();
</script>
