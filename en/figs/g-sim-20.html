<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Civilization Simulator · Chapter 20: one household's agreement</p><p class="figsub">Set this villager's age, whether his harvest is steady, how strongly he dislikes swings, and how much he can save each year. The scribe gives an allocation and annual deposits for each of the three accounts, and calculates across two thousand runs of years how likely each goal is to be met on time.</p></div><button class="replay" type="button" data-replay="cs20">Replay</button></div>
    <div class="cs-rules"><span class="on">What did not change</span><span class="on">Product: what to promise</span><span class="lock">Mandate and authority · Ch. 21</span></div>
    <div class="cs20" id="cs20" data-anim>
      <div class="cs20-ctl">
        <div class="sl"><label for="cs20-a">Age <b id="cs20-av"></b></label><input id="cs20-a" type="range" min="25" max="55" step="1" value="30"></div>
        <div class="sl"><label for="cs20-g">Aversion to swings <b id="cs20-gv"></b></label><input id="cs20-g" type="range" min="1" max="8" step="0.5" value="3"></div>
        <div class="sl"><label for="cs20-s">Share of income saved each year <b id="cs20-sv"></b></label><input id="cs20-s" type="range" min="5" max="35" step="1" value="20"></div>
      </div>
      <div class="cs-sw"><label><input type="checkbox" id="cs20-v"> He works on the ships, so his harvest moves with the fleet</label></div>
      <div class="cs20-g" id="cs20-res"></div>
      <div class="cs20-doc" id="cs20-doc"></div>
    </div>
  </div>
  <figcaption>Illustrative model: income is 1 a year, and savings equal 1.5 years of income. The emergency account holds half a year's income in the granary. The house account starts with 0.6 years of income and needs 1.2 years of income in five years. The retirement account starts with 0.4 years of income and needs eight years of income at age 60. Ship shares return 6% a year on average with 16% volatility; safe holdings return 2% with 3% volatility. The house account's share in ship shares is the smaller of the Merton ratio and "horizon ÷ 25". The retirement account uses the share obtained after counting future income as wealth, capped at 100%; when the harvest moves with the fleet, it is reduced on the basis that 60% of future income bears ship-share risk. In the first five years, deposits first cover what the house account needs, calculated at 2%, and the rest go to the retirement account; after year five, everything goes to the retirement account. "Met on time" means having at least the required amount when due.</figcaption>
</figure>
<style>
.cs20-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cs20-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cs20-c{background:var(--quote);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55}
.cs20-c em{display:block;font-style:normal;font-size:11.5px;color:var(--faint)}
.cs20-c b{display:block;font-size:22px;margin:2px 0;font-variant-numeric:tabular-nums}
.cs20-c .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.cs20-c .bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
.cs20-doc{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.75;background:var(--bg)}
.cs20-doc p{margin:0 0 4px;font-size:12px;color:var(--faint)}
@media (max-width:640px){.cs20-ctl,.cs20-g{grid-template-columns:1fr;gap:4px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cs20'+id);
  function mc(w,H,init,c,T,c2=c,n=2000){let s=2020+H;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};const g=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());};
    let ok=0;const F=[];for(let k=0;k<n;k++){let v=init;for(let t=0;t<H;t++)v=(v+(t<5?c:c2))*(1+w*(.06+.16*g())+(1-w)*(.02+.03*g()));F.push(v);if(v>=T)ok++;}F.sort((a,b)=>a-b);return {p:ok/n,p10:F[Math.floor(n*.1)]};}
  function draw(){const age=+$('-a').value,gm=+$('-g').value,sv=+$('-s').value/100,vol=$('-v').checked;$('-av').textContent=String(age);$('-gv').textContent=gm.toFixed(1);$('-sv').textContent=Math.round(sv*100)+'%';
    const m=Math.min(1,.04/(gm*.16*.16)),Hr=60-age;let hc=0;for(let t=1;t<=65-age;t++)hc+=1/Math.pow(1.03,t);
    const init=1.5,em=.5,hInit=.6,rInit=init-em-hInit;
    const wH=Math.min(m,5/25),need=Math.max(0,(1.2-hInit*Math.pow(1.02,5))/((Math.pow(1.02,5)-1)/.02*1.02)),cH=Math.min(sv,need),cR=sv-cH;
    const fin=Math.max(.3,rInit+sv*Math.min(10,Hr)),wR=Math.max(0,Math.min(1,(m*(fin+hc)-(vol?.6*hc:0))/fin));
    const A=mc(wH,5,hInit,cH,1.2),B=mc(wR,Hr,rInit,cR,8,sv);
    $('-res').innerHTML=[['Emergency account · ship shares 0%','Available any time','Half a year\'s income set aside in the granary.',null],[`House account · ship shares ${Math.round(wH*100)}%`,(A.p*100).toFixed(0)+'%','Chance of being met on time in five years; in the worst tenth of runs, '+A.p10.toFixed(2)+' years of income when due.',A.p],[`Retirement account · ship shares ${Math.round(wR*100)}%`,(B.p*100).toFixed(0)+'%',`Chance of being met on time in ${Hr} years; in the worst tenth of runs, ${B.p10.toFixed(1)} years of income when due.`,B.p]].map(([e,b,t,p])=>`<div class="cs20-c"><em>${e}</em><b>${b}</b>${t}${p===null?'':`<div class="bar"><i style="width:${p*100}%"></i></div>`}</div>`).join('');
    $('-doc').innerHTML=`<p>Agreement (drafted by the scribe, confirmed by him)</p>Deposit ${Math.round(sv*100)}% of income each year: for the first five years, ${(cH*100).toFixed(1)}% goes to the house account and ${(cR*100).toFixed(1)}% to the retirement account; after the house is built, everything goes to the retirement account${cH<need?' (not enough to cover what the house needs, calculated at 2%; this is stated plainly)':''}. Ship shares are capped at ${Math.round(wH*100)}% in the house account and ${Math.round(wR*100)}% in the retirement account, rebalanced to these limits every year. Total fees do not exceed 0.3% a year. The chance of each account meeting its goal, and its outcome in the worst runs of years, are recalculated every year by the same method and reported. <b>No promise</b> is made about any account's returns or about meeting any goal on time.`;}
  ['-a','-g','-s','-v'].forEach(k=>$(k).addEventListener('input',draw));
  $('').addEventListener('anim-in',()=>{[[30,3,20,0],[30,3,10,0],[30,3,20,1],[45,3,25,0]].forEach(([a,g,s,v],i)=>setTimeout(()=>{$('-a').value=a;$('-g').value=g;$('-s').value=s;$('-v').checked=!!v;draw();},300+i*2400));});
  draw();
})();
</script>
