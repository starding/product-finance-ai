<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Start small, widen level by level</p><p class="figsub">Authority has four levels and is widened by one level each time the agreement has been kept for a period. Switch the type of scribe to see the largest loss it can cause at each level, and how long a scribe intending to cheat must keep the agreement before it gets authority worth cheating with.</p></div><button class="replay" type="button" data-replay="sm24">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Type">
      <button type="button" data-sm24="good" aria-pressed="true">Reliable scribe</button>
      <button type="button" data-sm24="bad" aria-pressed="false">Scribe intending to cheat</button>
    </div>
    <div class="sm24" id="sm24" data-anim>
      <svg viewBox="0 0 660 190" role="img" aria-label="Authority level widening over time"><g id="sm24-g"></g></svg>
      <p class="sm24-msg" id="sm24-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: at Level 1 the scribe can only make scheduled investments, moving at most 2% of household wealth at a time; at Level 2 it can adjust proportions as the agreement provides, up to 5%; at Level 3 it can handle rebalancing after a storm, up to 10%; at Level 4 it handles most matters on its own within the agreement, up to 25%. After a full year of keeping the agreement at one level, authority is widened by one level (starting small, as described by Watson, 1999).</figcaption>
</figure>
<style>
.sm24 svg{width:100%;height:auto;display:block}
.sm24-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.sm24 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('sm24'+id),L=[2,5,10,25],X0=50,X1=628,YB=160,YT=12,x=t=>X0+t/6*(X1-X0),y=v=>YB-v/25*(YB-YT);
  function set(k){document.querySelectorAll('[data-sm24]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sm24===k)));
    let h=[0,5,10,15,20,25].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}%</text>`).join('')+[0,1,2,3,4,5,6].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">Year ${t}</text>`).join('');
    const S=[];for(let t=0;t<6;t++){const lv=k==='bad'?(t<2?t:t===2?2:-1):Math.min(3,t);S.push(lv);}
    S.forEach((lv,t)=>{const v=lv<0?0:L[lv];h+=`<rect x="${x(t)+4}" y="${y(v)}" width="${x(1)-x(0)-8}" height="${YB-y(v)}" fill="${lv<0?'var(--faint)':k==='bad'&&t===2?'var(--warm)':'var(--accent)'}" opacity="${lv<0?.3:1}"/>`;});
    if(k==='bad')h+=`<text x="${x(2)+4}" y="${y(10)-6}" font-size="11" fill="var(--warm)">Cheats in year 3, is caught, loses authority</text>`;
    $('-g').innerHTML=h;
    $('-msg').textContent=k==='good'?'The reliable scribe is widened one level for each year it keeps the agreement. After three years it reaches Level 4 and handles most matters for him; at every level, the largest possible loss matches the confidence he already has.':'The scribe intending to cheat must first do small tasks honestly for two years, and only in the third year does it get authority to move up to 10%. It cheats in the third year, takes at most 10%, and is caught at once and loses its authority. In the first two years its record of keeping the agreement itself benefits him, and the large sum it wanted to steal never reaches its hands.';}
  document.querySelectorAll('[data-sm24]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.sm24)));
  $('').addEventListener('anim-in',()=>{set('good');setTimeout(()=>set('bad'),2600);});
  set('good');
})();
</script>
