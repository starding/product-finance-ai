<figure>
  <div class="card">
    <p class="figtitle">Hedging: a little less on average, in exchange for certainty</p>
    <p class="figsub">An exporter will receive a payment of US$1 million in three months. Simulate 400 possible exchange-rate paths and see the distribution of the income in yuan.</p>
    <div class="seg-btns" role="group" aria-label="Hedge or not">
      <button type="button" data-hg="0" aria-pressed="true">No hedge</button>
      <button type="button" data-hg="1" aria-pressed="false">Sell dollars forward today</button>
    </div>
    <div class="hg" id="hg" data-anim>
      <svg viewBox="0 0 640 200" role="img" aria-label="Distribution of income in yuan">
        <g id="hg-axis"></g>
        <g id="hg-dots"></g>
        <line id="hg-mean" class="hg-mean" y1="20" y2="160"/>
      </svg>
      <div class="hg-out">
        <div><span>Average income</span><b id="hg-m"></b></div>
        <div><span>Worst 5% of cases</span><b id="hg-w"></b></div>
        <div><span>Best minus worst</span><b id="hg-r"></b></div>
      </div>
    </div>
  </div>
  <figcaption>Example parameters: spot rate 7.10 yuan per dollar, three-month exchange-rate volatility about 3%; the forward price is 0.02 below the expected future spot rate, representing the cost of hedging (including the spread the dealer earns). It does not correspond to any real quote.</figcaption>
</figure>
<style>
.hg svg{width:100%;height:auto;display:block}
.hg-dot{fill:var(--blue);opacity:.55;transition:cx .8s ease,cy .8s ease}
.hg-mean{stroke:var(--ink);stroke-width:2}
.hg-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hg-out div{background:var(--quote);border-radius:8px;padding:8px 12px}
.hg-out span{display:block;font-size:12px;color:var(--faint)}
.hg-out b{font-size:19px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.hg-out{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const N=400, S0=7.10, VOL=0.03, F=S0-0.02, X0=40, X1=620, L=650, H=770, x=v=>X0+(v-L)/(H-L)*(X1-X0);
  let seed=3; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const g=()=>{let u=0,v=0;while(!u)u=rnd();v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const rates=Array.from({length:N},()=>S0*Math.exp(VOL*g()-VOL*VOL/2));
  let a=`<line x1="${X0}" y1="160" x2="${X1}" y2="160" class="s-faint"/>`;
  [660,680,700,720,740,760].forEach(v=>a+=`<text x="${x(v)}" y="178" text-anchor="middle" font-size="11" class="t-faint">${(v/100).toFixed(1)}</text>`);
  a+=`<text x="${X1}" y="196" text-anchor="end" font-size="11" class="t-faint">Income in yuan (millions)</text>`;
  document.getElementById('hg-axis').innerHTML=a;
  // Jittered layout: bin by income, then stack vertically
  const dots=document.getElementById('hg-dots');
  dots.innerHTML=rates.map(()=>'<circle class="hg-dot" r="3"/>').join('');
  const cs=[...dots.children];
  function place(vals){
    const bins={};vals.forEach((v,i)=>{const b=Math.round(x(v)/7);bins[b]=(bins[b]||0)+1;const k=bins[b];cs[i].setAttribute('cx',(b*7).toFixed(1));cs[i].setAttribute('cy',(156-((k-1)%22)*6.4-Math.floor((k-1)/22)*1.5).toFixed(1));});
  }
  function set(h){
    document.querySelectorAll('[data-hg]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.hg===h)));
    const vals=rates.map(r=>100*(h?F:r));
    place(vals);
    const m=vals.reduce((s,v)=>s+v,0)/N, srt=vals.slice().sort((p,q)=>p-q);
    const ml=document.getElementById('hg-mean');ml.setAttribute('x1',x(m));ml.setAttribute('x2',x(m));
    document.getElementById('hg-m').textContent=(m/100).toFixed(3)+' m';
    document.getElementById('hg-w').textContent=(srt[Math.floor(N*0.05)]/100).toFixed(3)+' m';
    document.getElementById('hg-r').textContent=((srt[N-1]-srt[0])/100).toFixed(3)+' m';
  }
  document.querySelectorAll('[data-hg]').forEach(b=>b.addEventListener('click',()=>set(+b.dataset.hg)));
  document.getElementById('hg').addEventListener('anim-in',()=>{set(0);setTimeout(()=>set(1),2200);});
  set(0);
})();
</script>
