<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">How long a task an agent can complete on its own</p><p class="figsub">The vertical axis is the time a human professional needs for the task (log scale). The curve shows how the length of task an agent can complete with a given level of confidence has changed over time; the dashed line extrapolates the older pace. Switch the confidence level and compare with the length of three financial tasks.</p></div><button class="replay" type="button" data-replay="hz">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Confidence level">
      <button type="button" data-hz="50" aria-pressed="true">50% confidence</button>
      <button type="button" data-hz="80" aria-pressed="false">80% confidence</button>
    </div>
    <div class="hz" id="hz" data-anim>
      <svg viewBox="0 0 640 250" role="img" aria-label="Growth of the time horizon"><g id="hz-ax"></g><path id="hz-p" class="hz-l"/><path id="hz-f" class="hz-f"/><g id="hz-pts"></g></svg>
      <p class="hz-msg" id="hz-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>The solid line and dots are METR's time-horizon measurements (task set v1.1, taking the best-performing model at each point in time); the method is described in Kwa et al. (2025). The 50% time horizon doubled about every 7 months over 2019–2025, speeding up to about every 4 months since 2023. The dashed line extrapolates from early 2025 (about 1 hour) at one doubling every 7 months; the 2026 measurements are already above it. The 80% time horizon is about a quarter to a tenth of the 50% one; measurements above 16 hours are less reliable (METR, 2026).</figcaption>
</figure>
<style>
.hz svg{width:100%;height:auto;display:block}
.hz-l{fill:none;stroke:var(--accent);stroke-width:2.5}
.hz-f{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.hz-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.hz svg text{font-size:17px}}
</style>
<script>
(function(){
  const X0=70,X1=600,YT=14,YB=210,t0=2019,t1=2027,x=t=>X0+(t-t0)/(t1-t0)*(X1-X0);
  const lmin=Math.log10(1/60),lmax=Math.log10(60*24*5),y=m=>YB-(Math.log10(m)-lmin)/(lmax-lmin)*(YB-YT);
  // Best-performing model at each point in METR time horizons v1.1: [release date, minutes at 50%, minutes at 80%]
  const P=[[2019.12,0.0538,0.0128],[2020.41,0.144,0.0562],[2022.20,0.599,0.255],[2023.20,3.99,0.89],[2023.85,4.04,0.783],[2024.36,6.99,1.27],[2024.47,11.4,1.67],[2024.70,20.3,4.42],[2024.81,20.5,2.6],[2024.93,38.8,7.09],[2025.15,60.4,12.1],[2025.29,120,30],[2025.60,203,38.3],[2025.88,224,54.1],[2025.90,293,49.4],[2025.94,352,66],[2026.10,719,69.9],[2026.26,1045,186]];
  const V=(r,k)=>k==='50'?r[1]:r[2];
  // Dashed line: extrapolation from early 2025 at one doubling every 7 months
  const H=(t,k)=>(k==='50'?60.4:12.1)*Math.pow(2,(t-2025.15)*12/7);
  const $=id=>document.getElementById(id);
  const T=[[1,'Look up a figure: about 1 minute'],[240,'Research a company: about half a day'],[60*24*3,'A quarterly review: about three working days']];
  let a=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`;
  [[1/60,'1 sec'],[1,'1 min'],[60,'1 hour'],[60*24,'1 day']].forEach(([m,l])=>a+=`<text x="${X0-6}" y="${y(m)+4}" text-anchor="end" font-size="11" class="t-faint">${l}</text><line x1="${X0}" x2="${X1}" y1="${y(m)}" y2="${y(m)}" class="s-line"/>`);
  [2019,2021,2023,2025,2027].forEach(t=>a+=`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${t}</text>`);
  T.forEach(([m,l])=>a+=`<line x1="${X0}" x2="${X1}" y1="${y(m)}" y2="${y(m)}" stroke="var(--gold)" stroke-dasharray="2 3"/><text x="${X0+4}" y="${y(m)-4}" font-size="11" fill="var(--gold)">${l}</text>`);
  $('hz-ax').innerHTML=a;
  function set(k){document.querySelectorAll('[data-hz]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hz===k)));
    const pts=P.filter(r=>V(r,k)>=1/60);
    let d='',f='',c='';pts.forEach(r=>{d+=(d?'L':'M')+x(r[0]).toFixed(1)+','+y(V(r,k)).toFixed(1);c+=`<circle cx="${x(r[0]).toFixed(1)}" cy="${y(V(r,k)).toFixed(1)}" r="3" fill="var(--accent)"/>`;});
    for(let t=2025.15;t<=2026.8;t+=.05)f+=(f?'L':'M')+x(t).toFixed(1)+','+y(Math.min(H(t,k),60*24*5)).toFixed(1);
    $('hz-p').setAttribute('d',d);$('hz-f').setAttribute('d',f);$('hz-pts').innerHTML=c;
    const fmt=m=>m>=60?(m/60).toFixed(1)+' hours':m.toFixed(0)+' minutes';
    $('hz-msg').textContent=k==='50'?`The April 2026 measurement is about ${fmt(V(P[P.length-1],k))} (above 16 hours, so less reliable), while extrapolating one doubling every 7 months gives only about ${fmt(H(2026.26,k))} for the same date. But a task with only even odds of completion still has to be checked item by item after it is handed over.`:`At 80% confidence, the measurements for the first half of 2026 are about ${fmt(V(P[P.length-2],k))} to ${fmt(V(P[P.length-1],k))}: researching a company takes about half a day, still longer than this, and a full quarterly review lies far beyond it.`;}
  document.querySelectorAll('[data-hz]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.hz)));
  $('hz').addEventListener('anim-in',()=>{set('50');setTimeout(()=>set('80'),2600);});
  set('50');
})();
</script>
