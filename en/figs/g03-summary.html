<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: making promises credible</p><p class="figsub">Four conclusions, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g03summary">Replay</button></div>
    <div class="g03summary" id="g03summary" data-anim><div class="g03summary-c" style="--i:0"><em>The commitment problem</em><b>At the moment of repayment, repaying no longer pays</b><p>In a one-off encounter not repaying is rational, so lending never happens at all.</p></div><div class="g03summary-c" style="--i:1"><em>Three approaches</em><b>Reputation, collateral and third-party enforcement</b><p>Make the borrower care about the future, give him something to lose, or let a third party enforce the promise.</p></div><div class="g03summary-c warn" style="--i:2"><em>Costs</em><b>Every approach shuts some people out</b><p>Newcomers have no record, people without assets have no collateral, and small loans cannot bear the cost of enforcement.</p></div><div class="g03summary-c warn" style="--i:3"><em>Interest rates</em><b>Interest rates cannot replace trust</b><p>The higher the rate, the sooner prudent borrowers leave, and the more likely those who remain are not to repay.</p></div></div>
