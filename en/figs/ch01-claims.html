<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">One company, two shapes of promise</p><p class="figsub">The company owes its creditors 100 (in units of 10,000 yuan). Drag the company's value at maturity to see how it is divided between creditors and shareholders.</p></div><button class="replay" type="button" data-replay="cl">Replay</button></div>
    <div class="cl" id="cl" data-anim>
      <div class="cl-bar"><div class="cl-debt" id="cl-debt"><span id="cl-dl"></span></div><div class="cl-eq" id="cl-eq"><span id="cl-el"></span></div></div>
      <div class="cl-scale"><span>0</span><span>50</span><span>100</span><span>150</span><span>200</span></div>
      <div class="sl"><label for="cl-v">Company value at maturity <b id="cl-vv"></b></label><input id="cl-v" type="range" min="0" max="200" value="140"></div>
      <svg viewBox="0 0 640 230" role="img" aria-label="Payoffs to creditors and shareholders as company value changes">
        <g id="cl-axes"></g>
        <path id="cl-pd" class="cl-l debt"/>
        <path id="cl-pe" class="cl-l eq"/>
        <line id="cl-cur" class="cl-cur"/>
        <circle id="cl-cd" r="6" class="cl-dot debt"/>
        <circle id="cl-ce" r="6" class="cl-dot eq"/>
      </svg>
      <p class="cl-msg" id="cl-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Creditors hold a fixed claim: when company value exceeds 100 they receive only 100; when it falls short of 100 they take everything that remains. Shareholders hold a residual claim: when company value falls short of 100 they get nothing, and everything above 100 goes to them. On this basis Merton (1974) treated equity as a call option on the value of the company with the face value of the debt as the strike price.</figcaption>
</figure>
<style>
.cl-bar{display:flex;height:40px;border-radius:8px;overflow:hidden;background:var(--quote);font-size:12px}
.cl-debt,.cl-eq{display:flex;align-items:center;justify-content:center;transition:width .15s;overflow:hidden;white-space:nowrap}
.cl-debt{background:var(--accent);color:#fff}
.cl-eq{background:var(--warm);color:#fff}
.cl-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin:4px 0 14px}
.cl svg{width:100%;height:auto;display:block}
.cl-l{fill:none;stroke-width:2.5;stroke-linejoin:round}
.cl-l.debt{stroke:var(--accent)} .cl-l.eq{stroke:var(--warm)}
.cl-dot.debt{fill:var(--accent)} .cl-dot.eq{fill:var(--warm)}
.cl-cur{stroke:var(--ink);stroke-dasharray:3 3}
.cl-msg{font-size:14px;margin:6px 0 0;min-height:1.7em}
</style>
<script>
(function(){
  const D=100, X0=50, X1=620, Y0=196, Y1=20, x=v=>X0+v/200*(X1-X0), y=v=>Y0-v/100*(Y0-Y1);
  let g=`<line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" class="s-faint"/><line x1="${X0}" y1="${Y1}" x2="${X0}" y2="${Y0}" class="s-faint"/>`;
  [0,50,100,150,200].forEach(v=>g+=`<text x="${x(v)}" y="${Y0+16}" text-anchor="middle" font-size="11" class="t-faint">${v}</text>`);
  [50,100].forEach(v=>g+=`<line x1="${X0}" y1="${y(v)}" x2="${X1}" y2="${y(v)}" class="s-line"/><text x="${X0-8}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`);
  g+=`<text x="${X1}" y="${Y0+32}" text-anchor="end" font-size="11" class="t-faint">Company value at maturity</text><text x="${X0}" y="${Y1-6}" font-size="11" class="t-faint">Each party receives</text>`;
  g+=`<text x="${x(165)}" y="${y(100)-8}" text-anchor="middle" font-size="12" class="t-accent">Creditors</text><text x="${x(175)}" y="${y(75)+16}" text-anchor="middle" font-size="12" class="t-warm">Shareholders</text>`;
  document.getElementById('cl-axes').innerHTML=g;
  document.getElementById('cl-pd').setAttribute('d',`M${x(0)},${y(0)}L${x(D)},${y(D)}L${x(200)},${y(D)}`);
  document.getElementById('cl-pe').setAttribute('d',`M${x(0)},${y(0)}L${x(D)},${y(0)}L${x(200)},${y(100)}`);
  const v=document.getElementById('cl-v');
  function render(){
    const V=+v.value, d=Math.min(V,D), e=Math.max(V-D,0);
    document.getElementById('cl-vv').textContent=V+' × 10,000 yuan';
    const de=document.getElementById('cl-debt'), ee=document.getElementById('cl-eq');
    de.style.width=(d/200*100)+'%'; ee.style.width=(e/200*100)+'%';
    document.getElementById('cl-dl').textContent=d>=18?'Creditors '+d:'';
    document.getElementById('cl-el').textContent=e>=18?'Shareholders '+e:'';
    const cur=document.getElementById('cl-cur');cur.setAttribute('x1',x(V));cur.setAttribute('x2',x(V));cur.setAttribute('y1',Y1);cur.setAttribute('y2',Y0);
    const cd=document.getElementById('cl-cd'),ce=document.getElementById('cl-ce');
    cd.setAttribute('cx',x(V));cd.setAttribute('cy',y(d));ce.setAttribute('cx',x(V));ce.setAttribute('cy',y(e));
    document.getElementById('cl-msg').innerHTML=V>=D
      ?`The company can repay: creditors get back the agreed <b>${d}</b>, and shareholders receive the remaining <b>${e}</b>. The more successful the company, the more shareholders get; creditors always get 100.`
      :`The company cannot repay in full: creditors can only take everything that remains, <b>${d}</b>, and shareholders <b>get nothing</b>. Here the fixed promise fails.`;
  }
  v.addEventListener('input',render); render();
  document.getElementById('cl').addEventListener('anim-in',()=>{
    const seq=[0,200,140]; let k=0, cur=+v.value;
    const step=()=>{const t=seq[k]; if(cur===t){k++; if(k>=seq.length)return; return setTimeout(step,300);} cur+=cur<t?4:-4; if(Math.abs(cur-t)<4)cur=t; v.value=cur; render(); requestAnimationFrame(step);};
    cur=100; step();
  });
})();
</script>
