<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: finance between two people</p><p class="figsub">Four conclusions, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g02summary">Replay</button></div>
    <div class="g02summary" id="g02summary" data-anim><div class="g02summary-c" style="--i:0"><em>Lending</em><b>Lending out is storage without losses</b><p>Two people who run short at different times lend to each other, so grain need not spoil in the granary.</p></div><div class="g02summary-c" style="--i:1"><em>Constraint</em><b>The benefit comes from mismatched timing</b><p>If both run short at the same time, lending cannot help; with a half-year gap, the benefit is greatest.</p></div><div class="g02summary-c warn" style="--i:2"><em>Interest</em><b>The price of time has a floor and a ceiling</b><p>The floor is the lender's other options, the ceiling the borrower's circumstances; when storage involves losses, the floor can be negative.</p></div><div class="g02summary-c warn" style="--i:3"><em>Commitment</em><b>Lending requires the other party to be able to repay later</b><p>What is lent is today's grain; what comes back is a promise about the future, and it may not be kept.</p></div></div>
  </div>
