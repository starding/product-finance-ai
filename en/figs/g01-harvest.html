<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">One harvest, twelve months of eating</p><p class="figsub">The autumn harvest brings 12 portions of grain, and 1 portion a month is just enough. Switch between two ways of eating: the total eaten is the same, but its distribution over time differs.</p></div><button class="replay" type="button" data-replay="hv">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Way of eating">
      <button type="button" data-hv="free" aria-pressed="true">Eat as much as he likes</button>
      <button type="button" data-hv="even" aria-pressed="false">Spread evenly over the months</button>
    </div>
    <div class="hv" id="hv" data-anim>
      <svg viewBox="0 0 640 220" role="img" aria-label="Monthly consumption and stock"><g id="hv-ax"></g><g id="hv-b"></g><path id="hv-st" class="hv-st"/></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Eaten that month</span><span><i style="background:var(--warm)"></i>Hungry months</span><span><i style="background:var(--faint)"></i>Grain left in the granary</span></div>
      <p class="hv-msg" id="hv-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative: "Eat as much as he likes" assumes at most 3 portions a month.</figcaption>
</figure>
<style>
.hv svg{width:100%;height:auto;display:block}
.hv-st{fill:none;stroke:var(--faint);stroke-width:1.8;stroke-dasharray:4 3}
.hv-b rect{transition:height .5s,y .5s}
.hv-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.hv svg text{font-size:16px}}
</style>
<script>
(function(){
  const M=['Aut','','','Win','','','Spr','','','Sum','',''],X0=40,X1=630,YB=186,YT=14,W=(X1-X0)/12,y=v=>YB-v/12*(YB-YT);
  const $=id=>document.getElementById(id);
  $('hv-ax').innerHTML=[0,3,6,9,12].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+
    `<line x1="${X0}" x2="${X1}" y1="${y(1)}" y2="${y(1)}" stroke="var(--warm)" stroke-dasharray="3 3"/><text x="${X1}" y="${y(1)-5}" text-anchor="end" font-size="11" class="t-warm">Enough to eat: 1 portion</text>`+
    M.map((m,i)=>`<text x="${X0+W*i+W/2}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${m||i+1}</text>`).join('');
  $('hv-b').innerHTML=M.map((_,i)=>`<rect x="${X0+W*i+W*.2}" width="${W*.6}" y="${YB}" height="0" rx="2"/>`).join('');
  const rs=[...document.querySelectorAll('#hv-b rect')];
  function plan(k){let s=12;const c=[],st=[];for(let i=0;i<12;i++){const e=k==='free'?Math.min(3,s):Math.min(1,s);c.push(e);s-=e;st.push(s);}return [c,st];}
  function set(k){document.querySelectorAll('[data-hv]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hv===k)));
    const [c,st]=plan(k);let hungry=0;
    rs.forEach((r,i)=>{const v=c[i],h=v<1;if(h)hungry++;const hh=h?Math.max(3,(YB-y(Math.max(v,.12)))):YB-y(v);r.setAttribute('y',YB-hh);r.setAttribute('height',hh);r.setAttribute('fill',h?'var(--warm)':'var(--accent)');});
    $('hv-st').setAttribute('d','M'+X0+','+y(12)+st.map((v,i)=>'L'+(X0+W*(i+1))+','+y(v)).join(''));
    $('hv-msg').textContent=k==='free'?`He eats 3 portions a month for the first four months; for the next ${hungry} months the granary is empty and he goes hungry.`:'He eats 1 portion a month, every one of the twelve months has enough, and he is never hungry. The total eaten is again 12 portions.';}
  document.querySelectorAll('[data-hv]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.hv)));
  $('hv').addEventListener('anim-in',()=>{set('free');setTimeout(()=>set('even'),2600);});
  set('free');
})();
</script>
