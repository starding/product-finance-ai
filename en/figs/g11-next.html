<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">What this step leaves open</p><p class="figsub">Four questions still unresolved once rules exist. Select a question to see the assumption it rests on.</p></div><button class="replay" type="button" data-replay="nx11">Replay</button></div>
    <div class="nx" id="nx11" data-anim>
      <div class="nx-src"><b>A village that sets rules</b><span>Custody, disclosure and suitability</span></div>
      <div class="nx-list" id="nx11-l"></div>
    </div>
    <p class="nx-msg" id="nx11-msg" aria-live="polite"></p>
  </div>
</figure>
<style>
.nx{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.nx-src{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 10px;text-align:center}
.nx-src b{display:block;font-size:16px} .nx-src span{font-size:12px;opacity:.75}
.nx-list{display:grid;gap:6px}
.nx-i{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--quote);border:1px solid transparent;border-radius:9px;padding:9px 12px;color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.3s)}
.nx.in .nx-i{opacity:1;transform:none}
.nx-i span{font-size:13.5px} .nx-i em{font-style:normal;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nx-i.sel{border-color:var(--accent)}
.nx-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.nx{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const Q=[['People make their own mistakes','Chapter 12: Defaults','Assumption: if products are reliable and information is public, principals will make good decisions. Principals still chase rises, sell into falls and redeem too often.'],
    ['Rules can govern only what can be seen','Part Two','Assumption: the disclosed figures are enough to reflect the manager\'s judgement and motives. Rules see the past, not the present moment.'],
    ['New trustees','Part Two','Assumption: the trustee is a person. If the one acting for others is an agent that can place orders directly, who holds custody over its actions, who checks them, and who is responsible when it errs?'],
    ['Whether the regulator itself can be trusted','Part Two','Assumption: the regulator is fair and competent. That trust likewise needs constraints and accountability.']];
  const l=document.getElementById('nx11-l'),msg=document.getElementById('nx11-msg');
  l.innerHTML=Q.map((q,i)=>`<button type="button" class="nx-i" style="--i:${i}" data-i="${i}"><span>${q[0]}</span><em>→ ${q[1]}</em></button>`).join('');
  const bs=[...l.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));msg.textContent=Q[i][2];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('nx11').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1600+k*1800));});
  set(0);
})();
</script>
