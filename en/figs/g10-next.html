<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">What this step leaves open</p><p class="figsub">Four questions still unresolved once delegation exists. Select a question to see the assumption it rests on.</p></div><button class="replay" type="button" data-replay="nx10">Replay</button></div>
    <div class="nx" id="nx10" data-anim>
      <div class="nx-src"><b>Whom to hand it to</b><span>Principals and agents</span></div>
      <div class="nx-list" id="nx10-l"></div>
    </div>
    <p class="nx-msg" id="nx10-msg" aria-live="polite"></p>
  </div>
</figure>
<style>
.nx{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.nx-src{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 10px;text-align:center}
.nx-src b{display:block;font-size:16px} .nx-src span{font-size:12px;opacity:.75}
.nx-list{display:grid;gap:6px}
.nx-i{font:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--quote);border:1px solid transparent;border-radius:9px;padding:9px 12px;color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.3s)}
.nx.in .nx-i{opacity:1;transform:none}
.nx-i span{font-size:13.5px} .nx-i em{font-style:normal;font-size:11.5px;color:var(--faint);white-space:nowrap}
.nx-i.sel{border-color:var(--accent)}
.nx-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.nx{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const Q=[['Managers may misappropriate principals\' assets','Chapter 11: Regulation & custody','Assumption: the ship shares stay in the manager\'s hands, untouched. How can principals confirm they are still there?'],
    ['Sellers know more','Chapter 11: Regulation & custody','Assumption: the manager explains the risks truthfully. He may talk only about returns, or recommend unsuitable products to people they do not suit.'],
    ['Principals make their own mistakes','Chapter 12: Defaults','Assumption: principals will stick to holding for the long term. Switching managers to chase performance and redeeming in falls often leave them with lower returns than the fund itself.'],
    ['Delegation itself is expensive','Part Two','Assumption: the costs of research, monitoring and fees stay fixed. If these costs fell sharply, how would the boundary of delegation shift?']];
  const l=document.getElementById('nx10-l'),msg=document.getElementById('nx10-msg');
  l.innerHTML=Q.map((q,i)=>`<button type="button" class="nx-i" style="--i:${i}" data-i="${i}"><span>${q[0]}</span><em>→ ${q[1]}</em></button>`).join('');
  const bs=[...l.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));msg.textContent=Q[i][2];}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('nx10').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1600+k*1800));});
  set(0);
})();
</script>
