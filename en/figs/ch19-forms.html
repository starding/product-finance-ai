<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Three basic forms of human cooperation</p><p class="figsub">Pick a form to see what is handed over, when the result can be verified and where the difficulty lies. A user handing a task to an AI agent belongs to the third.</p></div><button class="replay" type="button" data-replay="fm">Replay</button></div>
    <div class="fm" id="fm" data-anim>
      <button type="button" class="fm-c" data-fm="0" style="--i:0"><em>1</em><b>Exchange</b><span>Buying and selling something that already exists</span></button>
      <button type="button" class="fm-c" data-fm="1" style="--i:1"><em>2</em><b>Joint production</b><span>Several people completing something together</span></button>
      <button type="button" class="fm-c sel" data-fm="2" style="--i:2"><em>3</em><b>Principal–agent</b><span>Handing a task to someone else to do on your behalf</span></button>
    </div>
    <dl class="fm-d" id="fm-d" aria-live="polite"></dl>
  </div>
  <figcaption>The difficulty of joint production is from Alchian and Demsetz (1972); the principal–agent relationship is from Ross (1973) and Jensen and Meckling (1976).</figcaption>
</figure>
<style>
.fm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fm-c{font:inherit;text-align:left;cursor:pointer;background:var(--quote);border:1px solid transparent;border-radius:10px;padding:10px 12px;color:var(--ink);display:flex;flex-direction:column;gap:2px;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.25s)}
.fm.in .fm-c{opacity:1;transform:none}
.fm-c em{font-style:normal;font-size:11px;color:var(--faint)} .fm-c b{font-size:15px} .fm-c span{font-size:12.5px;color:var(--muted)}
.fm-c.sel{border-color:var(--accent);background:var(--accent-soft)}
.fm-d{display:grid;grid-template-columns:7.5em 1fr;gap:6px 14px;margin:14px 0 0;font-size:14px;line-height:1.6}
.fm-d dt{color:var(--faint);font-size:12.5px;padding-top:2px} .fm-d dd{margin:0}
@media (max-width:640px){.fm{grid-template-columns:1fr}.fm-d{grid-template-columns:1fr;gap:2px}.fm-d dd{margin-bottom:8px}}
</style>
<script>
(function(){
  const K=['What is handed over','When the result can be verified','Main difficulty','Examples'];
  const D=[['A good or a right that already exists','On the spot, at delivery','Quality and authenticity; the relationship ends at delivery','Buying groceries, buying a computer, buying fund units'],
    ['Each person\'s labour and input','After the work is done together','Each person\'s contribution is hard to measure, so some may shirk','A choir, moving something heavy, a team building software'],
    ['The right to act: doing something on your behalf','Afterwards, and often only under asymmetric information','The other party\'s ability and conduct are hard to see, and the two sides\' goals are not fully aligned','Employer and employee, patient and doctor, investor and fund manager, user and AI agent']];
  const d=document.getElementById('fm-d');
  function set(k){document.querySelectorAll('[data-fm]').forEach(b=>b.classList.toggle('sel',+b.dataset.fm===k));d.innerHTML=K.map((x,i)=>`<dt>${x}</dt><dd>${D[k][i]}</dd>`).join('');}
  document.querySelectorAll('[data-fm]').forEach(b=>b.addEventListener('click',()=>set(+b.dataset.fm)));
  document.getElementById('fm').addEventListener('anim-in',()=>{[0,1,2].forEach((k,i)=>setTimeout(()=>set(k),400+i*1500));});
  set(2);
})();
</script>
