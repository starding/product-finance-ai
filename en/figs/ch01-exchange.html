<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Settled on the spot versus a promise across time</p><p class="figsub">The payment is the same; what comes back sits at a different point in time.</p></div><button class="replay" type="button" data-replay="ex">Replay</button></div>
    <div class="ex" id="ex" data-anim>
      <svg viewBox="0 0 640 316" role="img" aria-label="The time structure of three exchanges: buying bread, a fixed deposit, and buying shares">
        <line x1="150" y1="34" x2="150" y2="306" class="s-line" stroke-width="1"/>
        <line x1="590" y1="34" x2="590" y2="306" class="s-line" stroke-width="1"/>
        <text x="150" y="22" text-anchor="middle" font-size="12" class="t-faint">Today</text>
        <text x="590" y="22" text-anchor="middle" font-size="12" class="t-faint">In 3 years</text>
        <line x1="150" y1="22" x2="590" y2="22" class="s-line" stroke-dasharray="2 4"/>

        <text x="16" y="74" font-size="15" font-weight="700" class="t-ink">Bread</text>
        <text x="16" y="94" font-size="12" class="t-faint">Settled now</text>
        <g class="ex-pay" style="--d:.2s"><rect x="112" y="52" width="76" height="26" rx="13"/><text x="150" y="70" text-anchor="middle" font-size="12">Pay 10</text></g>
        <g class="ex-get" style="--d:.7s"><rect x="112" y="84" width="76" height="26" rx="13"/><text x="150" y="102" text-anchor="middle" font-size="12">Get bread</text></g>

        <text x="16" y="164" font-size="15" font-weight="700" class="t-ink">Deposit</text>
        <text x="16" y="184" font-size="12" class="t-faint">Fixed promise</text>
        <g class="ex-pay" style="--d:1.2s"><rect x="104" y="158" width="92" height="26" rx="13"/><text x="150" y="176" text-anchor="middle" font-size="12">Pay in 10,000</text></g>
        <path d="M196,171 C320,120 440,120 540,171" class="ex-arc" style="--d:1.6s"/>
        <text x="368" y="128" text-anchor="middle" font-size="12" class="t-accent ex-lab" style="--d:2.2s">The bank's promise</text>
        <g class="ex-get" style="--d:2.8s"><rect x="534" y="158" width="104" height="26" rx="13"/><text x="586" y="176" text-anchor="middle" font-size="12">Get 10,612</text></g>

        <text x="16" y="248" font-size="15" font-weight="700" class="t-ink">Stock fund</text>
        <text x="16" y="268" font-size="12" class="t-faint">No fixed sum</text>
        <g class="ex-pay" style="--d:3.4s"><rect x="104" y="242" width="92" height="26" rx="13"/><text x="150" y="260" text-anchor="middle" font-size="12">Invest 10,000</text></g>
        <path d="M196,255 C300,226 420,226 520,214" class="ex-arc risky" style="--d:3.8s"/>
        <path d="M196,255 C300,255 420,255 520,255" class="ex-arc risky" style="--d:3.9s"/>
        <path d="M196,255 C300,284 420,290 520,296" class="ex-arc risky" style="--d:4s"/>
        <g class="ex-get risky" style="--d:4.6s"><rect x="528" y="202" width="96" height="24" rx="12"/><text x="576" y="219" text-anchor="middle" font-size="12">Maybe 16,000</text></g>
        <g class="ex-get risky" style="--d:4.8s"><rect x="528" y="243" width="96" height="24" rx="12"/><text x="576" y="260" text-anchor="middle" font-size="12">Maybe 11,500</text></g>
        <g class="ex-get risky" style="--d:5s"><rect x="528" y="284" width="96" height="24" rx="12"/><text x="576" y="301" text-anchor="middle" font-size="12">Maybe 7,000</text></g>
      </svg>
    </div>
  </div>
  <figcaption>Illustrative; amounts in yuan. The deposit earns 2% a year. The three outcomes for the stock fund only show that there is more than one possible result; they are not probabilities or forecasts.</figcaption>
</figure>
<style>
.ex svg{width:100%;height:auto;display:block}
.ex-pay rect{fill:var(--quote);stroke:var(--faint)}
.ex-pay text{fill:var(--ink)}
.ex-get rect{fill:var(--accent-soft);stroke:var(--accent)}
.ex-get text{fill:var(--ink)}
.ex-get.risky rect{fill:var(--warm-soft);stroke:var(--warm)}
.ex-pay,.ex-get,.ex-lab{opacity:0;transition:opacity .45s;transition-delay:var(--d)}
.ex-arc{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:420;stroke-dashoffset:420;transition:stroke-dashoffset 1.1s ease;transition-delay:var(--d)}
.ex-arc.risky{stroke:var(--warm);stroke-dasharray:420;opacity:.8}
.ex.in .ex-pay,.ex.in .ex-get,.ex.in .ex-lab{opacity:1}
.ex.in .ex-arc{stroke-dashoffset:0}
</style>
