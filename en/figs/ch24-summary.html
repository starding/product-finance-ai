<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: writing a promise that can be kept</p><p class="figsub">Four design requirements, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="ch24summary">Replay</button></div>
    <div class="ch24summary" id="ch24summary" data-anim><div class="ch24summary-c" style="--i:0"><em>Three conditions</em><b>Promise only what can be provided, delivered and verified</b><p>Fees, execution, discipline, constraints and coverage can be promised; returns and direction cannot.</p></div><div class="ch24summary-c" style="--i:1"><em>Returns are a poor signal</em><b>Promise the process, and make process measures checkable</b><p>Write measures such as fees, allocation drift and accounting for each cycle into the promise, and publish them monthly.</p></div><div class="ch24summary-c warn" style="--i:2"><em>Net value is the value</em><b>State promises in terms of net value</b><p>Say what the user gets, pays and bears, not just the returns.</p></div><div class="ch24summary-c warn" style="--i:3"><em>Backtests mislead</em><b>When showing history, state the number of trials and out-of-sample results</b><p>Do not use selected backtests and short-term rankings to create expectations; write out, task by task, what is and is not promised.</p></div></div>
  </div>
</figure>
