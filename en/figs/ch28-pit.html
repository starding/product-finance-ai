<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Reviewing with the data of the time, or with later data</p><p class="figsub">A company first reports a preliminary figure for quarterly earnings, which is later revised down sharply. The agent decided to keep holding when the second-quarter preliminary figure was released. Switch the data used in the review and see how the decision is judged.</p></div><button class="replay" type="button" data-replay="pt2">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Data used in the review"><button type="button" data-pt2="now" aria-pressed="true">Revised data</button><button type="button" data-pt2="pit" aria-pressed="false">Data of the time</button></div>
    <div class="pt2" id="pt2" data-anim>
      <svg viewBox="0 0 640 200" role="img" aria-label="Preliminary and revised earnings"><g id="pt2-g"></g></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>Preliminary figure reported at the time</span><span><i style="background:var(--warm)"></i>Later revised figure</span></div>
      <p class="pt2-msg" id="pt2-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative data. Judging past decisions with revised data introduces bias, so data must be kept point in time; the idea follows the real-time data set of Croushore and Stark (2001).</figcaption>
</figure>
<style>
.pt2 svg{width:100%;height:auto;display:block}
.pt2-b{transition:height .5s ease,y .5s ease,opacity .4s}
.pt2-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.pt2 svg text{font-size:17px}}
</style>
<script>
(function(){
  const Q=['Q1','Q2','Q3','Q4'],P=[1.20,1.30,1.10,1.25],R=[1.15,0.80,1.05,1.20];
  const X0=50,X1=620,YB=160,YT=14,w=(X1-X0)/4,h=v=>v/1.5*(YB-YT);
  function set(k){document.querySelectorAll('[data-pt2]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pt2===k)));
    let g=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`;
    Q.forEach((q,i)=>{const x=X0+i*w;g+=`<rect class="pt2-b" x="${x+w*.18}" width="${w*.28}" y="${YB-h(P[i])}" height="${h(P[i])}" rx="3" fill="var(--accent)" opacity="${k==='pit'||i!==1?1:.35}"/><rect class="pt2-b" x="${x+w*.52}" width="${w*.28}" y="${YB-h(R[i])}" height="${h(R[i])}" rx="3" fill="var(--warm)" opacity="${k==='now'||i!==1?1:.25}"/><text x="${x+w/2}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${q}</text>`;});
    g+=`<line x1="${X0+w*1.5}" y1="${YT}" x2="${X0+w*1.5}" y2="${YB}" stroke="var(--ink)" stroke-dasharray="3 3"/><text x="${X0+w*1.5}" y="${YT+10}" text-anchor="middle" font-size="11" class="t-ink">Decision: keep holding</text>`;
    document.getElementById('pt2-g').innerHTML=g;
    document.getElementById('pt2-msg').textContent=k==='now'?'With the revised data, second-quarter earnings were only 0.80, and "keep holding" looks plainly wrong. But that number became known two quarters later; no one could see it at the time.':'With the data of the time, the second-quarter preliminary figure was 1.30, higher than the previous quarter, and keeping the holding was reasonable. Only a point-in-time record separates the quality of the decision itself from information that came later.';}
  document.querySelectorAll('[data-pt2]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.pt2)));
  document.getElementById('pt2').addEventListener('anim-in',()=>{set('now');setTimeout(()=>set('pit'),2600);});
  set('now');
})();
</script>
