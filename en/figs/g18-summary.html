<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: can an agent correct human bias?</p><p class="figsub">Five conclusions, each tied to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g18summary">Replay</button></div>
    <div class="g18summary" id="g18summary" data-anim><div class="g18summary-c" style="--i:0"><em>Rerun: Choice architecture</em><b>A default for each household</b><p>The default no longer aims only at the average person; inertia holds each household closer to what it intended.</p></div><div class="g18summary-c" style="--i:1"><em>Rerun: Quasi-hyperbolic discounting</em><b>A smarter lock</b><p>It adds resistance to impulses and lets emergencies through, on the basis of the agreement the principal wrote in advance.</p></div><div class="g18summary-c warn" style="--i:2"><em>Exploiting bias</em><b>One capability, the opposite direction</b><p>A scribe acting on the number of trades knows best how to push for a trade at the impulsive moment.</p></div><div class="g18summary-c warn" style="--i:3"><em>Misuse and disuse</em><b>Trust must match reliability</b><p>Trust it too much and you stop checking; see it err once and you stop using it. Confirming and answering for key actions in person reduces both biases.</p></div><div class="g18summary-c wide" style="--i:4"><em>Current practice and the ideal</em><b>Respect first, then invite</b><p>A scattered way of investing is also a steady state. Use the principal's own record to show the results, then ask whether he would like to try something else; promise only the quality of the process.</p></div></div>
  </div>
