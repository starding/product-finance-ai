<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">A list, or a chain</p><p class="figsub">The same twelve financial arrangements, arranged two ways. As a list they can only be memorized one by one; in the order in which they arise, each one answers a constraint.</p></div><button class="replay" type="button" data-replay="gz">Replay</button></div>
    <div class="seg-btns" role="group" aria-label="Arrangement">
      <button type="button" data-gz="list" aria-pressed="true">Product list</button>
      <button type="button" data-gz="chain" aria-pressed="false">In order of appearance</button>
    </div>
    <div class="gz" id="gz" data-anim></div>
  </div>
  <figcaption>The order is the logical order of the derivation, not historical dates; the number at the top right of each box is the corresponding chapter.</figcaption>
</figure>
<style>
.gz{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gz-c{position:relative;background:var(--quote);border-radius:10px;padding:10px 12px;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;transition-delay:calc(var(--i)*.06s)}
.gz.in .gz-c{opacity:1;transform:none}
.gz-c b{display:block;font-size:14px}
.gz-c span{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:3px}
.gz-c em{position:absolute;top:8px;right:10px;font-style:normal;font-size:11px;color:var(--faint)}
.gz.chain .gz-c{border-left:3px solid var(--accent)}
@media (max-width:640px){.gz{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
(function(){
  const P=[['Saving','Income and spending come at different times'],['Deposits and loans','You are short today, I am short tomorrow'],['Collateral and guarantees','A loan may not be repaid'],['Accounts and payments','Barter needs a double coincidence of wants'],['Insurance','Future harvests may be good or bad'],['Deposits on demand','Savers may need their money at any time; borrowers need it for years'],['Stocks and bonds','No one person can bear the risk of a large project'],['Exchanges and brokers','Securities need to find buyers'],['Index funds','Prices are hard to predict'],['Funds and advisers','Ordinary people have neither the time nor the expertise'],['Custody and disclosure','Trustees may not do their duty'],['Regular investing and defaults','The institutions are in place, and people still make mistakes']];
  const SH=[8,2,10,0,6,11,3,9,1,5,7,4];
  const box=document.getElementById('gz');let mode='list';
  function draw(){const idx=mode==='list'?SH:P.map((_,i)=>i);box.classList.toggle('chain',mode==='chain');
    box.innerHTML=idx.map((i,k)=>`<div class="gz-c" style="--i:${k}"><b>${P[i][0]}</b>${mode==='chain'?`<span>Constraint: ${P[i][1]}</span><em>${i+1}</em>`:''}</div>`).join('');
    box.classList.remove('in');void box.offsetWidth;box.classList.add('in');}
  document.querySelectorAll('[data-gz]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.gz;document.querySelectorAll('[data-gz]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
  box.addEventListener('anim-in',()=>{mode='list';document.querySelectorAll('[data-gz]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.gz==='list')));draw();setTimeout(()=>{mode='chain';document.querySelectorAll('[data-gz]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.gz==='chain')));draw();},1800);});
  draw();box.classList.remove('in');
})();
</script>
