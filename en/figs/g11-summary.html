<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">Chapter summary: regulation and custody</p><p class="figsub">Four conclusions, each corresponding to one mechanism in this chapter.</p></div><button class="replay" type="button" data-replay="g11summary">Replay</button></div>
    <div class="g11summary" id="g11summary" data-anim><div class="g11summary-c" style="--i:0"><em>Lemons</em><b>When good cannot be told from bad, the good leave</b><p>Principals will pay only the average, reliable managers leave, and those who remain get worse and worse.</p></div><div class="g11summary-c" style="--i:1"><em>Custody</em><b>Assets out of the manager's hands</b><p>The manager can only give instructions, and the custodian reports directly to principals: theft and false reporting have nowhere to hide.</p></div><div class="g11summary-c warn" style="--i:2"><em>Disclosure and suitability</em><b>Visible, and sold to the right people</b><p>Disclosure lets the good be recognised; suitability makes sellers act in buyers' interests and recommend only matching products.</p></div><div class="g11summary-c warn" style="--i:3"><em>The price of rules</em><b>Regulation needs limits and constraints too</b><p>Compliance has costs, and overly strict rules push out small managers; regulators themselves also need to be held accountable.</p></div></div>
  </div>
</figure>
