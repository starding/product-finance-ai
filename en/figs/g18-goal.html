<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">One capability, two goals</p><p class="figsub">The scribe's capability is knowing a household and being present at the critical moment. Pick a moment and compare what it does when acting on the principal's plan and when acting on the number of trades or promotional income.</p></div><button class="replay" type="button" data-replay="gl18">Replay</button></div>
    <div class="gl18" id="gl18" data-anim>
      <div class="gl18-m" id="gl18-m"></div>
      <div class="gl18-d" id="gl18-d" aria-live="polite"></div>
    </div>
  </div>
  <figcaption>Illustrative: the comparisons are fictional examples.</figcaption>
</figure>
<style>
.gl18-m{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gl18-m button{font:inherit;cursor:pointer;text-align:left;background:var(--quote);border:1px solid transparent;border-radius:9px;padding:8px 10px;color:var(--ink);font-size:13px;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s,border-color .3s;transition-delay:calc(var(--i)*.2s)}
.gl18.in .gl18-m button{opacity:1;transform:none}
.gl18-m button.sel{border-color:var(--ink)}
.gl18-d{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gl18-d div{border-radius:9px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.gl18-d div:first-child{background:var(--accent-soft)} .gl18-d div:last-child{background:var(--warm-soft)}
.gl18-d span{display:block;font-size:11.5px;color:var(--faint)}
@media (max-width:640px){.gl18-m{grid-template-columns:1fr 1fr}.gl18-d{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const M=[['Payday','Automatically saves the agreed share and asks whether some of the extra money should be saved too.','Pushes a "limited-time" high-yield product that happens to use up this month\'s extra money.'],
    ['Sharp fall after a storm','Sets out the original agreement and where this fall sits in history, and asks him to confirm a day later.','Pushes "buy the dip" and "stop-loss alert" messages; every buy and every sell is a trade.'],
    ['Several weeks of gains','Notes that the portfolio has drifted from the agreed shares and sells some according to plan.','Pushes the top-gainers list and "you missed out" prompts, then a burst of confetti.'],
    ['He does nothing','Does nothing; the plan runs by itself.','Pushes messages until he opens the app again.']];
  const g=document.getElementById('gl18-m'),d=document.getElementById('gl18-d');
  g.innerHTML=M.map((m,i)=>`<button type="button" style="--i:${i}">${m[0]}</button>`).join('');const bs=[...g.children];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));d.innerHTML=`<div><span>Acting on the principal's plan</span>${M[i][1]}</div><div><span>Acting on trades or promotional income</span>${M[i][2]}</div>`;}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('gl18').addEventListener('anim-in',()=>{[0,1,2,3].forEach((i,k)=>setTimeout(()=>set(i),1200+k*2000));});
  set(0);
})();
</script>
