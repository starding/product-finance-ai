<script>
(function(){
  const D={
    time:'Time compensation: holding today\'s money until the future deserves compensation in itself. It is available to everyone, but must be measured in purchasing power and matched to when the money is needed.',
    risk:'Risk compensation: only by bearing risk that cannot be diversified away does one earn an extra return over the long run, the risk premium. It is available to everyone, at the cost of enduring volatility, drawdowns and extreme outcomes.',

    cost:'Trading costs: spreads, market impact and fees of all kinds. All traders bear them together, which makes trading negative-sum in aggregate.',
    luck:'Luck: the main source of short-term results, averaging to zero over the long run. Judging any result begins with separating luck from skill.',
    keep:'The premise of delivery: every term above depends on promises being kept, which is secured by institutions such as disclosure, segregated custody, central counterparties and regulation.'

  const d=document.getElementById('pm6-d'), bs=[...document.querySelectorAll('#pm6 .pm6-term')];

})();
