<figure>
  <div class="card">
    <p class="figtitle">The basis for trade-offs: consequences and verifiability</p>
    <p class="figsub">Five pairs of principles that pull against each other. Drag how severe a function's consequences are (the more severe, and the harder to undo and verify, the further right), and see which way the balance point of each pair moves.</p>
    <div class="tn" id="tn" data-anim>
      <div class="sl"><label for="tn-s">Severity of consequences <b id="tn-sv"></b></label><input id="tn-s" type="range" min="0" max="100" step="5" value="20"></div>
      <div class="tn-list" id="tn-list"></div>
      <p class="tn-msg" id="tn-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>Illustrative. The balance point of each pair moves with the severity of consequences, at different speeds.</figcaption>
</figure>
<style>
.tn-list{display:grid;gap:10px;margin-top:10px}
.tn-r{display:grid;grid-template-columns:96px 1fr 96px;gap:10px;align-items:center;font-size:12.5px}
.tn-r span:first-child{text-align:right;color:var(--muted)} .tn-r span:last-child{color:var(--muted)}
.tn-t{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--accent-soft),var(--warm-soft))}
.tn-t i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);transition:left .4s}
.tn-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.tn-r{grid-template-columns:70px 1fr 70px;font-size:11.5px}}
</style>
<script>
(function(){
  const T=[['Convenience','Confirm each action',1.2],['Quiet','Proactive reminders',1.0],['Simplicity','Full transparency',.8],['Speed of iteration','Level of assurance',1.1],['Respect for habit','Guiding improvement',.9]];
  const L=v=>v<25?'light, easy to undo':v<50?'moderate':v<75?'fairly severe':'severe, cannot be undone';
  const box=document.getElementById('tn-list');box.innerHTML=T.map(([a,b])=>`<div class="tn-r"><span>${a}</span><div class="tn-t"><i></i></div><span>${b}</span></div>`).join('');
  const dots=[...box.querySelectorAll('.tn-t i')],sl=document.getElementById('tn-s');
  function r(){const v=+sl.value;document.getElementById('tn-sv').textContent=L(v);dots.forEach((d,i)=>d.style.left=Math.max(4,Math.min(96,10+v*.8*T[i][2]))+'%');
    document.getElementById('tn-msg').textContent=v<25?'Functions with light consequences that are easy to undo and verify, such as a market summary: lean towards convenience, quiet, simplicity, fast iteration and respect for habit.':v<75?'Functions with moderate consequences, such as a rebalancing plan: plan approval, reminders at key moments, a basis the user can open, and an evaluation set; in reviews, invite improvement with the user\'s own records.':'Operations with severe, irreversible consequences, such as selling or transferring money out: confirmation of each action, repeated reminders, a complete record and the strongest assurance, with a clear warning about any practice beyond what the user can bear.';}
  sl.addEventListener('input',r);
  document.getElementById('tn').addEventListener('anim-in',()=>{let v=0;sl.value=0;r();const id=setInterval(()=>{v+=5;sl.value=v;r();if(v>=100){clearInterval(id);setTimeout(()=>{sl.value=20;r();},600);}},120);});
  r();
})();
</script>
