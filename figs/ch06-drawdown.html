<figure>
  <div class="card">
    <p class="figtitle">有补偿的因子，也可能连续多年落后</p>
    <p class="figsub">假设一个因子长期每年平均带来 3% 的补偿，年波动率 12%。选择持有年限，看这段时间内累计收益为负的概率；下方是三条可能的 40 年路径。</p>
    <div class="fd" id="fd" data-anim>
      <div class="sl"><label for="fd-y">持有年限 <b id="fd-yv"></b></label><input id="fd-y" type="range" min="1" max="30" step="1" value="10"></div>
      <div class="fd-p"><span>这段时间内累计收益为负的概率</span><b id="fd-p"></b><i><em id="fd-bar"></em></i></div>
      <svg viewBox="0 0 640 200" role="img" aria-label="因子累计收益的三条模拟路径">
        <g id="fd-axis"></g><g id="fd-paths"></g>
      </svg>
      <button type="button" class="replay" id="fd-re">换三条路径</button>
    </div>
  </div>
  <figcaption>示意参数，不对应某个具体因子的估计。真实案例：按 Fama–French 的定义，价值因子自 2007 年起跑输成长，到 2020 年年中累计回撤约 55%（Arnott 等，2021）。概率按正态近似计算：Φ(−平均补偿 × √年限 ÷ 波动率)。</figcaption>
</figure>
<style>
.fd svg{width:100%;height:auto;display:block;margin-top:8px}
.fd-p{background:var(--quote);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.fd-p span{font-size:12px;color:var(--faint)}
.fd-p b{font-size:22px;color:var(--warm);font-variant-numeric:tabular-nums}
.fd-p i{grid-column:1/-1;display:block;height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
.fd-p em{display:block;height:100%;background:var(--warm);transition:width .3s}
.fd-l{fill:none;stroke-width:1.8;opacity:.85}
</style>
<script>
(function(){
  const MU=0.03, SG=0.12, Y=40, X0=50, X1=620, YT=14, YB=176;
  const erf=z=>{const t=1/(1+0.3275911*Math.abs(z));const r=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-z*z);return z>=0?r:-r;};
  const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
  const s=document.getElementById('fd-y');
  function prob(){const y=+s.value,p=Phi(-MU*Math.sqrt(y)/SG);document.getElementById('fd-yv').textContent=y+' 年';document.getElementById('fd-p').textContent=Math.round(p*100)+'%';document.getElementById('fd-bar').style.width=(p*100)+'%';}
  s.addEventListener('input',prob); prob();
  const g=()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const x=t=>X0+t/Y*(X1-X0);
  function paths(){
    const P=[0,1,2].map(()=>{let l=0;const a=[0];for(let t=0;t<Y;t++){l+=MU-SG*SG/2+SG*g();a.push(l);}return a;});
    const all=P.flat(), lo=Math.min(...all,-0.3), hi=Math.max(...all,0.3), y=v=>YB-(v-lo)/(hi-lo)*(YB-YT);
    let a=`<line x1="${X0}" y1="${y(0)}" x2="${X1}" y2="${y(0)}" class="s-line"/><text x="${X0-6}" y="${y(0)+4}" text-anchor="end" font-size="10" class="t-faint">起点</text>`;
    [0,10,20,30,40].forEach(t=>a+=`<text x="${x(t)}" y="${YB+18}" text-anchor="middle" font-size="11" class="t-faint">${t} 年</text>`);
    document.getElementById('fd-axis').innerHTML=a;
    const cols=['var(--accent)','var(--blue)','var(--warm)'];
    document.getElementById('fd-paths').innerHTML=P.map((p,i)=>`<path class="fd-l" stroke="${cols[i]}" d="M${p.map((v,t)=>`${x(t).toFixed(1)},${y(v).toFixed(1)}`).join('L')}"/>`).join('');
  }
  document.getElementById('fd-re').addEventListener('click',paths);
  document.getElementById('fd').addEventListener('anim-in',()=>{let v=1;s.value=v;prob();const id=setInterval(()=>{v+=1;s.value=v;prob();if(v>=10)clearInterval(id);},120);});
  paths();
})();
</script>
