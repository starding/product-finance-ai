<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">信念随证据更新</p><p class="figsub">受托人实际上是可靠的。选择先验与证据的类型，逐次观察履约记录，看信念多快越过全权管理所需的门槛；再试试一次严重失误与一次模型版本更新。</p></div><button class="replay" type="button" id="by-reset">重新开始</button></div>
    <div class="by-c">
      <div class="seg-btns" role="group" aria-label="先验"><button type="button" data-pr="0.7" aria-pressed="false">有托管与监管的机构</button><button type="button" data-pr="0.3" aria-pressed="true">新的受托人</button></div>
      <div class="seg-btns" role="group" aria-label="证据"><button type="button" data-ev="r" aria-pressed="true">只看每年收益</button><button type="button" data-ev="p" aria-pressed="false">看过程记录</button></div>
    </div>
    <div class="by" id="by" data-anim>
      <svg viewBox="0 0 640 220" role="img" aria-label="信念随观察次数变化"><g id="by-ax"></g><path id="by-p" class="by-l"/><g id="by-mk"></g><circle id="by-d" r="6" fill="var(--ink)"/></svg>
      <div class="by-btn"><button type="button" class="replay" id="by-10">再观察 10 次</button><button type="button" class="replay" id="by-f">发生一次严重失误</button><button type="button" class="replay" id="by-v">模型版本更新</button></div>
      <p class="by-msg" id="by-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意模型：两种假设，可靠与不可靠。每年收益：可靠者有 55% 的年份表现较好，不可靠者 50%。过程记录（费用、约束、周期交代）：可靠者 97% 的周期守约，不可靠者 70%。严重失误：可靠者 0.2%，不可靠者 20%。旧记录逐次打折，每次保留九成；模型版本更新时，信念向先验回撤一半。思路见 Diamond（1989）、Jøsang 与 Ismail（2002）。</figcaption>
</figure>
<style>
.by-c{display:flex;flex-wrap:wrap;gap:4px 14px}
.by svg{width:100%;height:auto;display:block}
.by-l{fill:none;stroke:var(--accent);stroke-width:2.5}
.by-btn{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.by-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.by svg text{font-size:18px}}
</style>
<script>
(function(){
  const X0=50,X1=620,YT=14,YB=190,TH=.85,MAX=80,y=p=>YB-p*(YB-YT);
  const $=id=>document.getElementById(id);let prior=.3,ev='r',H=[],mk=[],seed=7;
  const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const lo=p=>Math.log(p/(1-p)),ex=l=>1/(1+Math.exp(-l));
  const x=i=>X0+i/MAX*(X1-X0);
  function reset(){H=[prior];mk=[];seed=7;draw('');}
  function step(){const L0=lo(prior),L=L0+(lo(H[H.length-1])-L0)*.9;let d;if(ev==='r'){const g=rnd()<.55;d=g?Math.log(.55/.5):Math.log(.45/.5);}else{const g=rnd()<.97;d=g?Math.log(.97/.7):Math.log(.03/.3);}H.push(ex(L+d));}
  function draw(msg){$('by-ax').innerHTML=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`+[0,.5,1].map(v=>`<text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+
      `<line x1="${X0}" x2="${X1}" y1="${y(TH)}" y2="${y(TH)}" stroke="var(--warm)" stroke-dasharray="4 4"/><text x="${X1}" y="${y(TH)-5}" text-anchor="end" font-size="11" class="t-warm">全权管理所需的门槛</text>`+[0,20,40,60,80].map(i=>`<text x="${x(i)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${i} 次</text>`).join('');
    const n=Math.min(H.length,MAX+1);$('by-p').setAttribute('d',H.slice(0,n).map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p).toFixed(1)).join(''));
    $('by-mk').innerHTML=mk.filter(([i])=>i<=MAX).map(([i,t])=>`<line x1="${x(i)}" x2="${x(i)}" y1="${YT}" y2="${YB}" stroke="${t==='f'?'var(--warm)':'var(--blue)'}" stroke-dasharray="2 3"/><text x="${x(i)+3}" y="${YT+10}" font-size="11" fill="${t==='f'?'var(--warm)':'var(--blue)'}">${t==='f'?'严重失误':'版本更新'}</text>`).join('');
    const p=H[n-1];$('by-d').setAttribute('cx',x(n-1));$('by-d').setAttribute('cy',y(p));
    $('by-msg').textContent=msg||`已观察 ${n-1} 次，信念为 ${(p*100).toFixed(0)}%。`+(ev==='r'?'每年收益的诊断力很低，信念几乎原地徘徊：好的受托人也要很多年才能证明自己。':'过程记录的诊断力高，信念很快越过门槛。');}
  function more(k){for(let i=0;i<k&&H.length<=MAX;i++)step();draw();}
  $('by-10').addEventListener('click',()=>more(10));
  $('by-f').addEventListener('click',()=>{if(H.length>MAX)return;const L=lo(H[H.length-1]);H.push(ex(L+Math.log(.002/.2)));mk.push([H.length-1,'f']);const p=H[H.length-1];draw(`一次严重失误，似然比约为 1 比 100：信念从 ${(H[H.length-2]*100).toFixed(0)}% 跌到 ${(p*100).toFixed(0)}%。此前许多次良好记录积累的信念，一次就失去了大半。`);});
  $('by-v').addEventListener('click',()=>{if(H.length>MAX)return;const L=lo(H[H.length-1]),L0=lo(prior);H.push(ex(L0+(L-L0)*.5));mk.push([H.length-1,'v']);draw(`模型版本更新后，过去的记录只部分适用：信念回撤到 ${(H[H.length-1]*100).toFixed(0)}%，需要新的证据重新积累。`);});
  document.querySelectorAll('[data-pr]').forEach(b=>b.addEventListener('click',()=>{prior=+b.dataset.pr;document.querySelectorAll('[data-pr]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));reset();}));
  document.querySelectorAll('[data-ev]').forEach(b=>b.addEventListener('click',()=>{ev=b.dataset.ev;document.querySelectorAll('[data-ev]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));reset();}));
  $('by-reset').addEventListener('click',reset);
  $('by').addEventListener('anim-in',()=>{reset();let k=0;const id=setInterval(()=>{more(2);k+=2;if(k>=40)clearInterval(id);},120);});
  reset();more(40);
})();
</script>
