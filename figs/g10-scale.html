<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">研究一次，用在所有人的钱上</p><p class="figsub">研究船队每年要花 30 份粮食的成本。拖动把船股交给同一位经理的户数，看平均到每户的研究成本。</p></div><button class="replay" type="button" data-replay="scl">重播</button></div>
    <div class="scl" id="scl" data-anim>
      <svg viewBox="0 0 640 200" role="img" aria-label="户数与每户分摊的研究成本"><g id="scl-ax"></g><path id="scl-c" class="scl-c"/><circle id="scl-p" r="6" fill="var(--ink)"/></svg>
      <div class="sl"><label for="scl-n">委托的户数 <b id="scl-nv"></b></label><input id="scl-n" type="range" min="0" max="100" step="1" value="0"></div>
      <p class="scl-msg" id="scl-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：研究的成本与管的钱多少无关，平均到每户 ＝ 30 ÷ 户数；横轴为对数刻度。</figcaption>
</figure>
<style>
.scl svg{width:100%;height:auto;display:block}
.scl-c{fill:none;stroke:var(--accent);stroke-width:2.5}
.scl-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.scl svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=46,X1=630,YT=12,YB=170,lx=n=>X0+Math.log(n)/Math.log(500)*(X1-X0),y=v=>YB-v/30*(YB-YT),nOf=v=>Math.max(1,Math.round(Math.pow(500,v/100)));
  $('scl-ax').innerHTML=[0,10,20,30].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+[1,5,10,50,100,500].map(n=>`<text x="${lx(n)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${n} 户</text>`).join('');
  let d='';for(let n=1;n<=500;n*=1.05)d+=(n===1?'M':'L')+lx(n).toFixed(1)+','+y(30/n).toFixed(1);$('scl-c').setAttribute('d',d);
  function draw(){const n=nOf(+$('scl-n').value),c=30/n;$('scl-p').setAttribute('cx',lx(n));$('scl-p').setAttribute('cy',y(c));$('scl-nv').textContent=n+' 户';
    $('scl-msg').textContent=n===1?'一户人家自己研究，要独自承担全部 30 份的成本。':`${n} 户委托同一位经理，每户只分摊 ${c<1?c.toFixed(2):c.toFixed(1)} 份。研究是一次投入、多次使用的，这正是委托与基金的规模优势。`;}
  $('scl-n').addEventListener('input',draw);
  $('scl').addEventListener('anim-in',()=>{let v=0;$('scl-n').value=0;draw();const id=setInterval(()=>{v+=4;$('scl-n').value=Math.min(v,100);draw();if(v>=100)clearInterval(id);},120);});
  draw();
})();
</script>
