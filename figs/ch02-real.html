<figure>
  <div class="card">
    <p class="figtitle">金额在增长，购买力未必</p>
    <p class="figsub">10,000 元存 20 年。调节名义利率与通胀率，比较账户上的金额与它能买到的东西。</p>
    <div class="rl" id="rl" data-anim>
      <svg viewBox="0 0 640 230" role="img" aria-label="名义金额与实际购买力随时间的变化">
        <g id="rl-axis"></g>
        <path id="rl-n" class="rl-l n"/><path id="rl-r" class="rl-l r"/>
        <text id="rl-tn" font-size="12" class="t-ink">账户金额</text><text id="rl-tr" font-size="12" class="t-warm">按今天的物价计算的购买力</text>
      </svg>
      <div class="rl-ctrl">
        <div class="sl"><label for="rl-i">名义利率 <b id="rl-iv"></b></label><input id="rl-i" type="range" min="0" max="8" step="0.5" value="2"></div>
        <div class="sl"><label for="rl-p">通胀率 <b id="rl-pv"></b></label><input id="rl-p" type="range" min="0" max="8" step="0.5" value="3"></div>
      </div>
      <div class="rl-out">
        <div><span>实际利率</span><b id="rl-rr"></b></div>
        <div><span>20 年后账户金额</span><b id="rl-fn"></b></div>
        <div><span>20 年后的购买力</span><b id="rl-fr"></b></div>
      </div>
    </div>
  </div>
  <figcaption>示例参数。实际利率按（1＋名义利率）÷（1＋通胀率）－1 计算，近似等于两者之差；关系见 Fisher（1930）。</figcaption>
</figure>
<style>
.rl svg{width:100%;height:auto;display:block}
.rl-l{fill:none;stroke-width:2.5}
.rl-l.n{stroke:var(--ink)} .rl-l.r{stroke:var(--warm)}
.rl-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rl-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rl-out div{background:var(--quote);border-radius:8px;padding:8px 12px}
.rl-out span{display:block;font-size:12px;color:var(--faint)}
.rl-out b{font-size:19px;font-variant-numeric:tabular-nums}
#rl-rr.neg{color:var(--warm)}
@media (max-width:640px){.rl-ctrl,.rl-out{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const T=20,X0=56,X1=620,Y0=196,Y1=16,V0=0,x=t=>X0+t/T*(X1-X0);
  let V1=20000; const y=v=>Y0-(v-V0)/(V1-V0)*(Y0-Y1);
  function axis(){let a=`<line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" class="s-faint"/>`;
    [0,5,10,15,20].forEach(t=>a+=`<text x="${x(t)}" y="${Y0+16}" text-anchor="middle" font-size="11" class="t-faint">${t} 年</text>`);
    const st=V1/4;for(let v=st;v<=V1;v+=st)a+=`<line x1="${X0}" y1="${y(v)}" x2="${X1}" y2="${y(v)}" class="s-line"/><text x="${X0-8}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${(v/10000).toFixed(v%10000?1:0)} 万</text>`;
    document.getElementById('rl-axis').innerHTML=a;}
  const i=document.getElementById('rl-i'), p=document.getElementById('rl-p'), fmt=v=>Math.round(v).toLocaleString('zh-CN');
  function render(){
    const r=+i.value/100, q=+p.value/100;
    document.getElementById('rl-iv').textContent=i.value+'%'; document.getElementById('rl-pv').textContent=p.value+'%';
    const N=t=>10000*Math.pow(1+r,t), R=t=>N(t)/Math.pow(1+q,t);
    V1=Math.max(20000,Math.ceil(Math.max(N(T),R(T))/10000)*10000); axis();
    const P=f=>'M'+Array.from({length:T+1},(_,t)=>`${x(t).toFixed(1)},${y(Math.min(V1,f(t))).toFixed(1)}`).join('L');
    document.getElementById('rl-n').setAttribute('d',P(N)); document.getElementById('rl-r').setAttribute('d',P(R));
    const tn=document.getElementById('rl-tn'),tr=document.getElementById('rl-tr');
    tn.setAttribute('x',x(13));tn.setAttribute('y',y(Math.min(V1,N(13)))-8);tr.setAttribute('x',x(9));tr.setAttribute('y',y(R(9))+18);
    const rr=(1+r)/(1+q)-1, e=document.getElementById('rl-rr');
    e.textContent=(rr*100).toFixed(2)+'%'; e.className=rr<0?'neg':'';
    document.getElementById('rl-fn').textContent=fmt(N(T))+' 元'; document.getElementById('rl-fr').textContent=fmt(R(T))+' 元';
  }
  [i,p].forEach(el=>el.addEventListener('input',render)); render();
})();
</script>
