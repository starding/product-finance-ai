<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">因子模型的演进</p><p class="figsub">每一次扩展，都是为了解释上一代模型解释不了的收益差异。点按一个因子查看它的构造与经济解释。</p></div><button class="replay" type="button" data-replay="fm6">重播</button></div>
    <div class="fm6" id="fm6" data-anim>
      <div class="fm6-row" style="--i:0"><span class="fm6-y">1964</span><span class="fm6-n">资本资产定价模型</span><div class="fm6-chips"><button data-f="mkt">市场</button></div></div>
      <div class="fm6-row" style="--i:1"><span class="fm6-y">1993</span><span class="fm6-n">三因子模型</span><div class="fm6-chips"><button data-f="mkt" class="old">市场</button><button data-f="smb">规模</button><button data-f="hml">价值</button></div></div>
      <div class="fm6-row" style="--i:2"><span class="fm6-y">1997</span><span class="fm6-n">四因子模型</span><div class="fm6-chips"><button data-f="mkt" class="old">市场</button><button data-f="smb" class="old">规模</button><button data-f="hml" class="old">价值</button><button data-f="mom">动量</button></div></div>
      <div class="fm6-row" style="--i:3"><span class="fm6-y">2015</span><span class="fm6-n">五因子模型</span><div class="fm6-chips"><button data-f="mkt" class="old">市场</button><button data-f="smb" class="old">规模</button><button data-f="hml" class="old">价值</button><button data-f="rmw">盈利能力</button><button data-f="cma">投资方式</button></div></div>
    </div>
    <div class="fm6-d" id="fm6-d" aria-live="polite">点按一个因子。</div>
  </div>
  <figcaption>三因子与五因子见 Fama 与 French（1993、2015），动量因子见 Carhart（1997），动量现象见 Jegadeesh 与 Titman（1993）。五因子模型不含动量；动量常与之并用。</figcaption>
</figure>
<style>
.fm6-row{display:grid;grid-template-columns:52px 120px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateX(-8px);transition:opacity .4s,transform .4s;transition-delay:calc(var(--i)*.4s)}
.fm6.in .fm6-row{opacity:1;transform:none}
.fm6-y{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.fm6-n{font-size:13px;font-weight:700}
.fm6-chips{display:flex;flex-wrap:wrap;gap:6px}
.fm6-chips button{font:inherit;font-size:12.5px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.fm6-chips button.old{background:transparent;border-color:var(--line);color:var(--muted)}
.fm6-chips button.sel{outline:2px solid var(--ink)}
.fm6-d{margin-top:12px;background:var(--quote);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.7;min-height:5em}
.fm6-d dl{display:grid;grid-template-columns:72px 1fr;gap:2px 10px;margin:4px 0 0}
.fm6-d dt{font-size:12px;color:var(--faint);padding-top:3px}
.fm6-d dd{margin:0}
@media (max-width:640px){.fm6-row{grid-template-columns:44px 1fr}.fm6-chips{grid-column:1/-1}}
</style>
<script>
(function(){
  const D={
    mkt:['市场','整个股票市场相对无风险资产的超额收益','经济整体的波动无法分散'],
    smb:['规模','买入小市值公司、卖出大市值公司','小公司更脆弱、流动性更差，经济不好时更容易陷入困境'],
    hml:['价值','买入账面市值比高的公司、卖出账面市值比低的公司','风险解释：价值股常是陷入困境的公司；行为解释：投资者对前景暗淡的公司过度悲观'],
    mom:['动量','买入过去约一年涨得多的股票、卖出涨得少的','多数研究倾向于行为解释：投资者对新信息反应不足；动量在市场急剧反转时可能大幅亏损'],
    rmw:['盈利能力','买入盈利能力强的公司、卖出盈利能力弱的公司','在价格相同的情况下，盈利能力越强，隐含的预期回报越高'],
    cma:['投资方式','买入资产扩张保守的公司、卖出扩张激进的公司','扩张激进的公司往往在高估值时大举投资，此后回报偏低']
  };
  const d=document.getElementById('fm6-d'), bs=[...document.querySelectorAll('#fm6 [data-f]')];
  bs.forEach(b=>b.addEventListener('click',()=>{bs.forEach(x=>x.classList.toggle('sel',x.dataset.f===b.dataset.f));const v=D[b.dataset.f];
    d.innerHTML=`<b>${v[0]}因子</b><dl><dt>构造</dt><dd>${v[1]}</dd><dt>经济解释</dt><dd>${v[2]}</dd></dl>`;}));
})();
</script>
