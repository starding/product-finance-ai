<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">越着急，卖得越便宜</p><p class="figsub">一份船股按前景值 10 份粮食。卖的人每天能问三户，每户有一成半的可能愿意买、出价在 6～12 份之间。拖动最多能等的天数，看按最好的办法卖，平均能卖多少。</p></div><button class="replay" type="button" data-replay="se">重播</button></div>
    <div class="se" id="se" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="能等的天数与平均卖价"><g id="se-ax"></g><path id="se-c" class="se-c"/><circle id="se-p" r="6" fill="var(--ink)"/></svg>
      <div class="sl"><label for="se-d">最多能等 <b id="se-dv"></b></label><input id="se-d" type="range" min="0" max="30" step="1" value="2"></div>
      <p class="se-msg" id="se-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：期限到了还没卖出，只能以 5 份贱卖给愿意收的人。最好的办法是每天比较当天的出价与继续等下去的预期所得，出价更高就卖（按倒推计算）。</figcaption>
</figure>
<style>
.se svg{width:100%;height:auto;display:block}
.se-c{fill:none;stroke:var(--accent);stroke-width:2.5}
.se-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.se svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),A=6,B=12,p=1-Math.pow(.85,3),X0=46,X1=630,YT=12,YB=178,x=d=>X0+d/30*(X1-X0),y=v=>YB-(v-4)/7*(YB-YT);
  const Emax=v=>v<=A?(A+B)/2:v>=B?v:((B*B-v*v)/2+v*(v-A))/(B-A);
  const V=[5];for(let k=1;k<=30;k++)V.push(p*Emax(V[k-1])+(1-p)*V[k-1]);
  $('se-ax').innerHTML=[5,7,9,10,11].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="${v===10?'s-faint':'s-line'}"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+[0,5,10,15,20,25,30].map(d=>`<text x="${x(d)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${d} 天</text>`).join('')+`<text x="${X1}" y="${y(10)-5}" text-anchor="end" font-size="11" class="t-muted">按前景值 10 份</text>`;
  $('se-c').setAttribute('d',V.map((v,d)=>(d?'L':'M')+x(d).toFixed(1)+','+y(v).toFixed(1)).join(''));
  function draw(){const d=+$('se-d').value;$('se-p').setAttribute('cx',x(d));$('se-p').setAttribute('cy',y(V[d]));$('se-dv').textContent=d+' 天';
    $('se-msg').textContent=d===0?'一天也等不了，只能以 5 份贱卖，只有前景值的一半。':V[d]<10?`最多能等 ${d} 天，平均能卖 ${V[d].toFixed(1)} 份，比前景值少 ${(10-V[d]).toFixed(1)} 份。能等得越久，越能挑到好的出价；可是急用的人往往等不起。`:`最多能等 ${d} 天，平均能卖 ${V[d].toFixed(1)} 份：等得足够久，甚至能挑到出价高于前景值的买方。不着急的卖方占了便宜，急用的人却等不起。`;}
  $('se-d').addEventListener('input',draw);
  $('se').addEventListener('anim-in',()=>{let v=0;$('se-d').value=0;draw();const id=setInterval(()=>{v++;$('se-d').value=v;draw();if(v>=30)clearInterval(id);},90);});
  draw();
})();
</script>
