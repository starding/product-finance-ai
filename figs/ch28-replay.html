<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">回放过去的决定</p><p class="figsub">八次已记录的决定，保存了输入、依据的条款与模型版本。先用原版本回放，检查能否复现；再用新版本回放，看新版本会在哪些地方作出不同的决定。</p></div></div>
    <div class="by-btn"><button type="button" class="replay" id="rp-1">用原版本回放</button><button type="button" class="replay" id="rp-2">用新版本回放</button></div>
    <div class="rp" id="rp" data-anim></div>
    <p class="rp-msg" id="rp-msg" aria-live="polite">选择一种回放。</p>
  </div>
  <figcaption>示意。可重复性要求公开数据与代码，见 Peng（2011）；对代理而言，还需要保存当时的数据时点、条款与模型版本。</figcaption>
</figure>
<style>
.by-btn{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.rp{display:grid;gap:4px}
.rp-r{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;font-size:12.5px;background:var(--quote);border-radius:7px;padding:6px 10px}
.rp-r.h{background:none;font-size:11.5px;color:var(--faint)}
.rp-r i{font-style:normal;border-radius:5px;padding:2px 6px;opacity:0;transition:opacity .3s;transition-delay:calc(var(--i)*.15s)}
.rp.go .rp-r i{opacity:1}
.rp-r i.same{background:var(--accent-soft);color:var(--accent)} .rp-r i.diff{background:var(--warm-soft);color:var(--warm)}
.rp-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.rp-r{grid-template-columns:1fr 1fr}.rp-r span:first-child{grid-column:1/-1}}
</style>
<script>
(function(){
  const D=[['到期提醒：期权实值','提醒并请示','提醒并请示'],['再平衡：偏离 6%','按方案执行','按方案执行'],['新闻：同业公司被调查','记录，不提醒','提醒，说明关联'],['供股：认购截止前三天','提醒并请示','提醒并请示'],['数据源中断','标记受阻','标记受阻'],['单一持仓升至 31%','请示减仓','请示减仓'],['分红到账','按约定再投资','按约定再投资'],['波动加大，未触发约束','不操作','建议降低仓位']];
  const box=document.getElementById('rp');
  function show(v){box.classList.remove('go');box.innerHTML=`<div class="rp-r h"><span>记录的事件</span><span>当时的决定</span><span>回放结果</span></div>`+D.map(([e,a,b],i)=>{const r=v===1?a:b,s=r===a;return `<div class="rp-r"><span>${e}</span><span>${a}</span><i class="${s?'same':'diff'}" style="--i:${i}">${r}${s?'':'（不同）'}</i></div>`;}).join('');
    void box.offsetWidth;box.classList.add('go');
    document.getElementById('rp-msg').textContent=v===1?'用原版本与当时的输入回放，八次决定全部复现：记录是完整的，过去的决定可以被还原与检验。':'新版本在两处作出了不同的决定：一处多了提醒，一处多了降低仓位的建议。更换版本之前，这些变化应当先告诉委托人。';}
  document.getElementById('rp-1').addEventListener('click',()=>show(1));document.getElementById('rp-2').addEventListener('click',()=>show(2));
  box.addEventListener('anim-in',()=>{show(1);setTimeout(()=>show(2),3000);});
  show(1);
})();
</script>
