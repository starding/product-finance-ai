<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">文明模拟器 · 第 16 章：人人都有分析师的集市</p><p class="figsub">四十户人家决定是否让书记员替自己分析公开的报告。两条线是认知劳动的价格从原价降到百分之一时，愿意分析的人家与价格提前反映的公开信息；圆点是当前的价格。再打开“少数人家独占不公开的数据”，看优势转到了哪里。</p></div><button class="replay" type="button" data-replay="cs16">重播</button></div>
    <div class="cs-rules"><span class="on">价格中的信息</span><span class="on">参数：认知劳动的价格</span><span class="on">专属代理</span><span class="on">代理的担保</span><span class="on">人人都有分析师</span><span class="lock">代理成为市场参与者 · 第 17 章</span></div>
    <div class="cs16" id="cs16" data-anim>
      <svg viewBox="0 0 660 220" role="img" aria-label="知情者比例与价格反映的信息"><g id="cs16-g"></g></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>愿意分析的人家</span><span><i style="background:var(--blue)"></i>价格提前反映的公开信息</span></div>
      <div class="sl"><label for="cs16-c">认知劳动的价格 <b id="cs16-cv"></b></label><input id="cs16-c" type="range" min="0" max="2" step="0.1" value="0"></div>
      <div class="cs-sw"><label><input type="checkbox" id="cs16-x"> 少数人家（一成）独占不公开的数据</label></div>
      <div class="cs16-out" id="cs16-out"></div>
      <p class="cs16-msg" id="cs16-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意模型：与“打听的人停在哪里”一图相同。分析公开报告的成本原为每人每年 0.8 份，按认知劳动的价格同比例下降；知情者比例停在每人的好处恰好等于成本处。独占数据每年带来 3 份优势，由一成人家分享，钱来自不掌握这些数据而参与买卖的人家，不随认知劳动的价格变化。横轴为认知劳动的价格，对数刻度。</figcaption>
</figure>
<style>
.cs16 svg{width:100%;height:auto;display:block}
.cs16-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cs16-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.cs16-out span{display:block;font-size:11.5px;color:var(--faint)} .cs16-out b{font-size:18px;font-variant-numeric:tabular-nums}
.cs16-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.cs16-out{grid-template-columns:1fr}.cs16 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cs16'+id),N=40,V=9.6,K=.1,VX=3,D=.1,X0=50,X1=628,YT=12,YB=180,x=l=>X0+l/2*(X1-X0),y=v=>YB-v*(YB-YT);
  const gain=f=>V*(K/(f+K))*(1-f)/(f*N);
  function eq(c){if(gain(1/N)<=c)return 1/N;let lo=1/N,hi=.999;if(gain(hi)>c)return hi;for(let k=0;k<60;k++){const m=(lo+hi)/2;if(gain(m)>c)lo=m;else hi=m;}return lo;}
  function draw(){const l=+$('-c').value,a=Math.pow(10,-l),c=.8*a,f=eq(c),sh=f/(f+K),xo=$('-x').checked;$('-cv').textContent=a>=.1?Math.round(a*100)+'%':(a*100).toFixed(1)+'%';
    let h=[0,.25,.5,.75,1].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+[[0,'原价'],[1,'10%'],[2,'1%']].map(([v,t])=>`<text x="${x(v)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${t}</text>`).join('')+`<text x="${X1}" y="${YB+30}" text-anchor="end" font-size="11" class="t-faint">认知劳动的价格 →</text>`;
    let dF='',dS='';for(let k=0;k<=40;k++){const ll=k/20,ff=eq(.8*Math.pow(10,-ll));dF+=(k?'L':'M')+x(ll).toFixed(1)+','+y(ff).toFixed(1);dS+=(k?'L':'M')+x(ll).toFixed(1)+','+y(ff/(ff+K)).toFixed(1);}
    h+=`<path d="${dF}" fill="none" stroke="var(--accent)" stroke-width="2.6"/><path d="${dS}" fill="none" stroke="var(--blue)" stroke-width="2.6"/><circle cx="${x(l)}" cy="${y(f)}" r="6" fill="var(--accent)"/><circle cx="${x(l)}" cy="${y(sh)}" r="6" fill="var(--blue)"/>`;
    $('-g').innerHTML=h;const per=c;
    $('-out').innerHTML=[['愿意分析的人家',Math.round(f*N)+' 户'],['每位分析者每年的好处',per<.1?per.toFixed(3)+' 份':per.toFixed(2)+' 份'],[xo?'每户数据持有者每年':'价格提前反映的公开信息',xo?(VX/(D*N)).toFixed(2)+' 份':Math.round(sh*100)+'%']].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('');
    $('-msg').textContent=(l===0?`认知劳动按原价计，只有 ${Math.round(f*N)} 户愿意花钱分析，价格提前反映约 ${Math.round(sh*100)}% 的公开信息。`:`认知劳动的价格降到 ${a>=.1?Math.round(a*100):(a*100).toFixed(1)}%，愿意分析的人家增加到 ${Math.round(f*N)} 户，价格提前反映约 ${Math.round(sh*100)}% 的公开信息；每位分析者的好处跟着成本降到 ${per<.1?per.toFixed(3):per.toFixed(2)} 份，读报告本身几乎不再值钱。`)+(xo?`独占不公开数据的 4 户人家，每户每年仍有 ${(VX/(D*N)).toFixed(2)} 份的优势，书记员再便宜也读不到这些数据。`:'');}
  ['-c','-x'].forEach(k=>$(k).addEventListener('input',draw));
  $('').addEventListener('anim-in',()=>{$('-x').checked=false;let v=0;$('-c').value=0;draw();const id=setInterval(()=>{v+=.1;$('-c').value=v.toFixed(1);draw();if(v>=2){clearInterval(id);setTimeout(()=>{$('-x').checked=true;draw();},1200);}},150);});
  draw();
})();
</script>
