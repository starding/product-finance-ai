<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">本章小结：按交易动机设计产品</p><p class="figsub">四条设计要求，各自对应本章的一个机制。</p></div><button class="replay" type="button" data-replay="s04">重播</button></div>
    <div class="s04" id="s04" data-anim>
      <div class="s04-c" style="--i:0"><em>动机决定输赢的意义</em><b>先弄清用户为什么交易</b><p>为养老、换汇、对冲还是娱乐，决定了什么样的帮助有用；动机只用于提供服务，不给用户贴标签。</p></div>
