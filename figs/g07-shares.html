<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">把 5 份分到许多艘船上</p><p class="figsub">每户拿出 5 份投资造船，平均分到若干艘船上，各艘船是否沉没互不相关。拖动投资的船数，看这 5 份最后可能变成多少。</p></div><button class="replay" type="button" data-replay="sr">重播</button></div>
    <div class="sr" id="sr" data-anim>
      <svg viewBox="0 0 640 200" role="img" aria-label="投资结果的分布"><g id="sr-ax"></g><g id="sr-b"></g></svg>
      <div class="sl"><label for="sr-k">投资的船数 <b id="sr-kv"></b></label><input id="sr-k" type="range" min="1" max="20" step="1" value="1"></div>
      <p class="sr-msg" id="sr-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：每艘船七成回来，回来时价值为投入的两倍半；柱子为各种结果的概率，按二项分布精确计算。</figcaption>
</figure>
<style>
.sr svg{width:100%;height:auto;display:block}
.sr-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.sr svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=40,X1=630,YT=10,YB=170,x=v=>X0+v/12.5*(X1-X0),y=p=>YB-p/1*(YB-YT);
  $('sr-ax').innerHTML=`<line x1="${X0}" x2="${X1}" y1="${YB}" y2="${YB}" class="s-faint"/>`+[0,2.5,5,7.5,10,12.5].map(v=>`<text x="${x(v)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${v}</text>`).join('')+`<text x="${X1}" y="${YB-6}" text-anchor="end" font-size="11" class="t-muted">5 份最后变成的份数</text>`+`<line x1="${x(5)}" x2="${x(5)}" y1="${YT}" y2="${YB}" class="s-faint" stroke-dasharray="3 4"/>`;
  const C=(n,k)=>{let r=1;for(let i=0;i<k;i++)r=r*(n-i)/(i+1);return r;};
  function draw(){const k=+$('sr-k').value;let h='',pl=0;
    for(let s=0;s<=k;s++){const p=C(k,s)*Math.pow(.7,s)*Math.pow(.3,k-s),v=12.5*s/k;if(v<5)pl+=p;h+=`<rect x="${x(v)-6}" y="${y(p)}" width="12" height="${YB-y(p)}" rx="2" fill="${v<5?'var(--warm)':'var(--accent)'}"/>`;}
    $('sr-b').innerHTML=h;$('sr-kv').textContent=k+' 艘';
    $('sr-msg').textContent=k===1?'全部押在一艘船上：七成的可能变成 12.5 份，三成的可能一份不剩。':`分到 ${k} 艘船上，平均结果不变，仍是 8.75 份；但一份不剩的可能降到 ${(Math.pow(.3,k)*100).toFixed(k>3?3:1)}%，亏本的可能为 ${Math.round(pl*100)}%。分散没有降低平均所得，只降低了波动。`;}
  $('sr-k').addEventListener('input',draw);
  $('sr').addEventListener('anim-in',()=>{const seq=[1,2,3,5,8,12,20];seq.forEach((v,i)=>setTimeout(()=>{$('sr-k').value=v;draw();},200+i*500));});
  draw();
})();
</script>
