<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">只看结果，分不清好坏</p><p class="figsub">二十位书记员中有四位违约：在约定之外多冒风险。每一点是一位书记员一年的结果。拖动观察的年数，看守约者与违约者能否被结果分开。</p></div><button class="replay" type="button" data-replay="bk22">重播</button></div>
    <div class="bk22" id="bk22" data-anim>
      <svg viewBox="0 0 660 190" role="img" aria-label="守约者与违约者的结果"><g id="bk22-g"></g></svg>
      <div class="legend"><span><i style="background:var(--accent);border-radius:50%"></i>守约的书记员</span><span><i style="background:var(--warm);border-radius:50%"></i>违约的书记员</span></div>
      <div class="sl"><label for="bk22-n">观察的年数 <b id="bk22-nv"></b></label><input id="bk22-n" type="range" min="1" max="20" step="1" value="1"></div>
      <p class="bk22-msg" id="bk22-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：守约者每年平均收益 5%，各自的波动为 10%；违约者多冒险，平均收益 6%、波动 22%；所有人还共同承受同一个年景。横轴为观察期内的年化收益。</figcaption>
</figure>
<style>
.bk22 svg{width:100%;height:auto;display:block}
.bk22-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.bk22 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('bk22'+id),N=20,X0=40,X1=628,x=v=>X0+(v+.3)/.6*(X1-X0);
  let s=2201;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};const g=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());};
  const Y=20,M=Array.from({length:Y},()=>.12*g()),E=Array.from({length:N},()=>Array.from({length:Y},g));
  function draw(){const n=+$('-n').value;$('-nv').textContent=n+' 年';
    const R=E.map((e,i)=>{const bad=i<4;let w=1;for(let t=0;t<n;t++)w*=1+(bad?.06:.05)+M[t]*(bad?1.3:1)+(bad?.22:.10)*e[t];return [Math.pow(Math.max(w,.01),1/n)-1,bad];});
    let h=[-.2,-.1,0,.1,.2].map(v=>`<line x1="${x(v)}" x2="${x(v)}" y1="20" y2="150" class="s-line"/><text x="${x(v)}" y="168" text-anchor="middle" font-size="11" class="t-faint">${Math.round(v*100)}%</text>`).join('');
    R.forEach(([v,b],i)=>{h+=`<circle cx="${x(Math.max(-.29,Math.min(.29,v)))}" cy="${b?60:110}" r="7" fill="${b?'var(--warm)':'var(--accent)'}" opacity=".8"/>`;});
    h+=`<text x="${X0}" y="56" font-size="11" class="t-faint">违约</text><text x="${X0}" y="106" font-size="11" class="t-faint">守约</text>`;
    $('-g').innerHTML=h;const gm=R.filter(r=>!r[1]).map(r=>r[0]),bm=R.filter(r=>r[1]).map(r=>r[0]),mx=Math.max(...gm),better=bm.filter(v=>v>mx).length,inside=bm.filter(v=>v>=Math.min(...gm)).length;
    $('-msg').textContent=n<5?`只看 ${n} 年的结果：4 位违约者中有 ${inside} 位的结果不比最差的守约者差${better?`，其中 ${better} 位比所有守约者都好`:''}。委托人分不清谁守约、谁违约。`:`看了 ${n} 年，违约者的结果开始散得更开，可仍有 ${inside} 位的结果不比最差的守约者差。靠结果分辨，要等太久。`;}
  $('-n').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{let v=1;$('-n').value=1;draw();const id=setInterval(()=>{v+=1;$('-n').value=v;draw();if(v>=20)clearInterval(id);},200);});
  draw();
})();
</script>
