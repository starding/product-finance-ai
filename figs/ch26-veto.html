<figure>
  <div class="card">
    <p class="figtitle">否决窗口开多长</p>
    <p class="figsub">代理提出一项操作，距截止时刻还有 24 小时。委托人平均约 6 小时后看到消息。拖动否决窗口的长度，看委托人来得及看到的概率，以及错过截止时刻的风险。</p>
    <div class="vt" id="vt" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="否决窗口与两类风险"><g id="vt-ax"></g><path id="vt-a" class="vt-l a"/><path id="vt-b" class="vt-l b"/><line id="vt-c" class="vt-c"/></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>委托人来得及看到</span><span><i style="background:var(--warm)"></i>错过截止时刻的风险</span></div>
      <div class="sl"><label for="vt-w">否决窗口 <b id="vt-wv"></b></label><input id="vt-w" type="range" min="1" max="30" step="1" value="12"></div>
      <p class="vt-msg" id="vt-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意计算：委托人看到消息的时间服从均值 6 小时的指数分布；窗口结束后执行，执行需要 2 小时，晚于截止时刻即为错过。限时否决的分级见 Sheridan 与 Verplank（1978），表述参照 Parasuraman、Sheridan 与 Wickens（2000）。</figcaption>
</figure>
<style>
.vt svg{width:100%;height:auto;display:block}
.vt-l{fill:none;stroke-width:2.5} .vt-l.a{stroke:var(--accent)} .vt-l.b{stroke:var(--warm)}
.vt-c{stroke:var(--ink);stroke-dasharray:3 3}
.vt-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.vt svg text{font-size:18px}}
</style>
<script>
(function(){
  const D=24,E=2,M=6,X0=56,X1=620,YT=14,YB=176,x=w=>X0+(w-1)/29*(X1-X0),y=v=>YB-v*(YB-YT);
  const See=w=>1-Math.exp(-w/M),Miss=w=>w+E>D?1:Math.max(0,(w+E-(D-6))/6)*.3;
  const $=id=>document.getElementById(id),sl=$('vt-w');
  $('vt-ax').innerHTML=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`+[0,.5,1].map(v=>`<text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+[1,6,12,18,24,30].map(w=>`<text x="${x(w)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${w} 小时</text>`).join('')+`<line x1="${x(D-E)}" y1="${YT}" x2="${x(D-E)}" y2="${YB}" stroke="var(--warm)" stroke-dasharray="2 3"/><text x="${x(D-E)-4}" y="${YT+10}" text-anchor="end" font-size="11" class="t-warm">再晚就来不及执行</text>`;
  let a='',b='';for(let w=1;w<=30;w+=.25){a+=(w>1?'L':'M')+x(w).toFixed(1)+','+y(See(w)).toFixed(1);b+=(w>1?'L':'M')+x(w).toFixed(1)+','+y(Miss(w)).toFixed(1);}$('vt-a').setAttribute('d',a);$('vt-b').setAttribute('d',b);
  function r(){const w=+sl.value;$('vt-wv').textContent=w+' 小时';$('vt-c').setAttribute('x1',x(w));$('vt-c').setAttribute('x2',x(w));$('vt-c').setAttribute('y1',YT);$('vt-c').setAttribute('y2',YB);
    const s=See(w),m=Miss(w);$('vt-msg').textContent=w<4?`窗口只有 ${w} 小时，委托人来得及看到的概率只有 ${(s*100).toFixed(0)}%：多数时候操作在没人看过的情况下执行，名义上可否决，实际接近自动。`:m>=1?`窗口 ${w} 小时，执行时已经过了截止时刻：再稳妥的确认也失去了意义。临近截止时刻，应当回到逐笔确认并提高提醒强度。`:`窗口 ${w} 小时，委托人来得及看到的概率约 ${(s*100).toFixed(0)}%，错过截止时刻的风险${m<.05?'很小':'开始上升'}。`;}
  sl.addEventListener('input',r);
  $('vt').addEventListener('anim-in',()=>{let w=1;sl.value=1;r();const id=setInterval(()=>{w++;sl.value=w;r();if(w>=26){clearInterval(id);setTimeout(()=>{sl.value=12;r();},700);}},120);});
  r();
})();
</script>
