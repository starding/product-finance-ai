<figure>
  <div class="card">
    <p class="figtitle">可逆性与损失上限决定授权的上限</p>
    <p class="figsub">横向是出错后能否撤回，纵向是损失有没有上限。每一格标出可以授予的最高级别。点按一项操作查看说明。</p>
    <div class="rv2" id="rv2" data-anim>
      <div class="rv2-h"><span></span><span>可以撤回</span><span>可以补救</span><span>无法撤回</span></div>
      <div class="rv2-row"><span class="rv2-y">损失小且有上限</span><div class="rv2-c" data-lv="6"></div><div class="rv2-c" data-lv="5"></div><div class="rv2-c" data-lv="4"></div></div>
      <div class="rv2-row"><span class="rv2-y">损失可能很大</span><div class="rv2-c" data-lv="4"></div><div class="rv2-c" data-lv="3"></div><div class="rv2-c" data-lv="3"></div></div>
    </div>
    <p class="rv2-msg" id="rv2-msg" aria-live="polite">点按一项操作。</p>
  </div>
  <figcaption>示意判断。级别对应授权的六级阶梯：3 为逐笔确认，4 为方案批准，5 为限时可否决，6 为范围内自主。具体操作的归属还取决于金额与账户情况。</figcaption>
</figure>
<style>
.rv2-h,.rv2-row{display:grid;grid-template-columns:90px repeat(3,1fr);gap:6px}
.rv2-h span{font-size:11.5px;color:var(--faint);text-align:center}
.rv2-row{margin-top:6px}
.rv2-y{font-size:12px;color:var(--faint);align-self:center}
.rv2-c{background:var(--quote);border-radius:10px;padding:8px;min-height:110px;display:flex;flex-direction:column;gap:5px;position:relative}
.rv2-c::before{content:"最高第 " attr(data-lv) " 级";font-size:11px;color:var(--faint)}
.rv2-c[data-lv="6"],.rv2-c[data-lv="5"]{background:var(--accent-soft)}
.rv2-c[data-lv="3"]{background:var(--warm-soft)}
.rv2-i{font:inherit;text-align:left;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--surface);color:var(--ink);cursor:pointer;opacity:0;transform:translateY(5px);transition:opacity .3s,transform .3s;transition-delay:calc(var(--i)*.1s)}
.rv2.in .rv2-i{opacity:1;transform:none}
.rv2-i.sel{border-color:var(--ink)}
.rv2-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.rv2-h,.rv2-row{grid-template-columns:56px repeat(3,1fr)}.rv2-i{font-size:11.5px}}
</style>
<script>
(function(){
  const A=[[0,0,'生成一份摘要','错了可以重写，没有资金后果，可以自主完成。'],[0,0,'设置一个价格提醒','随时可以改回，自主即可。'],[0,1,'按计划小额定投','单笔有限，下一期可以修正，适合限时可否决。'],[0,2,'撤销一笔未成交的挂单','撤单本身无法撤回，但损失有限，可在方案内执行。'],
    [1,0,'修改账户的提醒与通知规则','改错了可以改回，但可能让用户错过重要事件，宜方案批准。'],[1,1,'按约定比例再平衡','可以下次再调回，但单次金额可能较大，宜逐笔确认或方案批准。'],[1,2,'卖出一笔持仓','成交后无法撤回，损失可能很大，必须逐笔确认。'],[1,2,'转出资金','无法撤回，必须由本人确认。'],[1,2,'接受收购要约或行使期权','一经提交即不可撤回，必须由本人确认。']];
  const cells=[...document.querySelectorAll('.rv2-c')];let n=0;
  A.forEach(([r,c,t,d])=>{const b=document.createElement('button');b.type='button';b.className='rv2-i';b.style.setProperty('--i',n++);b.textContent=t;b.dataset.d=d;cells[r*3+c].appendChild(b);});
  const bs=[...document.querySelectorAll('.rv2-i')];
  bs.forEach(b=>b.addEventListener('click',()=>{bs.forEach(x=>x.classList.toggle('sel',x===b));document.getElementById('rv2-msg').textContent=b.textContent+'：'+b.dataset.d;}));
})();
</script>
