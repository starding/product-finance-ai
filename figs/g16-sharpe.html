<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">挑选便宜了，算术没有变</p><p class="figsub">全部船股一年的平均收益为 6%。被动持有全部的人只付 0.1% 的费用。拖动主动挑选的成本，看主动者作为整体扣除成本后的收益。</p></div><button class="replay" type="button" data-replay="sh16">重播</button></div>
    <div class="sh16" id="sh16" data-anim>
      <div class="sh16-bars" id="sh16-b"></div>
      <div class="sl"><label for="sh16-c">主动挑选的成本 <b id="sh16-cv"></b></label><input id="sh16-c" type="range" min="0.1" max="2" step="0.1" value="1.5"></div>
      <p class="sh16-msg" id="sh16-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：按夏普（1991）的算术，主动者作为整体在扣除成本之前的收益等于市场平均；图中横条从 5% 起画，以便看清差距。</figcaption>
</figure>
<style>
.sh16-bars{display:grid;gap:12px;margin:6px 0 10px}
.sh16-r{display:grid;grid-template-columns:10em 1fr 4em;gap:10px;align-items:center;font-size:12.5px}
.sh16-r div{height:22px;background:var(--quote);border-radius:5px;overflow:hidden}
.sh16-r i{display:block;height:100%;transition:width .4s}
.sh16-r b{text-align:right;font-variant-numeric:tabular-nums}
.sh16-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.sh16-r{grid-template-columns:1fr 4em}.sh16-r span{grid-column:1/-1}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('sh16'+id),M=6,w=v=>Math.max(0,(v-5)/1.2*100);
  function draw(){const c=+$('-c').value;$('-cv').textContent=c.toFixed(1)+'%';
    $('-b').innerHTML=[['全部船股的平均',M,'var(--faint)'],['被动持有者，扣除成本后',M-.1,'var(--accent)'],['主动者整体，扣除成本前',M,'var(--blue)'],['主动者整体，扣除成本后',M-c,'var(--warm)']].map(([k,v,col])=>`<div class="sh16-r"><span>${k}</span><div><i style="width:${w(v)}%;background:${col}"></i></div><b>${v.toFixed(1)}%</b></div>`).join('');
    $('-msg').textContent=c<=.1?'主动挑选的成本降到与被动持有一样低，两者作为整体扣除成本后的收益相同：主动者整体不会领先，只是不再落后。':`主动挑选的成本为 ${c.toFixed(1)}%，主动者作为整体每年落后 ${(c-.1).toFixed(1)} 个百分点。书记员把成本压得越低，落后越少，但不会变成领先。`;}
  $('-c').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{let v=2;$('-c').value=2;draw();const id=setInterval(()=>{v-=.1;$('-c').value=v.toFixed(1);draw();if(v<=.15)clearInterval(id);},160);});
  draw();
})();
</script>
