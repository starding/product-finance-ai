<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">盈利型交易者：利润从哪里来，对市场有何影响</p><p class="figsub">绿色表示改善，橙色表示损害，灰色表示影响不明确。</p></div><button class="replay" type="button" data-replay="pf4">重播</button></div>
    <div class="pf4-wrap"><div class="pf4" id="pf4" data-anim>
      <div class="h"></div><div class="h">从谁那里获利</div><div class="h">对价格效率</div><div class="h">对流动性</div>
      <div class="r" style="--i:0"><b>知情交易者</b><span>价值、新闻</span></div>
      <div class="c" style="--i:0">价格偏离价值时与之交易的人</div><div class="c good" style="--i:0">改善：推动价格靠近价值</div><div class="c mid" style="--i:0">不确定：做市商会因担心他们而扩大价差</div>
      <div class="r" style="--i:1"><b>交易商</b><span>做市</span></div>
      <div class="c" style="--i:1">急于成交、愿付价差的人</div><div class="c mid" style="--i:1">中性</div><div class="c good" style="--i:1">改善：随时提供买卖报价</div>
      <div class="r" style="--i:2"><b>套利者</b><span>相关资产之间</span></div>
      <div class="c" style="--i:2">造成相关价格偏离的交易者</div><div class="c good" style="--i:2">改善：让相关价格保持一致</div><div class="c good" style="--i:2">改善：把流动性传到另一个市场</div>
      <div class="r" style="--i:3"><b>寄生型</b><span>抢先、跟价</span></div>
      <div class="c" style="--i:3">被预判了订单的交易者</div><div class="c mid" style="--i:3">不提供新信息</div><div class="c bad" style="--i:3">损害：抬高大额交易的成本</div>
      <div class="r" style="--i:4"><b>市场操纵者</b><span>传言、虚假报单</span></div>
      <div class="c" style="--i:4">被误导的交易者</div><div class="c bad" style="--i:4">损害：使价格偏离价值</div><div class="c bad" style="--i:4">损害：制造虚假的流动性</div>
    </div></div>
  </div>
  <figcaption>比较维度参照 Harris（1993）工作论文中的比较表，各项判断依据 Harris（2003、2015）的论述，经本书归纳。</figcaption>
</figure>
