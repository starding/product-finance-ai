<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">借贷让种子流向回报更高的地</p><p class="figsub">我有 9 份种子，他一份也没有。拖动借给他的种子数，看两块地上最后一份种子的增收，以及整座岛的总收成。</p></div><button class="replay" type="button" data-replay="sd6">重播</button></div>
    <div class="sd6" id="sd6" data-anim>
      <div class="sd6-plots">
        <div class="sd6-p"><b>我的地</b><div class="sd6-seeds" id="sd6-a"></div><span id="sd6-am"></span></div>
        <div class="sd6-p"><b>他的地</b><div class="sd6-seeds" id="sd6-b"></div><span id="sd6-bm"></span></div>
      </div>
      <div class="sl"><label for="sd6-l">借给他的种子 <b id="sd6-lv"></b></label><input id="sd6-l" type="range" min="0" max="9" step="0.5" value="0"></div>
      <div class="sd6-out"><div><span>两块地的总增收</span><b id="sd6-t"></b></div><div><span>比不借时多收</span><b id="sd6-g"></b></div></div>
      <p class="sd6-msg" id="sd6-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：每块地的增收 ＝ 4 × √（种子份数），两块地同样肥沃。最后一份种子的增收在两块地上相等时，总收成最大。</figcaption>
</figure>
<style>
.sd6-plots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sd6-p{background:var(--quote);border-radius:10px;padding:10px 12px}
.sd6-p b{font-size:14px} .sd6-p span{display:block;font-size:12.5px;color:var(--muted);margin-top:6px;min-height:2.6em}
.sd6-seeds{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:44px}
.sd6-seeds i{width:16px;height:16px;border-radius:50%;background:var(--gold);display:block}
.sd6-seeds i.h{clip-path:inset(0 50% 0 0)}
.sd6-out{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px}
.sd6-out div{display:flex;flex-direction:column} .sd6-out span{font-size:12px;color:var(--faint)} .sd6-out b{font-size:20px;font-variant-numeric:tabular-nums}
.sd6-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),G=s=>4*Math.sqrt(s),M=s=>s>0?2/Math.sqrt(s):Infinity,base=G(9);
  const dots=n=>Array.from({length:Math.ceil(n)},(_,i)=>`<i class="${i+1>n?'h':''}"></i>`).join('');
  function draw(){const L=+$('sd6-l').value,a=9-L,b=L,tot=G(a)+G(b);
    $('sd6-a').innerHTML=dots(a);$('sd6-b').innerHTML=dots(b);$('sd6-lv').textContent=L+' 份';
    $('sd6-am').textContent=`种 ${a} 份，增收 ${G(a).toFixed(1)} 份；最后一份种子增收 ${a?M(a).toFixed(2):'—'} 份`;
    $('sd6-bm').textContent=b?`种 ${b} 份，增收 ${G(b).toFixed(1)} 份；最后一份种子增收 ${M(b).toFixed(2)} 份`:'没有种子，地空着';
    $('sd6-t').textContent=tot.toFixed(1)+' 份';$('sd6-g').textContent='+'+(tot-base).toFixed(1)+' 份';
    $('sd6-msg').textContent=L===0?'种子都在我的地上，最后几份几乎不增收，他的地却空着。':L===4.5?'各种一半，两块地上最后一份种子的增收相等，总收成最大。他从增收中拿出一部分作为利息付给我，双方都更好。':L<4.5?'他的地上一份种子的增收仍高于我的地，继续借给他，总收成还会增加。':'借得太多，他的地上最后一份种子的增收已低于我的地，总收成开始下降。';}
  $('sd6-l').addEventListener('input',draw);
  $('sd6').addEventListener('anim-in',()=>{let v=0;$('sd6-l').value=0;draw();const id=setInterval(()=>{v+=.5;$('sd6-l').value=v;draw();if(v>=4.5)clearInterval(id);},280);});
  draw();
})();
</script>
