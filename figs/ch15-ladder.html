<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">从目标到动作：一项任务的层次</p><p class="figsub">“为退休做准备”逐层分解为计划、决定与动作。点按一层，查看例子；右侧是每一层发生的频率与单次的价值。</p></div><button class="replay" type="button" data-replay="ld">重播</button></div>
    <div class="ld" id="ld" data-anim></div>
    <p class="ld-msg" id="ld-msg" aria-live="polite"></p>
  </div>
  <figcaption>示意。层次越高，任务越少发生、单次价值越大；衡量下层操作的价值，要看它是否服务于上层的目标。</figcaption>
</figure>
<style>
.ld{display:grid;gap:6px}
.ld-r{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:10px;opacity:0;transform:translateX(-12px);transition:opacity .4s,transform .4s;transition-delay:calc(var(--i)*.2s)}
.ld.in .ld-r{opacity:1;transform:none}
.ld-b{width:var(--w);font:inherit;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink);background:color-mix(in srgb,var(--accent) var(--a),var(--surface))}
.ld-b b{font-size:14px;display:block} .ld-b span{font-size:12px;color:var(--muted)}
.ld-b.sel{border-color:var(--ink)}
.ld-m{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.ld-m i{font-style:normal;display:inline-block;height:8px;border-radius:4px;vertical-align:middle;margin-left:4px}
.ld-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.ld-r{grid-template-columns:1fr}.ld-m{flex-direction:row;gap:10px}}
</style>
<script>
(function(){
  const L=[['目标','三十年后退休，生活水平不明显下降','每生只有几次',100,'目标定义了衡量一切的尺子：用钱的时间、需要的金额与可接受的波动。'],
    ['计划','每月存收入的 15%，股票与债券约六比四','每年检视一次',70,'计划把目标转化为可以执行的约束；它决定了长期结果的大部分。'],
    ['决定','这个月买哪一类资产，是否需要再平衡','每月或每季度',40,'决定要遵守计划；偏离计划的决定，往往来自行情的刺激而不是目标的变化。'],
    ['动作','转账、下单、确认成交','每月多次',18,'动作要快捷、准确、可撤销；单次价值小，但出错时损失可能很大。'],
    ['查看与理解','查价格、读新闻、理解一次波动','每天',8,'这是用户在产品中最常做的事。它的价值不在于本身，而在于能否帮助上层的决定。']];
  const box=document.getElementById('ld');
  box.innerHTML=L.map(([n,e,f,v],i)=>`<div class="ld-r" style="--i:${i};--w:${100-i*10}%"><button type="button" class="ld-b" style="--a:${38-i*7}%" data-i="${i}"><b>${n}</b><span>${e}</span></button><div class="ld-m"><span>频率：${f}</span><span>单次价值<i style="width:${v*0.6}px;background:var(--accent)"></i></span></div></div>`).join('');
  const bs=[...box.querySelectorAll('.ld-b')],msg=document.getElementById('ld-msg');
  bs.forEach(b=>b.addEventListener('click',()=>{bs.forEach(x=>x.classList.toggle('sel',x===b));msg.textContent=L[+b.dataset.i][4];}));
  bs[0].classList.add('sel');msg.textContent=L[0][4];
})();
</script>
