<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">把未来的收成算进家产</p><p class="figsub">拖动年龄，看他未来收成的现值与积蓄各有多少，以及积蓄中应放在船股上的比例；再切换他的收成是否随船队起落。</p></div><button class="replay" type="button" data-replay="hc20">重播</button></div>
    <div class="seg-btns" role="group" aria-label="收成的性质">
      <button type="button" data-hc20="bond" aria-pressed="true">收成稳定，像债券</button>
      <button type="button" data-hc20="stock" aria-pressed="false">在船上做工，收成随船队起落</button>
    </div>
    <div class="hc20" id="hc20" data-anim>
      <div class="hc20-bars" id="hc20-b"></div>
      <div class="sl"><label for="hc20-a">年龄 <b id="hc20-av"></b></label><input id="hc20-a" type="range" min="25" max="65" step="1" value="30"></div>
      <p class="hc20-msg" id="hc20-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：每年收入为 1，干到 65 岁，未来收入按 3% 折现；积蓄从 25 岁起每年存入收入的 12%，按 5% 增长。默顿比例取 50%：把未来收入与积蓄合起来，总共有一半承担船股的风险；收成稳定时未来收入视为无风险资产，随船队起落时视为六成承担船股的风险（博迪、默顿与萨缪尔森，1992 的思路）。</figcaption>
</figure>
<style>
.hc20-bars{display:grid;gap:12px;margin:6px 0 10px}
.hc20-r{display:grid;grid-template-columns:8em 1fr 5em;gap:10px;align-items:center;font-size:12.5px}
.hc20-r div{height:22px;background:var(--quote);border-radius:5px;overflow:hidden}
.hc20-r i{display:block;height:100%;transition:width .4s}
.hc20-r b{text-align:right;font-variant-numeric:tabular-nums}
.hc20-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.hc20-r{grid-template-columns:1fr 5em}.hc20-r span{grid-column:1/-1}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('hc20'+id),M=.5;let mode='bond';
  const H=a=>{let v=0;for(let t=1;t<=65-a;t++)v+=1/Math.pow(1.03,t);return v;},F=a=>{let w=.3;for(let t=25;t<a;t++)w=(w+.12)*1.05;return w;};
  function draw(){const a=+$('-a').value,h=H(a),f=F(a),beta=mode==='bond'?0:.6,share=Math.max(0,Math.min(1,(M*(f+h)-beta*h)/f));$('-av').textContent=a+' 岁';
    $('-b').innerHTML=[['未来收成的现值',h,25,'var(--blue)',h.toFixed(1)+' 年收入'],['积蓄',f,25,'var(--accent)',f.toFixed(1)+' 年收入'],['积蓄中放在船股上',share,1,'var(--warm)',Math.round(share*100)+'%']].map(([k,v,m,c,t])=>`<div class="hc20-r"><span>${k}</span><div><i style="width:${Math.min(100,v/m*100)}%;background:${c}"></i></div><b>${t}</b></div>`).join('');
    $('-msg').textContent=mode==='bond'?`${a} 岁：未来收成的现值是积蓄的 ${(h/f).toFixed(1)} 倍，像一大笔稳妥的债券；积蓄中可以放 ${Math.round(share*100)}% 在船股上。年纪越大，未来收成越少，这一比例随之下降。`:`他在船上做工，未来的收成本身就随船队起落，已经承担了不少船股的风险；积蓄中只应放 ${Math.round(share*100)}% 在船股上。`;}
  const bs=[...document.querySelectorAll('[data-hc20]')];
  function set(m){mode=m;bs.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hc20===m)));draw();}
  bs.forEach(b=>b.addEventListener('click',()=>set(b.dataset.hc20)));$('-a').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{set('bond');let v=25;$('-a').value=25;draw();const id=setInterval(()=>{v+=1;$('-a').value=v;draw();if(v>=65){clearInterval(id);setTimeout(()=>{$('-a').value=30;set('stock');},800);}},90);});
  draw();
})();
</script>
