<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">文明模拟器 · 第 9 章：知情与不知情</p><p class="figsub">每年船队的前景都会出现一条新消息。花成本打听的人先知道，其余的人要等消息公开。调整三个比例与成本，看三类人二十年的累计得失。</p></div><button class="replay" type="button" data-replay="cs9">重播</button></div>
    <div class="cs-rules"><span class="on">货币</span><span class="on">保险</span><span class="on">银行</span><span class="on">股份</span><span class="on">市场</span><span class="on">价格中的信息</span><span class="lock">委托 · 第 10 章</span></div>
    <div class="cs9" id="cs9" data-anim>
      <svg viewBox="0 0 660 220" role="img" aria-label="三类人每人的累计得失"><g id="cs9-ax"></g><g id="cs9-l"></g></svg>
      <div class="legend"><span><i style="background:var(--blue)"></i>打听消息的人</span><span><i style="background:var(--warm)"></i>不知情却频繁买卖的人</span><span><i style="background:var(--accent)"></i>被动持有的人</span></div>
      <div class="cs9-ctl">
        <div class="sl"><label for="cs9-f">打听消息的人 <b id="cs9-fv"></b></label><input id="cs9-f" type="range" min="0" max="80" step="5" value="15"></div>
        <div class="sl"><label for="cs9-c">每人每年打听的成本 <b id="cs9-cv"></b></label><input id="cs9-c" type="range" min="0" max="3" step="0.1" value="0.8"></div>
        <div class="sl"><label for="cs9-a">不知情者中频繁买卖的 <b id="cs9-av"></b></label><input id="cs9-a" type="range" min="0" max="100" step="10" value="50"></div>
      </div>
      <button type="button" class="replay" id="cs9-re">换一组年景</button>
      <div class="cs9-out" id="cs9-out"></div>
      <p class="cs9-msg" id="cs9-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意模型：四十户人家，纵轴为每人相对于“只得到船队平均收益”的累计得失，以份计。打听消息的人越多，价格在消息公开前反映得越多（比例为 f ÷（f ＋ 0.15））；打听者从频繁买卖的不知情者那里赚到尚未反映的那部分，二者每次买卖还各付 0.05 份的成本。被动持有的人不交易，得失恒为零。</figcaption>
</figure>
<style>
.cs9 svg{width:100%;height:auto;display:block}
.cs9-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0}
.cs9-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cs9-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.cs9-out span{display:block;font-size:11.5px;color:var(--faint)} .cs9-out b{font-size:18px;font-variant-numeric:tabular-nums}
.cs9-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.cs9-ctl{grid-template-columns:1fr;gap:4px}.cs9-out{grid-template-columns:1fr}.cs9 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cs9'+id),N=40,Y=20,TC=.05;let seed=909;
  const X0=44,X1=650,YT=10,YB=186,x=t=>X0+t/Y*(X1-X0);
  function sim(f,c,a){let s=seed;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};const g=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());};
    const nI=Math.round(f*N),nU=N-nI,nA=Math.round(a*nU),sh=nI?f/(f+.15):0;const cum={I:[0],A:[0],P:[0]};let I=0,A=0;
    for(let t=0;t<Y;t++){const e=Math.abs(g())*2,vol=.3*nA,pool=nI&&nA?vol*e*(1-sh):0;
      const gi=nI?pool/nI-c-TC:0,ga=nA?-pool/nA-TC:0;I+=gi;A+=ga;cum.I.push(I);cum.A.push(A);cum.P.push(0);}
    return {cum,sh,nI,nA,nP:nU-nA};}
  function draw(){const f=+$('-f').value/100,c=+$('-c').value,a=+$('-a').value/100,S=sim(f,c,a);
    $('-fv').textContent=Math.round(f*100)+'%';$('-cv').textContent=c.toFixed(1)+' 份';$('-av').textContent=Math.round(a*100)+'%';
    const all=[...S.cum.I,...S.cum.A],mx=Math.max(5,...all.map(Math.abs)),y=v=>(YT+YB)/2-v/mx*(YB-YT)/2;
    $('-ax').innerHTML=[-mx,-mx/2,0,mx/2,mx].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="${v===0?'s-faint':'s-line'}"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v>0?'+':''}${Math.round(v)}</text>`).join('')+[0,5,10,15,20].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">第 ${t} 年</text>`).join('');
    const line=(k,col)=>`<path d="${S.cum[k].map((v,t)=>(t?'L':'M')+x(t).toFixed(1)+','+y(v).toFixed(1)).join('')}" fill="none" stroke="${col}" stroke-width="2.4"/>`;
    $('-l').innerHTML=(S.nI?line('I','var(--blue)'):'')+(S.nA?line('A','var(--warm)'):'')+line('P','var(--accent)');
    const iY=S.nI?S.cum.I[Y]/Y:0,aY=S.nA?S.cum.A[Y]/Y:0;
    $('-out').innerHTML=[['价格在公开前反映的消息',Math.round(S.sh*100)+'%'],['打听者每人每年',S.nI?(iY>=0?'+':'−')+Math.abs(iY).toFixed(2)+' 份':'—'],['频繁买卖者每人每年',S.nA?'−'+Math.abs(aY).toFixed(2)+' 份':'—']].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('');
    $('-msg').textContent=!S.nI?'没有人打听消息，价格只在消息公开时才变化；频繁买卖的人白白付出交易成本。':!S.nA?'没有人陪打听者交易，打听来的消息无利可图，打听者每年白白付出成本。':Math.abs(iY)<.15?`打听消息的人约占 ${Math.round(f*100)}%，扣除成本之后几乎不赚不亏：这正是打听者人数会停下来的地方。价格在公开前已反映了 ${Math.round(S.sh*100)}% 的消息，频繁买卖的不知情者每人每年仍亏约 ${Math.abs(aY).toFixed(2)} 份，被动持有的人不受影响。`:iY>0?`打听消息的人每人每年多赚约 ${iY.toFixed(2)} 份，钱来自频繁买卖的不知情者。打听的人一多，价格反映得更快，这份好处就会被摊薄、直至消失。被动持有的人不参与，也不受损。`:`打听的人太多，价格已经反映了 ${Math.round(S.sh*100)}% 的消息，剩下的好处不够弥补成本：打听者每人每年亏约 ${Math.abs(iY).toFixed(2)} 份。会有人退出，直到打听恰好不赚不亏。`;}
  ['-f','-c','-a'].forEach(k=>$(k).addEventListener('input',draw));$('-re').addEventListener('click',()=>{seed=(seed*48271)%2147483647;draw();});
  $('').addEventListener('anim-in',()=>{const seq=[5,15,30,50,70];seq.forEach((v,i)=>setTimeout(()=>{$('-f').value=v;draw();},300+i*1200));});
  draw();
})();
</script>
