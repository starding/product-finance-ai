<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">分析变便宜之后，分析的回报去了哪里</p><p class="figsub">越多投资者用同类分析，同一信息越快进入价格，每位使用者能得到的超额收益越少。人们会一直加入，直到超额收益只够补偿分析成本。</p></div><button class="replay" type="button" data-replay="gs">重播</button></div>
    <div class="gs" id="gs" data-anim>
      <svg viewBox="0 0 640 250" role="img" aria-label="使用者比例与每位使用者超额收益的关系">
        <g id="gs-axis"></g>
        <path id="gs-curve" class="gs-curve"/>
        <line id="gs-cost" class="gs-cost"/>
        <text id="gs-ct" font-size="12" class="t-warm" text-anchor="start"></text>
        <line id="gs-eqv" class="gs-eqv"/>
        <circle id="gs-dot" r="6" class="gs-dot"/>
        <text id="gs-et" font-size="12" class="t-ink" text-anchor="middle"></text>
      </svg>
      <div class="sl"><label for="gs-c">分析成本（每年，占资产的比例） <b id="gs-cv"></b></label><input id="gs-c" type="range" min="0.2" max="3.5" step="0.1" value="3"><div class="hint">AI 让分析变便宜：向左拖动</div></div>
      <div class="gs-out">
        <div><span>均衡时使用这类分析的投资者</span><b id="gs-s"></b></div>
        <div><span>每位使用者的超额收益</span><b id="gs-r"></b></div>
      </div>
      <p class="gs-msg" id="gs-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>按 Grossman 与 Stiglitz（1980）的逻辑作的示意模型：信息的总价值为每年 4%，使用者越多，信息越早进入价格，每位使用者的超额收益按比例减少；均衡时超额收益等于分析成本。数字不对应任何市场的估计。</figcaption>
</figure>
<style>
.gs svg{width:100%;height:auto;display:block}
.gs-curve{fill:none;stroke:var(--accent);stroke-width:2.5}
.gs-cost{stroke:var(--warm);stroke-width:2;stroke-dasharray:6 4}
.gs-eqv{stroke:var(--ink);stroke-dasharray:3 3}
.gs-dot{fill:var(--ink)}
.gs-out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.gs-out div{background:var(--quote);border-radius:8px;padding:8px 12px}
.gs-out span{display:block;font-size:12px;color:var(--faint)}
.gs-out b{font-size:22px;font-variant-numeric:tabular-nums}
.gs-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
</style>
<script>
(function(){
  const E=4, X0=56, X1=620, Y0=210, Y1=20, x=s=>X0+s*(X1-X0), y=r=>Y0-r/E*(Y0-Y1);
  let a=`<line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" class="s-faint"/><line x1="${X0}" y1="${Y1}" x2="${X0}" y2="${Y0}" class="s-faint"/>`;
  [0,.25,.5,.75,1].forEach(s=>a+=`<text x="${x(s)}" y="${Y0+16}" text-anchor="middle" font-size="11" class="t-faint">${s*100}%</text>`);
  [1,2,3,4].forEach(r=>a+=`<line x1="${X0}" y1="${y(r)}" x2="${X1}" y2="${y(r)}" class="s-line"/><text x="${X0-8}" y="${y(r)+4}" text-anchor="end" font-size="11" class="t-faint">${r}%</text>`);
  a+=`<text x="${X1}" y="${Y0+32}" text-anchor="end" font-size="11" class="t-faint">使用同类分析的投资者比例</text><text x="${X0}" y="${Y1-6}" font-size="11" class="t-faint">每位使用者的超额收益</text>`;
  document.getElementById('gs-axis').innerHTML=a;
  document.getElementById('gs-curve').setAttribute('d',`M${x(0)},${y(E)}L${x(1)},${y(0)}`);
  const c=document.getElementById('gs-c');
  const set=(id,o)=>{const e=document.getElementById(id);for(const k in o)e.setAttribute(k,o[k]);};
  function render(){
    const C=+c.value, s=1-C/E;
    document.getElementById('gs-cv').textContent=C.toFixed(1)+'%';
    set('gs-cost',{x1:X0,x2:X1,y1:y(C),y2:y(C)});
    const ct=document.getElementById('gs-ct');ct.setAttribute('x',X0+8);ct.setAttribute('y',y(C)-6);ct.textContent='分析成本 '+C.toFixed(1)+'%';
    set('gs-eqv',{x1:x(s),x2:x(s),y1:y(C),y2:Y0});
    set('gs-dot',{cx:x(s),cy:y(C)});
    const et=document.getElementById('gs-et');et.setAttribute('x',x(s));et.setAttribute('y',y(C)-12);et.textContent='均衡';
    document.getElementById('gs-s').textContent=Math.round(s*100)+'%';
    document.getElementById('gs-r').textContent=C.toFixed(1)+'%';
    document.getElementById('gs-msg').textContent=C>=2.5
      ?'分析昂贵时，只有少数人做分析，他们能获得较高的超额收益，价格吸收信息较慢。'
      :C>=1?'分析成本下降，更多人加入，价格更快反映信息，每个人得到的超额收益随之下降。'
      :'分析几乎免费时，绝大多数人都在用同类分析，价格几乎即时反映信息，靠分析获得的超额收益所剩无几。';
  }
  c.addEventListener('input',render); render();
  document.getElementById('gs').addEventListener('anim-in',()=>{let v=3.5;c.value=v;render();const id=setInterval(()=>{v=Math.round((v-0.1)*10)/10;c.value=v;render();if(v<=0.8)clearInterval(id);},70);});
})();
</script>
