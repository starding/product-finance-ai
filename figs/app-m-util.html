<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">模型的选择：平方根与对数</p><p class="figsub">同样一笔一生的资源，在借贷利率为正时，按两种满足感计算出的最好消费路径。拖动利率，看两条路径的差别。</p></div><button class="replay" type="button" data-replay="mu">重播</button></div>
    <div class="mu" id="mu" data-anim>
      <svg viewBox="0 0 640 220" role="img" aria-label="两种满足感下的消费路径"><g id="mu-ax"></g><path id="mu-s" class="mu-s"/><path id="mu-l" class="mu-l"/></svg>
      <div class="legend"><span><i style="background:var(--warm)"></i>平方根：初稿</span><span><i style="background:var(--accent)"></i>对数：修订后</span></div>
      <div class="sl"><label for="mu-r">年利率 <b id="mu-rv"></b></label><input id="mu-r" type="range" min="0" max="6" step="0.5" value="3"></div>
      <p class="mu-msg" id="mu-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：20～80 岁，消费路径满足“今年多吃一口的满足，等于存到明年、加上利息之后那一口的满足”；平方根下每年增长（1 ＋ 利率）²，对数下增长（1 ＋ 利率）。两条路径一生资源的现值相同，纵轴为相对于 20 岁时的倍数。</figcaption>
</figure>
<style>
.mu svg{width:100%;height:auto;display:block}
.mu-s{fill:none;stroke:var(--warm);stroke-width:2.4}
.mu-l{fill:none;stroke:var(--accent);stroke-width:2.4}
.mu-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.mu svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=46,X1=630,YT=12,YB=186,x=a=>X0+(a-20)/60*(X1-X0),ly=v=>YB-Math.log(v)/Math.log(40)*(YB-YT);
  $('mu-ax').innerHTML=[1,2,5,10,20,40].map(v=>`<line x1="${X0}" x2="${X1}" y1="${ly(v)}" y2="${ly(v)}" class="s-line"/><text x="${X0-6}" y="${ly(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}×</text>`).join('')+[20,40,60,80].map(a=>`<text x="${x(a)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${a} 岁</text>`).join('');
  function draw(){const r=+$('mu-r').value/100;let ps='',pl='';for(let a=20;a<=80;a++){const t=a-20;ps+=(t?'L':'M')+x(a).toFixed(1)+','+ly(Math.min(40,Math.pow(1+r,2*t))).toFixed(1);pl+=(t?'L':'M')+x(a).toFixed(1)+','+ly(Math.pow(1+r,t)).toFixed(1);}
    $('mu-s').setAttribute('d',ps);$('mu-l').setAttribute('d',pl);$('mu-rv').textContent=(r*100).toFixed(1)+'%';
    const s=Math.pow(1+r,120),l=Math.pow(1+r,60);
    $('mu-msg').textContent=r===0?'利率为零时，两种模型都让一生每年吃得一样多。':`年利率 ${(r*100).toFixed(1)}% 时，平方根模型让 80 岁的消费达到 20 岁的 ${s>=100?Math.round(s):s.toFixed(1)} 倍，即年轻时节衣缩食、年老时大吃大喝；对数模型约为 ${l.toFixed(1)} 倍。前者与平滑消费的本意相去甚远。`;}
  $('mu-r').addEventListener('input',draw);
  $('mu').addEventListener('anim-in',()=>{let v=0;$('mu-r').value=0;draw();const id=setInterval(()=>{v+=.5;$('mu-r').value=v;draw();if(v>=4)clearInterval(id);},250);});
  draw();
})();
</script>
