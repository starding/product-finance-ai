<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">本章小结：让用户看见交易的真实成本</p><p class="figsub">四条设计要求，各自对应本章的一个机制。</p></div><button class="replay" type="button" data-replay="s05">重播</button></div>
    <div class="s05" id="s05" data-anim>
      <div class="s05-c" style="--i:0"><em>大单会吃掉多档报价</em><b>下单前展示预估成交均价</b><p>按当前订单簿估算成交均价与相对中间价的成本，而不只显示最新价。</p></div>
      <div class="s05-c" style="--i:1"><em>价差是即时成交的价格</em><b>不急的交易，帮用户耐心成交</b><p>提供限价与分批成交，让不急于成交的用户少付价差，并说明可能无法成交的风险。</p></div>
      <div class="s05-c" style="--i:2"><em>流动性有价格</em><b>把交易频率与价差放在一起算</b><p>对流动性差的资产，提示频繁买卖每年会付出多少成本。</p></div>
      <div class="s05-c warn" style="--i:3"><em>流动性会突然消失</em><b>在动荡与非常规时段提示风险</b><p>开盘、收盘前后、盘前盘后及剧烈波动时提示价差与深度；说明止损单触发后可能以远差于预期的价格成交。</p></div>
    </div>
  </div>
</figure>
