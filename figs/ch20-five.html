<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">按结果落在哪里，人类事务分为五类</p><p class="figsub">点按一类，查看例子，以及 AI 代理能否直接改变这类事务的结果。</p></div><button class="replay" type="button" data-replay="fv">重播</button></div>
    <div class="fv" id="fv" data-anim></div>
    <p class="fv-msg" id="fv-msg" aria-live="polite"></p>
  </div>
  <figcaption>本书的分类：按事务的结果最终改变了什么来划分。与 Autor、Levy 与 Murnane（2003）按“常规与非常规、认知与手工”的划分互为补充。</figcaption>
</figure>
<style>
.fv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.fv-c{font:inherit;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s,border-color .2s;transition-delay:calc(var(--i)*.15s)}
.fv.in .fv-c{opacity:1;transform:none}
.fv-c em{font-style:normal;font-size:11px;color:var(--faint)}
.fv-c b{font-size:14.5px}
.fv-c span{font-size:12px;color:var(--muted);line-height:1.5}
.fv-c i{font-style:normal;font-size:11.5px;border-radius:5px;padding:2px 6px;margin-top:auto;align-self:flex-start}
.fv-c.d i{background:var(--accent-soft);color:var(--accent)}
.fv-c.n i{background:var(--quote);color:var(--faint)}
.fv-c.d{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.fv-c.sel{border-color:var(--ink)}
.fv-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.fv{grid-template-columns:1fr 1fr}}
</style>
<script>
(function(){
  const T=[['本人的身心','锻炼、学习、休息、治疗',0,'结果落在本人身上：代理可以安排计划、讲解知识，但锻炼与学习只能由本人完成。'],
    ['他人的身心与关系','照护、教育孩子、谈判、维系关系',0,'结果落在他人与关系上：代理可以准备材料、起草消息，关系本身仍要由人来经营。'],
    ['物与环境','做饭、修理、搬运、种植',0,'结果落在物理世界：没有身体的代理只能给出建议与清单，具身的机器人仍在早期。'],
    ['信息','写报告、做分析、查资料、翻译',1,'结果本身就是信息：代理可以直接完成，这是当前适用比例最高的一类。'],
    ['权利与义务','签约、转账、下单、报税',1,'结果是权利与义务的变化：借助工具，代理可以替人提交与执行，但往往需要本人授权。']];
  const box=document.getElementById('fv');
  box.innerHTML=T.map(([n,e,d],i)=>`<button type="button" class="fv-c ${d?'d':'n'}" style="--i:${i}" data-i="${i}"><em>第 ${i+1} 类</em><b>${n}</b><span>${e}</span><i>${d?'代理可以直接作用':'代理只能间接帮忙'}</i></button>`).join('');
  const bs=[...box.children],m=document.getElementById('fv-msg');
  const sel=i=>{bs.forEach((b,j)=>b.classList.toggle('sel',j===i));m.textContent=T[i][3];};
  bs.forEach((b,i)=>b.addEventListener('click',()=>sel(i)));sel(3);
})();
</script>
