<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">一家健康的银行，也会被挤兑</p><p class="figsub">银行把 30 个储户的存款大部分贷了出去，手头只留 30% 的现金。调节“担心别人会来提款”的储户比例，看银行能否撑住；再打开存款保险。</p></div><button class="replay" type="button" id="rn-run">重新演示</button></div>
    <div class="rn" id="rn" data-anim>
      <div class="rn-grid" id="rn-g"></div>
      <div class="rn-bank"><span>银行手头的现金</span><div class="rn-t"><i id="rn-cash"></i></div><b id="rn-cv"></b></div>
      <div class="rn-ctrl">
        <div class="sl"><label for="rn-p">担心别人会来提款的储户 <b id="rn-pv"></b></label><input id="rn-p" type="range" min="0" max="100" step="10" value="40"></div>
        <label class="rn-chk"><input type="checkbox" id="rn-i"> 有存款保险</label>
      </div>
      <p class="rn-msg" id="rn-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>按 Diamond 与 Dybvig（1983）的思路简化：真正需要用钱的储户占 10%；担心的储户会跟着提款，而提款的人越多，原本不担心的人也越担心。存款保险让储户确信存款有保障，提前提款不再是最好的选择。</figcaption>
</figure>
<style>
.rn-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:6px}
.rn-grid i{aspect-ratio:1;border-radius:50%;background:var(--accent-soft);border:1.5px solid var(--accent);transition:all .35s}
.rn-grid i.w{background:var(--warm);border-color:var(--warm)}
.rn-grid i.lost{background:var(--line);border-color:var(--faint)}
.rn-bank{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;margin:12px 0;font-size:13px}
.rn-t{height:16px;background:var(--quote);border-radius:4px;overflow:hidden}
.rn-t i{display:block;height:100%;background:var(--accent);transition:width .35s}
.rn-bank b{text-align:right;font-variant-numeric:tabular-nums}
.rn-ctrl{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.rn-chk{font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.rn-chk input{accent-color:var(--accent);width:16px;height:16px}
.rn-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.rn-grid{grid-template-columns:repeat(10,1fr)}.rn-ctrl{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const N=30,R=0.3,g=document.getElementById('rn-g');g.innerHTML='<i></i>'.repeat(N);const cs=[...g.children];
  const p=document.getElementById('rn-p'),ins=document.getElementById('rn-i');let timer;
  function run(){clearInterval(timer);cs.forEach(c=>c.className='');document.getElementById('rn-pv').textContent=p.value+'%';
    const worried=+p.value/100, insured=ins.checked; let w=0, cash=N*R;
    const show=()=>{document.getElementById('rn-cash').style.width=Math.max(0,cash/(N*R)*100)+'%';document.getElementById('rn-cv').textContent=Math.max(0,cash).toFixed(0)+' 份';};
    show();
    const need=Math.round(N*0.1);
    let target=insured?need:Math.round(need+worried*N*0.5);
    timer=setInterval(()=>{
      if(w<target&&w<N){cs[w].classList.add('w');w++;cash-=1;
        if(!insured&&w>=N*0.25)target=Math.min(N,target+2);
        show();
        if(cash<=0){clearInterval(timer);for(let i=w;i<N;i++)cs[i].classList.add('lost');document.getElementById('rn-msg').textContent=`提款超过了银行手头的现金，银行被迫倒闭；剩下 ${N-w} 位储户的存款需要等资产清算，可能遭受损失。银行本身是健康的，倒闭完全来自恐慌。`;}
      }else{clearInterval(timer);document.getElementById('rn-msg').textContent=insured?`有存款保险时，只有真正需要用钱的 ${need} 位储户提款，银行轻松应付。没有人有理由抢先提款。`:`共有 ${w} 位储户提款，银行手头的现金还够，挤兑没有发生。但只要担心的人再多一些，结果就会完全不同。`;}
    },160);
    document.getElementById('rn-msg').textContent='';
  }
  p.addEventListener('input',run);ins.addEventListener('change',run);document.getElementById('rn-run').addEventListener('click',run);
  document.getElementById('rn').addEventListener('anim-in',run);
  document.getElementById('rn-pv').textContent=p.value+'%';
})();
</script>
