<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">平均一样，波动越大越难过</p><p class="figsub">两户人家二十年的平均收成都是 12 份。拖动其中一户收成的波动，比较两户“相当于每年稳定收多少”。</p></div><button class="replay" type="button" data-replay="lk">重播</button></div>
    <div class="lk" id="lk" data-anim>
      <svg viewBox="0 0 640 200" role="img" aria-label="两户人家二十年的收成"><g id="lk-ax"></g><g id="lk-b"></g></svg>
      <div class="legend"><span><i style="background:var(--faint)"></i>收成稳定的一户</span><span><i style="background:var(--accent)"></i>收成波动的一户</span></div>
      <div class="sl"><label for="lk-s">波动的大小 <b id="lk-sv"></b></label><input id="lk-s" type="range" min="0" max="50" step="5" value="35"></div>
      <p class="lk-msg" id="lk-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：波动的一户每年收成 ＝ 12 ×（1 ＋ 波动大小 × 随机数），随机数固定，并调整为平均恰为 12 份。“相当于每年稳定收多少”按对数满足感折算。</figcaption>
</figure>
<style>
.lk svg{width:100%;height:auto;display:block}
.lk-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.lk svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),Z=[.3,-1.2,.8,.1,-.4,1.5,-.9,.2,.6,-1.8,.9,.4,-.2,1.1,-.7,.05,-1.3,.7,1.0,-.45],m=Z.reduce((a,b)=>a+b,0)/Z.length,ZZ=Z.map(z=>z-m);
  const X0=40,X1=630,YT=10,YB=170,W=(X1-X0)/20,y=v=>YB-v/24*(YB-YT);
  $('lk-ax').innerHTML=[0,6,12,18,24].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+[1,5,10,15,20].map(t=>`<text x="${X0+W*(t-.5)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">第 ${t} 年</text>`).join('');
  function draw(){const s=+$('lk-s').value/100,H=ZZ.map(z=>Math.max(.5,12*(1+s*z)));
    $('lk-b').innerHTML=H.map((h,t)=>`<rect x="${X0+W*t+W*.12}" y="${y(12)}" width="${W*.34}" height="${YB-y(12)}" fill="var(--faint)" opacity=".55"/><rect x="${X0+W*t+W*.5}" y="${y(h)}" width="${W*.34}" height="${YB-y(h)}" fill="var(--accent)"/>`).join('');
    const ce=Math.exp(H.reduce((a,h)=>a+Math.log(h),0)/H.length);$('lk-sv').textContent=Math.round(s*100)+'%';
    $('lk-msg').textContent=s===0?'没有波动时，两户完全一样。':`平均同样是 12 份，波动的一户相当于每年稳定收 ${ce.toFixed(1)} 份，比稳定的一户少 ${(12-ce).toFixed(1)} 份：丰年多出来的，弥补不了荒年少掉的。`;}
  $('lk-s').addEventListener('input',draw);
  $('lk').addEventListener('anim-in',()=>{let v=0;$('lk-s').value=0;draw();const id=setInterval(()=>{v+=5;$('lk-s').value=v;draw();if(v>=45)clearInterval(id);},200);});
  draw();
})();
</script>
