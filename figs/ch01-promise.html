<figure id="promisefig">
  <div class="card">
    <p class="figtitle">同一笔钱，四种承诺</p>
    <p class="figsub">把 10,000 元放进四种承诺，持有到期。每种承诺模拟 4,000 种可能的未来；左侧注明承诺方，以及承诺在什么情况下落空。</p>
    <div class="pf-ctrl">
      <div class="sl"><label for="pf-t">持有年限 <b id="pf-tv"></b></label><input id="pf-t" type="range" min="1" max="30" step="1" value="10"></div>
      <label class="pf-chk"><input type="checkbox" id="pf-real"> 按购买力计算（扣除通胀）</label>
    </div>
    <div id="pf-rows"></div>
    <div class="legend pf-legend"><span><i class="pf-band"></i>中间 90% 的结果</span><span><i class="pf-dot"></i>中位数</span><span><i class="pf-mean"></i>平均数</span><span><i class="pf-base"></i>本金 10,000 元</span></div>
  </div>
  <figcaption>示例参数，不对应任何真实产品：存款年利率 2%；政府债券年收益 3%，持有到期；公司债券票面利率 5%，每年违约概率 1.5%，违约时收回本金的 40%，已收利息与收回款项按 2% 再投资；股票指数年化对数收益均值 5.5%、波动率 18%，不计费用。通胀每年 2.5% 上下波动（标准差 1.2%）。政府债券与公司债券若中途卖出，价格会随利率波动，图中只显示持有到期的结果。</figcaption>
</figure>
<style>
.pf-ctrl{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:8px}
.pf-chk{font-size:14px;display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.pf-chk input{accent-color:var(--accent);width:16px;height:16px}
.pf-row{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.pf-name{font-size:15px;font-weight:700}
.pf-who{font-size:12px;color:var(--faint);line-height:1.5;margin-top:2px}
.pf-fail{font-size:12px;color:var(--warm);line-height:1.5;margin-top:2px}
.pf-track{position:relative;height:30px;margin-top:2px}
.pf-track .axis{position:absolute;left:0;right:0;top:15px;height:1px;background:var(--line)}
.pf-track .band{position:absolute;top:8px;height:14px;border-radius:7px;background:var(--accent-soft);transition:left .3s,width .3s}
.pf-track .band.risky{background:var(--warm-soft)}
.pf-track .med{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent);transition:left .3s}
.pf-track .med.risky{background:var(--warm)}
.pf-track .mean{position:absolute;top:4px;width:2px;height:22px;margin-left:-1px;background:var(--ink);transition:left .3s}
.pf-track .base{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--faint)}
.pf-stats{font-size:13px;color:var(--muted);line-height:1.7;font-variant-numeric:tabular-nums}
.pf-stats b{color:var(--ink)}
.pf-stats .loss{color:var(--warm);font-weight:700}
.pf-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin:6px 0 0 186px}
.pf-legend .pf-band{background:var(--accent-soft);width:18px;border-radius:5px}
.pf-legend .pf-dot{background:var(--accent);border-radius:50%}
.pf-legend .pf-mean{background:var(--ink);width:2px}
.pf-legend .pf-base{background:none;border-left:1.5px dashed var(--faint);width:0}
@media (max-width:640px){
  .pf-ctrl{grid-template-columns:1fr;gap:4px}
  .pf-row{grid-template-columns:1fr;gap:6px}
  .pf-scale{margin-left:0}
}
</style>
<script>
(function(){
  const N=4000, P0=10000, MAXT=30;
  const products=[
    {key:'dep', name:'银行存款', who:'承诺方：银行（存款保险在限额内兜底）', fail:'落空：银行倒闭且金额超出保险限额', risky:false},
    {key:'gov', name:'政府债券', who:'承诺方：政府；持有到期', fail:'落空：政府违约（本币国债极少发生）', risky:false},
    {key:'corp',name:'公司债券', who:'承诺方：发行公司', fail:'落空：公司无力偿付', risky:true},
    {key:'eq',  name:'股票指数基金', who:'无固定金额承诺；分享剩余收益', fail:'结果取决于公司经营与市场定价', risky:true},
  ];
  // 固定种子的随机数，保证每次打开结果一致
  let seed=20261019;
  const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  // 预先模拟 30 年的逐年路径，记录每一年末的财富
  const sim={dep:[],gov:[],corp:[],eq:[],cpi:[]};
  for(const k in sim) for(let t=0;t<=MAXT;t++) sim[k].push(new Float64Array(N));
  for(let i=0;i<N;i++){
    let eq=P0, cpi=1, coupons=0, principal=P0, alive=true;
    for(let t=1;t<=MAXT;t++){
      eq*=Math.exp(0.055+0.18*gauss());
      cpi*=1+0.025+0.012*gauss();
      if(alive){
        if(rnd()<0.015){alive=false;principal=P0*0.4;coupons*=1.02;}
        else coupons=coupons*1.02+P0*0.05;
      } else {coupons*=1.02;principal*=1.02;}
      sim.eq[t][i]=eq; sim.cpi[t][i]=cpi;
      sim.corp[t][i]=coupons+principal;
      sim.dep[t][i]=P0*Math.pow(1.02,t);
      sim.gov[t][i]=P0*Math.pow(1.03,t);
    }
  }
  const tEl=document.getElementById('pf-t'), rEl=document.getElementById('pf-real'), rows=document.getElementById('pf-rows');
  rows.innerHTML=products.map(p=>`<div class="pf-row"><div><div class="pf-name">${p.name}</div><div class="pf-who">${p.who}</div><div class="pf-fail">${p.fail}</div></div><div><div class="pf-track" id="pf-tr-${p.key}"><div class="axis"></div><div class="band${p.risky?' risky':''}"></div><div class="base"></div><div class="mean"></div><div class="med${p.risky?' risky':''}"></div></div><div class="pf-stats" id="pf-st-${p.key}"></div></div></div>`).join('')+'<div class="pf-scale" id="pf-scale"></div>';
  const fmt=v=>Math.round(v).toLocaleString('zh-CN');
  const q=(arr,p)=>arr[Math.min(arr.length-1,Math.floor(p*arr.length))];
  function render(){
    const T=+tEl.value, real=rEl.checked;
    document.getElementById('pf-tv').textContent=T+' 年';
    const stats={};
    products.forEach(p=>{
      const a=Array.from(sim[p.key][T],(v,i)=>real?v/sim.cpi[T][i]:v).sort((x,y)=>x-y);
      const mean=a.reduce((s,v)=>s+v,0)/N;
      const lossN=a.findIndex(v=>v>=P0-0.5); const loss=(lossN<0?N:lossN)/N;
      stats[p.key]={lo:q(a,.05),med:q(a,.5),hi:q(a,.95),mean,loss};
    });
    const top=Math.max(...Object.values(stats).map(s=>s.hi));
    const step=top>60000?20000:top>30000?10000:5000, max=Math.ceil(top/step)*step;
    const X=v=>Math.max(0,Math.min(100,v/max*100))+'%';
    products.forEach(p=>{
      const s=stats[p.key], tr=document.getElementById('pf-tr-'+p.key);
      const band=tr.querySelector('.band');
      band.style.left=X(s.lo); band.style.width=Math.max(0,(s.hi-s.lo)/max*100)+'%';
      tr.querySelector('.med').style.left=X(s.med);
      const meanEl=tr.querySelector('.mean'); meanEl.style.left=X(s.mean); meanEl.style.display=p.risky?'block':'none';
      tr.querySelector('.base').style.left=X(P0);
      const lbl=real?'购买力低于本金的概率':'低于本金的概率';
      const lossTxt=s.loss<0.0005?lbl+' 0%':`${lbl} <span class="loss">${(s.loss*100).toFixed(s.loss<0.1?1:0)}%</span>`;
      const spread=p.risky?`；最差 5% 的情形不高于 ${fmt(s.lo)} 元`:'';
      document.getElementById('pf-st-'+p.key).innerHTML=`中位数 <b>${fmt(s.med)}</b> 元${p.risky?'，平均数 '+fmt(s.mean)+' 元':''}${spread}；${lossTxt}`;
    });
    let sc=''; for(let v=0;v<=max;v+=step) sc+=`<span>${v===0?'0':(v/10000)+' 万'}</span>`;
    document.getElementById('pf-scale').innerHTML=sc;
  }
  tEl.addEventListener('input',render); rEl.addEventListener('change',render);
  render();
})();
</script>
