<figure>
  <div class="card">
    <p class="figtitle">保障多强才合适</p>
    <p class="figsub">保障越强，缺陷造成的期望损失越小，审核与等待的成本越高。选择功能的风险等级，看总成本最低的保障强度在哪里（示意）。</p>
    <div class="seg-btns" role="group" aria-label="风险等级"><button type="button" data-cs2="1" aria-pressed="false">低风险：行情摘要</button><button type="button" data-cs2="2" aria-pressed="true">中风险：再平衡方案</button><button type="button" data-cs2="3" aria-pressed="false">高风险：自动交易</button></div>
    <div class="cs2" id="cs2" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="保障强度与成本"><g id="cs2-ax"></g><path id="cs2-l" class="cs2-p l"/><path id="cs2-c" class="cs2-p c"/><path id="cs2-t" class="cs2-p t"/><circle id="cs2-d" r="6" fill="var(--ink)"/></svg>
      <div class="legend"><span><i style="background:var(--warm)"></i>缺陷的期望损失</span><span><i style="background:var(--gold)"></i>保障的成本与延误</span><span><i style="background:var(--ink)"></i>总成本</span></div>
      <p class="cs2-msg" id="cs2-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意曲线。过程的严格程度应随风险调整，见 Boehm 与 Turner（2004）。</figcaption>
</figure>
<style>
.cs2 svg{width:100%;height:auto;display:block}
.cs2-p{fill:none;stroke-width:2.5;transition:d .5s} .cs2-p.l{stroke:var(--warm)} .cs2-p.c{stroke:var(--gold)} .cs2-p.t{stroke:var(--ink);stroke-dasharray:6 4}
.cs2-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.cs2 svg text{font-size:18px}}
</style>
<script>
(function(){
  const X0=50,X1=620,YT=14,YB=176,x=a=>X0+a/10*(X1-X0),y=v=>YB-v/100*(YB-YT);
  const R={1:12,2:40,3:180},L=(a,r)=>r*Math.exp(-a*.55),C=a=>4*a;
  const N=['','抽查','','评测集','','分层评测与审核','','只运行不生效与分级发布','','形式化约束与全量检查',''];
  const $=id=>document.getElementById(id);
  $('cs2-ax').innerHTML=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`+[1,3,5,7,9].map(a=>`<text x="${x(a)}" y="${YB+16}" text-anchor="middle" font-size="10.5" class="t-faint">${N[a]}</text>`).join('')+`<text x="${X0}" y="${YT}" font-size="11" class="t-faint">成本</text>`;
  function set(k){document.querySelectorAll('[data-cs2]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cs2===k)));const r=R[k];
    const P=f=>{let d='';for(let a=0;a<=10;a+=.1)d+=(a?'L':'M')+x(a).toFixed(1)+','+y(Math.min(100,f(a))).toFixed(1);return d;};
    $('cs2-l').setAttribute('d',P(a=>L(a,r)));$('cs2-c').setAttribute('d',P(C));$('cs2-t').setAttribute('d',P(a=>L(a,r)+C(a)));
    let best=0,bv=1e9;for(let a=0;a<=10;a+=.05){const v=L(a,r)+C(a);if(v<bv){bv=v;best=a;}}
    $('cs2-d').setAttribute('cx',x(best));$('cs2-d').setAttribute('cy',y(Math.min(100,bv)));
    $('cs2-msg').textContent=k==='1'?'低风险功能：总成本最低的保障强度在抽查附近；再往上加保障，只会拖慢迭代。':k==='2'?'中风险功能：最优点在评测集与分层评测之间。':'高风险功能：期望损失很大，最优点移到只运行不生效、分级发布乃至全量检查。同一套标准用于所有功能，总有一端是错的。';}
  document.querySelectorAll('[data-cs2]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.cs2)));
  $('cs2').addEventListener('anim-in',()=>{['1','2','3'].forEach((k,i)=>setTimeout(()=>set(k),i*2000));});
  set('2');
})();
</script>
