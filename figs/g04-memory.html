<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">货币与账本：同一件事的两种记法</p><p class="figsub">三户人家轮流为下一户付出：种粮的给晒盐的粮，晒盐的给织布的盐，织布的给种粮的布。点“下一步”，比较两种记法。</p></div><button class="replay" type="button" data-replay="mm">重播</button></div>
    <div class="seg-btns" role="group" aria-label="记法">
      <button type="button" data-mm="coin" aria-pressed="true">用货币</button>
      <button type="button" data-mm="book" aria-pressed="false">用全村共享的账本</button>
    </div>
    <div class="mm" id="mm" data-anim>
      <div class="mm-h" id="mm-h"></div>
      <div class="mm-ctl"><button type="button" class="replay" id="mm-next">下一步</button><span id="mm-step"></span></div>
      <p class="mm-msg" id="mm-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>柯切拉科塔（1998）证明，在不能作出可信承诺的环境中，货币能实现的交换安排，完整的账本也能实现；货币是一种简便的记录。</figcaption>
</figure>
<style>
.mm-h{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mm-p{background:var(--quote);border-radius:10px;padding:10px 12px;min-height:92px;transition:box-shadow .3s}
.mm-p.on{box-shadow:0 0 0 2px var(--accent)}
.mm-p b{font-size:14px;display:block} .mm-p span{font-size:12.5px;color:var(--muted);display:block;margin-top:4px;line-height:1.55}
.mm-p i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold);margin-right:3px;vertical-align:-1px}
.mm-ctl{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--faint)}
.mm-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.mm-h{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),P=['种粮的','晒盐的','织布的'],GD=['粮','盐','布'];let mode='coin',k=0;
  const S=[['种粮的给晒盐的粮'],['晒盐的给织布的盐'],['织布的给种粮的布']];
  function draw(){const coins=[1,0,0],book=[];
    for(let s=0;s<k;s++){const a=s%3,b=(s+1)%3;if(mode==='coin'){coins[b]-=1;coins[a]+=1;}book.push(`${P[a]}为${P[b]}付出${GD[a]}`);}
    // 货币：最初种粮的手里没有贝壳，晒盐的拿一枚贝壳换粮
    const c=[0,1,0];for(let s=0;s<k;s++){const a=s%3,b=(s+1)%3;c[b]-=1;c[a]+=1;}
    $('mm-h').innerHTML=P.map((p,i)=>`<div class="mm-p${k>0&&((k-1)%3===i||(k%3)===i)?' on':''}"><b>${p}</b><span>${mode==='coin'?(c[i]>0?'<i></i>'.repeat(c[i])+` 手里有 ${c[i]} 枚贝壳`:'手里没有贝壳'):'账本：'+(book.filter(x=>x.startsWith(p)).length)+' 次付出，'+(book.filter(x=>x.includes('为'+p)).length)+' 次得到'}</span></div>`).join('');
    $('mm-step').textContent=k?`第 ${k} 步：${S[(k-1)%3][0]}`:'尚未开始';
    $('mm-msg').textContent=mode==='coin'?'一枚贝壳在三户之间流转：谁手里有贝壳，就说明他为别人付出过、还没有得到回报。不需要任何人记住全村的往来。':'全村共享一本账，记下谁为谁付出过。只要人人看得到、改不了，账本能做到贝壳能做到的一切，还能记下更多细节。';}
  document.querySelectorAll('[data-mm]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mm;document.querySelectorAll('[data-mm]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
  $('mm-next').addEventListener('click',()=>{k=k>=6?0:k+1;draw();});
  $('mm').addEventListener('anim-in',()=>{k=0;draw();[1,2,3].forEach((s,i)=>setTimeout(()=>{k=s;draw();},800+i*1300));});
  draw();
})();
</script>
