<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">第一部分十二章的案例，按六问复核</p><p class="figsub">点选一章，看它的案例、引入的唯一约束、今天的对应、第二部分的伏笔、出处与模拟器规则。</p></div></div>

<style>
.ms-ch{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}

.ms-d{display:grid;grid-template-columns:8em 1fr;gap:6px 14px;margin:0;font-size:13.5px;line-height:1.6}
.ms-d dt{color:var(--faint);font-size:12px;padding-top:2px} .ms-d dd{margin:0}

<script>

</script>
