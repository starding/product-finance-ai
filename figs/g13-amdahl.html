<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">最慢的环节决定整体</p><p class="figsub">一件事中有一部分可以交给书记员加速，其余部分（核对、担责、等待）速度不变。拖动两个滑块，看整体快了几倍。</p></div><button class="replay" type="button" data-replay="am13">重播</button></div>
    <div class="am13" id="am13" data-anim>
      <svg viewBox="0 0 660 220" role="img" aria-label="整体加速倍数"><g id="am13-g"></g></svg>
      <div class="am13-ctl">
        <div class="sl"><label for="am13-p">可以加速的部分 <b id="am13-pv"></b></label><input id="am13-p" type="range" min="10" max="99" step="1" value="80"></div>
        <div class="sl"><label for="am13-s">这一部分快了 <b id="am13-sv"></b></label><input id="am13-s" type="range" min="0" max="3" step="0.1" value="2"></div>
      </div>
      <p class="am13-msg" id="am13-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>整体加速倍数＝1 ÷［（1－p）＋ p ÷ s］，p 为可以加速的部分，s 为这一部分的加速倍数（阿姆达尔，1967）。横轴为 s，对数刻度；虚线为 s 无穷大时的上限 1 ÷（1－p）。</figcaption>
</figure>
<style>
.am13 svg{width:100%;height:auto;display:block}
.am13-ctl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.am13-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.am13-ctl{grid-template-columns:1fr;gap:4px}.am13 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('am13'+id),X0=50,X1=630,YT=12,YB=180,x=l=>X0+l/3*(X1-X0);
  const sp=(p,s)=>1/((1-p)+p/s);
  function draw(){const p=+$('-p').value/100,ls=+$('-s').value,s=Math.pow(10,ls),cap=1/(1-p),mx=Math.max(10,Math.ceil(cap/10)*10),y=v=>YB-(v-1)/(mx-1)*(YB-YT);
    $('-pv').textContent=Math.round(p*100)+'%';$('-sv').textContent=s<10?s.toFixed(1)+' 倍':Math.round(s)+' 倍';
    let h=[1,mx/2,mx].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${Math.round(v)} 倍</text>`).join('')
      +[0,1,2,3].map(l=>`<text x="${x(l)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${Math.pow(10,l)} 倍</text>`).join('');
    h+=`<line x1="${X0}" x2="${X1}" y1="${y(cap)}" y2="${y(cap)}" stroke="var(--warm)" stroke-dasharray="5 4"/><text x="${X1}" y="${y(cap)-6}" text-anchor="end" font-size="11" fill="var(--warm)">上限 ${cap.toFixed(1)} 倍</text>`;
    let d='';for(let l=0;l<=3.001;l+=.05)d+=(l?'L':'M')+x(l).toFixed(1)+','+y(sp(p,Math.pow(10,l))).toFixed(1);
    const now=sp(p,s);h+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.6"/><circle cx="${x(ls)}" cy="${y(now)}" r="6" fill="var(--accent)"/>`;
    $('-g').innerHTML=h;
    $('-msg').textContent=`可以加速的部分占 ${Math.round(p*100)}%，这一部分快了 ${s<10?s.toFixed(1):Math.round(s)} 倍，整体只快了 ${now.toFixed(1)} 倍；即使这一部分无限快，整体最多快 ${cap.toFixed(1)} 倍。要突破上限，只能缩短其余 ${Math.round((1-p)*100)}% 的部分。`;}
  ['-p','-s'].forEach(k=>$(k).addEventListener('input',draw));
  $('').addEventListener('anim-in',()=>{let v=0;$('-s').value=0;draw();const id=setInterval(()=>{v+=.1;$('-s').value=v.toFixed(1);draw();if(v>=3)clearInterval(id);},70);});
  draw();
})();
</script>
