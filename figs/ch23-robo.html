<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">价值集中在原本做得最差的人身上</p><p class="figsub">两组投资者采用智能投顾前后的变化。切换前后，比较持有的股票数量与组合的波动（示意数字）。</p></div><button class="replay" type="button" data-replay="rb">重播</button></div>
    <div class="seg-btns" role="group" aria-label="时点">
      <button type="button" data-rb="pre" aria-pressed="true">采用之前</button>
      <button type="button" data-rb="post" aria-pressed="false">采用之后</button>
    </div>
    <div class="rb" id="rb" data-anim>
      <div class="rb-g" id="rb-g"></div>
      <p class="rb-msg" id="rb-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意数字，方向依据 D'Acunto、Prabhala 与 Rossi（2019）对一家印度券商智能投顾的研究：原本分散不足的投资者采用后分散程度明显提高、波动下降；原本较分散的投资者持股反而减少，波动略有下降，交易增加；行为偏差的减少适用于全部采用者。</figcaption>
</figure>
<style>
.rb-g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rb-c{background:var(--quote);border-radius:10px;padding:10px 12px}
.rb-c>b{font-size:14px;display:block;margin-bottom:6px}
.rb-m{display:grid;grid-template-columns:90px 1fr 54px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.rb-m span{color:var(--faint)}
.rb-t{height:14px;background:var(--surface);border-radius:7px;overflow:hidden}
.rb-t i{display:block;height:100%;border-radius:7px;transition:width .7s ease}
.rb-m em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.rb-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.rb-g{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const G=[['原本分散不足',[3,14],[32,22]],['原本较为分散',[15,13],[19,18]]];
  const box=document.getElementById('rb-g');
  box.innerHTML=G.map(([n],i)=>`<div class="rb-c"><b>${n}</b><div class="rb-m"><span>持有股票数</span><div class="rb-t"><i id="rb-s${i}" style="background:var(--accent)"></i></div><em id="rb-sv${i}"></em></div><div class="rb-m"><span>组合年化波动</span><div class="rb-t"><i id="rb-v${i}" style="background:var(--warm)"></i></div><em id="rb-vv${i}"></em></div></div>`).join('');
  function set(k){document.querySelectorAll('[data-rb]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.rb===k)));const j=k==='pre'?0:1;
    G.forEach(([n,s,v],i)=>{document.getElementById('rb-s'+i).style.width=s[j]/20*100+'%';document.getElementById('rb-sv'+i).textContent=s[j]+' 只';document.getElementById('rb-v'+i).style.width=v[j]/40*100+'%';document.getElementById('rb-vv'+i).textContent=v[j]+'%';});
    document.getElementById('rb-msg').textContent=k==='pre'?'采用之前：一组投资者只持有三四只股票，组合波动很大；另一组已经较为分散。':'采用之后：原本分散不足的一组，持股数大幅增加、波动明显下降；原本已经分散的一组，持股数反而减少，波动只略有下降，交易却更频繁。代理的价值，是让做不到的人做到。';}
  document.querySelectorAll('[data-rb]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.rb)));
  document.getElementById('rb').addEventListener('anim-in',()=>{set('pre');setTimeout(()=>set('post'),2200);});
  set('pre');
})();
</script>
