<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">证据的诊断力</p><p class="figsub">每条证据在可靠与不可靠的受托人身上出现的概率，以及二者之比（似然比）。中线是 1：越靠近中线，证据越没有用。点按一条查看说明。</p></div><button class="replay" type="button" data-replay="lr">重播</button></div>
    <div class="lr" id="lr" data-anim></div>
    <p class="lr-msg" id="lr-msg" aria-live="polite">点按一条证据。</p>
  </div>
  <figcaption>示意概率，只表示相对大小。资金追逐过往业绩与广告的证据见 Sirri 与 Tufano（1998）、Jain 与 Wu（2000）；Jain 与 Wu（2000）发现广告基金此后的表现并不比同类更好，因此过往收益与广告的似然比接近 1。</figcaption>
</figure>
<style>
.lr{display:grid;gap:5px}
.lr-r{font:inherit;width:100%;display:grid;grid-template-columns:minmax(0,1.3fr) 96px minmax(0,1.6fr) 54px;gap:10px;align-items:center;text-align:left;background:var(--quote);border:1.5px solid transparent;border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink);cursor:pointer}
.lr-r.sel{border-color:var(--ink)}
.lr-r>span:nth-child(2){color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.lr-t{position:relative;height:14px;background:var(--surface);border-radius:7px}
.lr-t::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1.5px solid var(--faint)}
.lr-t i{position:absolute;top:0;height:100%;border-radius:7px;width:0;transition:width .6s ease,left .6s ease}
.lr-r b{text-align:right;font-variant-numeric:tabular-nums}
.lr-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.lr-r{grid-template-columns:minmax(0,1fr) 54px}.lr-r>span:nth-child(2){display:none}.lr-t{grid-column:1/-1;grid-row:2}}
</style>
<script>
(function(){
  const E=[['上一年收益排名前四分之一',.27,.25,'好与差的受托人都可能交出漂亮的一年：几乎不提供信息，却最常被拿来判断。'],
    ['做过大量广告',.5,.5,'是否投放广告与是否可靠无关，似然比为 1。'],
    ['全年费用与承诺一致',.99,.6,'可靠的受托人几乎总是守约；不可靠的常有隐性收费。'],
    ['全年未违反约定的约束',.98,.5,'约束是否被遵守，好坏差别很大，是诊断力高的证据。'],
    ['每个周期都有交代',.97,.4,'持续任务的每个周期都说明状态，不可靠的受托人很难长期做到。'],
    ['能力类失误后坦率承认并补救',.9,.3,'失误本身是关于能力的证据；对能力类失误坦率承认、说明改进，是愿意改进的证据，可靠的受托人更常这样做。'],
    ['发生一次严重违约',.01,.15,'在可靠的受托人身上极少发生：一次就足以大幅改变信念。']];
  const box=document.getElementById('lr'),L=Math.log(20);
  box.innerHTML=E.map(([n,a,b],i)=>`<button type="button" class="lr-r" data-i="${i}"><span>${n}</span><span>${Math.round(a*100)}% 对 ${Math.round(b*100)}%</span><div class="lr-t"><i></i></div><b>${(a/b)>=1?(a/b).toFixed(1):'1/'+(b/a).toFixed(0)}</b></button>`).join('');
  const rs=[...box.children];
  function fill(){rs.forEach((r,i)=>{const v=Math.log(E[i][1]/E[i][2])/L*50,el=r.querySelector('i');el.style.background=v>=0?'var(--accent)':'var(--warm)';el.style.left=(v>=0?50:50+v)+'%';el.style.width=Math.max(1,Math.abs(v))+'%';});}
  rs.forEach((r,i)=>r.addEventListener('click',()=>{rs.forEach(x=>x.classList.toggle('sel',x===r));document.getElementById('lr-msg').textContent=E[i][0]+'：'+E[i][3];}));
  box.addEventListener('anim-in',()=>{rs.forEach(r=>{const el=r.querySelector('i');el.style.width='0';el.style.left='50%';});setTimeout(fill,60);});
  fill();
})();
</script>
