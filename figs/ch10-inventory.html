<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">存货压力下，做市商如何调整报价</p><p class="figsub">第 10 至 22 笔连续涌来卖单。做市商被迫买入、存货上升，于是同时调低买价与卖价，吸引买方、劝退卖方。</p></div><button class="replay" type="button" id="iv-run">重新模拟</button></div>
    <div class="iv" id="iv" data-anim>
      <svg viewBox="0 0 640 260" role="img" aria-label="做市商报价与存货随交易变化">
        <g id="iv-axis"></g>
        <path id="iv-band" class="iv-band"/>
        <path id="iv-ask" class="iv-l ask"/><path id="iv-bid" class="iv-l bid"/>
        <g id="iv-inv"></g>
      </svg>
      <div class="sl"><label for="iv-v">价格波动 <b id="iv-vv"></b></label><input id="iv-v" type="range" min="1" max="3" step="1" value="1"><div class="hint">波动越大，持有存货的风险越高，价差越宽</div></div>
    </div>
  </div>
  <figcaption>示意模型，思路来自 Amihud 与 Mendelson（1980）、Ho 与 Stoll（1981）：报价中点随存货偏离而反向移动，价差随波动扩大。真实价值保持 100 不变。</figcaption>
</figure>
<style>
.iv svg{width:100%;height:auto;display:block}
.iv-band{fill:var(--accent-soft)}
.iv-l{fill:none;stroke-width:2}
.iv-l.ask{stroke:var(--warm)} .iv-l.bid{stroke:var(--accent)}
#iv-inv rect{fill:var(--blue);opacity:.6}
#iv-inv rect.neg{fill:var(--warm)}
</style>
<script>
(function(){
  const N=60,X0=50,X1=620,YT=16,YB=150,Y0I=210,x=t=>X0+t/N*(X1-X0), y=p=>YB-(p-99)/(101.2-99)*(YB-YT);
  let a=`<line x1="${X0}" y1="${y(100)}" x2="${X1}" y2="${y(100)}" class="s-faint" stroke-dasharray="4 3"/><text x="${X1}" y="${y(100)-5}" text-anchor="end" font-size="11" class="t-muted">真实价值 100</text>`;
  a+=`<text x="${X0-6}" y="${YT+8}" text-anchor="end" font-size="10" class="t-faint">报价</text><text x="${X0-6}" y="${Y0I+4}" text-anchor="end" font-size="10" class="t-faint">存货</text>`;
  a+=`<line x1="${X0}" y1="${Y0I}" x2="${X1}" y2="${Y0I}" class="s-faint"/><rect x="${x(10)}" y="${YT}" width="${x(22)-x(10)}" height="${Y0I+40-YT}" fill="var(--warm-soft)" opacity=".35"/><text x="${(x(10)+x(22))/2}" y="${YT+10}" text-anchor="middle" font-size="11" class="t-warm">卖单涌来</text>`;
  [0,10,20,30,40,50,60].forEach(t=>a+=`<text x="${x(t)}" y="256" text-anchor="middle" font-size="10" class="t-faint">${t}</text>`);
  document.getElementById('iv-axis').innerHTML=a;
  const v=document.getElementById('iv-v');
  function run(){
    const sg=+v.value; document.getElementById('iv-vv').textContent=['','小','中','大'][sg];
    let I=0; const A=[],B=[],INV=[];
    for(let t=0;t<=N;t++){
      const mid=100-0.04*I, h=0.05+0.06*sg;
      A.push(mid+h); B.push(mid-h); INV.push(I);
      let buy; if(t>=10&&t<22) buy=false; else buy=Math.random()<Math.min(0.9,Math.max(0.1,0.5+0.05*I));
      I+=buy?-1:1;
    }
    const P=arr=>'M'+arr.map((p,t)=>`${x(t).toFixed(1)},${y(p).toFixed(1)}`).join('L');
    document.getElementById('iv-ask').setAttribute('d',P(A));
    document.getElementById('iv-bid').setAttribute('d',P(B));
    document.getElementById('iv-band').setAttribute('d',P(A)+'L'+B.map((p,t)=>`${x(t).toFixed(1)},${y(p).toFixed(1)}`).reverse().join('L')+'Z');
    const w=(X1-X0)/N*0.7;
    document.getElementById('iv-inv').innerHTML=INV.map((I,t)=>{const h=Math.min(38,Math.abs(I)*2.6);return `<rect class="${I<0?'neg':''}" x="${x(t)-w/2}" y="${I>=0?Y0I-h:Y0I}" width="${w}" height="${h}"/>`;}).join('');
    ['iv-ask','iv-bid'].forEach(id=>{const el=document.getElementById(id),L=el.getTotalLength();el.style.transition='none';el.style.strokeDasharray=L;el.style.strokeDashoffset=L;el.getBoundingClientRect();el.style.transition='stroke-dashoffset 2s ease';el.style.strokeDashoffset=0;});
  }
  v.addEventListener('input',run);
  document.getElementById('iv-run').addEventListener('click',run);
  document.getElementById('iv').addEventListener('anim-in',run);
  run();
})();
</script>
