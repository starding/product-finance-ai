<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">分散不掉的风险</p><p class="figsub">每户的收成波动由两部分构成：自家的运气与全村共同的年景。拖动共同年景所占的比重，看户数增加时每户承担的波动能降到哪里。</p></div><button class="replay" type="button" data-replay="cm">重播</button></div>
    <div class="cm" id="cm" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="户数与每户承担的波动"><g id="cm-ax"></g><path id="cm-c" class="cm-c"/><line id="cm-f" class="cm-f"/><text id="cm-ft" font-size="12" class="t-warm"></text></svg>
      <div class="sl"><label for="cm-r">共同年景所占的比重 <b id="cm-rv"></b></label><input id="cm-r" type="range" min="0" max="100" step="5" value="30"></div>
      <p class="cm-msg" id="cm-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：比重指共同年景在每户收成方差中所占的比例。分担之后每户承担的波动 ＝ 原有波动 × √（比重 ＋（1 − 比重）÷ 户数），户数无限多时降到 原有波动 × √比重。</figcaption>
</figure>
<style>
.cm svg{width:100%;height:auto;display:block}
.cm-c{fill:none;stroke:var(--accent);stroke-width:2.5}
.cm-f{stroke:var(--warm);stroke-width:1.6;stroke-dasharray:5 4}
.cm-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.cm svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=50,X1=630,YT=12,YB=180,lx=n=>X0+Math.log(n)/Math.log(100)*(X1-X0),y=v=>YB-v*(YB-YT);
  $('cm-ax').innerHTML=[0,.25,.5,.75,1].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+[1,2,5,10,20,50,100].map(n=>`<text x="${lx(n)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${n} 户</text>`).join('');
  function draw(){const r=+$('cm-r').value/100;let d='';for(let n=1;n<=100;n*=1.05)d+=(n===1?'M':'L')+lx(n).toFixed(1)+','+y(Math.sqrt(r+(1-r)/n)).toFixed(1);$('cm-c').setAttribute('d',d);
    const f=Math.sqrt(r);['x1','x2'].forEach((k,i)=>$('cm-f').setAttribute(k,i?X1:X0));$('cm-f').setAttribute('y1',y(f));$('cm-f').setAttribute('y2',y(f));
    $('cm-ft').setAttribute('x',X1-4);$('cm-ft').setAttribute('y',y(f)-6);$('cm-ft').setAttribute('text-anchor','end');$('cm-ft').textContent=`分散不掉：${Math.round(f*100)}%`;
    $('cm-rv').textContent=Math.round(r*100)+'%';
    $('cm-msg').textContent=r===0?'各家的风险互不相关时，户数越多，每户承担的波动越接近零。':r===1?'所有风险都是全村共同的年景时，再多的户数也分担不了任何波动。':`共同年景占 ${Math.round(r*100)}% 时，户数再多，每户仍要承担原有波动的 ${Math.round(f*100)}%：这部分只能由愿意承担的人承担，并为此得到补偿。`;}
  $('cm-r').addEventListener('input',draw);
  $('cm').addEventListener('anim-in',()=>{let v=0;$('cm-r').value=0;draw();const id=setInterval(()=>{v+=5;$('cm-r').value=v;draw();if(v>=60)clearInterval(id);},200);});
  draw();
})();
</script>
