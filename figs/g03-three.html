<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">让承诺可信的三种办法</p><p class="figsub">点选一种办法，看它依靠什么、适合谁、代价是什么、把谁挡在门外。</p></div><button class="replay" type="button" data-replay="th3">重播</button></div>
    <div class="th3" id="th3" data-anim>
      <button type="button" class="th3-c" data-i="0" style="--i:0"><b>声誉</b><span>让借款人在乎将来</span></button>
      <button type="button" class="th3-c" data-i="1" style="--i:1"><b>抵押</b><span>让借款人有东西可失</span></button>
      <button type="button" class="th3-c" data-i="2" style="--i:2"><b>第三方执行</b><span>由双方都承认的人强制执行</span></button>
    </div>
    <dl class="th3-d" id="th3-d" aria-live="polite"></dl>
  </div>
</figure>
<style>
.th3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th3-c{font:inherit;text-align:left;cursor:pointer;background:var(--quote);border:1px solid transparent;border-radius:10px;padding:10px 12px;color:var(--ink);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.25s)}
.th3.in .th3-c{opacity:1;transform:none}
.th3-c b{display:block;font-size:15px} .th3-c span{font-size:12.5px;color:var(--muted)}
.th3-c.sel{border-color:var(--accent);background:var(--accent-soft)}
.th3-d{display:grid;grid-template-columns:7em 1fr;gap:6px 14px;margin:14px 0 0;font-size:13.5px;line-height:1.6}
.th3-d dt{color:var(--faint);font-size:12px;padding-top:2px} .th3-d dd{margin:0}
@media (max-width:640px){.th3{grid-template-columns:1fr}.th3-d{grid-template-columns:1fr;gap:1px}.th3-d dd{margin-bottom:6px}}
</style>
<script>
(function(){
  const K=['依靠','适合','代价','挡在门外的人','今天的对应'];
  const D=[['反复交往，以及违约记录能传开','熟人之间、反复发生的小额借贷','要有长期的关系与共享的记录；新来的人没有记录','初来乍到、没有记录的人','征信记录、信用评分'],
    ['借款人拥有、并愿意押出的东西','有资产的人、金额较大的借贷','要评估与保管抵押物；抵押物的价值会变化','没有资产的人','房贷、汽车贷款、证券质押与保证金'],
    ['合同，以及能强制执行的长老、法庭或官府','陌生人之间、金额较大的借贷','记录、审理与执行都要成本；执行者自己也要可信','付不起执行成本的小额借贷','借款合同、公证、法院判决']];
  const d=document.getElementById('th3-d'),bs=[...document.querySelectorAll('.th3-c')];
  function set(i){bs.forEach((b,j)=>b.classList.toggle('sel',j===i));d.innerHTML=K.map((k,j)=>`<dt>${k}</dt><dd>${D[i][j]}</dd>`).join('');}
  bs.forEach((b,i)=>b.addEventListener('click',()=>set(i)));
  document.getElementById('th3').addEventListener('anim-in',()=>{[0,1,2].forEach((i,k)=>setTimeout(()=>set(i),400+k*1800));});
  set(0);
})();
</script>
