<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">五项设计，各自作用于哪一项</p><p class="figsub">用户是否交出一件“方案批准”级的事务：信念要越过门槛。逐项打开设计，看它改变了哪一项，以及信念与门槛的位置。</p></div><button class="replay" type="button" data-replay="lv">重播</button></div>
    <div class="lv-eq" id="lv-eq">
      <span data-t="prior">先验</span><em>→ 经过</em><span data-t="n">被看见的证据</span><em>×</em><span data-t="lr">每条的诊断力</span><em>，扣除</em><span data-t="fail">失误的分量</span><em>→ 信念 ≥</em><span data-t="th">门槛</span>
    </div>
    <div class="lv-sl" id="lv-sl"></div>
    <div class="lv" id="lv" data-anim>
      <div class="lv-bar"><div class="lv-t"><i id="lv-b"></i></div><span id="lv-th"></span></div>
      <p class="lv-msg" id="lv-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意计算：先验 30%（有制度保障时 50%）；三个月里用户看见 6 条过程证据（有呈现设计时 14 条），每条似然比 1.15（有第三方核验时 1.35）；其间发生一次失误，似然比 1/20（主动说明时 1/4）；门槛 85%（退出容易时 70%）。</figcaption>
</figure>
<style>
.lv-eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;margin:4px 0 10px}
.lv-eq span{border:1.5px solid var(--line);border-radius:8px;padding:3px 9px;background:var(--surface);transition:all .3s}
.lv-eq span.on{border-color:var(--accent);background:var(--accent-soft)}
.lv-eq em{font-style:normal;color:var(--faint);font-size:12.5px}
.lv-sl{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-bottom:10px}
.lv-sl label{display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
.lv-sl input{accent-color:var(--accent);width:16px;height:16px}
.lv-bar{position:relative;margin-top:24px}
.lv-t{height:20px;background:var(--quote);border-radius:10px;overflow:hidden}
.lv-t i{display:block;height:100%;border-radius:10px;transition:width .6s ease,background .3s}
.lv-bar span{position:absolute;top:-22px;transform:translateX(-50%);font-size:11.5px;color:var(--warm);white-space:nowrap;transition:left .6s}
.lv-bar span::after{content:"";position:absolute;left:50%;top:16px;height:32px;border-left:2px dashed var(--warm)}
.lv-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.lv-sl{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const S=[['prior','借用制度：托管、监管与审计'],['n','让过程证据被看见'],['lr','证据由第三方核验'],['fail','失误时抢先说明'],['th','退出与收回很容易']];
  document.getElementById('lv-sl').innerHTML=S.map(([k,n])=>`<label><input type="checkbox" data-lv="${k}"> ${n}</label>`).join('');
  const cb=[...document.querySelectorAll('[data-lv]')],on=k=>document.querySelector(`[data-lv="${k}"]`).checked;
  const lo=p=>Math.log(p/(1-p)),ex=l=>1/(1+Math.exp(-l));
  function r(){const p0=on('prior')?.5:.3,n=on('n')?14:6,lr=on('lr')?1.35:1.15,f=on('fail')?1/4:1/20,th=on('th')?.7:.85;
    const b=ex(lo(p0)+n*Math.log(lr)+Math.log(f));
    document.querySelectorAll('.lv-eq span').forEach(s=>s.classList.toggle('on',on(s.dataset.t)));
    const bar=document.getElementById('lv-b');bar.style.width=(b*100)+'%';bar.style.background=b>=th?'var(--accent)':'var(--gold)';
    const t=document.getElementById('lv-th');t.style.left=(th*100)+'%';t.textContent='门槛 '+Math.round(th*100)+'%';
    const k=cb.filter(c=>c.checked).length;
    document.getElementById('lv-msg').textContent=`信念约为 ${(b*100).toFixed(0)}%，${b>=th?'越过了门槛：用户愿意交出这件事。':'仍低于门槛：用户还不会交出这件事。'}${k===0?'没有任何设计时，证据少、诊断力低，一次失误就把信念拉回原点。':''}`;}
  cb.forEach(c=>c.addEventListener('change',r));
  document.getElementById('lv').addEventListener('anim-in',()=>{cb.forEach(c=>c.checked=false);r();cb.forEach((c,i)=>setTimeout(()=>{c.checked=true;r();},1000*(i+1)));});
  r();
})();
</script>
