<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">两位编码者的一致程度</p><p class="figsub">κ 系数扣除了偶然一致的部分：0 表示与随机判定无异，1 表示完全一致。可达比例是连续取值，用相关系数衡量。</p></div><button class="replay" type="button" data-replay="ag">重播</button></div>
    <div class="ag" id="ag" data-anim></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>κ 系数或相关系数</span><span><i style="background:var(--faint)"></i>完全一致的比例</span></div>
  </div>
  <figcaption>κ 系数见 Cohen（1960）；有序档位用线性加权 κ，见 Cohen（1968）。数据见 reliability.json 与 activities-332.csv。</figcaption>
</figure>
<style>
.ag{display:grid;gap:8px}
.ag-r{display:grid;grid-template-columns:12em 1fr 9em;gap:10px;align-items:center;font-size:13px}
.ag-t{position:relative;height:16px;background:var(--quote);border-radius:4px;overflow:hidden}
.ag-t i{position:absolute;left:0;top:0;height:100%;border-radius:4px;transform-origin:left;transform:scaleX(0);transition:transform .8s;transition-delay:calc(var(--i)*.12s)}
.ag-t i.p{background:var(--faint);opacity:.45} .ag-t i.k{background:var(--accent);height:8px;top:4px}
.ag.in .ag-t i{transform:none}
.ag-r b{font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.ag-r small{color:var(--faint);font-size:11.5px;font-weight:400}
@media (max-width:640px){.ag-r{grid-template-columns:1fr;gap:3px}}
</style>
<script>
(function(){
  const R=[['事务的门（6 类）',.948,.961,'κ'],['事务的纲（17 类）',.904,.922,'κ'],['可达比例：Chat',.877,null,'相关'],['可达比例：Agent',.934,null,'相关'],['可达比例：具身 Agent',.838,null,'相关'],['违约后果（4 档）',.717,.72,'加权 κ'],['结果可验证性（4 档）',.834,.846,'加权 κ']];
  document.getElementById('ag').innerHTML=R.map(([n,k,p,t],i)=>`<div class="ag-r" style="--i:${i}"><span>${n}</span><div class="ag-t">${p!==null?`<i class="p" style="width:${p*100}%;--i:${i}"></i>`:''}<i class="k" style="width:${k*100}%;--i:${i}"></i></div><b>${t} ${k.toFixed(2)}${p!==null?`<small>　一致 ${Math.round(p*100)}%</small>`:''}</b></div>`).join('');
})();
</script>
