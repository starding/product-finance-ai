<figure>
  <div class="card">
    <p class="figtitle">持有的股票越多，风险降到哪里为止</p>
    <p class="figsub">拖动持有的股票数量。灰色是可以分散掉的个别风险，绿色是无论持有多少只都分散不掉的系统风险。</p>
    <div class="nn" id="nn" data-anim>
      <svg viewBox="0 0 640 230" role="img" aria-label="组合波动率随持有股票数量的变化">
        <g id="nn-axis"></g>
        <path id="nn-sys" class="nn-sys"/>
        <path id="nn-idio" class="nn-idio"/>
        <path id="nn-line" class="nn-line"/>
        <line id="nn-cur" class="nn-cur" y1="14" y2="196"/>
        <circle id="nn-dot" r="6" class="nn-dot"/>
      </svg>
      <div class="sl"><label for="nn-k">持有的股票数量 <b id="nn-kv"></b></label><input id="nn-k" type="range" min="1" max="100" step="1" value="10"></div>
      <div class="nn-out">
        <div><span>组合的年波动率</span><b id="nn-v"></b></div>
        <div><span>其中可分散的部分已消除</span><b id="nn-p"></b></div>
        <div><span>分散不掉的下限</span><b id="nn-f"></b></div>
      </div>
    </div>
  </div>
  <figcaption>示例参数：每只股票的年波动率 35%，任意两只股票之间的平均相关系数 0.2，组合等权持有。此时组合的方差约为“平均协方差＋个别风险÷持股数”，下限约为 15.7%。持股数量与分散效果的实证估计见 Evans 与 Archer（1968）、Statman（1987）。</figcaption>
</figure>
<style>
.nn svg{width:100%;height:auto;display:block}
.nn-sys{fill:var(--accent-soft)}
.nn-idio{fill:var(--quote)}
.nn-line{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:900;stroke-dashoffset:900;transition:stroke-dashoffset 1.6s ease}
.nn.in .nn-line{stroke-dashoffset:0}
.nn-cur{stroke:var(--warm);stroke-dasharray:3 3}
.nn-dot{fill:var(--warm)}
.nn-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nn-out div{background:var(--quote);border-radius:8px;padding:8px 12px}
.nn-out span{display:block;font-size:12px;color:var(--faint)}
.nn-out b{font-size:19px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.nn-out{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const S=0.35, R=0.2, X0=50, X1=620, YT=14, YB=196, KMAX=100;
  const vol=k=>Math.sqrt(S*S*(R+(1-R)/k)), floor=S*Math.sqrt(R);
  const x=k=>X0+Math.log10(k)/Math.log10(KMAX)*(X1-X0), y=v=>YB-v/0.38*(YB-YT);
  let a=`<line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`;
  [1,2,5,10,20,50,100].forEach(k=>a+=`<line x1="${x(k)}" y1="${YT}" x2="${x(k)}" y2="${YB}" class="s-line"/><text x="${x(k)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${k} 只</text>`);
  [0.1,0.2,0.3].forEach(v=>a+=`<text x="${X0-8}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`);
  a+=`<text x="${x(60)}" y="${y(floor/2)}" text-anchor="middle" font-size="12" class="t-accent">系统风险：分散不掉</text><text x="${x(2.2)}" y="${y(0.3)}" font-size="12" class="t-muted">个别风险：可以分散</text>`;
  document.getElementById('nn-axis').innerHTML=a;
  const ks=[];for(let i=0;i<=200;i++)ks.push(Math.pow(KMAX,i/200));
  const top=ks.map(k=>`${x(k).toFixed(1)},${y(vol(k)).toFixed(1)}`);
  document.getElementById('nn-line').setAttribute('d','M'+top.join('L'));
  document.getElementById('nn-idio').setAttribute('d','M'+top.join('L')+`L${x(KMAX)},${y(floor)}L${x(1)},${y(floor)}Z`);
  document.getElementById('nn-sys').setAttribute('d',`M${x(1)},${y(floor)}L${x(KMAX)},${y(floor)}L${x(KMAX)},${YB}L${x(1)},${YB}Z`);
  const k=document.getElementById('nn-k');
  function render(){const n=+k.value,v=vol(n);
    document.getElementById('nn-kv').textContent=n+' 只';
    const c=document.getElementById('nn-cur');c.setAttribute('x1',x(n));c.setAttribute('x2',x(n));
    const d=document.getElementById('nn-dot');d.setAttribute('cx',x(n));d.setAttribute('cy',y(v));
    document.getElementById('nn-v').textContent=(v*100).toFixed(1)+'%';
    const removed=(S*S-v*v)/(S*S-floor*floor);
    document.getElementById('nn-p').textContent=(removed*100).toFixed(0)+'%';
    document.getElementById('nn-f').textContent=(floor*100).toFixed(1)+'%';}
  k.addEventListener('input',render); render();
  document.getElementById('nn').addEventListener('anim-in',()=>{let n=1;k.value=n;render();const id=setInterval(()=>{n=Math.min(100,Math.ceil(n*1.25));k.value=n;render();if(n>=30){clearInterval(id);setTimeout(()=>{k.value=10;render();},800);}},180);});
})();
</script>
