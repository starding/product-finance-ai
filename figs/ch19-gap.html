<figure class="gap" id="gapfig">
  <div class="card">
    <p class="figtitle">理论区间与公开实测</p>
    <p class="figsub">对数刻度。点按任一行查看研究来源。</p>
    <div id="gapsvg"></div>
    <div class="gapnote" id="gapnote">点按任一行查看研究来源与口径。</div>
  </div>
  <figcaption>理论区间按“委托人自行完成的投入 ÷ 代理完整正确履行时委托人的投入”估算。实测中，实心点为委托型随机对照，空心点为人主导、AI 辅助的研究（作代理指标），菱形为厂商自报或模型自估（不计委托人核对）。</figcaption>
</figure>
<style>
.gap svg{width:100%;height:auto;display:block}
.gap .row{cursor:pointer}
.gap .row:hover .rowbg,.gap .row.on .rowbg{fill:var(--quote)}
.gapnote{min-height:64px;font-size:13px;line-height:1.7;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.gapnote b{color:var(--ink)}
</style>
<script>
/* ---------- 理论区间与公开实测 ---------- */
(function(){
  // [名称, 理论下, 理论上, 实测下, 实测上, 类型 D委托型/A辅助型/V自报/N无, 说明]
  const groups=[
    ['通用委托',[
      ['对外代办与跨网站事务',1.5,45,null,null,'N','未找到公开实测。耗时 1～2 小时的电脑操作长流程，严格完成率最高约 21%（OSWorld 2.0，2026）。'],
      ['长期监测与提醒',2,30,3.07,6.53,'D','安全告警分诊随机对照，167 名外部安全分析师；属一次性告警队列，约 83% 增益来自自动关闭无害举报；作者与被测产品均属微软（Bono，2025）。'],
      ['深度研究与信息综合',2.7,24,3.29,3.29,'A','阅读两份报告并写摘要的观察任务，每组 2～3 人、非随机，证据很弱（英国商业贸易部，2025）。'],
      ['团队例行事务',2,24,1.14,1.2,'A','66 家企业 7,137 名知识工作者随机获得办公助手，每周邮件处理时间减少 12%～17%，会议时长无显著变化（Dillon 等，2025）。'],
      ['办公成果生成',2,16,1.02,1.67,'A','三项随机对照或现场实验：文档完成时长约 1.02 倍；咨询顾问 1.12～1.34 倍；写作任务 1.67 倍（Dillon 等 2025；Dell\'Acqua 等 2023；Noy 与 Zhang 2023）。'],
    ]],
    ['专业领域委托',[
      ['客户服务工单',4,100,1.03,1.2,'D','淘宝 647 名坐席、68 万次会话随机对照：全部会话 1.03 倍，代理适用的会话（占 5.8%）1.20 倍（Wang 等，2026）。'],
      ['代码迁移与重构',2.5,60,2,14,'V','仅企业与厂商自报：Google 内部迁移 2～9 倍，Airbnb 测试文件迁移约 13 倍。结果可由编译与测试核验，差距最小。'],
      ['功能开发与缺陷修复',2,36,1.04,1.22,'D','57 名开源开发者、800 余项任务随机对照，可自由使用编程代理，用时减少 4%～18%，即约 1.0～1.2 倍；研究方称为弱证据，可能是下限（METR，2026）。'],
      ['合同审阅与法律研究',1.6,24,1.14,1.59,'A','127 名法学院高年级学生随机对照，五项任务用时减少 12%～37%（Schwarcz 等，2025）。'],
      ['门诊病历生成',2.3,10.3,1.02,1.1,'D','14 个专科 238 名门诊医生随机对照，每份病历书写时间减少 1.7%～9.5%；工具并未用于每一次就诊（Lukac 等，2025）。'],
    ]],
    ['金融委托',[
      ['公司与观点研究',8,40,3,6.7,'V','仅厂商与机构自报，口径多为“最多减少”或研究周期。个人投资者每笔交易研究时间中位数约 6 分钟，以实际行为为基准时倍数接近或低于 1。'],
      ['组合管理与持续监测',8,32,null,null,'N','未找到时间节省的实测。智能投顾研究观察到采用后登录与交易并未减少，价值主要体现为配置从“做不到”变为“做得到”。'],
      ['交易指令提交',1,2.5,null,null,'N','自行下单约半分钟，逐笔确认后节省十几秒；理论上限本身只有 2.5 倍。'],
    ]],
    ['参照',[
      ['使用者的全部工时',null,null,1.03,1.06,'A','美国与丹麦就业者问卷：使用者自报节省其工时的 2.8%～5.4%；计入不使用的人，美国全体就业者约节省 1.4%（Bick 等 2025；Humlum 与 Vestergaard 2025）。'],
      ['模型自估单项任务',null,null,5,20,'V','依据对话记录估计单项任务提速，不计委托人核对时间（Anthropic，2025～2026）。'],
    ]],
  ];
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const host=document.getElementById('gapsvg'), note=document.getElementById('gapnote');
  const fm=v=>v<2?String(+v.toFixed(2)):v<10?String(+v.toFixed(1)):String(Math.round(v));
  const rng=(l,h)=>l===h?fm(l)+'×':fm(l)+'～'+fm(h)+'×';
  function draw(){
    const narrow=host.clientWidth<600;
    const W=narrow?600:900, LW=narrow?170:230, RW=narrow?20:120, X0=LW, X1=W-RW;
    const RH=narrow?40:34, GH=30, TOP=34;
    const n=groups.reduce((s,g)=>s+g[1].length,0);
    const H=TOP+groups.length*GH+n*RH+10;
    const vmin=0.8,vmax=100, X=v=>X0+Math.log10(v/vmin)/Math.log10(vmax/vmin)*(X1-X0);
    const ink=css('--ink'),muted=css('--muted'),faint=css('--faint'),line=css('--line'),acc=css('--accent'),warm=css('--warm'),gray=css('--gray-mark'),surf=css('--surface');
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="各类委托的理论放大倍数区间与公开实测对照" font-family="Noto Sans SC, PingFang SC, sans-serif">`;
    [1,3,10,30,100].forEach(v=>{s+=`<line x1="${X(v)}" y1="${TOP-8}" x2="${X(v)}" y2="${H-6}" stroke="${line}"/><text x="${X(v)}" y="${TOP-14}" text-anchor="middle" font-size="12" fill="${faint}">${v}×</text>`;});
    let y=TOP, idx=0;
    groups.forEach(([gt,rows])=>{
      s+=`<text x="4" y="${y+20}" font-size="13" font-weight="700" fill="${muted}">${gt}</text>`; y+=GH;
      rows.forEach(r=>{
        const [name,tl,th,al,ah,k]=r, cy=y+RH/2;
        s+=`<g class="row" data-i="${idx}" tabindex="0"><rect class="rowbg" x="0" y="${y}" width="${W}" height="${RH}" fill="transparent" rx="6"/>`;
        s+=`<text x="12" y="${cy+5}" font-size="${narrow?13:14}" fill="${ink}">${name}</text>`;
        if(tl!=null){s+=`<rect x="${X(tl)}" y="${cy-8}" width="${X(th)-X(tl)}" height="16" rx="8" fill="${acc}" opacity=".22"/>`;
          if(!narrow) s+=`<text x="${X1+10}" y="${cy+5}" font-size="12" fill="${muted}">理论 ${rng(tl,th)}</text>`;}
        if(k==='D'||k==='A'){
          const x1=X(al),x2=X(ah);
          if(tl!=null&&ah<tl) s+=`<line x1="${x2+7}" y1="${cy}" x2="${X(tl)-2}" y2="${cy}" stroke="${warm}" stroke-width="1.3" stroke-dasharray="2 3"/>`;
          if(x2-x1>1) s+=`<line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}" stroke="${warm}" stroke-width="${k==='D'?4:2}" stroke-linecap="round"/>`;
          (x2-x1>1?[x1,x2]:[x1]).forEach(xv=>{s+= k==='D'?`<circle cx="${xv}" cy="${cy}" r="5.5" fill="${warm}"/>`:`<circle cx="${xv}" cy="${cy}" r="5" fill="${surf}" stroke="${warm}" stroke-width="2"/>`;});
        } else if(k==='V'){
          const x1=X(al),x2=X(ah);
          s+=`<line x1="${x1}" y1="${cy}" x2="${x2}" y2="${cy}" stroke="${gray}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
          [x1,x2].forEach(xv=>{s+=`<path d="M${xv},${cy-5.5} L${xv+5.5},${cy} L${xv},${cy+5.5} L${xv-5.5},${cy} Z" fill="${surf}" stroke="${gray}" stroke-width="1.6"/>`;});
        } else {
          s+=`<text x="${X(th)+8}" y="${cy+4}" font-size="11.5" fill="${faint}">无公开实测</text>`;
        }
        s+=`</g>`; y+=RH; idx++;
      });
    });
    s+='</svg>';
    host.innerHTML=s;
    const flat=groups.flatMap(g=>g[1]);
    host.querySelectorAll('.row').forEach(g=>{
      const show=()=>{host.querySelectorAll('.row').forEach(x=>x.classList.remove('on'));g.classList.add('on');
        const r=flat[+g.dataset.i]; const kind={D:'委托型随机对照',A:'辅助型研究（代理指标）',V:'厂商自报或模型自估',N:'无公开实测'}[r[5]];
        note.innerHTML=`<b>${r[0]}</b>　${r[1]!=null?'理论 '+rng(r[1],r[2])+'　':''}${r[3]!=null?'实测 '+rng(r[3],r[4])+'（'+kind+'）':kind}<br>${r[6]}`;};
      g.addEventListener('click',show); g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show();}});
    });
  }
  draw();
  let t; addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,120);});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
})();
</script>
