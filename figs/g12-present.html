<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">每年都计划存一半，每年都存不到</p><p class="figsub">春天做计划时，今年与将来一样遥远，一户人家打算把收成存下一半；秋天收获时，眼前的粮食分量更重。拖动“偏重眼前的程度”，看五年里计划与实际的差距；勾选“事先锁住”，看春天就把一半存进取不出来的仓里会怎样。</p></div><button class="replay" type="button" data-replay="pb12">重播</button></div>
    <div class="pb12" id="pb12" data-anim>
      <svg viewBox="0 0 660 200" role="img" aria-label="五年里计划与实际存下的比例"><g id="pb12-g"></g></svg>
      <div class="legend"><span><i style="background:var(--quote);border:1px dashed var(--faint)"></i>春天计划存下的比例</span><span><i style="background:var(--accent)"></i>秋天实际存下的比例</span></div>
      <div class="sl"><label for="pb12-b">偏重眼前的程度 <b id="pb12-bv"></b></label><input id="pb12-b" type="range" min="0" max="60" step="5" value="30"></div>
      <div class="cs-sw"><label><input type="checkbox" id="pb12-l"> 事先锁住：春天就把一半存进要提前一年申请才能取出的仓</label></div>
      <p class="pb12-msg" id="pb12-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：对数效用，两期，不计利息与损耗。没有偏重眼前时，存下的比例为一半；眼前的消费额外加权时（莱布森，1997 的准双曲贴现，β 为将来相对眼前的权重），秋天实际存下 β／(1＋β)。这里“偏重眼前的程度”为 1－β。</figcaption>
</figure>
<style>
.pb12 svg{width:100%;height:auto;display:block}
.pb12-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.pb12 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('pb12'+id),X0=50,X1=650,YT=12,YB=170,y=v=>YB-v/.6*(YB-YT);
  function draw(){const d=+$('-b').value/100,b=1-d,lock=$('-l').checked,act=lock?.5:b/(1+b);$('-bv').textContent=Math.round(d*100)+'%';
    const w=(X1-X0)/5;let h=[0,.1,.2,.3,.4,.5,.6].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${Math.round(v*100)}%</text>`).join('');
    for(let k=0;k<5;k++){const cx=X0+w*k+w/2;h+=`<rect x="${cx-34}" y="${y(.5)}" width="68" height="${YB-y(.5)}" fill="var(--quote)" stroke="var(--faint)" stroke-dasharray="4 3"/><rect class="pb12-a" x="${cx-24}" y="${y(act)}" width="48" height="${YB-y(act)}" fill="var(--accent)" style="transition-delay:${k*.12}s"/><text x="${cx}" y="${y(act)-6}" text-anchor="middle" font-size="12">${Math.round(act*100)}%</text><text x="${cx}" y="${YB+18}" text-anchor="middle" font-size="11" class="t-faint">第 ${k+1} 年</text>`;}
    $('-g').innerHTML=h;
    $('-msg').textContent=lock?'粮食在春天就锁进了仓，秋天想多吃也取不出来：计划得以执行。代价是急需时也取不出来。':d===0?'不偏重眼前，春天的计划与秋天的行动一致，每年都存下一半。':`偏重眼前 ${Math.round(d*100)}%：每年秋天只存下 ${Math.round(act*100)}%，比计划少 ${Math.round((.5-act)*100)} 个百分点。下一年春天，他仍会计划存一半，仍会落空。`;}
  $('-b').addEventListener('input',draw);$('-l').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{$('-l').checked=false;let v=0;$('-b').value=0;draw();const id=setInterval(()=>{v+=5;$('-b').value=v;draw();if(v>=40){clearInterval(id);setTimeout(()=>{$('-l').checked=true;draw();},1400);}},220);});
  draw();
})();
</script>
