<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">从小处开始，逐级放宽</p><p class="figsub">授权分四级，每守约一段时间放宽一级。切换书记员的类型，看它在每一级上能造成的最大损失，以及一个打算骗人的书记员要守约多久才能拿到值得骗的权限。</p></div><button class="replay" type="button" data-replay="sm24">重播</button></div>
    <div class="seg-btns" role="group" aria-label="类型">
      <button type="button" data-sm24="good" aria-pressed="true">可靠的书记员</button>
      <button type="button" data-sm24="bad" aria-pressed="false">打算骗人的书记员</button>
    </div>
    <div class="sm24" id="sm24" data-anim>
      <svg viewBox="0 0 660 190" role="img" aria-label="授权等级随时间放宽"><g id="sm24-g"></g></svg>
      <p class="sm24-msg" id="sm24-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：第一级只能定投，单次最多动用家产的 2%；第二级可按约定调整比例，最多 5%；第三级可处理风暴后的调回，最多 10%；第四级在约定范围内自行处理大部分事务，最多 25%。每一级守约满一年放宽一级（沃森，1999 所说的从小处开始）。</figcaption>
</figure>
<style>
.sm24 svg{width:100%;height:auto;display:block}
.sm24-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.sm24 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('sm24'+id),L=[2,5,10,25],X0=50,X1=628,YB=160,YT=12,x=t=>X0+t/6*(X1-X0),y=v=>YB-v/25*(YB-YT);
  function set(k){document.querySelectorAll('[data-sm24]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sm24===k)));
    let h=[0,5,10,15,20,25].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}%</text>`).join('')+[0,1,2,3,4,5,6].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">第 ${t} 年</text>`).join('');
    const S=[];for(let t=0;t<6;t++){const lv=k==='bad'?(t<2?t:t===2?2:-1):Math.min(3,t);S.push(lv);}
    S.forEach((lv,t)=>{const v=lv<0?0:L[lv];h+=`<rect x="${x(t)+4}" y="${y(v)}" width="${x(1)-x(0)-8}" height="${YB-y(v)}" fill="${lv<0?'var(--faint)':k==='bad'&&t===2?'var(--warm)':'var(--accent)'}" opacity="${lv<0?.3:1}"/>`;});
    if(k==='bad')h+=`<text x="${x(2)+4}" y="${y(10)-6}" font-size="11" fill="var(--warm)">第三年行骗，被发现，授权收回</text>`;
    $('-g').innerHTML=h;
    $('-msg').textContent=k==='good'?'可靠的书记员每守约一年放宽一级，三年后拿到第四级，替他处理大部分事务；每一级的最大损失都与他已有的信心相称。':'打算骗人的书记员要先老老实实做两年小事，第三年才拿到最多能动用 10% 的权限；它在第三年行骗，最多骗走 10%，并立即被发现、收回授权。在头两年里，它守约的记录本身就让他受益，而它想骗的那一大笔，从来没有到它手里。';}
  document.querySelectorAll('[data-sm24]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.sm24)));
  $('').addEventListener('anim-in',()=>{set('good');setTimeout(()=>set('bad'),2600);});
  set('good');
})();
</script>
