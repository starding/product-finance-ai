<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">从一种安排到每户一种</p><p class="figsub">四十户人家各有最合适的船股比例（圆点），取决于年龄、收入是否稳定、几年后是否要用一大笔钱。横线是实际得到的比例。切换三种安排，看平均偏离了多少。</p></div><button class="replay" type="button" data-replay="ft14">重播</button></div>
    <div class="seg-btns" role="group" aria-label="安排">
      <button type="button" data-ft14="one" aria-pressed="true">人人一种</button>
      <button type="button" data-ft14="age" aria-pressed="false">按年龄分档</button>
      <button type="button" data-ft14="own" aria-pressed="false">每户专属</button>
    </div>
    <div class="ft14" id="ft14" data-anim>
      <svg viewBox="0 0 660 220" role="img" aria-label="合适的比例与实际的比例"><g id="ft14-g"></g></svg>
      <div class="legend"><span><i style="background:var(--accent);border-radius:50%"></i>最合适的比例</span><span><i style="background:var(--ink)"></i>实际得到的比例</span><span><i style="background:var(--warm)"></i>偏离</span></div>
      <p class="ft14-msg" id="ft14-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：四十户按年龄从轻到老排列。最合适的比例随年龄下降，并因各户的收入与用钱计划上下浮动；“按年龄分档”按四个年龄段各取平均。</figcaption>
</figure>
<style>
.ft14 svg{width:100%;height:auto;display:block}
.ft14-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.ft14 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('ft14'+id);let s=1415;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  const N=40,I=Array.from({length:N},(_,i)=>Math.max(.05,Math.min(.95,.9-.6*i/(N-1)+(r()-.5)*.45)));
  const X0=50,X1=628,YT=12,YB=180,x=i=>X0+(i+.5)/N*(X1-X0),y=v=>YB-v*(YB-YT);let mode='one';
  const avg=a=>a.reduce((p,q)=>p+q,0)/a.length;
  function given(){if(mode==='own')return I.slice();if(mode==='one'){const m=avg(I);return I.map(()=>m);}return I.map((_,i)=>{const k=Math.floor(i/10);return avg(I.slice(k*10,k*10+10));});}
  function draw(){const G=given();let h=[0,.25,.5,.75,1].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+`<text x="${X0}" y="${YB+16}" font-size="11" class="t-faint">年轻</text><text x="${X1}" y="${YB+16}" text-anchor="end" font-size="11" class="t-faint">年长</text>`;
    I.forEach((v,i)=>{h+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(v)}" y2="${y(G[i])}" stroke="var(--warm)" stroke-width="2"/><line x1="${x(i)-6}" x2="${x(i)+6}" y1="${y(G[i])}" y2="${y(G[i])}" stroke="var(--ink)" stroke-width="2"/><circle cx="${x(i)}" cy="${y(v)}" r="4.2" fill="var(--accent)"/>`;});
    $('-g').innerHTML=h;const dev=avg(I.map((v,i)=>Math.abs(v-G[i])))*100;
    $('-msg').textContent={one:`人人一种：所有人家得到同一个比例，平均偏离 ${dev.toFixed(0)} 个百分点，年轻人太保守，年长的人太冒险。`,age:`按年龄分档：平均偏离降到 ${dev.toFixed(0)} 个百分点；同一年龄段里收入与用钱计划不同的人家，仍得到同样的安排。`,own:'每户专属：每户得到自己最合适的比例。过去只有请得起账房的人家才有这样的安排。'}[mode];}
  const bs=[...document.querySelectorAll('[data-ft14]')];
  function set(m){mode=m;bs.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ft14===m)));draw();}
  bs.forEach(b=>b.addEventListener('click',()=>set(b.dataset.ft14)));
  $('').addEventListener('anim-in',()=>{['one','age','own'].forEach((m,i)=>setTimeout(()=>set(m),300+i*2200));});
  draw();
})();
</script>
