<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">问多少才合适</p><p class="figsub">书记员一年要作 200 个决定，其中 20 个要紧、取决于他在乎什么。他一年只能认真回答 12 次请示，多了就会不假思索地点头。拖动请示的比例，看坏决定有多少。</p></div><button class="replay" type="button" data-replay="ak21">重播</button></div>
    <div class="ak21" id="ak21" data-anim>
      <svg viewBox="0 0 660 200" role="img" aria-label="请示的比例与坏决定"><g id="ak21-g"></g></svg>
      <div class="sl"><label for="ak21-e">请示的比例 <b id="ak21-ev"></b></label><input id="ak21-e" type="range" min="0" max="100" step="1" value="5"></div>
      <p class="ak21-msg" id="ak21-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：书记员按要紧程度排序，先请示最要紧的事；要紧的事若由书记员自行决定，四成会不合他的心意；他认真回答的把握为 12 ÷ 请示次数（不超过 1），不认真时等于由书记员决定。</figcaption>
</figure>
<style>
.ak21 svg{width:100%;height:auto;display:block}
.ak21-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.ak21 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('ak21'+id),D=200,I=20,C=12,X0=50,X1=628,YT=12,YB=170,x=e=>X0+e*(X1-X0),y=v=>YB-v/10*(YB-YT);
  const bad=e=>{const n=Math.round(e*D),imp=Math.min(I,n),care=n?Math.min(1,C/n):1;return (I-imp)*.4+imp*(1-care)*.4;};
  function draw(){const e=+$('-e').value/100,n=Math.round(e*D),b=bad(e);$('-ev').textContent=Math.round(e*100)+'%（一年 '+n+' 次）';
    let h=[0,2,4,6,8,10].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v} 个</text>`).join('')+[0,.25,.5,.75,1].map(v=>`<text x="${x(v)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${v*100}%</text>`).join('');
    let d='';for(let k=0;k<=100;k++)d+=(k?'L':'M')+x(k/100).toFixed(1)+','+y(bad(k/100)).toFixed(1);
    h+=`<path d="${d}" fill="none" stroke="var(--warm)" stroke-width="2.6"/><circle cx="${x(e)}" cy="${y(b)}" r="7" fill="var(--warm)"/>`;
    $('-g').innerHTML=h;
    $('-msg').textContent=n===0?'从不请示：20 个要紧的决定全由书记员作，约 8 个不合他的心意。':n<=C?`一年请示 ${n} 次，他都能认真回答；剩下的要紧决定中约 ${b.toFixed(1)} 个不合心意。`:`一年请示 ${n} 次，他只能认真看其中 ${C} 次，其余的不假思索地点头：坏决定回升到约 ${b.toFixed(1)} 个。问得太多，等于没问。`;}
  $('-e').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{let v=0;$('-e').value=0;draw();const id=setInterval(()=>{v+=2;$('-e').value=v;draw();if(v>=60)clearInterval(id);},80);});
  draw();
})();
</script>
