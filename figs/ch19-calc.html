<figure id="calcfig">
  <div class="card">
    <p class="figtitle">放大倍数拆解</p>
    <p class="figsub">以“自己完成一件事”的投入为 100，调整三项因素，看委托人仍需付出多少。</p>
    <div class="presets" role="group" aria-label="预设参数">
      <button type="button" data-p="1,5,100">厂商演示</button>
      <button type="button" data-p="1,27,100">专家逐项核对</button>
      <button type="button" data-p="0.3,25,70">真实部署</button>
      <button type="button" data-p="0.9,8,90">可程序化核验</button>
    </div>
    <div class="calc">
      <div>
        <div class="sl"><label for="a">适用比例 <b id="av"></b></label><input id="a" type="range" min="0" max="100" step="1"><div class="hint">工作中能交给代理的比例；其余仍由自己完成</div></div>
        <div class="sl"><label for="c">核对成本 <b id="cv"></b></label><input id="c" type="range" min="1" max="60" step="1"><div class="hint">说明任务并核对成果所需时间，占自己完成用时的比例</div></div>
        <div class="sl"><label for="p">一次成功率 <b id="pv"></b></label><input id="p" type="range" min="20" max="100" step="1"><div class="hint">代理一次做对的概率；做错时委托人需自己重做</div></div>
      </div>
      <div class="result" aria-live="polite">
        <div class="lbl">放大倍数</div>
        <div class="big" id="mult">—</div>
        <div class="cmp" id="cmp"></div>
      </div>
    </div>
    <div class="stack">
      <div class="stackrow"><span>自己完成</span><div class="stackbar"><div class="seg self" style="width:100%"></div></div></div>
      <div class="stackrow"><span>交给代理后</span><div class="stackbar" id="after"><div class="seg self" id="s1"></div><div class="seg check" id="s2"></div><div class="seg redo" id="s3"></div></div></div>
      <div class="legend"><span><i style="background:var(--gray-mark)"></i>代理不适用、仍自己完成</span><span><i style="background:var(--accent)"></i>说明与核对</span><span><i style="background:var(--warm)"></i>出错后重做</span></div>
    </div>
  </div>
  <figcaption>委托人投入 ＝（1 − 适用比例）＋ 适用比例 ×［核对成本 ＋（1 − 成功率）］，放大倍数为其倒数。为便于理解，模型假设出错后委托人从头重做，实际返工可能更少，也可能因发现错误较晚而更多。三组预设中，「厂商演示」与「专家逐项核对」对应正文引用的口径；「真实部署」参照正文研究取的示意值，并非单项研究的实测；「可程序化核验」示意代码迁移一类任务：结果可由编译与测试自动核对，核对成本低、适用范围广。</figcaption>
</figure>
<style>
.calc{display:grid;grid-template-columns:1fr 200px;gap:24px;align-items:start}
.result{text-align:center;border-left:1px solid var(--line);padding-left:20px}
.result .big{font-size:56px;font-weight:700;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.result .lbl{font-size:13px;color:var(--muted)}
.result .cmp{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.6}
.stack{margin-top:8px}
.stackrow{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.stackbar{height:22px;background:var(--quote);border-radius:4px;display:flex;overflow:hidden}
.seg{height:100%;transition:width .35s ease}
.seg.self{background:var(--gray-mark)} .seg.check{background:var(--accent)} .seg.redo{background:var(--warm)}
@media (max-width:640px){.calc{grid-template-columns:1fr}.result{border-left:none;border-top:1px solid var(--line);padding:16px 0 0}}
</style>
<script>
/* ---------- 放大倍数拆解 ---------- */
(function(){
  const a=document.getElementById('a'), c=document.getElementById('c'), p=document.getElementById('p');
  const btns=[...document.querySelectorAll('.presets button')];
  function render(){
    const A=a.value/100, C=c.value/100, P=p.value/100;
    const self=1-A, check=A*C, redo=A*(1-P);
    const total=self+check+redo, m=1/total;
    document.getElementById('av').textContent=a.value+'%';
    document.getElementById('cv').textContent=c.value+'%';
    document.getElementById('pv').textContent=p.value+'%';
    document.getElementById('mult').textContent=(m>=10?m.toFixed(0):m.toFixed(2).replace(/0$/,''))+'×';
    const w=v=>Math.min(100,v*100).toFixed(1)+'%';
    document.getElementById('s1').style.width=w(self);
    document.getElementById('s2').style.width=w(check);
    document.getElementById('s3').style.width=w(redo);
    document.getElementById('after').style.width=Math.min(100,total*100)+'%';
    document.getElementById('cmp').textContent='委托人仍需付出原来的 '+Math.round(total*100)+'%';
    const key=[A,c.value,p.value].join(',');
    btns.forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.p===key)));
  }
  function set(s){const [A,C,P]=s.split(',');a.value=Math.round(A*100);c.value=C;p.value=P;render();}
  btns.forEach(b=>b.addEventListener('click',()=>set(b.dataset.p)));
  [a,c,p].forEach(el=>el.addEventListener('input',render));
  set('0.3,25,70');
})();

</script>
