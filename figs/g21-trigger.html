<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">什么时候回来问他</p><p class="figsub">十年里发生的八件事排在时间轴上。勾选写进约定的触发条件，看哪些事会让书记员停下来问他。</p></div><button class="replay" type="button" data-replay="tg21">重播</button></div>
    <div class="tg21" id="tg21" data-anim>
      <svg viewBox="0 0 660 150" role="img" aria-label="十年的事件"><g id="tg21-g"></g></svg>
      <div class="cs-sw"><label><input type="checkbox" id="tg21-q" checked> 数量触发：任一账户一年跌幅超过 15%，或偏离目标两成</label><label><input type="checkbox" id="tg21-e"> 事件触发：换工作、添丁、生病、搬家</label><label><input type="checkbox" id="tg21-t"> 时间触发：每年复核一次</label></div>
      <p class="tg21-msg" id="tg21-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：八件事为虚构的例子；“悄悄的偏离”指没有单次大跌、而是多年累积的偏离，例如他的收入悄悄下降、约定的存入比例渐渐超出能力。</figcaption>
</figure>
<style>
.tg21 svg{width:100%;height:auto;display:block}
.tg21-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.tg21 svg text{font-size:13px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('tg21'+id),X0=30,X1=630,x=t=>X0+t/10*(X1-X0);
  const E=[[1.2,'风暴，养老跌 22%','q'],[2.5,'换工作','e'],[3.6,'添丁','e'],[4.4,'悄悄的偏离','t'],[5.5,'风暴，盖房跌 8%',''],[6.8,'生病','e'],[7.7,'收入下降','t'],[9.1,'风暴，养老跌 18%','q']];
  function draw(){const on={q:$('-q').checked,e:$('-e').checked,t:$('-t').checked};let h=`<line x1="${X0}" x2="${X1}" y1="80" y2="80" stroke="var(--line)" stroke-width="3"/>`+[0,2,4,6,8,10].map(t=>`<text x="${x(t)}" y="104" text-anchor="middle" font-size="11" class="t-faint">第 ${t} 年</text>`).join('');
    if(on.t)for(let t=1;t<=10;t++)h+=`<line x1="${x(t)}" x2="${x(t)}" y1="72" y2="88" stroke="var(--blue)" stroke-width="2"/>`;
    let n=0,miss=[];E.forEach(([t,l,k],i)=>{const hit=k&&on[k];if(hit)n++;else if(k)miss.push(l);h+=`<circle cx="${x(t)}" cy="80" r="${hit?9:6}" fill="${hit?'var(--warm)':'var(--faint)'}"/><text x="${x(t)}" y="${i%2?56:40}" text-anchor="middle" font-size="11" fill="${hit?'var(--warm)':'var(--muted)'}">${l}</text>`;});
    $('-g').innerHTML=h;
    $('-msg').textContent=`有 ${n} 件事让书记员停下来问他。`+(miss.length?`没有触发的要紧事：${miss.join('、')}。`:'该问的事都触发了；那次盖房账户跌 8% 没有超过边界，书记员按规则处理，不必打扰他。');}
  ['-q','-e','-t'].forEach(k=>$(k).addEventListener('input',draw));
  $('').addEventListener('anim-in',()=>{$('-q').checked=true;$('-e').checked=false;$('-t').checked=false;draw();setTimeout(()=>{$('-e').checked=true;draw();},1600);setTimeout(()=>{$('-t').checked=true;draw();},3200);});
  draw();
})();
</script>
