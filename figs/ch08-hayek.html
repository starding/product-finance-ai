<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">锡价如何协调千万人的行动</p><p class="figsub">左侧发生的事，右侧的使用者看不到；他们只看到价格。</p></div><button class="replay" type="button" data-replay="hk">重播</button></div>
    <div class="hk" id="hk" data-anim>
      <svg viewBox="0 0 640 270" role="img" aria-label="锡矿停产经由锡价影响各地使用者">
        <g class="hk-ev"><rect x="14" y="104" width="128" height="62" rx="12"/><text x="78" y="131" text-anchor="middle" font-size="14" font-weight="700">某处锡矿停产</text><text x="78" y="151" text-anchor="middle" font-size="11">锡变得更稀缺</text></g>
        <path d="M142,135 L232,135" class="hk-arrow a1"/>
        <g class="hk-price"><circle cx="290" cy="135" r="54"/><text x="290" y="124" text-anchor="middle" font-size="12" class="t-muted">锡价</text><text x="290" y="152" text-anchor="middle" font-size="24" font-weight="700" id="hk-p">100</text></g>
        <line x1="372" y1="18" x2="372" y2="252" class="hk-wall"/>
        <text x="380" y="262" font-size="11" class="t-faint">使用者看不到原因，只看到价格</text>
        <g id="hk-users"></g>
      </svg>
    </div>
  </div>
  <figcaption>Hayek（1945）的例子。没有任何一个使用者知道锡为什么变贵，每个人只是根据价格调整自己的行为，合起来却恰好是应对锡短缺所需要的行动。</figcaption>
</figure>
<style>
.hk svg{width:100%;height:auto;display:block}
.hk-ev rect{fill:var(--warm-soft);stroke:var(--warm);stroke-width:1.5}
.hk-ev text{fill:var(--ink)}
.hk-ev{opacity:0;transition:opacity .4s}
.hk.in .hk-ev{opacity:1}
.hk-arrow{fill:none;stroke:var(--warm);stroke-width:2;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .6s .5s}
.hk.in .hk-arrow{stroke-dashoffset:0}
.hk-price circle{fill:var(--surface);stroke:var(--accent);stroke-width:2;transition:fill .4s}
.hk.in .hk-price circle{fill:var(--accent-soft);transition-delay:1.1s}
#hk-p{fill:var(--accent)}
.hk-wall{stroke:var(--faint);stroke-dasharray:4 4}
.hk-u rect{fill:var(--quote);stroke:var(--line);transition:fill .4s,stroke .4s}
.hk-u text{fill:var(--ink)}
.hk-u .act{fill:var(--accent);opacity:0;transition:opacity .4s}
.hk-ln{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3;opacity:0;transition:opacity .4s}
.hk.in .hk-u rect{fill:var(--accent-soft);stroke:var(--accent);transition-delay:var(--d)}
.hk.in .hk-u .act,.hk.in .hk-ln{opacity:1;transition-delay:var(--d)}
</style>
<script>
(function(){
  const U=[['罐头厂','改用更薄的镀层'],['电子厂','减少焊料用量'],['玩具厂','改用其他金属'],['回收商','加紧回收旧锡'],['另一处矿山','扩大开采']];
  let s='';
  U.forEach(([n,a],i)=>{const y=22+i*46, d=(1.6+i*0.25)+'s';
    s+=`<line class="hk-ln" style="--d:${d}" x1="344" y1="135" x2="396" y2="${y+18}"/>`;
    s+=`<g class="hk-u" style="--d:${d}"><rect x="396" y="${y}" width="232" height="36" rx="8"/><text x="408" y="${y+23}" font-size="13" font-weight="700">${n}</text><text class="act" x="616" y="${y+23}" text-anchor="end" font-size="12">${a}</text></g>`;});
  document.getElementById('hk-users').innerHTML=s;
  const p=document.getElementById('hk-p');
  document.getElementById('hk').addEventListener('anim-in',()=>{p.textContent='100';let v=100;setTimeout(function up(){v+=3;p.textContent=v;if(v<130)setTimeout(up,40);},1100);});
})();
</script>
