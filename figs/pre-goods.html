<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">质量在什么时候才能被判断</p><p class="figsub">三类商品的区别，在于购买者何时能判断质量。</p></div><button class="replay" type="button" data-replay="goods-grid">重播</button></div>
    <div class="goods" id="goods-grid" data-anim>
      <div class="g-head"></div><div class="g-head">购买之前</div><div class="g-head">使用之后</div><div class="g-head">多年以后</div>
      <div class="g-sweep" aria-hidden="true"></div>

      <div class="g-name"><b>搜寻品</b><span>电脑、衣服</span></div>
      <div class="g-cell" style="--d:.5s"><i class="lamp on"></i><span>看得到，比得了</span></div>
      <div class="g-cell"></div><div class="g-cell"></div>

      <div class="g-name"><b>经验品</b><span>餐厅、理发</span></div>
      <div class="g-cell"><i class="lamp off"></i></div>
      <div class="g-cell" style="--d:1.4s"><i class="lamp on"></i><span>用过才知道</span></div>
      <div class="g-cell"></div>

      <div class="g-name"><b>信任品</b><span>汽车维修、医疗诊断</span></div>
      <div class="g-cell"><i class="lamp off"></i></div>
      <div class="g-cell"><i class="lamp off"></i></div>
      <div class="g-cell" style="--d:2.3s"><i class="lamp dim">?</i><span>用过也难判断</span></div>

      <div class="g-name fin"><b>金融产品</b><span>存款、债券、基金</span></div>
      <div class="g-cell"><i class="lamp off"></i></div>
      <div class="g-cell"><i class="lamp off"></i></div>
      <div class="g-cell" style="--d:3s"><i class="lamp split"><em></em></i><span>结果迟到，且混杂运气</span></div>
    </div>
  </div>
  <figcaption>搜寻品与经验品的划分见 Nelson（1970），信任品见 Darby 与 Karni（1973）。信任品的质量即使在使用之后也难以判断；金融产品的结果往往多年后才出现，而且同时取决于产品本身与运气，两者难以分开。</figcaption>
</figure>
<style>
.goods{position:relative;display:grid;grid-template-columns:150px repeat(3,1fr);row-gap:0;font-size:13px}
.g-head{font-size:12px;color:var(--faint);text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.g-name{padding:14px 0;border-bottom:1px solid var(--line);line-height:1.4}
.g-name b{display:block;font-size:15px}
.g-name span{font-size:12px;color:var(--faint)}
.g-name.fin b{color:var(--warm)}
.g-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-bottom:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px;line-height:1.4}
.g-cell span{opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s;transition-delay:var(--d,0s)}
.lamp{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-style:normal;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--faint);transition:background .4s,border-color .4s,box-shadow .4s;transition-delay:var(--d,0s)}
.lamp.off{border-style:dashed}
.goods.in .lamp.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 6px var(--accent-soft)}
.goods.in .lamp.dim{background:var(--quote);border-color:var(--faint);color:var(--muted)}
.lamp.split{position:relative;overflow:hidden}
.lamp.split em{position:absolute;inset:0;background:linear-gradient(90deg,var(--warm) 50%,var(--gray-mark) 50%);opacity:0;transition:opacity .5s;transition-delay:var(--d,0s);animation:none}
.goods.in .lamp.split{border-color:var(--warm)}
.goods.in .lamp.split em{opacity:1;animation:jitter 1.6s ease-in-out 3.4s infinite}
@keyframes jitter{0%,100%{background:linear-gradient(90deg,var(--warm) 50%,var(--gray-mark) 50%)}33%{background:linear-gradient(90deg,var(--warm) 25%,var(--gray-mark) 25%)}66%{background:linear-gradient(90deg,var(--warm) 72%,var(--gray-mark) 72%)}}
.goods.in .g-cell span{opacity:1;transform:none}
.g-sweep{position:absolute;top:28px;bottom:0;left:150px;width:2px;background:var(--accent);opacity:0;pointer-events:none}
.goods.in .g-sweep{animation:sweep 3.2s ease-in-out forwards}
@keyframes sweep{0%{opacity:.6;left:150px}90%{opacity:.6;left:calc(100% - 2px)}100%{opacity:0;left:calc(100% - 2px)}}
@media (max-width:640px){.goods{grid-template-columns:96px repeat(3,1fr)}.g-name b{font-size:14px}@keyframes sweep{0%{opacity:.6;left:96px}90%{opacity:.6;left:calc(100% - 2px)}100%{opacity:0}}}
</style>
