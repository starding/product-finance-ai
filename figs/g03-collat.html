<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">抵押：更安全，也挡住了一些人</p><p class="figsub">每户借 4 份、春天要还 4.4 份。拖动出借人要求抵押物至少值本息的几成，看谁能借到、违约时出借人损失多少。</p></div><button class="replay" type="button" data-replay="cl">重播</button></div>
    <div class="cl" id="cl" data-anim>
      <div class="cl-hh" id="cl-hh"></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>能借到</span><span><i style="background:var(--quote);border:1px solid var(--line)"></i>抵押物不够，借不到</span></div>
      <div class="sl"><label for="cl-r">要求抵押物至少值本息的 <b id="cl-rv"></b></label><input id="cl-r" type="range" min="0" max="150" step="10" value="100"></div>
      <div class="cl-out"><div><span>能借到的户数</span><b id="cl-n"></b></div><div><span>借到的人中，不还反而划算的户数</span><b id="cl-d"></b></div></div>
      <p class="cl-msg" id="cl-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：20 户人家拥有的可抵押物价值从 0 到 9 份不等，每格中的数字为该户可抵押物的价值。抵押物价值低于要还的本息时，不还反而划算。</figcaption>
</figure>
<style>
.cl-hh{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cl-hh i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11.5px;height:34px;border-radius:7px;transition:background .3s,color .3s}
.cl-out{display:flex;gap:24px;flex-wrap:wrap;margin-top:10px}
.cl-out div{display:flex;flex-direction:column} .cl-out span{font-size:12px;color:var(--faint)} .cl-out b{font-size:20px;font-variant-numeric:tabular-nums}
.cl-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),W=[0,0,0,0.5,1,1,1.5,2,2.5,3,3,3.5,4,4.5,5,5.5,6,7,8,9],due=4.4;
  $('cl-hh').innerHTML=W.map(w=>`<i>${w}</i>`).join('');const cs=[...$('cl-hh').children];
  function draw(){const q=+$('cl-r').value/100,need=due*q;let n=0,bad=0;
    W.forEach((w,i)=>{const ok=w>=need-1e-9;if(ok){n++;if(w<due)bad++;}cs[i].style.background=ok?'var(--accent)':'var(--quote)';cs[i].style.color=ok?'#fff':'var(--faint)';});
    $('cl-rv').textContent=Math.round(q*10)+' 成';$('cl-n').textContent=n+' 户';$('cl-d').textContent=bad+' 户';
    $('cl-msg').textContent=q===0?'不要求抵押，人人都借得到，但抵押物不足本息的人不还反而划算，承诺并不可信。':q<1?`要求抵押物值本息的 ${Math.round(q*10)} 成：${n} 户能借，其中 ${bad} 户抵押物不足本息，仍有不还的动机。`:`要求抵押物不低于本息：借到的人都没有不还的动机，承诺可信；但 ${20-n} 户因为抵押物不够而借不到。`;}
  $('cl-r').addEventListener('input',draw);
  $('cl').addEventListener('anim-in',()=>{let v=0;$('cl-r').value=0;draw();const id=setInterval(()=>{v+=10;$('cl-r').value=v;draw();if(v>=100)clearInterval(id);},260);});
  draw();
})();
</script>
