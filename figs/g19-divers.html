<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">分散去得掉的，与去不掉的</p><p class="figsub">每艘船的船股一年波动 35%，其中与全村船队一起起落的部分对应 16% 的波动。拖动持有的船数，看组合的波动降到哪里。</p></div><button class="replay" type="button" data-replay="dv19">重播</button></div>
    <div class="dv19" id="dv19" data-anim>
      <svg viewBox="0 0 660 210" role="img" aria-label="持有船数与组合波动"><g id="dv19-g"></g></svg>
      <div class="sl"><label for="dv19-n">持有的船数 <b id="dv19-nv"></b></label><input id="dv19-n" type="range" min="1" max="100" step="1" value="1"></div>
      <p class="dv19-msg" id="dv19-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：等权持有 n 艘船，组合波动 ＝ √（16%² ＋（35%² － 16%²）÷ n）。虚线为分散不掉的系统风险。斯塔特曼（1987）用实际股票数据得出类似的形状。</figcaption>
</figure>
<style>
.dv19 svg{width:100%;height:auto;display:block}
.dv19-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.dv19 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('dv19'+id),S=.35,M=.16,X0=50,X1=628,YT=12,YB=178,L=Math.log10(100),x=n=>X0+Math.log10(n)/L*(X1-X0),y=v=>YB-v/.4*(YB-YT),sd=n=>Math.sqrt(M*M+(S*S-M*M)/n);
  function draw(){const n=+$('-n').value;$('-nv').textContent=n+' 艘';
    let h=[0,.1,.2,.3,.4].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+[1,10,100].map(v=>`<text x="${x(v)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${v} 艘</text>`).join('');
    let d='';for(let k=1;k<=100;k++)d+=(k>1?'L':'M')+x(k).toFixed(1)+','+y(sd(k)).toFixed(1);
    h+=`<line x1="${X0}" x2="${X1}" y1="${y(M)}" y2="${y(M)}" stroke="var(--warm)" stroke-dasharray="5 4"/><text x="${X1}" y="${y(M)-6}" text-anchor="end" font-size="11" fill="var(--warm)">系统风险 16%，分散不掉</text><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.6"/><circle cx="${x(n)}" cy="${y(sd(n))}" r="7" fill="var(--accent)"/>`;
    $('-g').innerHTML=h;
    $('-msg').textContent=n===1?'只持有一艘船，承担 35% 的波动，其中一大半是这艘船自己的运气。':`持有 ${n} 艘船，组合波动降到 ${(sd(n)*100).toFixed(1)}%。书记员能让一户人家几乎免费地持有全部的船，可波动最低也只能降到 16%：全村一起遇到的风暴，分散不掉。`;}
  $('-n').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{let v=1;$('-n').value=1;draw();const id=setInterval(()=>{v=Math.min(100,Math.round(v*1.25+1));$('-n').value=v;draw();if(v>=100)clearInterval(id);},180);});
  draw();
})();
</script>
