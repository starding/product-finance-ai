<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">技能的好处归谁</p><p class="figsub">一位经理管的钱越多，越难找到同样好的机会，超额收益随规模下降。拖动他的本事大小，看资金会涌入到多大规模为止，以及委托人与经理各得到什么。</p></div><button class="replay" type="button" data-replay="bg">重播</button></div>
    <div class="bg" id="bg" data-anim>
      <svg viewBox="0 0 640 210" role="img" aria-label="规模与扣除费用后的超额收益"><g id="bg-ax"></g><path id="bg-c" class="bg-c"/><circle id="bg-p" r="6" fill="var(--ink)"/></svg>
      <div class="sl"><label for="bg-a">经理的本事（第一份钱能多赚） <b id="bg-av"></b></label><input id="bg-a" type="range" min="1" max="6" step="0.5" value="4"></div>
      <div class="bg-out"><div><span>资金涌入到的规模</span><b id="bg-q"></b></div><div><span>委托人扣除费用后的超额收益</span><b id="bg-i"></b></div><div><span>经理每年收到的费用</span><b id="bg-f"></b></div></div>
      <p class="bg-msg" id="bg-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：规模为 q 时扣除 1% 费用后的超额收益 ＝ 本事 − 0.03 × q − 1%；资金一直流入，直到委托人扣除费用后的超额收益降为零（伯克与格林，2004 的简化）。规模以 100 份为单位。</figcaption>
</figure>
<style>
.bg svg{width:100%;height:auto;display:block}
.bg-c{fill:none;stroke:var(--accent);stroke-width:2.5}
.bg-out{display:flex;gap:24px;flex-wrap:wrap;margin-top:8px}
.bg-out div{display:flex;flex-direction:column} .bg-out span{font-size:12px;color:var(--faint)} .bg-out b{font-size:20px;font-variant-numeric:tabular-nums}
.bg-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.bg svg text{font-size:16px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById(id),X0=46,X1=630,YT=12,YB=178,x=q=>X0+q/200*(X1-X0),y=v=>YB-(v+1)/6*(YB-YT);
  $('bg-ax').innerHTML=[-1,0,1,2,3,4,5].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="${v===0?'s-faint':'s-line'}"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v>0?'+':''}${v}%</text>`).join('')+[0,50,100,150,200].map(q=>`<text x="${x(q)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${q}</text>`).join('')+`<text x="${X1}" y="${YB-6}" text-anchor="end" font-size="11" class="t-muted">他管的钱（百份）</text>`;
  function draw(){const a=+$('bg-a').value,net=q=>a-.03*q-1,q=Math.max(0,(a-1)/.03);
    $('bg-c').setAttribute('d',`M${x(0)},${y(net(0))}L${x(200)},${y(net(200))}`);$('bg-p').setAttribute('cx',x(Math.min(q,200)));$('bg-p').setAttribute('cy',y(0));
    $('bg-av').textContent=a+'%';$('bg-q').textContent=Math.round(q)+' 百份';$('bg-i').textContent='0%';$('bg-f').textContent=Math.round(q*100*.01)+' 份';
    $('bg-msg').textContent=`本事为 ${a}% 的经理，资金会涌入到约 ${Math.round(q)} 百份为止，此时委托人扣除费用后的超额收益正好为零，经理每年收到约 ${Math.round(q)} 份费用。本事越大，规模越大、经理收入越高，委托人得到的仍只是平均水平：技能的好处归了经理。`;}
  $('bg-a').addEventListener('input',draw);
  $('bg').addEventListener('anim-in',()=>{let v=1;$('bg-a').value=1;draw();const id=setInterval(()=>{v+=.5;$('bg-a').value=v;draw();if(v>=6)clearInterval(id);},350);});
  draw();
})();
</script>
