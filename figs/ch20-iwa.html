  const jit=i=>(((i*2654435761)>>>0)%1000/1000-.5)*12;
  const $=id=>document.getElementById(id);
  $('iw-lg').innerHTML=Object.values(MEN).map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')+'<span><i style="background:transparent;border:1.5px solid var(--ink);border-radius:50%"></i>与金融相关</span>';
  const xm=lx(XM),ym=ly(.5);
  $('iw-bg').innerHTML=`<rect x="${X0}" y="${Y0}" width="${X1-X0}" height="${Y1-Y0}" fill="var(--quote)"/>`+
    `<rect x="${xm}" y="${Y0}" width="${X1-xm}" height="${ym-Y0}" fill="var(--accent-soft)"/><rect x="${xm}" y="${ym}" width="${X1-xm}" height="${Y1-ym}" fill="var(--warm-soft)"/>`+
    `<line x1="${xm}" x2="${xm}" y1="${Y0}" y2="${Y1}" class="s-faint"/><line x1="${X0}" x2="${X1}" y1="${ym}" y2="${ym}" class="s-faint"/>`+
    [.01,.1,1].map(v=>`<text x="${lx(v)}" y="${Y1+16}" text-anchor="middle" font-size="11" class="t-faint">${v}%</text>`).join('')+
    [0,.25,.5,.75].map(v=>`<text x="${X0-6}" y="${ly(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v*100}%</text>`).join('')+
    `<text x="${(X0+X1)/2}" y="${Y1+34}" text-anchor="middle" font-size="12" class="t-muted">占全部工作时间的比重（对数刻度）→</text>`+
    `<text x="14" y="${(Y0+Y1)/2}" text-anchor="middle" font-size="12" class="t-muted" transform="rotate(-90 14 ${(Y0+Y1)/2})">代理可承担的比例 →</text>`;
  const Q=[['tr','值得做，也有条件做',xm+8,Y0+18,'start'],['br','值得做，但条件不足',xm+8,Y1-10,'start'],['tl','有条件，但单项规模小',X0+8,Y0+18,'start'],['bl','规模小，条件也不足',X0+8,Y1-10,'start']];
  const order=D.map((d,i)=>i).sort((a,b)=>D[a][8]-D[b][8]);
  $('iw-p').innerHTML=order.map(i=>{const d=D[i];return `<circle class="iw-pt" data-i="${i}" cx="${lx(d[2]).toFixed(1)}" cy="${(ly(d[t])+jit(i)).toFixed(1)}" r="${d[8]?5:3.4}" fill="${MEN[d[1]][1]}" fill-opacity="${d[8]?.95:.6}" stroke="${d[8]?'var(--ink)':'none'}" stroke-width="1.4"><title>${d[0]}</title></circle>`;}).join('');
  const pts=[...document.querySelectorAll('.iw-pt')];
  const names={3:'Chat',4:'Agent',5:'具身 Agent'};
  function quads(){const s={tr:[0,0],br:[0,0],tl:[0,0],bl:[0,0]};D.forEach(d=>{const k=(d[t]>=.5?'t':'b')+(d[2]>=XM?'r':'l');s[k][0]++;s[k][1]+=d[2];});return s;}
  function draw(){pts.forEach(p=>{const i=+p.dataset.i;p.setAttribute('cy',(ly(D[i][t])+jit(i)).toFixed(1));});
    const s=quads();$('iw-lab').innerHTML=Q.map(([k,n,x,y,a])=>`<text x="${x}" y="${y}" text-anchor="${a}" class="iw-q t-ink">${n}<tspan class="t-muted" font-weight="400"> ${s[k][0]} 项 · ${Math.round(s[k][1])}%</tspan></text>`).join('');
    if(sel<0){$('iw-msg').textContent=`${names[t]} 条件下：值得做、也有条件做的活动约占工作时间的 ${Math.round(s.tr[1])}%；值得做但条件不足的约占 ${Math.round(s.br[1])}%。`;} else show(sel);}
  function show(i){sel=i;pts.forEach(p=>p.classList.toggle('sel',+p.dataset.i===i));const d=D[i];
    $('iw-msg').textContent=`${d[0]}（${MEN[d[1]][0]}，${d[9]}）：约占全部工作时间的 ${d[2]>=.01?d[2].toFixed(2):d[2].toFixed(3)}%；代理可承担的比例 Chat ${Math.round(d[3]*100)}% · Agent ${Math.round(d[4]*100)}% · 具身 Agent ${Math.round(d[5]*100)}%。`;}
  pts.forEach(p=>p.addEventListener('click',()=>show(+p.dataset.i)));
  document.querySelectorAll('[data-iwt]').forEach(b=>b.addEventListener('click',()=>{t=+b.dataset.iwt;document.querySelectorAll('[data-iwt]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
  $('iw').addEventListener('anim-in',()=>{sel=-1;pts.forEach(p=>p.classList.remove('sel'));[3,4,5,4].forEach((k,j)=>setTimeout(()=>{t=k;document.querySelectorAll('[data-iwt]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.iwt===k)));draw();},200+j*2200));});
  draw();
})();
</script>
