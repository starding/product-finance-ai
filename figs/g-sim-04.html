<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">文明模拟器 · 第 4 章：两代人与货币</p><p class="figsub">我 20 岁时开始耕种，第二个人比我小二十岁。借贷只能在活着的人之间进行；打开货币，看最年轻的一代能否不靠具体的借款人养老。</p></div><button class="replay" type="button" data-replay="cs4">重播</button></div>
    <div class="cs-rules"><span class="on">储蓄</span><span class="on">留种</span><span class="on">借贷</span><span class="on">承诺</span><span class="on">货币</span><span class="lock">保险 · 第 5 章</span></div>
    <div class="cs4" id="cs4" data-anim>
      <svg viewBox="0 0 660 240" role="img" aria-label="三个人一生每月吃到的粮食"><g id="cs4-ax"></g><g id="cs4-l"></g></svg>
      <div class="legend" id="cs4-lg"></div>
      <div class="cs4-ctl">
        <div class="sl"><label for="cs4-d">每月损耗 <b id="cs4-dv"></b></label><input id="cs4-d" type="range" min="0" max="2" step="0.1" value="1"></div>
        <div class="sl"><label for="cs4-r">借贷年利率 <b id="cs4-rv"></b></label><input id="cs4-r" type="range" min="-3" max="3" step="0.5" value="0"></div>
      </div>
      <div class="cs-sw"><label><input type="checkbox" id="cs4-lend" checked> 规则：借贷</label><label><input type="checkbox" id="cs4-c"> 加入第三个人（比第二个人小二十岁）</label><label><input type="checkbox" id="cs4-m"> 规则：货币</label><label><input type="checkbox" id="cs4-b" checked> 人们相信下一代会接受货币</label></div>
      <div class="cs4-out" id="cs4-out"></div>
      <p class="cs4-msg" id="cs4-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意模型：按年计算，每人 20～59 岁每年收获并扣除种子后余 15 份，60 岁后无收成，活到 80 岁；每人“为一生打算”，满足感按对数计算。只有当一个更年轻的人在还款时仍在耕种，存粮才能借出，按约定利率收回；否则只能储藏、按损耗缩水。打开货币且人们相信下一代会接受时，存下的可以换成货币，价值不损耗（假设物价稳定）。假设借款人用借来的粮食或种子生产，足以按约定还本付息。</figcaption>
</figure>
<style>
.cs4 svg{width:100%;height:auto;display:block}
.cs4-ctl{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.cs4-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cs4-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.cs4-out span{display:block;font-size:11.5px;color:var(--faint)} .cs4-out b{font-size:16px;font-variant-numeric:tabular-nums}
.cs4-out div.off{opacity:.35}
.cs4-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.cs4-ctl{grid-template-columns:1fr;gap:4px}.cs4-out{grid-template-columns:1fr}.cs4 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('cs4'+id),P=[['我',0,'var(--accent)'],['第二个人',20,'var(--warm)'],['第三个人',40,'var(--blue)']];
  const X0=40,X1=640,YT=12,YB=206,T=100,x=t=>X0+t/T*(X1-X0),yc=v=>YB-Math.min(v,2)/2*(YB-YT);
  $('-lg').innerHTML=P.map(p=>`<span><i style="background:${p[2]}"></i>${p[0]}</span>`).join('')+'<span><i style="background:var(--warm-soft)"></i>每月低于 0.6 份即挨饿</span>';
  // 某人在第 t 年（日历年）存下的粮食，下一年的回报
  function ret(o,i,t){const kids=P.slice(i+1,o.n);const ok=o.lend&&kids.some(q=>{const age=t+1-q[1]+20;return age>=20&&age<60;});let R=ok?o.r:-o.D;if(o.money&&o.belief)R=Math.max(R,0);return R;}
  function plan(o,i){const b=P[i][1],c=[];let W=0;
    for(let k=0;k<60;k++){const t=b+k;
      // 每年重新求：此后按欧拉路径 c_{s+1}=c_s·(1+R_s)，财富不为负的最大起点
      let lo=0,hi=60;for(let it=0;it<40;it++){const m=(lo+hi)/2;let w=W,cc=m,ok=true;
        for(let s=k;s<60;s++){const y=s<40?15:0;if(w+y<cc-1e-9){ok=false;break;}const R=ret(o,i,b+s);w=(w+y-cc)*(1+R);cc=cc*(1+R);}
        if(ok)lo=m;else hi=m;}
      const y=k<40?15:0,ck=lo;c.push(ck);W=(W+y-ck)*(1+ret(o,i,t));}
    return c;}
  function draw(){const d=+$('-d').value/100,o={D:1-Math.pow(1-d,12),r:+$('-r').value/100,lend:$('-lend').checked,n:$('-c').checked?3:2,money:$('-m').checked,belief:$('-b').checked};
    $('-dv').textContent=(d*100).toFixed(1)+'%';$('-rv').textContent=(o.r<0?'−':'')+Math.abs(o.r*100).toFixed(1)+'%';
    let ax=`<rect x="${X0}" y="${yc(.6)}" width="${X1-X0}" height="${YB-yc(.6)}" fill="var(--warm-soft)"/>`+[0,.5,1,1.5,2].map(v=>`<line x1="${X0}" x2="${X1}" y1="${yc(v)}" y2="${yc(v)}" class="s-line"/><text x="${X0-6}" y="${yc(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')+
      [0,20,40,60,80,100].map(t=>`<text x="${x(t)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">第 ${t} 年</text>`).join('');
    $('-ax').innerHTML=ax;
    const res=P.map((p,i)=>i<o.n?plan(o,i):null);let L='';
    res.forEach((c,i)=>{if(!c)return;const b=P[i][1];L+=`<path d="${c.map((v,k)=>(k?'L':'M')+x(b+k+.5).toFixed(1)+','+yc(v/12).toFixed(1)).join('')}" fill="none" stroke="${P[i][2]}" stroke-width="2.2"/>`+
      `<line x1="${x(b+40)}" x2="${x(b+40)}" y1="${YB-6}" y2="${YB}" stroke="${P[i][2]}" stroke-width="2"/>`;});
    $('-l').innerHTML=L;
    const st=res.map(c=>c?[c.slice(40).reduce((a,v)=>a+v,0)/20/12,c.filter(v=>v/12<.6).length*12]:null);
    $('-out').innerHTML=P.map((p,i)=>`<div class="${st[i]?'':'off'}"><span>${p[0]}：60 岁后每月吃 / 挨饿月数</span><b>${st[i]?st[i][0].toFixed(2)+' 份 / '+st[i][1]:'—'}</b></div>`).join('');
    const [a,b,c3]=st;
    const last=st[o.n-1];
    $('-msg').textContent=o.money&&o.belief?`有了货币，年轻人把余粮卖给老年人换成货币，年老时再用货币向下一代买粮：最年轻的一代 60 岁后每月也能吃 ${last[0].toFixed(2)} 份，不再需要找到一个具体的借款人。前提是人们相信下一代会接受货币。`:
      o.money?`人们不再相信下一代会接受货币，货币今天就一文不值：一切退回到只靠借贷与储藏的样子，最年轻的一代 60 岁后每月只能吃 ${last[0].toFixed(2)} 份。`:
      !o.lend?`没有借贷，每个人都只能靠会损耗的储藏养老：60 岁后每月只能吃 ${a[0].toFixed(2)} 份，与独自生活时一样。`:
      o.n===2?`有了借贷，我 40 岁以后的存粮借给正在耕种的第二个人，不再损耗：60 岁后每月吃 ${a[0].toFixed(2)} 份。可是轮到第二个人年老时，我已经不在，岛上没有更年轻的人，他 60 岁后每月只能吃 ${b[0].toFixed(2)} 份。`:
      `加入第三个人，第二个人的晚年也有了着落（每月 ${b[0].toFixed(2)} 份）；但第三个人又成了最后一代，60 岁后每月只能吃 ${c3[0].toFixed(2)} 份。只要人的寿命有限，总有一代人无人可借。`;}
  ['-d','-r','-lend','-c','-m','-b'].forEach(k=>$(k).addEventListener('input',draw));
  $('').addEventListener('anim-in',()=>{const s=[[true,false,false],[true,true,false],[true,true,true]];s.forEach(([l,c,m],i)=>setTimeout(()=>{$('-lend').checked=l;$('-c').checked=c;$('-m').checked=m;$('-b').checked=true;draw();},300+i*2800));});
  draw();
})();
</script>
