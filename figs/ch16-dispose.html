<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">处置效应：卖出赚钱的，留下亏钱的</p><p class="figsub">一个持有十只股票的账户需要卖出三只来取现。以买入价为参照点的卖法与不看参照点的卖法，留下的是不同的组合。下方是奥迪恩（1998）的实证结果。</p></div><button class="replay" type="button" data-replay="ds">重播</button></div>
    <div class="seg-btns" role="group" aria-label="卖法">
      <button type="button" data-ds="ref" aria-pressed="true">以买入价为参照点</button>
      <button type="button" data-ds="loss" aria-pressed="false">优先卖出亏损的</button>
    </div>
    <div class="ds" id="ds" data-anim>
      <div class="ds-pf" id="ds-pf"></div>
      <p class="ds-msg" id="ds-msg" aria-live="polite"></p>
      <div class="ds-ev">
        <div><span>盈利持仓被卖出的比例</span><div class="ds-t"><i data-w="14.8" style="background:var(--accent)"></i></div><b>14.8%</b></div>
        <div><span>亏损持仓被卖出的比例</span><div class="ds-t"><i data-w="9.8" style="background:var(--warm)"></i></div><b>9.8%</b></div>
        <div><span>随后一年：卖出的盈利股比留下的亏损股多涨</span><div class="ds-t"><i data-w="3.4" style="background:var(--ink)"></i></div><b>3.4 个百分点</b></div>
      </div>
    </div>
  </div>
  <figcaption>上方为示意账户。下方数字来自 Odean（1998）对一家美国券商约一万个账户 1987—1993 年交易记录的分析；条形长度按 0～20% 绘制。在对资本利得征税的地区，优先卖出亏损的股票还可以抵减税款。</figcaption>
</figure>
<style>
.ds-pf{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.ds-pf div{border-radius:7px;padding:8px 2px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;border:1.5px solid transparent;transition:all .4s}
.ds-pf .g{background:var(--accent-soft);color:var(--accent)} .ds-pf .l{background:var(--warm-soft);color:var(--warm)}
.ds-pf .sold{opacity:.3;border-style:dashed;border-color:var(--faint);transform:translateY(6px)}
.ds-msg{font-size:14px;margin:10px 0;min-height:3.4em}
.ds-ev{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.ds-ev>div{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 90px;gap:10px;align-items:center;font-size:12.5px}
.ds-t{height:14px;background:var(--quote);border-radius:4px;overflow:hidden}
.ds-t i{display:block;height:100%;width:0;transition:width .7s ease}
.ds-ev b{text-align:right;font-size:13px}
@media (max-width:640px){.ds-pf{grid-template-columns:repeat(5,1fr)}.ds-ev>div{grid-template-columns:1fr 70px}.ds-ev .ds-t{grid-column:1/3;grid-row:2}}
</style>
<script>
(function(){
  const P=[32,-18,15,-25,8,-6,41,-12,22,-31];
  const box=document.getElementById('ds-pf');box.innerHTML=P.map(v=>`<div class="${v>0?'g':'l'}">${v>0?'＋':'－'}${Math.abs(v)}%</div>`).join('');
  const cs=[...box.children];
  function set(k){document.querySelectorAll('[data-ds]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ds===k)));
    const ix=P.map((v,i)=>i).sort((a,b)=>k==='ref'?P[b]-P[a]:P[a]-P[b]).slice(0,3);
    cs.forEach((c,i)=>c.classList.toggle('sold',ix.includes(i)));
    const left=P.filter((v,i)=>!ix.includes(i)),lo=left.filter(v=>v<0).length;
    document.getElementById('ds-msg').textContent=k==='ref'?`卖出了涨得最多的三只，“锁定了收益”；留下的七只里有 ${lo} 只是亏损的。卖出亏损的股票意味着承认损失，于是它们被留了下来。`:`卖出亏损最多的三只，留下的七只里只有 ${lo} 只亏损。两种卖法取得的现金相近，区别只在是否愿意确认损失。`;}
  document.querySelectorAll('[data-ds]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.ds)));
  const bars=[...document.querySelectorAll('.ds-t i')];
  document.getElementById('ds').addEventListener('anim-in',()=>{set('ref');bars.forEach(b=>b.style.width='0');setTimeout(()=>bars.forEach((b,i)=>setTimeout(()=>b.style.width=(+b.dataset.w/20*100)+'%',i*300)),600);});
  set('ref');bars.forEach(b=>b.style.width=(+b.dataset.w/20*100)+'%');
})();
</script>
