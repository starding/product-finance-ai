<figure>
  <div class="card">
    <p class="figtitle">三种市场结构：流动性由谁提供</p>
    <p class="figsub">切换结构，看订单如何流动、谁站在对手方。</p>
    <div class="seg-btns" role="group" aria-label="市场结构">
      <button type="button" data-st="quote" aria-pressed="true">报价驱动</button>
      <button type="button" data-st="order" aria-pressed="false">指令驱动</button>
      <button type="button" data-st="broker" aria-pressed="false">经纪市场</button>
    </div>
    <div class="st" id="st" data-anim>
      <svg viewBox="0 0 640 220" role="img" aria-label="市场结构示意">
        <g id="st-g"></g>
      </svg>
      <div class="st-d" id="st-d" aria-live="polite"></div>
    </div>
  </div>
  <figcaption>分类依据 Harris（2003）与 Madhavan（2000）。现实中的市场多为混合结构。</figcaption>
</figure>
<style>
.st svg{width:100%;height:auto;display:block}
.st-n rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.st-n.c rect{fill:var(--accent-soft);stroke:var(--accent)}
.st-n text{fill:var(--ink)}
.st-f{fill:none;stroke:var(--faint);stroke-width:1.6;stroke-dasharray:5 5;animation:stflow 1.2s linear infinite}
.st-f.b{stroke:var(--accent)} .st-f.s{stroke:var(--warm)}
@keyframes stflow{to{stroke-dashoffset:-20}}
.st-d{font-size:14px;line-height:1.7;background:var(--quote);border-radius:10px;padding:10px 14px;margin-top:8px}
.st-d dl{display:grid;grid-template-columns:88px 1fr;gap:2px 10px;margin:0}
.st-d dt{font-size:12px;color:var(--faint);padding-top:3px}
.st-d dd{margin:0}
</style>
<script>
(function(){
  const node=(x,y,w,t,c)=>`<g class="st-n ${c||''}"><rect x="${x-w/2}" y="${y-18}" width="${w}" height="36" rx="10"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="700">${t}</text></g>`;
  const L=(x1,y1,x2,y2,c)=>`<path class="st-f ${c}" d="M${x1},${y1} L${x2},${y2}"/>`;
  const D={
    quote:{g:node(320,110,120,'做市商','c')+node(90,50,110,'买方')+node(90,170,110,'卖方')+node(550,50,110,'买方')+node(550,170,110,'卖方')+L(145,55,260,100,'b')+L(145,165,260,120,'s')+L(495,55,380,100,'b')+L(495,165,380,120,'s'),
      d:[['对手方','做市商：每个交易者都与做市商成交'],['流动性来源','做市商持续报出买卖价，承担存货与逆向选择风险'],['常见于','债券、外汇、部分场外市场']]},
    order:{g:node(320,110,150,'订单簿（交易所撮合）','c')+node(90,50,110,'挂限价买单')+node(90,170,110,'挂限价卖单')+node(550,50,110,'市价买单')+node(550,170,110,'市价卖单')+L(145,55,245,100,'b')+L(145,165,245,120,'s')+L(495,55,395,100,'b')+L(495,165,395,120,'s'),
      d:[['对手方','其他交易者：交易所只负责按规则撮合'],['流动性来源','挂限价单的交易者；急于成交者用市价单与之成交'],['常见于','今天的大多数股票与期货交易所']]},
    broker:{g:node(320,110,120,'经纪人','c')+node(90,110,120,'卖方（大宗）')+node(550,110,120,'潜在买方')+L(150,110,260,110,'s')+L(380,110,490,110,'b')+`<text x="320" y="170" text-anchor="middle" font-size="12" class="t-muted">经纪人逐一寻找并撮合对手方，不必公开报价</text>`,
      d:[['对手方','经纪人找到的另一位交易者'],['流动性来源','经纪人的客户网络与搜寻'],['常见于','大宗交易、流动性很差的资产']]}
  };
  function set(k){document.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.st===k)));
    document.getElementById('st-g').innerHTML=D[k].g;
    document.getElementById('st-d').innerHTML='<dl>'+D[k].d.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')+'</dl>';}
  document.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.st)));
  set('quote');
})();
</script>
