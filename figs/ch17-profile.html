<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">同一类画像，内部差异很大</p><p class="figsub">100 位问卷答案相近、被归为同一风险等级的投资者，在一次 30% 的下跌中各自承受到了多大的跌幅才卖出。切换两种表述方式。</p></div><button class="replay" type="button" data-replay="pf">重播</button></div>
    <div class="seg-btns" role="group" aria-label="表述方式">
      <button type="button" data-pf="ind" aria-pressed="true">对个人下结论</button>
      <button type="button" data-pf="stat" aria-pressed="false">按统计群体描述</button>
    </div>
    <div class="pf" id="pf" data-anim>
      <svg viewBox="0 0 640 170" role="img" aria-label="同一等级投资者的实际承受跌幅分布"><g id="pf-g"></g></svg>
      <div class="pf-say" id="pf-say"></div>
    </div>
  </div>
  <figcaption>示意分布。圆点为每位投资者卖出时的跌幅，30% 处仍持有的记在右端。常见风险问卷对实际风险资产配置的解释力有限，见 Klement（2015）。</figcaption>
</figure>
<style>
.pf svg{width:100%;height:auto;display:block}
.pf-d{opacity:0;transition:opacity .3s}
.pf.in .pf-d{opacity:1}
.pf-say{border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7;border-left:3px solid var(--accent);background:var(--quote);min-height:5.4em}
.pf-say.bad{border-left-color:var(--warm)}
.pf-say em{display:block;font-style:normal;font-size:12px;color:var(--faint)}
@media (max-width:640px){.pf svg text{font-size:18px}}
</style>
<script>
(function(){
  let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const D=Array.from({length:100},()=>{const u=rnd(),v=rnd();const z=Math.sqrt(-2*Math.log(u+1e-9))*Math.cos(2*Math.PI*v);return Math.max(6,Math.min(30,20+z*7));}).sort((a,b)=>a-b);
  const X0=40,X1=600,x=v=>X0+(v-5)/(30-5)*(X1-X0),YB=130;
  const bins={};let g=`<line x1="${X0}" y1="${YB+8}" x2="${X1}" y2="${YB+8}" class="s-faint"/>`;
  [5,10,15,20,25,30].forEach(v=>g+=`<text x="${x(v)}" y="${YB+24}" text-anchor="middle" font-size="11" class="t-faint">${v===30?'仍持有':v+'%'}</text>`);
  D.forEach((v,i)=>{const b=v>=30?30:Math.round(v);bins[b]=(bins[b]||0)+1;g+=`<circle class="pf-d" style="transition-delay:${i*12}ms" cx="${x(b)}" cy="${YB-(bins[b]-1)*8.5}" r="3.6" fill="${b>=30?'var(--accent)':'var(--warm)'}"/>`;});
  const hold=D.filter(v=>v>=30).length,sold=D.filter(v=>v<30),p10=sold[Math.floor(sold.length*.1)],p90=sold[Math.floor(sold.length*.9)];
  g+=`<rect x="${x(p10)}" y="${YB+3}" width="${x(p90)-x(p10)}" height="4" rx="2" fill="var(--ink)" opacity=".5"/>`;
  document.getElementById('pf-g').innerHTML=g;
  const T={ind:['对个人下结论（不应采用）','你属于平衡型投资者，能承受 30% 的下跌。'],
    stat:['按统计群体描述',`历史上答案与此相近的投资者，在一次 30% 的下跌中约有 ${hold} 人坚持持有；其余 ${100-hold} 人中，八成在跌幅 ${Math.round(p10)}% 至 ${Math.round(p90)}% 之间陆续卖出。这只是同类投资者的统计，不代表任何一个人的结果。`]};
  function set(k){document.querySelectorAll('[data-pf]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pf===k)));const e=document.getElementById('pf-say');
    e.classList.toggle('bad',k==='ind');e.innerHTML=`<em>${T[k][0]}</em>${T[k][1]}${k==='ind'?'<br><span style="font-size:12.5px;color:var(--warm)">同一等级中只有 '+hold+' 人做到了这一点；这句话替用户作了判断，也作出了无法兑现的承诺。</span>':''}`;}
  document.querySelectorAll('[data-pf]').forEach(b=>b.addEventListener('click',()=>set(b.dataset.pf)));
  document.getElementById('pf').addEventListener('anim-in',()=>{set('ind');setTimeout(()=>set('stat'),3000);});
  set('ind');
})();
</script>
