    <div class="ch06summary" id="ch06summary" data-anim><div class="ch06summary-c" style="--i:0"><em>收益可以拆成因子暴露</em><b>按因子拆开展示组合的收益来源</b><p>告诉用户收益中有多少来自市场、规模、价值等因子，有多少是真正的超额收益。</p></div><div class="ch06summary-c" style="--i:1"><em>因子暴露可以低成本复制</em><b>费用要与真正的超额收益相称</b><p>只有拆完因子之后仍然存在的部分，才值得支付主动管理的费用。</p></div><div class="ch06summary-c warn" style="--i:2"><em>试得够多总有假阳性</em><b>对“新发现的规律”提高门槛</b><p>AI 或回测给出的新因子，要有经济解释、更高的统计门槛和样本外检验。</p></div><div class="ch06summary-c warn" style="--i:3"><em>可信的因子也会长期落后</em><b>说明因子策略可能连续多年跑输</b><p>在用户买入前展示历史上最长的落后期，避免在低迷时被迫放弃。</p></div></div>
