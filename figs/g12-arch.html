<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">同一组选项，两种架构</p><p class="figsub">两份开户页面提供完全相同的选项，只是默认、排列与步骤不同。切换两种设计，看一百位委托人最后选了什么。</p></div><button class="replay" type="button" data-replay="ar12">重播</button></div>
    <div class="seg-btns" role="group" aria-label="页面设计">
      <button type="button" data-ar12="p" aria-pressed="true">为委托人设计</button>
      <button type="button" data-ar12="s" aria-pressed="false">为卖方设计</button>
    </div>
    <div class="ar12" id="ar12" data-anim>
      <div class="ar12-two">
        <div class="ar12-form" id="ar12-f"></div>
        <div class="ar12-res" id="ar12-r"></div>
      </div>
      <p class="ar12-msg" id="ar12-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：假定七成的人接受页面上的默认与第一个选项，其余的人按自己的需要选择；退出入口需要多走三步时，想退出的人只有三成真的完成。</figcaption>
</figure>
<style>
.ar12-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.ar12-form{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);font-size:13px;display:grid;gap:8px}
.ar12-form p{margin:0;font-size:11.5px;color:var(--faint)}
.ar12-row{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--quote);transition:outline-color .3s}
.ar12-row i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;font-style:normal;font-size:10px;line-height:1}
.ar12-row.on i{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.ar12-row.mark{outline:2px solid var(--warm);outline-offset:1px}
.ar12-row span{flex:1} .ar12-row em{font-style:normal;color:var(--faint);font-size:11.5px}
.ar12-exit{font-size:11.5px;color:var(--faint);text-align:right}
.ar12-res{display:grid;gap:8px}
.ar12-bar span{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.ar12-bar div{height:10px;border-radius:5px;background:var(--quote);overflow:hidden}
.ar12-bar div i{display:block;height:100%;background:var(--accent);transition:width .6s}
.ar12-bar.w div i{background:var(--warm)}
.ar12-msg{font-size:14px;margin:12px 0 0;min-height:3.4em}
@media (max-width:640px){.ar12-two{grid-template-columns:1fr}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('ar12'+id);let mode='p';
  const D={p:{rows:[['低费用的全市场组合','0.1%',1,0],['主动挑选的组合','1.5%',0,0],['附加的咨询服务','每月 30 份',0,0]],exit:'随时退出：本页右上角',res:[['选了低费用组合',.7+.3*.6,0],['选了高费用组合',.3*.4,1],['订了附加服务',.3*.2,1],['想退出且完成退出',1,0]],
      msg:'默认是大多数人想清楚之后也会选的低费用组合，附加服务需要主动勾选，退出与加入一样容易：惯性在帮委托人守住本意。'},
    s:{rows:[['主动挑选的组合','1.5%',1,1],['低费用的全市场组合','0.1%',0,0],['附加的咨询服务','每月 30 份',1,1]],exit:'退出：设置 › 账户 › 更多 › 申请',res:[['选了低费用组合',.3*.6,0],['选了高费用组合',.7+.3*.4,1],['订了附加服务',.7+.3*.2,1],['想退出且完成退出',.3,1]],
      msg:'选项完全相同，只是把高费用的组合排在第一位并设为默认，附加服务默认勾选，退出要多走三步：同一份惯性，变成了卖方的收入。'}};
  function draw(){const d=D[mode];
    $('-f').innerHTML='<p>选择你的投资方式</p>'+d.rows.map(([a,b,on,mk])=>`<div class="ar12-row${on?' on':''}${mk?' mark':''}"><i>${on?'✓':''}</i><span>${a}</span><em>${b}</em></div>`).join('')+`<div class="ar12-exit${mode==='s'?' ':''}">${d.exit}</div>`;
    $('-r').innerHTML=d.res.map(([a,v,w])=>`<div class="ar12-bar${w?' w':''}"><span>${a}<b>${Math.round(v*100)}%</b></span><div><i style="width:${v*100}%"></i></div></div>`).join('');
    $('-msg').textContent=d.msg;}
  const bs=[...document.querySelectorAll('[data-ar12]')];
  function set(m){mode=m;bs.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ar12===m)));draw();}
  bs.forEach(b=>b.addEventListener('click',()=>set(b.dataset.ar12)));
  $('').addEventListener('anim-in',()=>{set('p');setTimeout(()=>set('s'),2600);});
  draw();
})();
</script>
