<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">只看“跑赢基准”，会选中什么策略</p><p class="figsub">策略乙持续卖出虚值看跌期权，平时每月稳定赚一点，市场大跌时损失惨重。拖动时间，看两条曲线；再打开尾部风险约束。</p></div><button class="replay" type="button" data-replay="gm">重播</button></div>
    <label class="gm-chk"><input type="checkbox" id="gm-x"> 委托书加入约束：任何一个月的损失不得超过 15%（含压力情景）</label>
    <div class="gm" id="gm" data-anim>
      <svg viewBox="0 0 640 220" role="img" aria-label="两种策略的累计净值"><g id="gm-ax"></g><path id="gm-a" class="gm-l a"/><path id="gm-b" class="gm-l b"/><text id="gm-tag" font-size="12" class="t-warm"></text></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>甲：持有指数</span><span><i style="background:var(--warm)"></i>乙：持续卖出看跌期权</span></div>
      <div class="sl"><label for="gm-t">经过的月份 <b id="gm-tv"></b></label><input id="gm-t" type="range" min="1" max="120" step="1" value="96"></div>
      <p class="gm-msg" id="gm-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意路径，思路来自 Lo（2001）构造的假想基金。指标被当作目标后不再可靠，见 Goodhart（1975）；AI 系统钻指标空子的讨论见 Amodei 等（2016）。</figcaption>
</figure>
<style>
.gm-chk{display:flex;gap:6px;align-items:center;font-size:14px;margin-bottom:6px}
.gm-chk input{accent-color:var(--accent);width:16px;height:16px}
.gm svg{width:100%;height:auto;display:block}
.gm-l{fill:none;stroke-width:2.5} .gm-l.a{stroke:var(--accent)} .gm-l.b{stroke:var(--warm);transition:opacity .3s}
.gm-msg{font-size:14px;margin:6px 0 0;min-height:3.4em}
@media (max-width:640px){.gm svg text{font-size:18px}}
</style>
<script>
(function(){
  let s=4;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
  const A=[1],B=[1];for(let m=1;m<=120;m++){const z=(rnd()+rnd()+rnd()-1.5)*2;let ra=.008+.04*z;if(m===100)ra=-.22;if(m===101)ra=-.08;A.push(A[m-1]*(1+ra));B.push(B[m-1]*(1+(m===100?-.6:m===101?-.15:.011)));}
  const X0=50,X1=620,YT=14,YB=190,mx=Math.max(...A,...B),x=m=>X0+m/120*(X1-X0),y=v=>YB-(v-.4)/(mx-.4)*(YB-YT);
  const $=id=>document.getElementById(id),sl=$('gm-t'),cb=$('gm-x');
  $('gm-ax').innerHTML=`<line x1="${X0}" y1="${y(1)}" x2="${X1}" y2="${y(1)}" class="s-faint" stroke-dasharray="3 3"/><line x1="${X0}" y1="${YB}" x2="${X1}" y2="${YB}" class="s-faint"/>`+[0,2,4,6,8,10].map(k=>`<text x="${x(k*12)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">第 ${k} 年</text>`).join('')+`<text x="${X0-6}" y="${y(1)+4}" text-anchor="end" font-size="11" class="t-faint">1.0</text>`;
  const P=(S,T)=>S.slice(0,T+1).map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join('');
  function r(){const T=+sl.value,on=cb.checked;$('gm-a').setAttribute('d',P(A,T));$('gm-b').setAttribute('d',P(B,T));$('gm-b').style.opacity=on?.15:1;$('gm-tv').textContent='第 '+T+' 个月';
    const tag=$('gm-tag');tag.setAttribute('x',x(Math.min(T,110))+6);tag.setAttribute('y',y(B[T])-8);tag.textContent=on?'不符合约束，不可选':'';
    $('gm-msg').textContent=on?'压力情景下，乙在一个月内可能损失过半，违反了约束：它从一开始就不在可选范围之内。目标必须配上覆盖尾部的风险约束。':T<100?`前 ${T} 个月里，乙的净值始终高于甲，曲线平稳，看起来是更好的选择。只看“跑赢基准”，代理会选中它。`:`第 100 个月市场大跌，乙一个月损失六成：此前八年多的超额收益全部吐回，最终落后于甲。`;}
  sl.addEventListener('input',r);cb.addEventListener('change',r);
  $('gm').addEventListener('anim-in',()=>{cb.checked=false;let T=1;sl.value=1;r();const id=setInterval(()=>{T+=2;sl.value=Math.min(T,120);r();if(T>=120){clearInterval(id);setTimeout(()=>{cb.checked=true;r();},900);}},50);});
  r();
})();
</script>
