<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">门槛：固定成本除以家产</p><p class="figsub">委托一年的成本占家产的比例，随家产增加而下降；低于委托带来的好处（虚线）的那一段，委托才划算。拖动认知劳动的价格，看门槛移到哪里。</p></div><button class="replay" type="button" data-replay="th14">重播</button></div>
    <div class="th14" id="th14" data-anim>
      <svg viewBox="0 0 660 220" role="img" aria-label="委托成本占家产的比例"><g id="th14-g"></g></svg>
      <div class="sl"><label for="th14-a">认知劳动的价格 <b id="th14-av"></b></label><input id="th14-a" type="range" min="0" max="2" step="0.1" value="0"></div>
      <p class="th14-msg" id="th14-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：固定成本＝3 份 × 认知劳动的价格＋0.3 份核对与担责；委托带来的好处为家产的 1.3%。横轴为家产，对数刻度。</figcaption>
</figure>
<style>
.th14 svg{width:100%;height:auto;display:block}
.th14-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.th14 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('th14'+id),X0=50,X1=628,YT=12,YB=180,L0=1,L1=4,x=w=>X0+(Math.log10(w)-L0)/(L1-L0)*(X1-X0),mx=6,y=v=>YB-Math.min(v,mx)/mx*(YB-YT),B=1.3;
  function draw(){const ls=+$('-a').value,a=Math.pow(10,-ls),F=3*a+.3,th=F/B*100;$('-av').textContent=a>=.1?Math.round(a*100)+'%':(a*100).toFixed(1)+'%';
    let h=[0,2,4,6].map(v=>`<line x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}%</text>`).join('')+[10,100,1000,10000].map(w=>`<text x="${x(w)}" y="${YB+16}" text-anchor="middle" font-size="11" class="t-faint">${w} 份</text>`).join('');
    h+=`<rect x="${x(Math.max(10,Math.min(1e4,th)))}" y="${YT}" width="${X1-x(Math.max(10,Math.min(1e4,th)))}" height="${YB-YT}" fill="var(--accent)" opacity=".08"/>`;
    h+=`<line x1="${X0}" x2="${X1}" y1="${y(B)}" y2="${y(B)}" stroke="var(--warm)" stroke-dasharray="5 4"/><text x="${X1}" y="${y(B)-6}" text-anchor="end" font-size="11" fill="var(--warm)">委托的好处 1.3%</text>`;
    let d='';for(let l=L0;l<=L1+1e-9;l+=.02){const w=Math.pow(10,l);d+=(d?'L':'M')+x(w).toFixed(1)+','+y(F/w*100).toFixed(1);}
    const fl=.3/B*100;
    h+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.6"/>`;
    if(th>=10&&th<=1e4)h+=`<line x1="${x(th)}" x2="${x(th)}" y1="${y(B)}" y2="${YB}" stroke="var(--accent)"/><text x="${x(th)+6}" y="${YB-8}" font-size="11">门槛 ${Math.round(th)} 份</text>`;
    $('-g').innerHTML=h;
    $('-msg').textContent=ls===0?`认知劳动按原价计，固定成本 3.3 份，家产超过 ${Math.round(th)} 份的人家委托才划算。`:`认知劳动的价格降到 ${a>=.1?Math.round(a*100):(a*100).toFixed(1)}%，固定成本 ${F.toFixed(2)} 份，门槛降到 ${Math.round(th)} 份。认知劳动再便宜，门槛也不会低于 ${Math.round(fl)} 份：那是 0.3 份的核对与担责决定的。`;}
  $('-a').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{let v=0;$('-a').value=0;draw();const id=setInterval(()=>{v+=.1;$('-a').value=v.toFixed(1);draw();if(v>=2)clearInterval(id);},150);});
  draw();
})();
</script>
