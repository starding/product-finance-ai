<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">证据被看见，才会改变信念</p><p class="figsub">代理三个月里产生了 90 条过程记录。切换呈现方式，看用户真正看到并留意了多少条，以及信念的变化。</p></div><button class="replay" type="button" data-replay="vs">重播</button></div>
    <div class="seg-btns" role="group" aria-label="呈现方式">
      <button type="button" data-vs="0" aria-pressed="true">只存在后台</button><button type="button" data-vs="1" aria-pressed="false">全部推送</button><button type="button" data-vs="2" aria-pressed="false">每周期简短交代</button><button type="button" data-vs="3" aria-pressed="false">周期交代＋关键时刻呈现</button>
    </div>
    <div class="vs" id="vs" data-anim>
      <div class="vs-g" id="vs-g"></div>
      <div class="vs-out"><div><span>被用户留意的记录</span><b id="vs-n"></b></div><div><span>三个月后的信念</span><b id="vs-b"></b></div></div>
      <p class="vs-msg" id="vs-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：先验 30%，每条被留意的过程记录似然比 1.08，关键时刻的记录似然比 1.3。全部推送时消息过多，用户只留意其中约一成。</figcaption>
</figure>
<style>
.vs-g{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.vs-g i{aspect-ratio:1;border-radius:2px;background:var(--quote);transition:background .3s;transition-delay:calc(var(--i)*4ms)}
.vs-g i.s{background:var(--accent)} .vs-g i.k{background:var(--blue)}
.vs-out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.vs-out div{background:var(--quote);border-radius:8px;padding:8px 12px}
.vs-out span{display:block;font-size:12px;color:var(--faint)} .vs-out b{font-size:19px;font-variant-numeric:tabular-nums}
.vs-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.vs-g{grid-template-columns:repeat(15,1fr)}}
</style>
<script>
(function(){
  const g=document.getElementById('vs-g');g.innerHTML=Array.from({length:90},(_,i)=>`<i style="--i:${i}"></i>`).join('');const cs=[...g.children];
  const KEY=[14,37,62,81];
  const M=[[2,0,'记录都在，但只存在后台：用户只在偶然点开时看到两条，信念几乎没有变化。'],[9,0,'所有记录都推送给用户：消息太多，绝大多数被划掉忽略，真正留意的不到一成。'],[30,0,'每周期给出简短交代：用户留意了约三分之一的记录，信念稳步上升。'],[30,4,'在周期交代之外，在到期、波动等关键时刻主动呈现相关记录：诊断力最高的几条证据都被看见了。']];
  const lo=p=>Math.log(p/(1-p)),ex=l=>1/(1+Math.exp(-l));
  function set(k){document.querySelectorAll('[data-vs]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.vs===k)));const [n,kk,m]=M[k];
    const step=90/n;const seen=new Set();for(let j=0;j<n;j++)seen.add(Math.floor(j*step));
    cs.forEach((c,i)=>c.className=(kk&&KEY.includes(i))?'k':seen.has(i)?'s':'');
    const b=ex(lo(.3)+n*Math.log(1.08)+kk*Math.log(1.3));
    document.getElementById('vs-n').textContent=(n+kk)+' 条';document.getElementById('vs-b').textContent=(b*100).toFixed(0)+'%';document.getElementById('vs-msg').textContent=m;}
  document.querySelectorAll('[data-vs]').forEach(b=>b.addEventListener('click',()=>set(+b.dataset.vs)));
  document.getElementById('vs').addEventListener('anim-in',()=>{[0,1,2,3].forEach(i=>setTimeout(()=>set(i),i*1800));});
  set(0);
})();
</script>
