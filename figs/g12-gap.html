<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">追涨杀跌：委托人拿到的少于船股本身</p><p class="figsub">船股的价格围绕每年 6% 的长期趋势起伏。一位委托人每年本打算投入 10 份；追涨杀跌时，去年涨得多就多投，去年跌了就少投甚至卖出。拖动追涨杀跌的程度，比较三种收益。</p></div><button class="replay" type="button" data-replay="gp12">重播</button></div>
    <div class="gp12" id="gp12" data-anim>
      <svg viewBox="0 0 660 240" role="img" aria-label="船股价格与每年的投入"><g id="gp12-g"></g></svg>
      <div class="legend"><span><i style="background:var(--ink)"></i>船股价格</span><span><i style="background:var(--accent)"></i>当年投入</span><span><i style="background:var(--warm)"></i>当年卖出</span></div>
      <div class="sl"><label for="gp12-k">追涨杀跌的程度 <b id="gp12-kv"></b></label><input id="gp12-k" type="range" min="0" max="2" step="0.25" value="1"></div>
      <div class="gp12-out" id="gp12-out"></div>
      <p class="gp12-msg" id="gp12-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：价格＝长期趋势 ×（1＋0.3×周期起伏），周期八年。“船股本身”为买入并持有的年化收益；委托人的收益按资金进出的时点计算（内部收益率），即迪切夫（2007）所说的考虑资金进出时点的收益。按时定投与船股本身的差别，只来自投入时点的先后，不来自判断。</figcaption>
</figure>
<style>
.gp12 svg{width:100%;height:auto;display:block}
.gp12-out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.gp12-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.gp12-out span{display:block;font-size:11.5px;color:var(--faint)} .gp12-out b{font-size:18px;font-variant-numeric:tabular-nums}
.gp12-msg{font-size:14px;margin:10px 0 0;min-height:3.4em}
@media (max-width:640px){.gp12-out{grid-template-columns:1fr}.gp12 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('gp12'+id),T=20,X0=44,X1=628,x=t=>X0+t/T*(X1-X0);
  const P=[1];for(let t=1;t<=T;t++)P.push(Math.pow(1.06,t)*(1+.3*Math.sin(2*Math.PI*t/8)));const r=P.slice(1).map((v,t)=>v/P[t]-1);
  function irr(f,end){let lo=-.5,hi=.5;for(let k=0;k<80;k++){const m=(lo+hi)/2;let v=0;f.forEach((c,t)=>v+=c*Math.pow(1+m,T-t));if(v>end)hi=m;else lo=m;}return (lo+hi)/2;}
  function run(k){let H=0;const f=[];for(let t=0;t<T;t++){let c=10*(1+k*4*(t?r[t-1]-.06:0));if(c<-H)c=-H;f.push(c);H=(H+c)*(1+r[t]);}return {f,irr:irr(f,H)};}
  const prod=Math.pow(P[T],1/T)-1,dca=run(0).irr;
  function draw(){const k=+$('-k').value,R=run(k);$('-kv').textContent=k===0?'不追（按时定投）':k<=.75?'轻':k<=1.25?'中':'重';
    const yp=v=>130-(v-.8)/(4-.8)*120,yf=c=>200-c*1.1;
    let h=[1,2,3,4].map(v=>`<line x1="${X0}" x2="${X1}" y1="${yp(v)}" y2="${yp(v)}" class="s-line"/><text x="${X0-6}" y="${yp(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`).join('')
      +`<line x1="${X0}" x2="${X1}" y1="200" y2="200" class="s-line"/>`+[0,5,10,15,20].map(t=>`<text x="${x(t)}" y="236" text-anchor="middle" font-size="11" class="t-faint">第 ${t} 年</text>`).join('');
    h+=`<path d="${P.map((v,t)=>(t?'L':'M')+x(t).toFixed(1)+','+yp(v).toFixed(1)).join('')}" fill="none" stroke="var(--ink)" stroke-width="2.2"/>`;
    const bw=(X1-X0)/T*.6;R.f.forEach((c,t)=>{const cx=x(t)+bw*.3;h+=c>=0?`<rect x="${cx}" y="${yf(c)}" width="${bw}" height="${200-yf(c)}" fill="var(--accent)"/>`:`<rect x="${cx}" y="200" width="${bw}" height="${yf(c)-200}" fill="var(--warm)"/>`;});
    $('-g').innerHTML=h;const pc=v=>(v*100).toFixed(1)+'%';
    $('-out').innerHTML=[['船股本身（买入并持有）',pc(prod)],['按时定投的委托人',pc(dca)],['这位委托人实际拿到',pc(R.irr)]].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
    $('-msg').textContent=k===0?'每年按时投入 10 份，不看去年的涨跌：拿到的收益与船股本身几乎相同。':`去年涨得多，今年就多投，往往买在周期的高处；去年跌了就少投或卖出，又卖在低处。这位委托人每年比按时定投少拿 ${((dca-R.irr)*100).toFixed(1)} 个百分点，二十年累积下来是不小的差距。`;}
  $('-k').addEventListener('input',draw);
  $('').addEventListener('anim-in',()=>{let v=0;$('-k').value=0;draw();const id=setInterval(()=>{v+=.25;$('-k').value=v;draw();if(v>=1.5)clearInterval(id);},500);});
  draw();
})();
</script>
