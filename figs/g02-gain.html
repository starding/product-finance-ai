<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">借贷让双方都更好</p><p class="figsub">秋天我借给他若干份粮食，春天他连本带息还我。拖动借出的数量与利率，看两人的满足感各自比不借时多了还是少了。</p></div><button class="replay" type="button" data-replay="gn">重播</button></div>
    <div class="gn" id="gn" data-anim>
      <div class="gn-bars">
        <div class="gn-b"><span>我（出借）</span><div class="gn-t"><i id="gn-a"></i></div><b id="gn-av"></b></div>
        <div class="gn-b"><span>他（借入）</span><div class="gn-t"><i id="gn-b"></i></div><b id="gn-bv"></b></div>
      </div>
      <div class="gn-band"><div class="gn-ax" id="gn-ax"></div><div class="gn-ok" id="gn-ok"></div><i class="gn-r" id="gn-r"></i></div>
      <div class="gn-sl">
        <div class="sl"><label for="gn-l">秋天借出 <b id="gn-lv"></b></label><input id="gn-l" type="range" min="1" max="8" step="0.5" value="6"></div>
        <div class="sl"><label for="gn-i">利率（半年） <b id="gn-iv"></b></label><input id="gn-i" type="range" min="-20" max="60" step="1" value="10"></div>
      </div>
      <p class="gn-msg" id="gn-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>示意：我秋天有 12 份、春天没有，自己储藏半年损耗 5%（一年约一成）；他秋天只剩 1 份、春天有 12 份。满足感按每半年吃到份数的对数计算，比较对象是不借时各自最好的安排。绿色区间内的利率让双方都更好。</figcaption>
</figure>
<style>
.gn-bars{display:grid;gap:8px}
.gn-b{display:grid;grid-template-columns:6.5em 1fr 4.5em;gap:10px;align-items:center;font-size:13px}
.gn-t{position:relative;height:16px;background:var(--quote);border-radius:4px}
.gn-t::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--faint)}
.gn-t i{position:absolute;top:0;height:100%;border-radius:4px;transition:left .3s,width .3s,background .3s}
.gn-b b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.gn-band{position:relative;height:40px;margin:18px 0 6px}
.gn-ax{position:absolute;left:0;right:0;top:18px;border-top:1px solid var(--line)}
.gn-ax span{position:absolute;top:6px;transform:translateX(-50%);font-size:10.5px;color:var(--faint)}
.gn-ok{position:absolute;top:12px;height:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;transition:left .3s,width .3s}
.gn-r{position:absolute;top:6px;width:3px;height:24px;margin-left:-1.5px;background:var(--ink);border-radius:2px;transition:left .2s}
.gn-sl{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.gn-msg{font-size:14px;margin:8px 0 0;min-height:3.4em}
@media (max-width:640px){.gn-sl{grid-template-columns:1fr;gap:4px}}
</style>
<script>
(function(){
  const pc=v=>(v<0?'−':'')+Math.abs(Math.round(v*100))+'%',$=id=>document.getElementById(id),a=0.95,U0a=Math.log(6)+Math.log(6*a),U0b=Math.log(1)+Math.log(12),R0=-20,R1=60,px=r=>(r-R0)/(R1-R0)*100;
  const Ua=(L,r)=>Math.log(12-L)+Math.log(L*(1+r)),Ub=(L,r)=>{const rest=12-L*(1+r);return rest<=0?-99:Math.log(1+L)+Math.log(rest);};
  function root(f,lo,hi){for(let i=0;i<50;i++){const m=(lo+hi)/2;if(f(m)>0)hi=m;else lo=m;}return (lo+hi)/2;}
  $('gn-ax').innerHTML=[-20,0,20,40,60].map(v=>`<span style="left:${px(v)}%">${v<0?'−'+(-v):v}%</span>`).join('');
  function bar(el,d){const w=Math.min(50,Math.abs(d)/1.0*50);el.style.left=(d>=0?50:50-w)+'%';el.style.width=w+'%';el.style.background=d>=0?'var(--accent)':'var(--warm)';}
  function draw(){const L=+$('gn-l').value,r=+$('gn-i').value/100;
    const da=Ua(L,r)-U0a,db=Math.max(-3,Ub(L,r)-U0b);
    bar($('gn-a'),da);bar($('gn-b'),db);$('gn-av').textContent=(da>=0?'+':'')+da.toFixed(2);$('gn-bv').textContent=(db>=0?'+':'')+db.toFixed(2);
    const rmin=root(x=>Ua(L,x)-U0a,-0.99,3),rmax=root(x=>-(Ub(L,x)-U0b),-0.99,(12/L)-1-1e-6);
    const lo=Math.max(R0,rmin*100),hi=Math.min(R1,rmax*100);$('gn-ok').style.left=px(lo)+'%';$('gn-ok').style.width=Math.max(0,px(hi)-px(lo))+'%';$('gn-r').style.left=px(r*100)+'%';
    $('gn-lv').textContent=L+' 份';$('gn-iv').textContent=pc(r);
    $('gn-msg').textContent=rmin>rmax?`借出 ${L} 份时，没有一个利率能让双方都更好。`:da>=0&&db>=0?`借出 ${L} 份、利率 ${pc(r)}：双方都比不借更好。利率在 ${pc(rmin)} 到 ${pc(rmax)} 之间都可以，具体落在哪里，取决于两人怎样商定。`:da<0?`利率低于 ${pc(rmin)}，我不如自己储藏；注意这个下限是负的，因为储藏本身会损耗。`:`利率高于 ${pc(rmax)}，他还完之后剩下的太少，不如不借。`;}
  ['gn-l','gn-i'].forEach(k=>$(k).addEventListener('input',draw));
  $('gn').addEventListener('anim-in',()=>{let v=-20;$('gn-i').value=v;draw();const id=setInterval(()=>{v+=4;$('gn-i').value=v;draw();if(v>=56){clearInterval(id);setTimeout(()=>{$('gn-i').value=10;draw();},700);}},160);});
  draw();
})();
</script>
