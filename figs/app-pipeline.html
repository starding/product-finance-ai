<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">从职业任务到行业上限：五个步骤</p><p class="figsub">点选一步，查看它做了什么、用了哪些数据。</p></div><button class="replay" type="button" data-replay="pp">重播</button></div>
    <div class="pp" id="pp" data-anim>
      <button type="button" class="pp-s" data-pp="0" style="--i:0"><em>1</em><b>任务加权</b><span>约 1.9 万项任务</span></button>
      <button type="button" class="pp-s" data-pp="1" style="--i:1"><em>2</em><b>归入活动</b><span>332 项中间工作活动</span></button>
      <button type="button" class="pp-s" data-pp="2" style="--i:2"><em>3</em><b>双人编码</b><span>门、三档比例、信任两维</span></button>
      <button type="button" class="pp-s" data-pp="3" style="--i:3"><em>4</em><b>职业汇总</b><span>899 个职业 → 9 个大类</span></button>
      <button type="button" class="pp-s" data-pp="4" style="--i:4"><em>5</em><b>行业加权</b><span>20 个行业门类</span></button>
    </div>
    <p class="pp-msg" id="pp-msg" aria-live="polite"></p>
  </div>
</figure>
<style>
.pp{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative}
.pp-s{font:inherit;text-align:left;cursor:pointer;background:var(--quote);border:1px solid transparent;border-radius:10px;padding:10px;color:var(--ink);display:flex;flex-direction:column;gap:2px;position:relative;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s,border-color .3s;transition-delay:calc(var(--i)*.2s)}
.pp.in .pp-s{opacity:1;transform:none}
.pp-s:not(:last-child)::after{content:"→";position:absolute;right:-14px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px}
.pp-s em{font-style:normal;font-size:11px;color:var(--faint)} .pp-s b{font-size:14px} .pp-s span{font-size:11.5px;color:var(--muted);line-height:1.45}
.pp-s.sel{border-color:var(--accent);background:var(--accent-soft)}
.pp-msg{font-size:14px;margin:12px 0 0;min-height:4.8em;line-height:1.7}
@media (max-width:640px){.pp{grid-template-columns:1fr;gap:8px}.pp-s:not(:last-child)::after{content:"↓";right:12px}}
</style>
<script>
(function(){
  const M=['O*NET 31.0 为每个职业的任务给出重要度（1～5）与频次（1～7 类，从一年一次或更少到每小时多次）的评分。每项任务的权重取（重要度 − 1）× 频次类别的加权平均，作为它在该职业工作时间中所占比重的近似。',
    '每项任务对应一项或多项细项工作活动（DWA），权重平均分配给它们；细项活动再归入 332 项中间工作活动（IWA）。中间工作活动是跨职业的通用单位，例如「分析经营与财务数据」「执行金融交易」。',
    '两位编码者按同一份书面口径，各自独立判定每项中间工作活动：属于哪一门（信息再分数字可得与须现场感知）、Chat / Agent / 具身 Agent 三档条件下可交给代理的时间比例、违约后果与结果可验证性各 1～4 档。门不一致时各计一半，比例与档位取平均。',
    '每个职业的可达份额 p ＝ 各活动的时间比重 × 可达比例之和。职业按标准职业分类大类、工作区间与职业名称近似对应到 ISCO-08 的 9 个大类，大类内取平均。',
    '每个行业门类按欧盟 27 国 2024 年各 ISCO 大类的就业人数加权（Eurostat lfsa_eisn2）。整份工作的放大倍数上限 ＝ 1 ÷（1 − p）；可达部分提速 s 倍时，整体为 1 ÷ [(1 − p) ＋ p ÷ s]。'];
  const msg=document.getElementById('pp-msg');
  function set(k){document.querySelectorAll('[data-pp]').forEach(b=>b.classList.toggle('sel',+b.dataset.pp===k));msg.textContent=M[k];}
  document.querySelectorAll('[data-pp]').forEach(b=>b.addEventListener('click',()=>set(+b.dataset.pp)));
  document.getElementById('pp').addEventListener('anim-in',()=>{[0,1,2,3,4].forEach((k,i)=>setTimeout(()=>set(k),300+i*2000));});
  set(0);
})();
</script>
