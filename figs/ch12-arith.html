<figure>
  <div class="card">
    <p class="figtitle">主动管理的加减法</p>
    <p class="figsub">市场一年上涨 8%。拖动主动投资者所占的比例，比较两类投资者扣除成本前后的收益。</p>
    <div class="ar12" id="ar12" data-anim>
      <div class="ar12-split"><i id="ar12-p" class="p"></i><i id="ar12-a" class="a"></i></div>
      <div class="ar12-lbl"><span>被动投资者：按市值持有整个市场</span><span>主动投资者：试图跑赢市场</span></div>
      <div class="sl"><label for="ar12-s">主动投资者所占比例 <b id="ar12-sv"></b></label><input id="ar12-s" type="range" min="10" max="90" step="10" value="50"></div>
      <div class="ar12-tbl">
        <div class="h"></div><div class="h">扣除成本前</div><div class="h">成本</div><div class="h">扣除成本后</div>
        <div class="n">被动投资者</div><div>8.0%</div><div>0.1%</div><div><b>7.9%</b></div>
        <div class="n">主动投资者整体</div><div>8.0%</div><div>1.0%</div><div><b class="w">7.0%</b></div>
        <div class="n">全部投资者</div><div>8.0%</div><div id="ar12-c"></div><div id="ar12-t"></div>
      </div>
      <p class="ar12-msg">无论主动投资者占多少，他们合起来扣除成本前都只能等于市场；成本更高，所以扣除后必然落后。</p>
    </div>
  </div>
  <figcaption>示例数字：被动投资成本每年 0.1%，主动投资成本（费用与交易成本）每年 1%。论证见 Sharpe（1991）。</figcaption>
</figure>
<style>
.ar12-split{display:flex;height:34px;border-radius:8px;overflow:hidden}
.ar12-split i{display:block;height:100%;transition:width .5s ease}
.ar12-split i.p{background:var(--accent)} .ar12-split i.a{background:var(--warm)}
.ar12-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:4px 0 10px}
.ar12-tbl{display:grid;grid-template-columns:120px repeat(3,1fr);gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.ar12-tbl div{background:var(--quote);padding:6px 10px;border-radius:6px}
.ar12-tbl .h{background:transparent;color:var(--faint);font-size:12px}
.ar12-tbl .n{font-weight:500}
.ar12-tbl b.w{color:var(--warm)}
.ar12-msg{font-size:14px;margin:10px 0 0}
</style>
<script>
(function(){
  const s=document.getElementById('ar12-s');
  function r(){const a=+s.value/100;document.getElementById('ar12-sv').textContent=s.value+'%';
    document.getElementById('ar12-p').style.width=((1-a)*100)+'%';document.getElementById('ar12-a').style.width=(a*100)+'%';
    const c=(1-a)*0.1+a*1.0;document.getElementById('ar12-c').textContent=c.toFixed(2)+'%';document.getElementById('ar12-t').innerHTML='<b>'+(8-c).toFixed(2)+'%</b>';}
  s.addEventListener('input',r); r();
})();
</script>
