<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">同样的本事，价格降了 280 多倍</p><p class="figsub">达到同一水平的大模型，每百万词元的调用价格。纵轴为对数刻度。拖动“要读的报告”，看同一笔预算在两个时点能读多少份。</p></div><button class="replay" type="button" data-replay="pr13">重播</button></div>
    <div class="pr13" id="pr13" data-anim>
      <svg viewBox="0 0 660 210" role="img" aria-label="大模型调用价格的下降"><g id="pr13-g"></g></svg>
      <div class="sl"><label for="pr13-b">预算 <b id="pr13-bv"></b></label><input id="pr13-b" type="range" min="1" max="100" step="1" value="20"></div>
      <div class="pr13-out" id="pr13-out"></div>
    </div>
  </div>
  <figcaption>数据：斯坦福大学《人工智能指数报告 2025》，以 MMLU 约 64.8% 的水平为基准，2022 年 11 月约 20 美元，2024 年 10 月约 0.07 美元（每百万词元）。“一份报告”按约 2 万词元计算，为示意。</figcaption>
</figure>
<style>
.pr13 svg{width:100%;height:auto;display:block}
.pr13-out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pr13-out div{background:var(--quote);border-radius:8px;padding:8px 10px}
.pr13-out span{display:block;font-size:11.5px;color:var(--faint)} .pr13-out b{font-size:18px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.pr13-out{grid-template-columns:1fr}.pr13 svg text{font-size:15px}}
</style>
<script>
(function(){
  const $=id=>document.getElementById('pr13'+id),P=[['2022 年 11 月',20],['2024 年 10 月',.07]],X0=70,YT=16,YB=176;
  const y=v=>YB-(Math.log10(v)+2)/(Math.log10(100)+2)*(YB-YT);
  function draw(k){const b=+$('-b').value;$('-bv').textContent=b+' 美元';
    let h=[.01,.1,1,10,100].map(v=>`<line x1="${X0}" x2="640" y1="${y(v)}" y2="${y(v)}" class="s-line"/><text x="${X0-6}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v} 美元</text>`).join('');
    P.forEach(([n,v],i)=>{const cx=200+i*260,vv=k===undefined||k>i?v:100;h+=`<rect x="${cx-50}" y="${y(vv)}" width="100" height="${YB-y(vv)}" fill="${i?'var(--accent)':'var(--faint)'}" style="transition:y .8s,height .8s"/><text x="${cx}" y="${y(vv)-6}" text-anchor="middle" font-size="13">${v} 美元</text><text x="${cx}" y="${YB+20}" text-anchor="middle" font-size="12" class="t-faint">${n}</text>`;});
    $('-g').innerHTML=h;const n=v=>Math.floor(b/(v*.02));
    $('-out').innerHTML=[['2022 年 11 月能读的报告',n(20).toLocaleString()+' 份'],['2024 年 10 月能读的报告',n(.07).toLocaleString()+' 份']].map(([a,c])=>`<div><span>${a}</span><b>${c}</b></div>`).join('');}
  $('-b').addEventListener('input',()=>draw());
  $('').addEventListener('anim-in',()=>{draw(1);setTimeout(()=>draw(),900);});
  draw();
})();
</script>
