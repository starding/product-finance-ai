<figure>
  <div class="card">
    <div class="figbar"><div><p class="figtitle">知情者越多，价差越宽；交易越多，价格越准</p><p class="figsub">股票真实价值要么是 110，要么是 90，做市商不知道是哪一个。知情者只在对自己有利时交易，非知情者随机买卖。</p></div><button class="replay" type="button" id="gm-run">换一组交易重新模拟</button></div>
    <div class="gm" id="gm" data-anim>
      <div class="sl"><label for="gm-mu">知情交易者所占比例 <b id="gm-mv"></b></label><input id="gm-mu" type="range" min="0" max="60" step="5" value="20"></div>
      <div class="gm-q"><span>首笔报价</span><b id="gm-bid" class="bid"></b><i id="gm-gap"></i><b id="gm-ask" class="ask"></b><em id="gm-sp"></em></div>
      <svg viewBox="0 0 640 220" role="img" aria-label="逐笔交易后的买卖报价">
        <g id="gm-axis"></g>
        <path id="gm-band" class="gm-band"/>
        <path id="gm-a" class="gm-l ask"/><path id="gm-b" class="gm-l bid"/>
        <g id="gm-tr"></g>
      </svg>
      <p class="gm-msg" id="gm-msg" aria-live="polite"></p>
    </div>
  </div>
  <figcaption>按 Glosten 与 Milgrom（1985）的模型模拟。卖价等于“已知下一笔是买单”时价值的期望，买价同理；每笔成交后，做市商据此更新对真实价值的判断。下方圆点为每笔交易，绿色为买单，橙色为卖单。</figcaption>
</figure>
<style>
.gm svg{width:100%;height:auto;display:block}
.gm-q{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-size:13px}
.gm-q>span{color:var(--faint)}
.gm-q b{font-size:20px;font-variant-numeric:tabular-nums}
.gm-q b.bid{color:var(--accent)} .gm-q b.ask{color:var(--warm)}
.gm-q i{display:block;height:6px;background:var(--line);border-radius:3px;transition:width .3s}
.gm-q em{font-style:normal;color:var(--muted)}
.gm-band{fill:var(--quote)}
.gm-l{fill:none;stroke-width:2}
.gm-l.ask{stroke:var(--warm)} .gm-l.bid{stroke:var(--accent)}
#gm-tr circle.b{fill:var(--accent)} #gm-tr circle.s{fill:var(--warm)}
.gm-msg{font-size:14px;margin:6px 0 0;min-height:1.7em}
</style>
<script>
(function(){
  const N=40,H=110,L=90,X0=50,X1=620,YT=14,YB=180,x=t=>X0+t/N*(X1-X0), y=v=>YB-(v-88)/(112-88)*(YB-YT);
  let a='';[90,100,110].forEach(v=>a+=`<line x1="${X0}" y1="${y(v)}" x2="${X1}" y2="${y(v)}" class="s-line"/><text x="${X0-8}" y="${y(v)+4}" text-anchor="end" font-size="11" class="t-faint">${v}</text>`);
  [0,10,20,30,40].forEach(t=>a+=`<text x="${x(t)}" y="214" text-anchor="middle" font-size="11" class="t-faint">第 ${t} 笔</text>`);
  document.getElementById('gm-axis').innerHTML=a;
  const mu=document.getElementById('gm-mu');
  function quotes(p,m){const bh=m+(1-m)/2,bl=(1-m)/2,sh=(1-m)/2,sl=m+(1-m)/2;
    const pa=p*bh/(p*bh+(1-p)*bl), pb=p*sh/(p*sh+(1-p)*sl);return [L+(H-L)*pa, L+(H-L)*pb];}
  function first(){const m=+mu.value/100;const [ask,bid]=quotes(0.5,m);
    document.getElementById('gm-mv').textContent=mu.value+'%';
    document.getElementById('gm-ask').textContent=ask.toFixed(1);document.getElementById('gm-bid').textContent=bid.toFixed(1);
    document.getElementById('gm-gap').style.width=Math.max(4,(ask-bid)*8)+'px';
    document.getElementById('gm-sp').textContent='价差 '+(ask-bid).toFixed(1);}
  let timer;
  function run(){
    clearInterval(timer); first();
    const m=+mu.value/100, V=Math.random()<0.5?H:L; let p=0.5; const A=[],B=[],TR=[];
    let t=0;
    const draw=()=>{const P=arr=>'M'+arr.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('L');
      if(!A.length)return; document.getElementById('gm-a').setAttribute('d',P(A));document.getElementById('gm-b').setAttribute('d',P(B));
      document.getElementById('gm-band').setAttribute('d',P(A)+'L'+B.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).reverse().join('L')+'Z');
      document.getElementById('gm-tr').innerHTML=TR.map((b,i)=>`<circle class="${b?'b':'s'}" cx="${x(i+0.5)}" cy="196" r="3.2"/>`).join('');};
    timer=setInterval(()=>{
      const [ask,bid]=quotes(p,m); A.push(ask); B.push(bid);
      const informed=Math.random()<m, buy=informed?(V===H):Math.random()<0.5; TR.push(buy);
      const bh=m+(1-m)/2,bl=(1-m)/2; p=buy? p*bh/(p*bh+(1-p)*bl) : p*(1-bh)/(p*(1-bh)+(1-p)*(1-bl));
      t++; draw();
      if(t>=N){clearInterval(timer);
        document.getElementById('gm-msg').textContent=m===0?'没有知情者时，订单流不含信息，报价不动，价差为零（不计其他成本）。':`本次真实价值为 ${V}。经过 ${N} 笔交易，报价已移到 ${((A[A.length-1]+B[B.length-1])/2).toFixed(1)} 附近，价差收窄到 ${(A[A.length-1]-B[B.length-1]).toFixed(1)}：信息通过订单流进入了价格。`;}
    },90);
    document.getElementById('gm-msg').textContent='';
  }
  mu.addEventListener('input',run);
  document.getElementById('gm-run').addEventListener('click',run);
  document.getElementById('gm').addEventListener('anim-in',run);
  first();
})();
</script>
